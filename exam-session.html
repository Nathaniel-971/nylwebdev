<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRITICAL SYSTEM ERROR</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background-color: #050505;
        color: #ff0000;
        font-family: 'Courier New', Courier, monospace;
        height: 100vh;
        overflow: hidden;
        user-select: none;
        cursor: none; /* Hide the cursor */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    /* Flashing border */
    .border-flash {
        position: fixed;
        inset: 0;
        border: 10px solid #ff0000;
        pointer-events: none;
        animation: flash 1s infinite alternate;
        z-index: 999;
    }

    @keyframes flash {
        0% { opacity: 0; }
        100% { opacity: 1; }
    }

    #main-container {
        width: 90%;
        max-width: 800px;
        text-align: left;
    }

    h1 {
        font-size: 40px;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 5px;
        animation: glitch 0.3s infinite;
        margin-bottom: 30px;
    }

    @keyframes glitch {
        0% { transform: translate(0); }
        20% { transform: translate(-2px, 2px); }
        40% { transform: translate(-2px, -2px); }
        60% { transform: translate(2px, 2px); }
        80% { transform: translate(2px, -2px); }
        100% { transform: translate(0); }
    }

    .terminal-box {
        border: 1px solid #333;
        background: #000;
        padding: 20px;
        height: 300px;
        overflow-y: hidden;
        font-size: 14px;
        line-height: 1.5;
        box-shadow: 0 0 20px rgba(255, 0, 0, 0.2);
    }

    .log-line { margin-bottom: 5px; }
    .success { color: #00ff00; }
    .warning { color: #ffcc00; }
    .danger { color: #ff0000; font-weight: bold; }

    .bottom-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 20px;
        font-weight: bold;
        font-size: 18px;
    }

    .progress-bar {
        width: 100%;
        height: 10px;
        background: #333;
        margin-top: 10px;
        border-radius: 5px;
        overflow: hidden;
    }

    .progress-fill {
        height: 100%;
        background: #ff0000;
        width: 0%;
        transition: width 0.1s linear;
    }
</style>
</head>
<body>

<div class="border-flash"></div>

<div id="main-container">
    <h1>SYSTEM COMPROMISED</h1>
    
    <div class="terminal-box" id="terminal">
        <div class="log-line">> [SYSTEM] Unauthorized payload detected in memory.</div>
        <div class="log-line">> [SYSTEM] Attempting to isolate... <span class="danger">FAILED.</span></div>
        <div class="log-line">> [NETWORK] Uploading local files to remote server...</div>
    </div>

    <div class="progress-bar">
        <div class="progress-fill" id="progress"></div>
    </div>

    <div class="bottom-bar">
        <div>STATUS: <span class="danger" id="status-text">DO NOT CLOSE WINDOW</span></div>
        <div>T-MINUS: <span id="countdown" class="danger">15</span>s</div>
    </div>
</div>

<script>
    const terminal = document.getElementById('terminal');
    const countdownEl = document.getElementById('countdown');
    const progressEl = document.getElementById('progress');
    const statusText = document.getElementById('status-text');

    let timeLeft = 15;
    let lockActive = true;

    // 1. TRAP: The browser will refuse to close
    window.onbeforeunload = function() {
        if (lockActive) {
            return "CRITICAL ERROR: Data transfer in progress. Do not close this window.";
        }
    };

    // 2. FORCE FULLSCREEN (Must be triggered by a user click to work in modern browsers)
    document.body.addEventListener('click', () => {
        if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(() => {});
        }
    });

    // 3. FAKE LOGS GENERATOR
    const logs = [
        "> [MEMORY] Accessing 0x00A4F... <span class='success'>OK</span>",
        "> [DATA] Extracting WhatsApp Database... <span class='success'>OK</span>",
        "> [DATA] Extracting Browser Passwords... <span class='success'>OK</span>",
        "> [DATA] Scraping Photo Gallery... <span class='success'>OK</span>",
        "> [NETWORK] Establishing encrypted tunnel... <span class='success'>OK</span>",
        "> [NETWORK] Transferring data to IP 102.132.45.12...",
        "> [SECURITY] Overwriting MBR (Master Boot Record)...",
        "> [SECURITY] Deleting System32.dll...",
        "> [ERROR] Cannot terminate process. Access denied."
    ];

    let logIndex = 0;
    const logInterval = setInterval(() => {
        if (logIndex < logs.length) {
            const div = document.createElement('div');
            div.className = 'log-line';
            div.innerHTML = logs[logIndex];
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
            logIndex++;
        }
    }, 1200);

    // 4. THE COUNTDOWN & PROGRESS BAR
    const timer = setInterval(() => {
        timeLeft--;
        countdownEl.innerText = timeLeft;
        
        // Update progress bar (0 to 100%)
        let progress = ((15 - timeLeft) / 15) * 100;
        progressEl.style.width = progress + "%";

        if (timeLeft === 10) {
            document.querySelector('h1').innerText = "ENCRYPTING FILES";
        }
        if (timeLeft === 5) {
            document.querySelector('h1').innerText = "DELETING FILES";
            document.body.style.backgroundColor = "#1a0000"; // Darker red tint
        }

        if (timeLeft <= 0) {
            clearInterval(timer);
            clearInterval(logInterval);
            
            // Release the trap so they can actually close it if they force quit
            lockActive = false; 
            window.onbeforeunload = null; 
            
            // Final state: Creepy blank screen
            document.getElementById('main-container').style.display = 'none';
            document.body.style.backgroundColor = '#000';
            document.body.style.color = '#333';
            document.body.innerHTML = "<div style='text-align:center; font-size: 24px;'>CONNECTION TERMINATED.</div>";
            document.body.style.cursor = 'default';
        }
    }, 1000);

    // Disable Right-Click
    document.addEventListener('contextmenu', event => event.preventDefault());
    
    // Disable Keyboard shortcuts (like Ctrl+W, Ctrl+T, F12)
    document.addEventListener('keydown', (e) => {
        if (lockActive) {
            if (e.ctrlKey || e.key === 'F12' || e.key === 'Escape') {
                e.preventDefault();
            }
        }
    });
</script>
</body>
</html>
