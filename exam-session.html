<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IFB Advanced Scanner</title>
<script async src="https://docs.opencv.org/4.9.0/opencv.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --maroon: #7A1F2B;
    --bg: #0F172A;
    --surface: #1E293B;
    --text: #fff;
    --success: #15803D;
  }
  
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
  body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* HEADER */
  .header { background: var(--maroon); padding: 15px 20px; text-align: center; font-size: 18px; font-weight: 900; letter-spacing: 1px; z-index: 10; }
  
  /* VIEWPORT */
  .viewport { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; background: #000; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; opacity: 0; transition: opacity 0.3s; }
  video.active { opacity: 1; }
  canvas { display: none; }
  img.preview { width: 100%; height: 100%; object-fit: contain; position: absolute; inset: 0; background: #111; display: none; z-index: 5; }
  img.preview.active { display: block; }
  
  /* LOADER */
  #loader { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.9); z-index: 20; display: flex; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(5px); transition: opacity 0.5s; }
  .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.2); border-top-color: var(--maroon); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
  @keyframes spin { 100% { transform: rotate(360deg); } }

  /* CONTROLS */
  .controls { background: var(--surface); padding: 24px 20px; border-top-left-radius: 24px; border-top-right-radius: 24px; display: flex; flex-direction: column; gap: 15px; z-index: 10; box-shadow: 0 -4px 20px rgba(0,0,0,0.5); }
  
  .action-row { display: flex; justify-content: space-between; align-items: center; gap: 15px; }
  
  .btn-circle { width: 60px; height: 60px; border-radius: 50%; background: #334155; border: none; color: white; font-size: 24px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.2s; }
  .btn-circle:active { transform: scale(0.9); }
  
  .btn-capture { width: 80px; height: 80px; border-radius: 50%; background: var(--maroon); border: 4px solid white; box-shadow: 0 4px 15px rgba(122,31,43,0.5); font-size: 32px; }
  
  .btn-main { flex: 1; padding: 16px; border: none; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; }
  .btn-save { background: var(--success); color: #fff; }
  .btn-retake { background: #334155; color: #fff; }
  
  .filter-row { display: flex; gap: 10px; justify-content: center; margin-bottom: 5px; }
  .filter-btn { padding: 10px 20px; border-radius: 100px; background: #334155; border: 2px solid transparent; color: #94A3B8; font-weight: 800; font-size: 13px; cursor: pointer; }
  .filter-btn.active { background: rgba(122,31,43,0.2); border-color: var(--maroon); color: white; }

  /* Hide elements initially */
  #previewControls { display: none; flex-direction: column; gap: 15px; }
  #btnFlash { display: none; }
</style>
</head>
<body>

  <div class="header">∆ IFB SMART SCANNER</div>

  <div class="viewport">
    <div id="loader">
      <div class="spinner"></div>
      <div>Initializing OpenCV...</div>
    </div>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <img id="preview" class="preview" alt="Scanned Document">
  </div>

  <div class="controls">
    
    <!-- Camera Controls -->
    <div id="cameraControls">
      <div class="action-row">
        <button class="btn-circle" id="btnFlash" title="Toggle Flash">⚡</button>
        <button class="btn-circle btn-capture" id="btnCapture" title="Capture Document">📸</button>
        <div style="width: 60px;"></div> <!-- Spacer to center the capture button -->
      </div>
    </div>

    <!-- Preview Controls -->
    <div id="previewControls">
      <div class="filter-row">
        <button class="filter-btn active" id="btnViewInk" onclick="toggleView('ink')">✍️ Ink Only</button>
        <button class="filter-btn" id="btnViewOrig" onclick="toggleView('original')">🖼️ Original</button>
      </div>
      <button class="btn-main btn-save" id="btnSave">⬇️ Save Image to Device</button>
      <button class="btn-main btn-retake" id="btnRetake">🔄 Retake Scan</button>
    </div>

  </div>

<script>
  let cvReady = false;
  let stream = null;
  let videoTrack = null;
  let flashOn = false;
  let originalImage = null;
  let currentView = 'ink';

  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const preview = document.getElementById('preview');
  const loader = document.getElementById('loader');
  
  const btnFlash = document.getElementById('btnFlash');
  const btnCapture = document.getElementById('btnCapture');
  const btnSave = document.getElementById('btnSave');
  const btnRetake = document.getElementById('btnRetake');
  
  const cameraControls = document.getElementById('cameraControls');
  const previewControls = document.getElementById('previewControls');

  // 1. Initialize OpenCV
  function waitForOpenCV() {
    const interval = setInterval(() => {
      if (typeof cv !== 'undefined' && cv.Mat) {
        cvReady = true;
        clearInterval(interval);
        loader.style.opacity = '0';
        setTimeout(() => loader.style.display = 'none', 500);
        startCamera();
      }
    }, 100);
  }
  waitForOpenCV();

  // 2. Start Camera
  async function startCamera() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } 
      });
      video.srcObject = stream;
      await video.play();
      videoTrack = stream.getVideoTracks()[0];
      video.classList.add('active');

      // Check for Flash/Torch
      if (videoTrack.getCapabilities().torch) {
        btnFlash.style.display = 'flex';
      }
    } catch (err) {
      alert("Camera Error: " + err.message + "\n(Make sure you are on HTTPS)");
    }
  }

  // 3. Toggle Flash
  btnFlash.addEventListener('click', async () => {
    if (!videoTrack) return;
    try {
      flashOn = !flashOn;
      await videoTrack.applyConstraints({ advanced: [{ torch: flashOn }] });
      btnFlash.style.background = flashOn ? 'var(--maroon)' : '#334155';
    } catch(e) { console.warn(e); }
  });

  // 4. Capture & Process
  btnCapture.addEventListener('click', () => {
    const w = video.videoWidth;
    const h = video.videoHeight;
    if (!w || !h) return;

    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, w, h);
    
    originalImage = canvas.toDataURL('image/jpeg', 1.0);

    // Run CV
    const processedCanvas = processImage(canvas);
    preview.src = processedCanvas.toDataURL('image/jpeg', 0.95);
    
    // Switch UI
    video.classList.remove('active');
    preview.classList.add('active');
    cameraControls.style.display = 'none';
    previewControls.style.display = 'flex';
    currentView = 'ink';
    updateFilterUI();
  });

  // 5. OpenCV Engine (Perspective Warp + Ink Extraction)
  function processImage(sourceCanvas) {
    if (!cvReady) return sourceCanvas;

    let src = cv.imread(sourceCanvas);
    let gray = new cv.Mat();
    let edges = new cv.Mat();
    let contours = new cv.MatVector();
    let hierarchy = new cv.Mat();
    
    // Grayscale & Blur
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY, 0);
    cv.GaussianBlur(gray, gray, new cv.Size(5, 5), 0, 0, cv.BORDER_DEFAULT);
    
    // Edge Detection
    cv.Canny(gray, edges, 50, 150);
    cv.dilate(edges, edges, cv.Mat.ones(3, 3, cv.CV_8U));
    
    // Find Contours
    cv.findContours(edges, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
    
    let maxArea = 0;
    let bestContour = null;
    
    for (let i = 0; i < contours.size(); ++i) {
        let cnt = contours.get(i);
        let area = cv.contourArea(cnt);
        if (area > maxArea && area > 5000) {
            maxArea = area;
            bestContour = cnt;
        }
    }

    let dst = new cv.Mat();
    
    if (bestContour) {
        let peri = cv.arcLength(bestContour, true);
        let approx = new cv.Mat();
        cv.approxPolyDP(bestContour, approx, 0.02 * peri, true);
        
        if (approx.rows === 4) {
            // Perspective Warp (Auto-Crop)
            let pts = [];
            for (let i = 0; i < 4; i++) pts.push({ x: approx.data32S[i * 2], y: approx.data32S[i * 2 + 1] });
            pts.sort((a, b) => a.y - b.y);
            let top = pts.slice(0, 2).sort((a, b) => a.x - b.x);
            let bottom = pts.slice(2, 4).sort((a, b) => a.x - b.x);
            let ordered = [top[0], top[1], bottom[1], bottom[0]];
            
            let width = Math.max(Math.hypot(ordered[0].x - ordered[1].x, ordered[0].y - ordered[1].y), Math.hypot(ordered[2].x - ordered[3].x, ordered[2].y - ordered[3].y));
            let height = Math.max(Math.hypot(ordered[0].x - ordered[3].x, ordered[0].y - ordered[3].y), Math.hypot(ordered[1].x - ordered[2].x, ordered[1].y - ordered[2].y));
            
            let srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [ordered[0].x, ordered[0].y, ordered[1].x, ordered[1].y, ordered[2].x, ordered[2].y, ordered[3].x, ordered[3].y]);
            let dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, width, 0, width, height, 0, height]);
            
            let M = cv.getPerspectiveTransform(srcTri, dstTri);
            cv.warpPerspective(src, dst, M, new cv.Size(width, height));
            
            M.delete(); srcTri.delete(); dstTri.delete();
        } else {
            src.copyTo(dst);
        }
        approx.delete();
    } else {
        src.copyTo(dst);
    }

    // Ink Extraction
    let finalDst = new cv.Mat();
    cv.cvtColor(dst, gray, cv.COLOR_RGBA2GRAY, 0);
    cv.adaptiveThreshold(gray, finalDst, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY, 21, 15);
    
    // Cleanup
    src.delete(); gray.delete(); edges.delete(); contours.delete(); hierarchy.delete(); dst.delete();
    
    let outCanvas = document.createElement('canvas');
    outCanvas.width = finalDst.cols;
    outCanvas.height = finalDst.rows;
    cv.imshow(outCanvas, finalDst);
    finalDst.delete();
    
    return outCanvas;
  }

  // 6. Toggle View
  window.toggleView = function(type) {
    currentView = type;
    if (type === 'ink') {
      const processedCanvas = processImage(canvas);
      preview.src = processedCanvas.toDataURL('image/jpeg', 0.95);
    } else {
      preview.src = originalImage;
    }
    updateFilterUI();
  }

  function updateFilterUI() {
    if (currentView === 'ink') {
      document.getElementById('btnViewInk').classList.add('active');
      document.getElementById('btnViewOrig').classList.remove('active');
    } else {
      document.getElementById('btnViewOrig').classList.add('active');
      document.getElementById('btnViewInk').classList.remove('active');
    }
  }

  // 7. Save Image
  btnSave.addEventListener('click', () => {
    if (!preview.src) return;
    const link = document.createElement('a');
    link.download = `IFB_Scan_${new Date().getTime()}.jpg`;
    link.href = preview.src;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  });

  // 8. Retake
  btnRetake.addEventListener('click', () => {
    preview.classList.remove('active');
    preview.src = "";
    video.classList.add('active');
    previewControls.style.display = 'none';
    cameraControls.style.display = 'block';
    originalImage = null;
  });

</script>
</body>
</html>
