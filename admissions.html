<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Apply · IFB Institute</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ffffff">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
/* =================== THEME =================== */
:root{
  --ink:#0b0b0b;--ink-2:#1c1c1c;
  --paper:#ffffff;--bg:#f7f7f7;
  --line:#e5e5e5;--line-2:#d4d4d4;
  --muted:#6b6b6b;--muted-2:#8e8e8e;--muted-3:#b3b3b3;
  --blue:#1d3d8f;--blue-bg:#f0f4ff;
  --green:#0a6b44;--green-bg:#ebf7f1;
  --gold:#9e7820;--gold-bg:#fcf8eb;
  --red:#b3261e;--red-bg:#fdefec;
  --radius:12px;--radius-lg:16px;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--font);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  width:100%;position:relative;
}
::selection{background:var(--ink);color:var(--paper)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}

/* =================== HEADER =================== */
header{
  position:sticky;top:0;z-index:100;
  background:rgba(255,255,255,.95);
  backdrop-filter:saturate(180%) blur(16px);
  -webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.header-inner{
  padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;
  max-width:680px;margin:0 auto;
}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink)}
.brand-mark{font-size:44px;font-weight:700;line-height:.85;letter-spacing:-3px;}
.brand-text{display:flex;flex-direction:column;line-height:1.05;}
.brand-name{font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;}
.brand-sub{font-size:9.5px;color:var(--muted);letter-spacing:1.6px;text-transform:uppercase;margin-top:3px;}
@media(max-width:400px){.brand-text{display:none}}
.header-right{display:flex;align-items:center;gap:10px;}
.icon-btn{
  width:40px;height:40px;border-radius:12px;background:var(--paper);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--ink);flex-shrink:0;
  transition:all .2s ease;
}
.icon-btn:hover{background:var(--bg);border-color:var(--ink);}
.icon-btn svg{width:18px;height:18px;}

/* =================== SHELL =================== */
.shell{max-width:680px;margin:0 auto;padding:24px 20px 60px;width:100%;}

/* =================== TABS =================== */
.tabs{
  display:flex;gap:6px;margin-bottom:28px;background:var(--bg);padding:6px;border-radius:14px;
}
.tab{
  flex:1;padding:12px;border-radius:10px;font-size:13.5px;font-weight:600;
  color:var(--muted);transition:all .2s ease;text-align:center;
}
.tab.active{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08);}

/* =================== HEADINGS =================== */
.head{margin-bottom:24px;}
.head h1{font-size:28px;font-weight:700;letter-spacing:-1px;margin-bottom:6px;}
.head p{font-size:14px;color:var(--muted);}

/* =================== STEP TRACK =================== */
.step-track{display:flex;gap:6px;margin-bottom:24px;}
.step-dot{flex:1;height:4px;border-radius:100px;background:var(--line);transition:background .3s ease;}
.step-dot.active, .step-dot.done{background:var(--ink);}

/* =================== FORM =================== */
.card{
  background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:20px;margin-bottom:18px;animation:fadeUp .3s ease both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.field{margin-bottom:16px;}
.field:last-child{margin-bottom:0;}
.field label{display:block;font-size:12px;font-weight:600;margin-bottom:6px;color:var(--ink);}
.field label .req{color:var(--red);margin-left:2px;}
.field input, .field select{
  width:100%;padding:14px 16px;font-size:14.5px;font-family:inherit;
  border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);
  transition:border-color .2s ease;appearance:none;
}
.field input:focus, .field select:focus{outline:none;border-color:var(--ink);}
.field .hint{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.4;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:440px){.grid-2{grid-template-columns:1fr;}}

/* =================== ALERT MESSAGES =================== */
.alert{
  padding:14px 16px;border-radius:10px;font-size:13px;font-weight:500;margin-bottom:20px;
  display:none;border:1px solid transparent;
}
.alert.show{display:flex;align-items:flex-start;gap:10px;animation:fadeUp .3s ease;}
.alert svg{width:16px;height:16px;flex-shrink:0;margin-top:2px;}
.alert.error{background:var(--red-bg);color:var(--red);border-color:rgba(179,38,30,.2);}
.alert.success{background:var(--green-bg);color:var(--green);border-color:rgba(10,107,68,.2);}

/* =================== BUTTONS =================== */
.btn{
  width:100%;padding:16px;border-radius:12px;font-size:15px;font-weight:600;
  background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;gap:8px;
  transition:all .2s ease;
}
.btn:hover:not(:disabled){background:var(--ink-2);transform:translateY(-1px);}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none;}
.btn svg{width:18px;height:18px;}
.btn.ghost{background:var(--paper);color:var(--ink);border:1.5px solid var(--line);}
.btn.ghost:hover:not(:disabled){border-color:var(--ink);background:var(--bg);}

/* =================== GOOGLE BTN =================== */
.google-btn{
  width:100%;padding:14px;border-radius:12px;background:var(--paper);border:1.5px solid var(--line);
  font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;
  margin-top:12px;transition:all .2s;
}
.google-btn:hover{background:var(--bg);border-color:var(--ink);}
.google-btn svg{width:18px;height:18px;}

/* =================== MODAL =================== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);}
.modal-overlay.open{display:flex;}
.modal{background:var(--paper);width:100%;max-width:480px;border-radius:20px;padding:24px;}
.modal h3{font-size:18px;font-weight:700;margin-bottom:8px;}
.modal p{font-size:13px;color:var(--muted);margin-bottom:20px;}
.account-option{
  display:flex;align-items:center;gap:12px;padding:16px;border:1px solid var(--line);
  border-radius:12px;margin-bottom:10px;cursor:pointer;transition:all .2s;
}
.account-option:hover{border-color:var(--ink);background:var(--bg);}
.account-option .info h4{font-size:14px;font-weight:600;margin-bottom:2px;}
.account-option .info p{font-size:11px;color:var(--muted);margin:0;}

/* =================== SPINNER =================== */
.spinner{width:20px;height:20px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;}
.spinner.dark{border-color:rgba(0,0,0,.1);border-top-color:var(--ink);}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="index.html" class="brand">
      <span class="brand-mark">∆</span>
      <span class="brand-text">
        <span class="brand-name">IFB Institute</span>
        <span class="brand-sub">Admissions</span>
      </span>
    </a>
    <div class="header-right">
      <a href="index.html" class="icon-btn" title="Home"><i data-lucide="home"></i></a>
    </div>
  </div>
</header>

<main class="shell" id="app">
  <div style="display:flex;justify-content:center;padding:40px;">
    <div class="spinner dark"></div>
  </div>
</main>

<!-- ACCOUNT SELECTOR MODAL -->
<div class="modal-overlay" id="accountModal">
  <div class="modal">
    <h3>Multiple Accounts Found</h3>
    <p>We found multiple profiles linked to your email address. Please select the account you wish to access.</p>
    <div id="accountList"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { 
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, 
  GoogleAuthProvider, signInWithPopup, updateProfile, onAuthStateChanged 
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { 
  getFirestore, doc, setDoc, getDoc, getDocs, collection, query, where, serverTimestamp, updateDoc 
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyA6HO7n6wCZEeCgKxJLjB-MjL0ZFGR7svU", authDomain: "nyldevcourses.firebaseapp.com", projectId: "nyldevcourses", storageBucket: "nyldevcourses.firebasestorage.app", messagingSenderId: "16687006873", appId: "1:16687006873:web:b7d66ad1024ccd92722408" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const ADMIN_EMAIL = "n1nathaniel971@gmail.com";
const gp = new GoogleAuthProvider();

const appEl = document.getElementById('app');

function makeReferenceId(uid) {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let h = 0;
  for (let i = 0; i < uid.length; i++) h = Math.imul(31, h) + uid.charCodeAt(i) | 0;
  h = Math.abs(h);
  let code = '';
  for (let i = 0; i < 6; i++) { code += chars[h % chars.length]; h = Math.floor(h / chars.length) || 1; }
  return 'IFB-2027-' + code;
}

const STREAMS = [
  { id: 'fullstack', label: 'Full Stack Engineering' },
  { id: 'frontend', label: 'Frontend Development' },
  { id: 'backend', label: 'Backend Engineering' },
  { id: 'mobile', label: 'Mobile Development' },
  { id: 'webdesign', label: 'Web Design' },
  { id: 'uiux', label: 'UI/UX Design' },
  { id: 'data', label: 'Data & Analytics' },
  { id: 'stem', label: 'STEM & Physics' }
];

const ELECTIVES = [
  { id: 'math', label: 'Mathematics (Recommended)' },
  { id: 'physics', label: 'Physics (Requires Mathematics)' },
  { id: 'react', label: 'React' },
  { id: 'node', label: 'Node.js' },
  { id: 'figma', label: 'Figma' },
  { id: 'sql', label: 'SQL' }
];

const state = {
  mode: 'register',
  step: 1,
  data: { name: '', email: '', password: '', idNumber: '', dob: '', phone: '', city: '', province: '', duration: '6', course: 'fullstack', elective1: '', elective2: '' }
};

function showAlert(text, type = 'error') {
  const el = document.getElementById('alertBox');
  if (!el) return;
  const icon = type === 'error' ? 'alert-circle' : type === 'success' ? 'check-circle' : 'info';
  el.className = `alert show ${type}`;
  el.innerHTML = `<i data-lucide="${icon}"></i><div>${text}</div>`;
  if (window.lucide) lucide.createIcons();
}

function clearAlert() {
  const el = document.getElementById('alertBox');
  if (el) el.className = 'alert';
}

/* =================== RENDERING =================== */
function render() {
  if (state.mode === 'success') { renderSuccess(); return; }

  appEl.innerHTML = `
    <div class="head">
      <h1>${state.mode === 'register' ? 'Apply to IFB' : 'Welcome Back'}</h1>
      <p>${state.mode === 'register' ? 'Create your candidate profile for the 2027 intake.' : 'Sign in to access your student dashboard.'}</p>
    </div>

    <div class="tabs">
      <button class="tab ${state.mode === 'register' ? 'active' : ''}" data-mode="register">Register</button>
      <button class="tab ${state.mode === 'signin' ? 'active' : ''}" data-mode="signin">Sign In</button>
    </div>

    <div class="alert" id="alertBox"></div>

    ${state.mode === 'signin' ? renderSignIn() : renderWizard()}
  `;

  bindEvents();
  if (window.lucide) lucide.createIcons();
}

function renderSignIn() {
  return `
    <div class="card">
      <div class="field">
        <label>Email Address <span class="req">*</span></label>
        <input type="email" id="sEmail" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="field">
        <label>Password <span class="req">*</span></label>
        <input type="password" id="sPassword" placeholder="••••••••" autocomplete="current-password">
      </div>
    </div>
    <button class="btn" id="signinBtn">Sign In</button>
    <button class="google-btn" id="googleSigninBtn">
      <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.2 26.7 36 24 36c-5.2 0-9.6-3.1-11.3-7.6l-6.5 5C9.6 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.1 5.6l6.2 5.2C41 35.2 44 30 44 24c0-1.3-.1-2.3-.4-3.5z"/></svg>
      Sign in with Google
    </button>
  `;
}

function renderWizard() {
  let content = `
    <div class="step-track">
      <div class="step-dot ${state.step >= 1 ? 'done' : ''}"></div>
      <div class="step-dot ${state.step >= 2 ? 'done' : ''}"></div>
      <div class="step-dot ${state.step >= 3 ? 'done' : ''}"></div>
    </div>
  `;

  if (state.step === 1) {
    content += `
      <div class="card">
        <div class="field"><label>Full Name <span class="req">*</span></label><input type="text" id="rName" value="${state.data.name}" placeholder="As it appears on your ID"></div>
        <div class="field"><label>Email Address <span class="req">*</span></label><input type="email" id="rEmail" value="${state.data.email}" placeholder="you@example.com"></div>
        <div class="field"><label>Password <span class="req">*</span></label><input type="password" id="rPassword" value="${state.data.password}" placeholder="Minimum 8 characters"></div>
      </div>
      <button class="btn" id="nextBtn">Continue</button>
    `;
  } else if (state.step === 2) {
    content += `
      <div class="card">
        <div class="field"><label>ID / Passport Number <span class="req">*</span></label><input type="text" id="rIdNumber" value="${state.data.idNumber}"></div>
        <div class="field"><label>Date of Birth <span class="req">*</span></label><input type="date" id="rDob" value="${state.data.dob}"></div>
        <div class="field"><label>Mobile Number <span class="req">*</span></label><input type="tel" id="rPhone" value="${state.data.phone}" placeholder="+27 ..."></div>
        <div class="grid-2">
          <div class="field"><label>City <span class="req">*</span></label><input type="text" id="rCity" value="${state.data.city}"></div>
          <div class="field"><label>Province <span class="req">*</span></label><input type="text" id="rProvince" value="${state.data.province}"></div>
        </div>
      </div>
      <div style="display:flex;gap:12px;">
        <button class="btn ghost" id="backBtn" style="flex:1;">Back</button>
        <button class="btn" id="nextBtn" style="flex:2;">Continue</button>
      </div>
    `;
  } else if (state.step === 3) {
    const showEl2 = state.data.duration !== '3';
    content += `
      <div class="card">
        <div class="field">
          <label>Programme Duration <span class="req">*</span></label>
          <select id="rDuration">
            <option value="3" ${state.data.duration === '3' ? 'selected' : ''}>3 Months (Foundation)</option>
            <option value="6" ${state.data.duration === '6' ? 'selected' : ''}>6 Months (Specialisation)</option>
            <option value="12" ${state.data.duration === '12' ? 'selected' : ''}>12 Months (Advanced)</option>
          </select>
        </div>
        <div class="field">
          <label>Stream <span class="req">*</span></label>
          <select id="rCourse">${STREAMS.map(s => `<option value="${s.id}" ${state.data.course === s.id ? 'selected' : ''}>${s.label}</option>`).join('')}</select>
        </div>
        <div class="field">
          <label>Elective 1 <span class="req">*</span></label>
          <select id="rElective1"><option value="">Select an elective</option>${ELECTIVES.map(e => `<option value="${e.id}" ${state.data.elective1 === e.id ? 'selected' : ''}>${e.label}</option>`).join('')}</select>
        </div>
        ${showEl2 ? `
        <div class="field">
          <label>Elective 2 <span class="req">*</span></label>
          <select id="rElective2"><option value="">Select an elective</option>${ELECTIVES.map(e => `<option value="${e.id}" ${state.data.elective2 === e.id ? 'selected' : ''}>${e.label}</option>`).join('')}</select>
        </div>` : ''}
      </div>
      <div style="display:flex;gap:12px;">
        <button class="btn ghost" id="backBtn" style="flex:1;">Back</button>
        <button class="btn" id="submitBtn" style="flex:2;">Submit Application</button>
      </div>
    `;
  }
  return content;
}

function renderSuccess() {
  appEl.innerHTML = `
    <div class="success-wrap" style="text-align:center;padding:40px 0;">
      <div class="success-icon" style="width:80px;height:80px;background:var(--green-bg);color:var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;"><i data-lucide="check"></i></div>
      <h1 style="font-size:26px;font-weight:700;margin-bottom:8px;">Application Submitted</h1>
      <p style="font-size:14px;color:var(--muted);margin-bottom:28px;">Welcome, ${state.data.name}. Your candidate profile has been created.</p>
      
      <div class="ref-box" style="background:var(--bg);border:1.5px dashed var(--line-2);border-radius:14px;padding:24px;margin-bottom:28px;">
        <div style="font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px;">Your Reference ID</div>
        <div style="font-family:var(--mono);font-size:24px;font-weight:700;letter-spacing:2px;color:var(--ink);">${state.data.refId}</div>
      </div>

      <p style="font-size:13px;color:var(--muted);margin-bottom:24px;">Next step: You must sit the IFB/AE Admission Examination in January / February 2027 to receive your Student Number.</p>
      <a href="student-dashboard.html" class="btn">Go to Dashboard</a>
    </div>
  `;
  if (window.lucide) lucide.createIcons();
}

/* =================== LOGIC =================== */
function bindEvents() {
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => { state.mode = t.dataset.mode; clearAlert(); render(); }));

  // Sign In Logic
  const signinBtn = document.getElementById('signinBtn');
  const googleSigninBtn = document.getElementById('googleSigninBtn');

  if (signinBtn) {
    signinBtn.addEventListener('click', async () => {
      clearAlert();
      const email = document.getElementById('sEmail').value.trim();
      const password = document.getElementById('sPassword').value;
      if (!email || !password) { showAlert('Please enter email and password.'); return; }
      
      signinBtn.disabled = true; signinBtn.innerHTML = '<div class="spinner"></div> Signing in...';
      try {
        const cred = await signInWithEmailAndPassword(auth, email, password);
        await routeUser(cred.user);
      } catch (err) {
        if (err.code === 'auth/account-exists-with-different-credential') {
          showAlert('You originally signed up with Google. Please use the Google button below.');
        } else if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password') {
          showAlert('Invalid email or password. If you registered with Google, use the Google button.');
        } else {
          showAlert(err.message);
        }
        signinBtn.disabled = false; signinBtn.innerHTML = 'Sign In';
      }
    });
  }

  if (googleSigninBtn) {
    googleSigninBtn.addEventListener('click', async () => {
      clearAlert();
      googleSigninBtn.disabled = true; googleSigninBtn.innerHTML = '<div class="spinner dark"></div> Connecting...';
      try {
        const result = await signInWithPopup(auth, gp);
        await routeUser(result.user);
      } catch (err) {
        if (err.code === 'auth/account-exists-with-different-credential') {
          showAlert('You originally signed up with Email & Password. Please sign in using the password form above.');
        } else if (err.code !== 'auth/popup-closed-by-user') {
          showAlert(err.message);
        }
        googleSigninBtn.disabled = false; googleSigninBtn.innerHTML = '<svg viewBox="0 0 48 48">...</svg> Sign in with Google';
      }
    });
  }

  // Wizard Navigation (same as before)
  const backBtn = document.getElementById('backBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');

  if (backBtn) backBtn.addEventListener('click', () => { state.step--; clearAlert(); render(); });

  if (nextBtn) {
    nextBtn.addEventListener('click', () => {
      clearAlert();
      if (state.step === 1) {
        state.data.name = document.getElementById('rName').value.trim();
        state.data.email = document.getElementById('rEmail').value.trim();
        state.data.password = document.getElementById('rPassword').value;
        if (!state.data.name) return showAlert('Full name is required.');
        if (!/^\S+@\S+\.\S+$/.test(state.data.email)) return showAlert('Enter a valid email address.');
        if (state.data.password.length < 8) return showAlert('Password must be at least 8 characters.');
      } else if (state.step === 2) {
        state.data.idNumber = document.getElementById('rIdNumber').value.trim();
        state.data.dob = document.getElementById('rDob').value;
        state.data.phone = document.getElementById('rPhone').value.trim();
        state.data.city = document.getElementById('rCity').value.trim();
        state.data.province = document.getElementById('rProvince').value.trim();
        if (!state.data.idNumber || !state.data.dob || !state.data.phone || !state.data.city) return showAlert('Please fill all required fields.');
      }
      state.step++; render();
    });
  }

  if (submitBtn) {
    submitBtn.addEventListener('click', async () => {
      clearAlert();
      state.data.duration = document.getElementById('rDuration').value;
      state.data.course = document.getElementById('rCourse').value;
      state.data.elective1 = document.getElementById('rElective1').value;
      const el2 = document.getElementById('rElective2');
      if (el2) state.data.elective2 = el2.value;
      if (!state.data.elective1) return showAlert('Please select an elective.');
      if (state.data.duration !== '3' && !state.data.elective2) return showAlert('Please select a second elective.');

      submitBtn.disabled = true; submitBtn.innerHTML = '<div class="spinner"></div> Submitting...';
      try {
        const cred = await createUserWithEmailAndPassword(auth, state.data.email, state.data.password);
        const user = cred.user;
        await updateProfile(user, { displayName: state.data.name });
        const refId = makeReferenceId(user.uid);
        
        await setDoc(doc(db, 'users', user.uid), {
          name: state.data.name, email: state.data.email, referenceId: refId,
          idNumber: state.data.idNumber, dob: state.data.dob, phone: state.data.phone, city: state.data.city, province: state.data.province,
          duration: state.data.duration, course: state.data.course, electives: [state.data.elective1, state.data.elective2].filter(Boolean),
          status: 'awaiting_ae', preludePassed: false, createdAt: serverTimestamp(), updatedAt: serverTimestamp()
        });

        localStorage.setItem('ifb_user', JSON.stringify({ uid: user.uid, email: user.email }));
        state.data.refId = refId; state.mode = 'success'; render();

      } catch (err) {
        if (err.code === 'auth/email-already-in-use') {
          showAlert('This email is already registered. Please go to the Sign In tab.');
          setTimeout(() => { state.mode = 'signin'; render(); }, 2000);
        } else {
          showAlert(err.message);
        }
        submitBtn.disabled = false; submitBtn.innerHTML = 'Submit Application';
      }
    });
  }

  const durSel = document.getElementById('rDuration');
  if (durSel) durSel.addEventListener('change', () => { state.data.duration = durSel.value; render(); });
}

/* =================== MULTI-ACCOUNT HANDLING =================== */
async function routeUser(user) {
  if (user.email === ADMIN_EMAIL) { window.location.href = 'administration.html'; return; }
  
  // Query all profiles matching this email
  const q = query(collection(db, 'users'), where('email', '==', user.email));
  const snap = await getDocs(q);

  if (snap.empty) {
    // If no profile exists but they authenticated, send to index to apply
    localStorage.setItem('ifb_user', JSON.stringify({ uid: user.uid, email: user.email }));
    window.location.href = 'index.html';
    return;
  }

  if (snap.size === 1) {
    // Single profile
    const docId = snap.docs[0].id;
    if (docId !== user.uid) {
      // Migrate to current Auth UID if it's a legacy profile
      const data = snap.docs[0].data();
      await setDoc(doc(db, 'users', user.uid), data);
      await updateDoc(doc(db, 'users', docId), { archived: true });
    }
    localStorage.setItem('ifb_user', JSON.stringify({ uid: user.uid, email: user.email }));
    window.location.href = 'student-dashboard.html';
    return;
  }

  // Multiple profiles found
  const accountList = document.getElementById('accountList');
  accountList.innerHTML = '';
  
  snap.forEach(d => {
    const data = d.data();
    const el = document.createElement('div');
    el.className = 'account-option';
    el.innerHTML = `
      <div class="info">
        <h4>${data.name || 'Unknown'}</h4>
        <p>Ref: ${data.referenceId} · ${data.course || 'No Stream'}</p>
      </div>
    `;
    el.addEventListener('click', async () => {
      // Migrate selected profile to current Auth UID
      await setDoc(doc(db, 'users', user.uid), data);
      await updateDoc(doc(db, 'users', d.id), { archived: true });
      localStorage.setItem('ifb_user', JSON.stringify({ uid: user.uid, email: user.email }));
      window.location.href = 'student-dashboard.html';
    });
    accountList.appendChild(el);
  });

  document.getElementById('accountModal').classList.add('open');
}

/* =================== INIT =================== */
onAuthStateChanged(auth, (user) => {
  if (user) {
    routeUser(user);
  } else {
    render();
  }
});
if (window.lucide) lucide.createIcons();
</script>
