<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Gateway</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0d0d0d">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--black:#0d0d0d;--white:#fff;--grey:#6b6b6b;--light:#f5f5f5;--line:#e5e5e5;--red:#dc2626}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--black);color:var(--white);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;line-height:1.6}
.card{width:100%;max-width:480px;background:var(--white);color:var(--black);border-radius:16px;padding:40px 32px}
.badge{width:90px;height:135px;margin:0 auto 18px;display:block}
h1{font-size:24px;letter-spacing:-.5px;margin-bottom:8px;text-align:center}
.sub{font-size:13.5px;color:var(--grey);margin-bottom:26px;text-align:center}
.msg{padding:11px 13px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none}
.msg.error{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;display:block}
.msg.success{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0;display:block}
.form-group{margin-bottom:14px}
.form-group label{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;margin-bottom:7px}
.form-group label svg{width:13px;height:13px;color:var(--grey)}
.form-group input{width:100%;padding:14px 15px;font-size:15px;font-family:'Courier New',monospace;border:1.5px solid var(--line);border-radius:10px;background:var(--white);color:var(--black);text-align:center;letter-spacing:2px}
.form-group input:focus{outline:none;border-color:var(--black)}
.btn{width:100%;padding:15px;font-size:14.5px;font-weight:600;font-family:inherit;border-radius:10px;border:1.5px solid var(--black);background:var(--black);color:var(--white);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:9px;margin-top:8px}
.btn:hover{background:#333}.btn:disabled{opacity:.6;cursor:not-allowed}
.back{display:block;text-align:center;margin-top:18px;font-size:13px;color:var(--grey);text-decoration:none}
.note{font-size:11.5px;color:var(--grey);text-align:center;margin-top:16px;line-height:1.5}
</style>
</head>
<body>
<div class="card">
  <svg class="badge" viewBox="0 0 240 360" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="eg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5d76e"/><stop offset="0.5" stop-color="#d4af37"/><stop offset="1" stop-color="#8f6b1a"/></linearGradient>
      <linearGradient id="er1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a4a9e"/><stop offset="1" stop-color="#0f1f5c"/></linearGradient>
      <linearGradient id="es1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f6f9"/><stop offset="1" stop-color="#a8b0bd"/></linearGradient>
    </defs>
    <path d="M 120 8 L 228 48 L 228 200 Q 228 310 120 348 Q 12 310 12 200 L 12 48 Z" fill="url(#eg1)"/>
    <path d="M 120 22 L 214 58 L 214 198 Q 214 300 120 334 Q 26 300 26 198 L 26 58 Z" fill="url(#er1)"/>
    <path d="M 120 36 L 200 68 L 200 196 Q 200 290 120 320 Q 40 290 40 196 L 40 68 Z" fill="none" stroke="url(#es1)" stroke-width="2.5"/>
    <path d="M 100 108 L 120 138 L 140 108" fill="none" stroke="url(#eg1)" stroke-width="4.5" stroke-linecap="square"/>
    <g transform="translate(120,262)"><circle cx="0" cy="0" r="16" fill="url(#es1)" stroke="#0f1f5c" stroke-width="1"/><ellipse cx="0" cy="0" rx="28" ry="9" fill="none" stroke="url(#eg1)" stroke-width="2" transform="rotate(-20)"/></g>
    <path d="M 28 308 L 212 308 L 212 334 Q 120 350 28 334 Z" fill="url(#eg1)" stroke="#0f1f5c" stroke-width="1.5"/>
  </svg>
  <h1>Exam Gateway</h1>
  <p class="sub">Enter your Examination Number and PIN to begin.</p>
  <div class="msg" id="gateMsg"></div>
  <form id="gateForm">
    <div class="form-group"><label><i data-lucide="hash"></i> Examination Number</label><input type="text" id="examNumber" maxlength="13" placeholder="13 digits" required></div>
    <div class="form-group"><label><i data-lucide="key"></i> Exam PIN</label><input type="text" id="examPin" maxlength="4" placeholder="4 digits" required></div>
    <button type="submit" class="btn" id="gateBtn"><i data-lucide="log-in"></i> Enter Exam</button>
  </form>
  <p class="note">Only approved candidates can sign in. If you have not received your examination number and PIN, contact the administrator.</p>
  <a href="student-portal.html" class="back">← Back to portal</a>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyA6HO7n6wCZEeCgKxJLjB-MjL0ZFGR7svU", authDomain: "nyldevcourses.firebaseapp.com", projectId: "nyldevcourses", storageBucket: "nyldevcourses.firebasestorage.app", messagingSenderId: "16687006873", appId: "1:16687006873:web:b7d66ad1024ccd92722408" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
function showMsg(text, type){const el=document.getElementById('gateMsg');el.textContent=text;el.className='msg '+type;}
document.getElementById('gateForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const examNumber = document.getElementById('examNumber').value.trim();
  const pin = document.getElementById('examPin').value.trim();
  if (!examNumber || !pin) { showMsg('Enter both fields.','error'); return; }
  const btn = document.getElementById('gateBtn'); btn.disabled=true;
  btn.innerHTML='<i data-lucide="loader"></i> Verifying…'; if (window.lucide) lucide.createIcons();
  try {
    const q = query(collection(db,'users'), where('examinationNumber','==',examNumber), where('examPin','==',pin), where('status','==','approved'));
    const snap = await getDocs(q);
    if (snap.empty) { showMsg('Invalid Examination Number or PIN.','error'); btn.disabled=false; btn.innerHTML='<i data-lucide="log-in"></i> Enter Exam'; if (window.lucide) lucide.createIcons(); return; }
    showMsg('Verified. Opening exam session…','success');
    const userId = snap.docs[0].id;
    sessionStorage.setItem('verified_candidate', JSON.stringify({ uid: userId, examNumber }));
    setTimeout(() => window.location.href = 'exam-session.html', 800);
  } catch (err) {
    showMsg('Error: ' + err.message, 'error');
    btn.disabled=false; btn.innerHTML='<i data-lucide="log-in"></i> Enter Exam'; if (window.lucide) lucide.createIcons();
  }
});
if (window.lucide) lucide.createIcons();
</script>
</body>
</html>
