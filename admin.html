<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administration · ∆ IFB Institute</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b0b0b">
<meta name="robots" content="noindex, nofollow">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
/* =================== THEME =================== */
:root{
  --ink:#0b0b0b;--ink-2:#1c1c1c;--ink-3:#2b2b2b;
  --paper:#ffffff;--paper-2:#fafafa;--paper-3:#f4f4f4;--paper-4:#ebebeb;
  --line:#e7e7e7;--line-2:#d6d6d6;
  --muted:#6f6f6f;--muted-2:#909090;--muted-3:#b4b4b4;
  --gold:#b58a2b;--gold-soft:#fbf4e0;
  --blue:#2f4ba8;--blue-soft:#eef2ff;
  --green:#0a7d4f;--green-soft:#e8f5ec;
  --red:#b3261e;--red-soft:#fdefec;
  --orange:#b46300;--orange-soft:#fdf1e0;
  --radius:10px;--radius-lg:16px;--radius-xl:22px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 10px 28px rgba(0,0,0,.06);
  --shadow-lg:0 26px 70px rgba(0,0,0,.10);
  --shadow-xl:0 40px 90px rgba(0,0,0,.18);
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper-2);color:var(--ink);
  font-family:var(--font);font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
::selection{background:var(--ink);color:var(--paper)}
button{font-family:inherit;cursor:pointer}
a{color:inherit}
table{border-collapse:collapse}

/* =================== LOADER =================== */
.loader{position:fixed;inset:0;z-index:9999;background:var(--ink);color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;transition:opacity .6s ease,visibility .6s ease}
.loader.gone{opacity:0;visibility:hidden;pointer-events:none}
.loader-mark{font-size:100px;font-weight:600;line-height:1;letter-spacing:-3px;animation:breathe 1.7s ease-in-out infinite}
.loader-label{font-size:11.5px;letter-spacing:4px;text-transform:uppercase;color:rgba(255,255,255,.5);font-weight:600}
.loader-bar{width:220px;height:2px;background:rgba(255,255,255,.14);border-radius:2px;overflow:hidden;margin-top:4px}
.loader-bar span{display:block;height:100%;width:36%;background:var(--paper);border-radius:2px;animation:loaderSlide 1.35s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.7;transform:scale(.94)}50%{opacity:1;transform:scale(1)}}
@keyframes loaderSlide{0%{transform:translateX(-130%)}100%{transform:translateX(380%)}}

/* =================== NAV =================== */
nav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.96);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid var(--line)}
.nav-inner{max-width:1600px;margin:0 auto;padding:12px 28px;display:flex;justify-content:space-between;align-items:center;gap:14px}
@media(max-width:760px){.nav-inner{padding:10px 16px}}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.brand-mark{font-size:38px;font-weight:600;line-height:.9;letter-spacing:-2.5px}
.brand-text{display:flex;flex-direction:column;line-height:1.05}
.brand-name{font-size:13px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase}
.brand-sub{font-size:10px;color:var(--muted);letter-spacing:1.6px;text-transform:uppercase;margin-top:3px}
@media(max-width:620px){.brand-text{display:none}}
.nav-right{display:flex;align-items:center;gap:8px}
.nav-chip{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;padding:6px 11px;border-radius:100px;background:var(--ink);color:var(--paper);max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-chip svg{width:12px;height:12px;flex-shrink:0}
.nav-btn{font-size:13px;font-weight:600;color:var(--ink);background:var(--paper);text-decoration:none;padding:8px 14px;border-radius:8px;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);transition:all .18s ease}
.nav-btn:hover{border-color:var(--ink);background:var(--paper-3)}
.nav-btn svg{width:14px;height:14px}
@media(max-width:520px){.nav-chip{display:none}}

/* =================== LAYOUT =================== */
.shell{max-width:1600px;margin:0 auto;padding:0 28px}
@media(max-width:760px){.shell{padding:0 16px}}

/* =================== DENIED =================== */
.denied{max-width:520px;margin:96px auto;text-align:center;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-xl);padding:48px 40px;box-shadow:var(--shadow-sm)}
.denied .icon{width:72px;height:72px;border-radius:50%;background:var(--red-soft);border:1px solid rgba(179,38,30,.2);display:flex;align-items:center;justify-content:center;margin:0 auto 22px}
.denied .icon svg{width:30px;height:30px;color:var(--red)}
.denied h1{font-size:24px;letter-spacing:-.8px;margin-bottom:10px;font-weight:700}
.denied p{font-size:14.5px;color:var(--muted);line-height:1.6;margin-bottom:26px}
.denied .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* =================== HEADER =================== */
.admin-head{padding:48px 0 26px}
.admin-head .eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:11px;letter-spacing:2.2px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:12px}
.admin-head .eyebrow svg{width:12px;height:12px}
.admin-head .eyebrow::before{content:"";width:20px;height:1px;background:var(--muted);opacity:.5}
.admin-head h1{font-size:clamp(26px,3.4vw,38px);letter-spacing:-1.4px;line-height:1.1;font-weight:700;margin-bottom:8px}
.admin-head p{font-size:14.5px;color:var(--muted);max-width:760px}

/* =================== DESKTOP NOTICE =================== */
.desktop-note{
  display:none;align-items:center;gap:14px;
  background:var(--orange-soft);border:1px solid rgba(180,99,0,.25);
  color:var(--orange);padding:14px 18px;border-radius:12px;
  font-size:13px;line-height:1.5;margin-bottom:20px;
}
.desktop-note svg{width:18px;height:18px;flex-shrink:0}
.desktop-note strong{font-weight:700}
@media(max-width:1100px){.desktop-note{display:flex}}

/* =================== STATS =================== */
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:22px}
@media(max-width:1100px){.stats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);padding:16px 16px 14px;position:relative;overflow:hidden;transition:all .2s ease}
.stat:hover{border-color:var(--ink);transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.stat .label{display:flex;align-items:center;gap:6px;font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:10px}
.stat .label svg{width:11px;height:11px}
.stat .value{font-size:26px;font-weight:700;letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums}
.stat .sub{font-size:11px;color:var(--muted-2);margin-top:5px}
.stat.accent{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.stat.accent .label{color:rgba(255,255,255,.6)}
.stat.accent .sub{color:rgba(255,255,255,.5)}

/* =================== TOOLBAR =================== */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{flex:1;min-width:260px;position:relative}
.search input{width:100%;padding:11px 14px 11px 40px;font-size:13.5px;font-family:inherit;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);transition:border-color .18s ease,box-shadow .18s ease}
.search input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 4px rgba(11,11,11,.05)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted);pointer-events:none}
.tool-btn{font-size:13px;font-weight:600;padding:10px 15px;border-radius:9px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);display:inline-flex;align-items:center;gap:7px;transition:all .18s ease}
.tool-btn:hover{border-color:var(--ink);background:var(--paper-3)}
.tool-btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tool-btn.primary:hover{background:var(--ink-2);transform:translateY(-1px)}
.tool-btn svg{width:14px;height:14px}
.tool-btn:disabled{opacity:.55;cursor:not-allowed;transform:none}

/* =================== TABS =================== */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:11px 16px;font-size:13px;font-weight:600;background:transparent;border:none;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:all .18s ease}
.tab svg{width:14px;height:14px}
.tab:hover:not(.active){color:var(--ink)}
.tab.active{color:var(--ink);border-bottom-color:var(--ink)}

/* =================== FILTER CHIPS =================== */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{font-size:12.5px;font-weight:600;padding:8px 13px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--muted);display:inline-flex;align-items:center;gap:6px;transition:all .18s ease}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip svg{width:12px;height:12px}
.chip .count{font-family:var(--mono);font-size:10px;font-weight:700;background:var(--paper-3);color:var(--muted);padding:1px 6px;border-radius:100px;margin-left:2px}
.chip.active .count{background:rgba(255,255,255,.2);color:var(--paper)}

/* =================== TABLE =================== */
.table-card{border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--paper);overflow:hidden;box-shadow:var(--shadow-sm)}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.excel{width:100%;font-size:13px;min-width:1100px}
table.excel th,table.excel td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:middle}
table.excel th:last-child,table.excel td:last-child{border-right:none}
table.excel th{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--paper-3);position:sticky;top:0;z-index:2;white-space:nowrap}
table.excel tbody tr{cursor:pointer;transition:background .12s ease}
table.excel tbody tr:nth-child(even){background:var(--paper-2)}
table.excel tbody tr:hover{background:var(--paper-3)}
table.excel tbody tr.selected{background:var(--gold-soft)}
table.excel tbody tr:last-child td{border-bottom:none}
table.excel td.mono{font-family:var(--mono);font-size:12px;letter-spacing:.2px}
table.excel td.num{font-variant-numeric:tabular-nums;text-align:right}
.cell-user{display:flex;align-items:center;gap:10px;min-width:220px}
.cell-user .avatar{width:32px;height:32px;border-radius:8px;overflow:hidden;border:1px solid var(--line);flex-shrink:0;background:var(--paper-3);display:flex;align-items:center;justify-content:center}
.cell-user .avatar svg{display:block}
.cell-user .info{display:flex;flex-direction:column;min-width:0;flex:1}
.cell-user .name{font-size:13px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell-user .email{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono)}
.status{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:3px 8px;border-radius:100px;white-space:nowrap}
.status svg{width:10px;height:10px}
.status.pending{background:var(--orange-soft);color:var(--orange)}
.status.prelude{background:var(--blue-soft);color:var(--blue)}
.status.curriculum{background:var(--gold-soft);color:var(--gold)}
.status.approved{background:var(--green-soft);color:var(--green)}
.status.revoked{background:var(--red-soft);color:var(--red)}
.status.none{background:var(--paper-3);color:var(--muted)}
.tag{display:inline-flex;font-size:10px;font-weight:700;letter-spacing:.5px;padding:3px 7px;border-radius:5px;background:var(--paper-3);color:var(--muted);text-transform:uppercase;white-space:nowrap}
.tag.duration{background:var(--blue-soft);color:var(--blue)}
.tag.stream{background:var(--ink);color:var(--paper)}
td .null{color:var(--muted-3);font-style:italic;font-size:12px}
.empty{text-align:center;padding:70px 24px}
.empty .icon{width:52px;height:52px;border-radius:12px;background:var(--paper-3);display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.empty .icon svg{width:22px;height:22px;color:var(--muted)}
.empty h3{font-size:16px;font-weight:700;margin-bottom:6px}
.empty p{font-size:13px;color:var(--muted);max-width:400px;margin:0 auto}

/* =================== ACCESS MATRIX =================== */
.matrix-wrap{border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--paper);overflow:hidden;box-shadow:var(--shadow-sm)}
.matrix-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.matrix{width:100%;font-size:12px;min-width:900px}
table.matrix th,table.matrix td{padding:9px 12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center;vertical-align:middle}
table.matrix th:last-child,table.matrix td:last-child{border-right:none}
table.matrix th{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--paper-3);position:sticky;top:0;z-index:2;white-space:nowrap}
table.matrix th.subhead{font-size:9px;letter-spacing:1px;background:var(--paper-2);color:var(--muted-2);padding:5px 8px}
table.matrix td.matrix-name{text-align:left;font-weight:600;font-family:var(--mono);font-size:11.5px;white-space:nowrap}
table.matrix td.matrix-check{cursor:pointer;transition:background .12s ease}
table.matrix td.matrix-check:hover{background:var(--paper-3)}
.matrix-check .box{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line-2);background:var(--paper);display:inline-flex;align-items:center;justify-content:center;transition:all .15s ease;margin:0 auto}
.matrix-check.granted .box{background:var(--green);border-color:var(--green);color:var(--paper)}
.matrix-check.denied .box{background:var(--red-soft);border-color:rgba(179,38,30,.35);color:var(--red)}
.matrix-check .box svg{width:13px;height:13px;display:none}
.matrix-check.granted .box svg{display:block}
.matrix-check.denied .box svg{display:block}

/* =================== BULK BAR =================== */
.bulk-bar{display:none;align-items:center;gap:12px;padding:11px 16px;background:var(--ink);color:var(--paper);border-radius:10px;margin-bottom:12px;font-size:13px;flex-wrap:wrap}
.bulk-bar.show{display:flex}
.bulk-bar strong{font-weight:700}
.bulk-bar .actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.bulk-bar button{font-size:12px;font-weight:600;padding:7px 12px;border-radius:7px;background:rgba(255,255,255,.12);color:var(--paper);border:1px solid rgba(255,255,255,.18);display:inline-flex;align-items:center;gap:5px;transition:background .18s ease}
.bulk-bar button:hover{background:rgba(255,255,255,.22)}
.bulk-bar button svg{width:12px;height:12px}
.bulk-bar button:disabled{opacity:.5;cursor:not-allowed}
.cb-cell{width:32px}

/* =================== DRAWER =================== */
.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:400;opacity:0;visibility:hidden;transition:opacity .3s ease,visibility .3s ease;backdrop-filter:blur(2px)}
.drawer-backdrop.open{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;right:0;bottom:0;width:600px;max-width:100vw;background:var(--paper);z-index:401;border-left:1px solid var(--line);transform:translateX(102%);transition:transform .45s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column;box-shadow:var(--shadow-xl)}
@media(max-width:620px){.drawer{width:100%}}
.drawer.open{transform:translateX(0)}
.drawer-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:14px;flex-shrink:0}
.drawer-head .avatar-lg{width:52px;height:52px;border-radius:12px;overflow:hidden;border:1px solid var(--line);flex-shrink:0;background:var(--paper-3);display:flex;align-items:center;justify-content:center}
.drawer-head .meta{flex:1;min-width:0}
.drawer-head .meta h3{font-size:16px;font-weight:700;letter-spacing:-.3px;margin-bottom:2px;line-height:1.25}
.drawer-head .meta .email{font-size:12px;color:var(--muted);font-family:var(--mono);word-break:break-all;line-height:1.4}
.drawer-head .meta .badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.drawer-close{width:32px;height:32px;border-radius:9px;background:var(--paper-3);border:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .18s ease}
.drawer-close:hover{background:var(--line)}
.drawer-close svg{width:15px;height:15px}
.drawer-body{flex:1;overflow-y:auto;padding:20px 24px 32px}
.drawer-body::-webkit-scrollbar{width:8px}
.drawer-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.section{margin-bottom:24px}
.section-title{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section-title svg{width:12px;height:12px}
.section-title::after{content:"";flex:1;height:1px;background:var(--line)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.row:last-child{border-bottom:none}
.row .k{color:var(--muted);display:flex;align-items:center;gap:6px;flex-shrink:0}
.row .k svg{width:12px;height:12px}
.row .v{font-weight:600;text-align:right;word-break:break-word;font-variant-numeric:tabular-nums}
.row .v.mono{font-family:var(--mono);letter-spacing:.3px;font-size:12px}
.row .v.null{color:var(--muted-3);font-style:italic;font-weight:400}
.barcode-card{border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);padding:16px;text-align:center}
.barcode-card .label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:12px}
.barcode-card svg{width:100%;height:56px;display:block;margin:0 auto}
.barcode-card .code{font-family:var(--mono);font-size:11.5px;letter-spacing:2px;color:var(--ink);font-weight:700;margin-top:8px}
.barcode-card .hint{font-size:10.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.barcode-empty{padding:22px 14px;color:var(--muted);font-size:12px;text-align:center;border:1.5px dashed var(--line-2);border-radius:var(--radius)}
.results-table{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;font-size:12.5px}
.results-table table{width:100%;border-collapse:collapse}
.results-table th,.results-table td{padding:8px 12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:left}
.results-table th:last-child,.results-table td:last-child{border-right:none}
.results-table th{font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--paper-3)}
.results-table td.mono{font-family:var(--mono);font-size:12px}
.results-table td.num{text-align:right;font-variant-numeric:tabular-nums}
.results-table td.score{font-weight:700}
.results-table tr:last-child td{border-bottom:none}
.results-empty{padding:24px 14px;text-align:center;color:var(--muted);font-size:12.5px;border:1.5px dashed var(--line-2);border-radius:var(--radius)}
.actions-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
@media(max-width:480px){.actions-grid{grid-template-columns:1fr}}
.action-btn{font-size:12.5px;font-weight:600;padding:10px 13px;border-radius:9px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);display:flex;align-items:center;gap:7px;transition:all .18s ease;text-align:left;text-decoration:none}
.action-btn:hover{border-color:var(--ink);background:var(--paper-3)}
.action-btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.action-btn.primary:hover{background:var(--ink-2)}
.action-btn.danger{color:var(--red);border-color:rgba(179,38,30,.3)}
.action-btn.danger:hover{background:var(--red-soft);border-color:var(--red)}
.action-btn.full{grid-column:1/-1}

<script>
/* ---------- LOADER ---------- */
(function(){
  const loader = document.getElementById('loader');
  const start = Date.now();
  const minShow = 700;
  function hide(){
    const elapsed = Date.now() - start;
    const wait = Math.max(0, minShow - elapsed);
    setTimeout(() => {
      loader.classList.add('gone');
      setTimeout(() => loader.remove(), 700);
    }, wait);
  }
  if (document.readyState === 'complete') hide();
  else window.addEventListener('load', hide);
  setTimeout(() => { if (document.body.contains(loader)) loader.classList.add('gone'); }, 3400);
})();

/* ---------- GRIDY AVATAR ---------- */
function hash32(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function gridy(seed,px){
  px = px || 40;
  const h = hash32(String(seed || 'anon'));
  const rnd = mulberry32(h);
  const hue = h % 360;
  const fg = 'hsl(' + hue + ',58%,38%)';
  const bg = 'hsl(' + hue + ',28%,95%)';
  const N = 5, cell = 100 / N;
  const half = [];
  for (let r = 0; r < N; r++) {
    const row = [];
    for (let c = 0; c < 3; c++) row.push(rnd() > 0.46 ? 1 : 0);
    half.push(row);
  }
  if (!half.some(r => r.some(v => v))) half[2][1] = 1;
  let rects = '';
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const cc = c < 3 ? c : 4 - c;
    if (half[r][cc]) {
      rects += '<rect x="' + (c*cell).toFixed(2) + '" y="' + (r*cell).toFixed(2) +
               '" width="' + cell.toFixed(2) + '" height="' + cell.toFixed(2) + '"/>';
    }
  }
  return '<svg viewBox="0 0 100 100" width="' + px + '" height="' + px +
         '" xmlns="http://www.w3.org/2000/svg" style="display:block">' +
         '<rect width="100" height="100" fill="' + bg + '"/>' +
         '<g fill="' + fg + '">' + rects + '</g></svg>';
}
window.gridy = gridy;

/* ---------- TOASTS ---------- */
window.toast = function(msg, type){
  type = type || 'info';
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const icon = type === 'success' ? 'check-circle' : type === 'error' ? 'alert-triangle' : 'info';
  el.innerHTML = '<i data-lucide="' + icon + '"></i><span>' + String(msg) + '</span>';
  document.getElementById('toasts').appendChild(el);
  if (window.lucide) lucide.createIcons();
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateY(12px)'; setTimeout(() => el.remove(), 300); }, 3400);
};

/* ---------- MODAL ---------- */
window.confirmModal = function(opts){
  return new Promise(resolve => {
    const backdrop = document.getElementById('modalBackdrop');
    const title = document.getElementById('modalTitle');
    const msg = document.getElementById('modalMsg');
    const cancel = document.getElementById('modalCancel');
    const confirm = document.getElementById('modalConfirm');
    title.textContent = opts.title || 'Confirm';
    msg.textContent = opts.message || 'Are you sure?';
    confirm.textContent = opts.confirmText || 'Confirm';
    confirm.className = (opts.danger ? 'danger' : 'primary');
    function cleanup(){ backdrop.classList.remove('open'); cancel.removeEventListener('click', onCancel); confirm.removeEventListener('click', onConfirm); }
    function onCancel(){ cleanup(); resolve(false); }
    function onConfirm(){ cleanup(); resolve(true); }
    cancel.addEventListener('click', onCancel);
    confirm.addEventListener('click', onConfirm);
    backdrop.classList.add('open');
  });
};
</script>

function fmtDateTime(ts){
  if (!ts) return '—';
  try {
    const d = ts.toDate ? ts.toDate() : (ts.seconds ? new Date(ts.seconds * 1000) : new Date(ts));
    return d.toLocaleString('en-ZA', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  } catch { return '—'; }
}
function fmtDate(ts){
  if (!ts) return '—';
  try {
    const d = ts.toDate ? ts.toDate() : (ts.seconds ? new Date(ts.seconds * 1000) : new Date(ts));
    return d.toLocaleDateString('en-ZA', { day: '2-digit', month: 'short', year: 'numeric' });
  } catch { return '—'; }
}

/* Deterministic Reference ID — same algorithm as auth.html so any account without one gets the same value */
function makeReferenceId(uid){
  const CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const h = hash32(String(uid));
  let n = h, code = '';
  for (let i = 0; i < 6; i++) {
    code += CHARS[n % CHARS.length];
    n = Math.floor(n / CHARS.length) || (n ^ (i * 2654435761));
  }
  return 'IFB-2027-' + code;
}
window.makeReferenceId = makeReferenceId;

/* Sequence number per paper — deterministic from (uid, subject, period) */
function paperSequence(uid, subject, period){
  const seed = String(uid) + '|' + subject + '|' + (period || 'FCP');
  const h = hash32(seed);
  return String(h % 1000000).padStart(6, '0');
}
window.paperSequence = paperSequence;

function statusOf(u){
  if (u.status === 'revoked') return { key: 'revoked', label: 'Revoked', icon: 'circle-x' };
  if (u.status === 'approved' && u.studentNumber) return { key: 'approved', label: 'Approved', icon: 'circle-check' };
  if (u.course) return { key: 'curriculum', label: 'Curriculum', icon: 'layout-grid' };
  if (u.preludePassed) return { key: 'prelude', label: 'Prelude passed', icon: 'shield-check' };
  return { key: 'pending', label: 'Pending', icon: 'clock' };
}

}

/* =================== LOAD USERS =================== */
async function loadUsers(){
  const snap = await getDocs(query(collection(db, 'users'), orderBy('createdAt', 'desc')));
  const list = [];
  const fixes = [];
  snap.forEach(d => {
    const data = d.data();
    if (data.email === ADMIN_EMAIL) return;
    const u = { id: d.id, ...data };
    list.push(u);
    /* Auto-heal: ensure every candidate has a Reference ID */
    if (!u.referenceId) {
      const referenceId = makeReferenceId(u.id);
      u.referenceId = referenceId;
      fixes.push({ id: u.id, referenceId });
    }
  });
  state.users = list;
  /* Persist reference IDs in background */
  fixes.forEach(f => {
    updateDoc(doc(db, 'users', f.id), { referenceId: f.referenceId, updatedAt: serverTimestamp() })
      .catch(() => {});
  });
  if (fixes.length) window.toast(fixes.length + ' Reference ID(s) issued.', 'success');
  applyFilter();
}

/* =================== FILTERS =================== */
function matchesFilter(u, f){
  if (f === 'all') return true;
  const s = statusOf(u).key;
  if (f === 'pending') return s === 'pending';
  if (f === 'prelude') return s === 'prelude';
  if (f === 'curriculum') return s === 'curriculum';
  if (f === 'approved') return s === 'approved';
  if (f === 'revoked') return s === 'revoked';
  if (f === 'noNumber') return u.preludePassed && !u.studentNumber;
  if (f === 'noStream') return u.preludePassed && !u.course;
  if (f === 'noPrelude') return !u.preludePassed;
  return true;
}
function matchesSearch(u, q){
  if (!q) return true;
  const hay = [u.name, u.email, u.referenceId, u.studentNumber, u.examinationNumber, u.course, u.curriculum]
    .filter(Boolean).join(' ').toLowerCase();
  return hay.includes(q.toLowerCase());
}
function applyFilter(){
  state.filtered = state.users.filter(u => matchesFilter(u, state.filter) && matchesSearch(u, state.search));
  renderBody();
}

          <th>Reference ID</th>
          <th>Student №</th>
          <th>Prelude</th>
          <th>Duration</th>
          <th>Stream</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        ${list.map(u => {
          const s = statusOf(u);
          const sel = state.selected.has(u.id);
          return `
            <tr data-id="${esc(u.id)}" class="${sel ? 'selected' : ''}">
              <td class="cb-cell"><input type="checkbox" class="row-cb" data-id="${esc(u.id)}" ${sel ? 'checked' : ''}></td>
              <td>
                <div class="cell-user">
                  <div class="avatar">${gridy(u.id, 32)}</div>
                  <div class="info">
                    <div class="name">${esc(u.name || '(no name)')}</div>
                    <div class="email">${esc(u.email || '')}</div>
                  </div>
                </div>
              </td>
              <td class="mono">${u.referenceId ? esc(u.referenceId) : '<span class="null">—</span>'}</td>
              <td class="mono">${u.studentNumber ? esc(u.studentNumber) : '<span class="null">—</span>'}</td>
              <td>${u.preludePassed
                ? `<span class="status approved"><i data-lucide="shield-check"></i> Passed${u.preludeScore != null ? ' · ' + u.preludeScore + '%' : ''}</span>`
                : `<span class="status pending"><i data-lucide="clock"></i> Pending</span>`}</td>
              <td>${u.duration ? `<span class="tag duration">${esc(durationLabel(u.duration))}</span>` : '<span class="null">—</span>'}</td>
              <td>${u.course ? `<span class="tag stream">${esc(streamLabel(u.course))}</span>` : '<span class="null">—</span>'}</td>
              <td><span class="status ${s.key}"><i data-lucide="${s.icon}"></i> ${s.label}</span></td>
            </tr>`;
        }).join('')}
      </tbody>
    </table>`;

  if (window.lucide) lucide.createIcons();

  wrap.querySelectorAll('tbody tr').forEach(tr => {
    tr.addEventListener('click', e => {
      if (e.target.closest('input[type="checkbox"]')) return;
      openDrawer(tr.dataset.id);
    });
  });
  wrap.querySelectorAll('.row-cb').forEach(cb => {
    cb.addEventListener('change', () => {
      const id = cb.dataset.id;
      if (cb.checked) state.selected.add(id); else state.selected.delete(id);
      const tr = cb.closest('tr');
      if (tr) tr.classList.toggle('selected', cb.checked);
      renderBulkBar();
      const all = document.getElementById('cbAll');
      if (all) {
        all.checked = state.selected.size === list.length && list.length > 0;
        all.indeterminate = state.selected.size > 0 && state.selected.size < list.length;
      }
    });
  });
  const all = document.getElementById('cbAll');
  if (all) {
    all.checked = state.selected.size === list.length && list.length > 0;
    all.indeterminate = state.selected.size > 0 && state.selected.size < list.length;
    all.addEventListener('change', () => {
      state.selected.clear();
      if (all.checked) list.forEach(u => state.selected.add(u.id));
      renderTable(); renderBulkBar();
    });
  }
}

function renderBulkBar(){
  const bar = document.getElementById('bulkBar');
  if (!bar) return;
  const n = state.selected.size;
  bar.classList.toggle('show', n > 0);
  const c = document.getElementById('bulkCount');
  if (c) c.textContent = n;
}

/* =================== ACCESS MATRIX =================== */
function renderAccessMatrix(){
  const candidates = state.filtered.filter(u => u.preludePassed && u.course);
  /* Subjects column set — union of core 3 + all stream subjects */
  const columns = [
    { key: 'Mathematics', type: 'core' },
    { key: 'Web Foundations', type: 'core' },
    { key: 'Programming Fundamentals', type: 'core' },
  ];
  /* Add stream subject as its own column once */
  const streamCols = new Set();
  candidates.forEach(u => {
    const s = SUBJECTS_BY_STREAM[u.course];
    if (s && s[3]) streamCols.add(s[3]);
  });
  Array.from(streamCols).sort().forEach(s => columns.push({ key: s, type: 'stream' }));

  main.innerHTML = `
    <div class="admin-head">
      <div class="eyebrow"><i data-lucide="key-round"></i> Paper access</div>
      <h1>Access matrix</h1>
      <p>See exactly who has access to which paper. Click any cell to grant or revoke access. Only candidates who passed the Prelude and set a curriculum appear here.</p>
    </div>

    <div class="desktop-note">
      <i data-lucide="monitor"></i>
      <div><strong>Desktop recommended.</strong> The access matrix is a wide table. Switch to desktop mode or rotate your device.</div>
    </div>

    <div class="tabs">
      <button class="tab" data-tab="candidates"><i data-lucide="users"></i> Candidates</button>
      <button class="tab active" data-tab="access"><i data-lucide="key-round"></i> Paper access</button>
    </div>

    <div class="toolbar">
      <div class="search">
        <i data-lucide="search"></i>
        <input type="text" id="searchInput" placeholder="Search candidate…" value="${esc(state.search)}">
      </div>
      <button class="tool-btn" id="grantAllBtn"><i data-lucide="check-circle"></i> Grant all visible</button>
      <button class="tool-btn" id="revokeAllBtn"><i data-lucide="x-circle"></i> Revoke all visible</button>
    </div>

    <div class="matrix-wrap">
      <div class="matrix-scroll">
        <table class="matrix">
          <thead>
            <tr>
              <th rowspan="2" style="text-align:left;">Candidate</th>
              <th colspan="${columns.length}">Papers</th>
            </tr>
            <tr>
              ${columns.map(c => `<th class="subhead">${esc(c.key)}</th>`).join('')}
            </tr>
          </thead>
          <tbody>
            ${candidates.length ? candidates.map(u => {
              const access = (u.paperAccess && typeof u.paperAccess === 'object') ? u.paperAccess : {};
              return `
                <tr data-uid="${esc(u.id)}">
                  <td class="matrix-name">${esc(u.studentNumber || u.referenceId || u.email)}</td>
                  ${columns.map(c => {
                    const granted = access[c.key] === true;
                    const denied = access[c.key] === false;
                    const cls = granted ? 'granted' : denied ? 'denied' : '';
                    return `<td class="matrix-check ${cls}" data-uid="${esc(u.id)}" data-subject="${esc(c.key)}">
                      <span class="box"><i data-lucide="${granted ? 'check' : denied ? 'x' : 'minus'}"></i></span>
                    </td>`;
                  }).join('')}
                </tr>`;
            }).join('') : `<tr><td colspan="${columns.length + 1}" style="padding:40px;text-align:center;color:var(--muted);">No eligible candidates. Candidates appear once they pass the Prelude and set a curriculum.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;
  if (window.lucide) lucide.createIcons();

  document.getElementById('searchInput').addEventListener('input', e => {
    state.search = e.target.value;
    state.filtered = state.users.filter(u => matchesFilter(u, state.filter) && matchesSearch(u, state.search));
    renderAccessMatrix();
  });
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    state.tab = t.dataset.tab;
    state.selected.clear();
    renderBody();
  }));

  /* Toggle access on click */
  document.querySelectorAll('.matrix-check').forEach(td => {
    td.addEventListener('click', async () => {
      const uid = td.dataset.uid;
      const subject = td.dataset.subject;
      const user = state.users.find(x => x.id === uid);
      if (!user) return;
      const access = { ...(user.paperAccess || {}) };
      const now = access[subject];
      /* Cycle: undefined → granted → denied → undefined */
      if (now === undefined) access[subject] = true;
      else if (now === true) access[subject] = false;
      else delete access[subject];
      user.paperAccess = access;
      try {
        await updateDoc(doc(db, 'users', uid), { paperAccess: access, updatedAt: serverTimestamp() });
        window.toast(subject + ': ' + (access[subject] === true ? 'granted' : access[subject] === false ? 'revoked' : 'cleared'), 'success');
      } catch (e) {
        window.toast('Error saving access.', 'error');
      }
      renderAccessMatrix();
    });
  });

  document.getElementById('grantAllBtn').addEventListener('click', () => bulkSetAccess(true));
  document.getElementById('revokeAllBtn').addEventListener('click', () => bulkSetAccess(false));
}

async function bulkSetAccess(grant){
  const candidates = state.filtered.filter(u => u.preludePassed && u.course);
  if (!candidates.length) { window.toast('No eligible candidates.', 'error'); return; }
  const subjects = new Set();
  candidates.forEach(u => {
    (SUBJECTS_BY_STREAM[u.course] || []).forEach(s => subjects.add(s));
    (u.electives || []).forEach(s => subjects.add(s));
  });
  const ok = await window.confirmModal({
    title: (grant ? 'Grant' : 'Revoke') + ' access for ' + candidates.length + ' candidate(s)?',
    message: (grant ? 'All papers' : 'All papers') + ' will be ' + (grant ? 'granted' : 'revoked') + ' for the visible candidates.',
    confirmText: grant ? 'Grant all' : 'Revoke all',
    danger: !grant
  });
  if (!ok) return;
  try {
    for (const u of candidates) {
      const access = { ...(u.paperAccess || {}) };
      subjects.forEach(s => { access[s] = grant; });
      u.paperAccess = access;
      await updateDoc(doc(db, 'users', u.id), { paperAccess: access, updatedAt: serverTimestamp() });
    }
    window.toast('Access updated.', 'success');
    renderAccessMatrix();
  } catch (e) {
    window.toast('Error: ' + e.message, 'error');
  }
}

  if (!user) return;
  state.current = user;
  renderDrawer(user);
  document.getElementById('drawerBackdrop').classList.add('open');
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawer').setAttribute('aria-hidden', 'false');
}
function closeDrawer(){
  document.getElementById('drawerBackdrop').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');

  state.current = null;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

/* =================== ACTIONS =================== */
async function handleAction(action, u){
  try {
    if (action === 'markPrelude') {
      const ok = await window.confirmModal({
        title: 'Mark Prelude as passed?',
        message: 'This will flag ' + (u.name || u.email) + ' as having passed the Prelude and unlock Student Number assignment.',
        confirmText: 'Mark passed'
      });
      if (!ok) return;
      await updateDoc(doc(db, 'users', u.id), { preludePassed: true, preludeTakenAt: serverTimestamp(), updatedAt: serverTimestamp() });
      window.toast('Prelude marked passed.', 'success');
      await refreshAndReopen(u.id);
      return;
    }
    if (action === 'assignNumber') {
      const ok = await window.confirmModal({
        title: 'Assign Student Number?',
        message: 'A permanent Student Number, Examination Number and PIN will be generated for ' + (u.name || u.email) + '.',
        confirmText: 'Assign'
      });
      if (!ok) return;
      await assignNumbersTo([u]);
      window.toast('Student Number assigned.', 'success');
      await refreshAndReopen(u.id);
      return;
    }
    if (action === 'approve') {
      await updateDoc(doc(db, 'users', u.id), { status: 'approved', approvedAt: serverTimestamp(), updatedAt: serverTimestamp() });
      window.toast('Candidate approved.', 'success');
      await refreshAndReopen(u.id);
      return;
    }
    if (action === 'revoke') {
      const ok = await window.confirmModal({
        title: 'Revoke candidate?',
        message: 'This will mark ' + (u.name || u.email) + ' as revoked. They will not be able to sit exams.',
        confirmText: 'Revoke', danger: true
      });
      if (!ok) return;
      await updateDoc(doc(db, 'users', u.id), { status: 'revoked', revokedAt: serverTimestamp(), updatedAt: serverTimestamp() });
      window.toast('Candidate revoked.', 'success');
      await refreshAndReopen(u.id);
      return;
    }
    if (action === 'shareResults') {
      const results = Array.isArray(u.results) ? u.results : [];
      if (!results.length) { window.toast('No results to share.', 'error'); return; }
      const ok = await window.confirmModal({
        title: 'Share all results?',
        message: 'All ' + results.length + ' result(s) will be marked as shared with ' + (u.name || u.email) + '.',
        confirmText: 'Share'
      });
      if (!ok) return;
      const updated = results.map(r => ({ ...r, shared: true, sharedAt: new Date().toISOString() }));
      await updateDoc(doc(db, 'users', u.id), { results: updated, resultsSharedAt: serverTimestamp(), updatedAt: serverTimestamp() });
      window.toast('Results shared.', 'success');
      await refreshAndReopen(u.id);
      return;
    }
    if (action === 'viewPublic') {
      window.open('profile.html?uid=' + u.id, '_blank');
      return;
    }
  } catch (err) {
    window.toast('Error: ' + err.message, 'error');
  }
}

/* =================== ASSIGN NUMBERS (transactional) =================== */
async function assignNumbersTo(users){
  const counterRef = doc(db, 'counters', 'students');
  await runTransaction(db, async tx => {
    const snap = await tx.get(counterRef);
    let next = (snap.exists() && snap.data().lastNumber) ? snap.data().lastNumber : 0;
    for (const u of users) {
      next++;
      const studentNum = 'IFB-2027-' + String(next).padStart(5, '0');
      const examNum = '27' + String(next).padStart(5, '0') + '01';
      const pin = String(Math.floor(1000 + Math.random() * 9000));
      tx.update(doc(db, 'users', u.id), {
        studentNumber: studentNum,
        examinationNumber: examNum,
        examPin: pin,
        status: 'approved',
        approvedAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      });
    }
    tx.set(counterRef, { lastNumber: next }, { merge: true });
  });
}

/* =================== BULK =================== */
async function bulkAssignNumbers(){
  const users = state.users.filter(u => state.selected.has(u.id) && u.preludePassed && !u.studentNumber);
  if (!users.length) { window.toast('No eligible candidates selected (must have passed Prelude and lack a Student №).', 'error'); return; }
  const ok = await window.confirmModal({
    title: 'Assign Student Numbers?',
    message: users.length + ' candidate(s) will receive permanent Student Numbers, Examination Numbers and PINs.',
    confirmText: 'Assign ' + users.length
  });
  if (!ok) return;
  try {
    await assignNumbersTo(users);
    state.selected.clear();
    window.toast(users.length + ' Student Number(s) assigned.', 'success');
    await loadUsers();
  } catch (e) { window.toast('Error: ' + e.message, 'error'); }
}

async function bulkApprove(){
  const users = state.users.filter(u => state.selected.has(u.id) && u.status !== 'approved');
  if (!users.length) { window.toast('No candidates to approve.', 'error'); return; }
  const ok = await window.confirmModal({ title: 'Approve ' + users.length + ' candidate(s)?', confirmText: 'Approve' });
  if (!ok) return;
  try {
    for (const u of users) {
      await updateDoc(doc(db, 'users', u.id), { status: 'approved', approvedAt: serverTimestamp(), updatedAt: serverTimestamp() });
    }
    state.selected.clear();
    window.toast(users.length + ' approved.', 'success');
    await loadUsers();
  } catch (e) { window.toast('Error: ' + e.message, 'error'); }
}

async function bulkMarkPrelude(){
  const users = state.users.filter(u => state.selected.has(u.id) && !u.preludePassed);
  if (!users.length) { window.toast('No candidates need Prelude marked.', 'error'); return; }
  const ok = await window.confirmModal({ title: 'Mark Prelude passed for ' + users.length + ' candidate(s)?', confirmText: 'Mark passed' });
  if (!ok) return;
  try {
    for (const u of users) {
      await updateDoc(doc(db, 'users', u.id), { preludePassed: true, preludeTakenAt: serverTimestamp(), updatedAt: serverTimestamp() });
    }
    state.selected.clear();
    window.toast(users.length + ' marked.', 'success');
    await loadUsers();
  } catch (e) { window.toast('Error: ' + e.message, 'error'); }
}

/* =================== EXPORT CSV =================== */
function exportCSV(){
  const rows = state.filtered;
  if (!rows.length) { window.toast('Nothing to export.', 'error'); return; }
  const headers = ['Name','Email','Reference ID','Student Number','Exam Number','PIN','Prelude Passed','Prelude Score','Duration','Stream','Electives','Status','Registered'];
  const csv = [headers.join(',')].concat(
    rows.map(u => [
      u.name || '', u.email || '', u.referenceId || '', u.studentNumber || '', u.examinationNumber || '', u.examPin || '',
      u.preludePassed ? 'Yes' : 'No', u.preludeScore != null ? u.preludeScore : '',
      u.duration || '', u.course || '', (u.electives || []).join(' | '), u.status || 'pending',
      u.createdAt ? fmtDate(u.createdAt) : ''
    ].map(v => '"' + String(v).replace(/"/g, '""') + '"').join(','))
  ).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'ifb-candidates-' + new Date().toISOString().slice(0, 10) + '.csv'; a.click();
  URL.revokeObjectURL(url);
  window.toast('Exported ' + rows.length + ' candidates.', 'success');
}

/* =================== REFRESH + REOPEN =================== */
async function refreshAndReopen(id){
  await loadUsers();
  if (state.users.find(u => u.id === id)) openDrawer(id);
  else closeDrawer();
}

/* =================== SIGN OUT =================== */
document.getElementById('signOutBtn').addEventListener('click', async () => {
  const ok = await window.confirmModal({ title: 'Sign out?', message: 'You will be returned to the site.', confirmText: 'Sign out' });
  if (!ok) return;
  await signOut(auth);
  window.location.href = 'index.html';
});

/* =================== AUTH GATE =================== */
onAuthStateChanged(auth, async (user) => {
  if (!user) { renderDenied('You are not signed in.'); return; }
  if (user.email !== ADMIN_EMAIL) {
    renderDenied('Signed in as ' + user.email + ', but this account does not have administrator access.');
    return;
  }
  document.getElementById('adminChip').innerHTML = '<i data-lucide="shield-check"></i> ' + (user.email || '');
  if (window.lucide) lucide.createIcons();
  try { await loadUsers(); }
  catch (err) {
    main.innerHTML = `
      <div class="denied">
        <div class="icon"><i data-lucide="alert-triangle"></i></div>
        <h1>Could not load candidates</h1>
        <p>${esc(err.message || 'Unknown error')}</p>
        <div class="actions">
          <button class="nav-btn" onclick="location.reload()" style="padding:11px 18px;font-size:13.5px;"><i data-lucide="refresh-cw"></i> Try again</button>
        </div>
      </div>`;
    if (window.lucide) lucide.createIcons();
  }
});

function renderDenied(reason){
  main.innerHTML = `
    <div class="denied">
      <div class="icon"><i data-lucide="lock"></i></div>
      <h1>Access denied</h1>
      <p>${esc(reason || 'You are not signed in as an administrator.')}</p>
      <div class="actions">
        <a href="auth.html" class="nav-btn" style="padding:11px 18px;font-size:13.5px;"><i data-lucide="log-in"></i> Sign in</a>
        <a href="index.html" class="nav-btn" style="padding:11px 18px;font-size:13.5px;"><i data-lucide="arrow-left"></i> Home</a>
      </div>
    </div>`;
  if (window.lucide) lucide.createIcons();
}
