<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>National Senior Certificate - Cover Page</title>
<style>
  @page { size: A4; margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body { 
    font-family: Arial, Helvetica, sans-serif; 
    background: #f0f0f0; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    min-height: 100vh; 
  }

  /* A4 PAGE SETUP */
  .page { 
    width: 210mm; 
    height: 297mm; 
    background: white; 
    position: relative; 
    box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
    border: 6px solid #000; /* Thick outer black border */
    padding: 20mm 18mm;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  @media print { 
    body { background: white; } 
    .page { margin: 0; box-shadow: none; page-break-after: always; border: 6px solid #000; } 
  }

  /* SILVER WATERMARK */
  .watermark { 
    position: absolute; 
    top: 50%; 
    left: 50%; 
    transform: translate(-50%, -50%) rotate(-45deg); 
    font-size: 110px; 
    font-weight: 900; 
    color: rgba(192, 192, 192, 0.25); /* Silver color with transparency */
    white-space: nowrap; 
    pointer-events: none; 
    z-index: 0;
    letter-spacing: 5px;
    font-family: 'Segoe UI', Tahoma, sans-serif;
  }

  .content-wrapper {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  /* HEADER SECTION */
  .header { 
    display: flex; 
    align-items: center; 
    gap: 20px; 
    margin-bottom: 50px;
    padding-bottom: 10px;
  }
  
  .header img {
    width: 130px;
    height: auto;
  }

  .header-text {
    display: flex;
    flex-direction: column;
    line-height: 1.2;
  }

  .header-text .title { 
    font-size: 34px; 
    font-weight: 400; 
    margin-bottom: 5px;
  }

  .header-text .subtitle { 
    font-size: 14px; 
    font-weight: 400; 
    color: #111;
  }

  .header-text .country { 
    font-size: 16px; 
    font-weight: 800; 
    margin-top: 2px;
  }

  /* CENTER BOXES */
  .national-box { 
    background: #000000; 
    border: 3px solid #0000CD; /* Blue border */
    border-radius: 10px; 
    padding: 15px 30px; 
    text-align: center; 
    margin: 0 auto 40px auto;
    width: 70%;
  }

  .national-box h1 { 
    color: #ffffff; 
    font-size: 22px; 
    font-weight: 700; 
    letter-spacing: 2px;
    line-height: 1.3;
  }

  .grade-box { 
    background: #e6ffe6; /* Light green */
    border: 3px solid #0000CD; 
    border-radius: 8px; 
    padding: 8px 40px; 
    text-align: center; 
    margin: 0 auto 50px auto;
    width: max-content;
  }

  .grade-box h2 { 
    color: #000; 
    font-size: 22px; 
    font-weight: 700; 
    letter-spacing: 1px;
  }

  .subject-box { 
    background: #ffffcc; /* Yellow */
    border: 4px dashed #0000CD; /* Blue dashed border */
    border-radius: 12px; 
    padding: 30px 20px; 
    text-align: center; 
    margin: 0 auto 40px auto;
    width: 90%;
  }

  .subject-box h3 { 
    font-size: 18px; 
    font-weight: 700; 
    margin-bottom: 20px;
    color: #000;
  }

  .subject-box h4 { 
    font-size: 18px; 
    font-weight: 700; 
    margin-bottom: 20px;
    color: #000;
  }

  .subject-box p { 
    font-size: 18px; 
    font-weight: 700; 
    color: #000;
  }

  /* BOTTOM TEXT */
  .marks {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 80px;
  }

  .pages-text {
    text-align: center;
    font-size: 14px;
    font-weight: 700;
    margin-top: auto;
    margin-bottom: 30px;
  }

  /* FOOTER */
  .footer { 
    display: flex; 
    justify-content: space-between; 
    font-size: 12px; 
    font-weight: 400;
    position: absolute;
    bottom: 20mm;
    left: 18mm;
    right: 18mm;
  }

</style>
</head>
<body>

<div class="page">
  <!-- Silver Watermark -->
  <div class="watermark">SILVER WATERMARK</div>

  <div class="content-wrapper">
    
    <!-- Header with Logo -->
    <div class="header">
      <!-- Using the official SA Coat of Arms SVG from Wikimedia -->
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Coat_of_arms_of_South_Africa.svg/200px-Coat_of_arms_of_South_Africa.svg.png" alt="South Africa Coat of Arms">
      <div class="header-text">
        <div class="title">basic education</div>
        <div class="subtitle">Department:</div>
        <div class="subtitle">Basic Education</div>
        <div class="country">REPUBLIC OF SOUTH AFRICA</div>
      </div>
    </div>

    <!-- National Senior Certificate Box -->
    <div class="national-box">
      <h1>NATIONAL<br>SENIOR CERTIFICATE</h1>
    </div>

    <!-- Grade 12 Box -->
    <div class="grade-box">
      <h2>GRADE 12</h2>
    </div>

    <!-- Subject Box -->
    <div class="subject-box">
      <h3>ENGLISH HOME LANGUAGE P3</h3>
      <h4>NOVEMBER 2017</h4>
      <p>MARKING GUIDELINES</p>
    </div>

    <!-- Marks -->
    <div class="marks">
      MARKS: 100
    </div>

    <!-- Page Count -->
    <div class="pages-text">
      These marking guidelines consist of 9 pages.
    </div>

  </div>

  <!-- Footer -->
  <div class="footer">
    <div>Copyright reserved</div>
    <div>Please turn over</div>
  </div>
  
</div>

</body>
</html>
