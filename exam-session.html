<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IFB Smart Scanner</title>
<script async src="https://docs.opencv.org/4.9.0/opencv.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --maroon: #7A1F2B;
    --bg: #111;
    --surface: #1E293B;
    --text: #fff;
    --success: #15803D;
  }
  
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
  body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* HEADER */
  .header { background: var(--maroon); padding: 15px 20px; text-align: center; font-size: 18px; font-weight: 900; letter-spacing: 1px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 10; }
  
  /* VIEWPORT */
  .viewport { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; background: #000; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
  canvas { display: none; }
  img.preview { width: 100%; height: 100%; object-fit: contain; position: absolute; inset: 0; background: #222; display: none; z-index: 5; }
  
  /* LOADER */
  #loader { position: absolute; inset: 0; background: rgba(0,0,0,0.8); z-index: 20; display: flex; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
  .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
  @keyframes spin { 100% { transform: rotate(360deg); } }

  /* CONTROLS */
  .controls { background: var(--surface); padding: 20px; border-top-left-radius: 24px; border-top-right-radius: 24px; display: flex; flex-direction: column; gap: 12px; z-index: 10; box-shadow: 0 -4px 20px rgba(0,0,0,0.3); }
  
  .btn-row { display: flex; gap: 10px; }
  
  button {
    flex: 1; padding: 16px; border: none; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px;
  }
  
  #btnCapture { background: #fff; color: var(--maroon); width: 100%; }
  #btnCapture:active { transform: scale(0.98); }
  
  #btnSave { background: var(--success); color: #fff; display: none; }
  #btnRetake { background: #334155; color: #fff; display: none; }
  
  button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

  <div class="header">∆ IFB SMART SCANNER</div>

  <div class="viewport">
    <div id="loader">
      <div class="spinner"></div>
      <div>Initializing Engine...</div>
    </div>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <img id="preview" class="preview" alt="Scanned Document">
  </div>

  <div class="controls">
    <button id="btnCapture" disabled>📸 Capture Document</button>
    
    <div class="btn-row" id="actionRow" style="display:none;">
      <button id="btnRetake">Retake</button>
      <button id="btnSave">Save Image</button>
    </div>
  </div>

<script>
  let cvReady = false;
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const preview = document.getElementById('preview');
  const loader = document.getElementById('loader');
  const btnCapture = document.getElementById('btnCapture');
  const btnSave = document.getElementById('btnSave');
  const btnRetake = document.getElementById('btnRetake');
  const actionRow = document.getElementById('actionRow');

  // 1. Wait for OpenCV to load
  function waitForOpenCV() {
    const interval = setInterval(() => {
      if (typeof cv !== 'undefined' && cv.Mat) {
        cvReady = true;
        clearInterval(interval);
        loader.style.display = 'none';
        btnCapture.disabled = false;
        startCamera();
      }
    }, 100);
  }
  waitForOpenCV();

  // 2. Start Camera
  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } 
      });
      video.srcObject = stream;
      await video.play();
    } catch (err) {
      alert("Camera access denied or unavailable. Make sure you are on HTTPS.");
    }
  }

  // 3. Capture & Process
  btnCapture.addEventListener('click', () => {
    const w = video.videoWidth;
    const h = video.videoHeight;
    if (!w || !h) return;

    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, w, h);

    // Run OpenCV
    const processedCanvas = processImage(canvas);
    
    // Show Preview
    preview.src = processedCanvas.toDataURL('image/jpeg', 0.95);
    preview.style.display = 'block';
    
    // Update UI
    btnCapture.style.display = 'none';
    actionRow.style.display = 'flex';
    btnSave.style.display = 'flex';
    btnRetake.style.display = 'flex';
  });

  // 4. OpenCV Image Processing (Ink Extraction)
  function processImage(sourceCanvas) {
    if (!cvReady) return sourceCanvas;

    let src = cv.imread(sourceCanvas);
    let gray = new cv.Mat();
    let dst = new cv.Mat();

    // Grayscale
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY, 0);
    
    // Blur to remove noise
    cv.GaussianBlur(gray, gray, new cv.Size(3, 3), 0, 0, cv.BORDER_DEFAULT);
    
    // Adaptive Thresholding (The magic that isolates ink)
    cv.adaptiveThreshold(
      gray, dst, 255, 
      cv.ADAPTIVE_THRESH_GAUSSIAN_C, 
      cv.THRESH_BINARY, 
      21, // Block size
      15  // Contrast
    );

    // Morphological opening to remove tiny dust specks
    let M = cv.Mat.ones(2, 2, cv.CV_8U);
    cv.morphologyEx(dst, dst, cv.MORPH_OPEN, M);

    // Output to canvas
    let outCanvas = document.createElement('canvas');
    outCanvas.width = dst.cols;
    outCanvas.height = dst.rows;
    cv.imshow(outCanvas, dst);

    // Cleanup memory
    src.delete(); gray.delete(); dst.delete(); M.delete();

    return outCanvas;
  }

  // 5. Save Image to Device
  btnSave.addEventListener('click', () => {
    if (!preview.src) return;
    
    const link = document.createElement('a');
    link.download = `IFB_Scan_${new Date().getTime()}.jpg`;
    link.href = preview.src;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  });

  // 6. Retake
  btnRetake.addEventListener('click', () => {
    preview.style.display = 'none';
    preview.src = "";
    btnCapture.style.display = 'block';
    actionRow.style.display = 'none';
    btnSave.style.display = 'none';
    btnRetake.style.display = 'none';
  });

</script>
</body>
</html>
