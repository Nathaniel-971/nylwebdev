<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apply — Institute of Board</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 10 L92 85 H8 L50 10 Z' fill='%237A1F2B'/%3E%3Cpath d='M50 32 L77 78 H23 L50 32 Z' fill='%23FFFFFF'/%3E%3C/svg%3E">

<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
    --white: #FFF; --black: #111; --gray: #666; --silver: #E2E8F0;
    --maroon: #7A1F2B; --maroon-hover: #5A1620; --bg: #F8FAFC;
    --success: #15803D; --error: #B91C1C;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
    font-family: 'Inter', sans-serif; background: var(--bg); color: var(--black);
    min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 40px 20px;
    opacity: 0; animation: fadeIn .4s ease forwards;
}
@keyframes fadeIn { to { opacity: 1; } }
a { text-decoration: none; color: inherit; }

.container { width: 100%; max-width: 600px; }
.nav-back { display: inline-flex; align-items: center; gap: 8px; color: var(--gray); font-weight: 600; font-size: 14px; margin-bottom: 24px; }
.nav-back:hover { color: var(--maroon); }

.form-card { background: var(--white); border-radius: 20px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid var(--silver); }
.header { text-align: center; margin-bottom: 32px; }
.header h1 { font-size: 24px; font-weight: 900; margin-bottom: 8px; letter-spacing: -0.5px; }
.header p { font-size: 14px; color: var(--gray); }

.btn-google { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 16px; background: var(--white); border: 1.5px solid var(--silver); border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; transition: 0.2s; }
.btn-google:hover { background: #FAFAFA; border-color: var(--black); }

.form-fields { display: none; margin-top: 24px; }
.form-group { margin-bottom: 20px; }
label.field-label { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; margin-bottom: 8px; }
label.field-label i { width: 14px; height: 14px; color: var(--maroon); }
.input-wrap { position: relative; }
.input-wrap input, .input-wrap select { width: 100%; padding: 14px; font-size: 15px; border: 1.5px solid var(--silver); border-radius: 10px; outline: none; font-family: inherit; background: var(--white); }
.input-wrap input:focus, .input-wrap select:focus { border-color: var(--maroon); }
.input-wrap input:disabled { background: #F8FAFC; color: var(--gray); cursor: not-allowed; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

/* Guardian Box (Hidden by default) */
.guardian-box { display: none; background: #FEF2F2; border: 1px solid #FECACA; border-radius: 10px; padding: 16px; margin-bottom: 20px; }
.guardian-box h4 { font-size: 13px; color: var(--error); font-weight: 800; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
.guardian-box p { font-size: 12px; color: var(--gray); margin-bottom: 12px; line-height: 1.5; }

.checkbox-group { display: flex; flex-direction: column; gap: 12px; margin: 24px 0; padding: 20px; background: #FAFAFA; border: 1px solid var(--silver); border-radius: 10px; }
.checkbox-item { display: flex; align-items: flex-start; gap: 12px; cursor: pointer; }
.checkbox-item input { width: 20px; height: 20px; accent-color: var(--maroon); cursor: pointer; margin-top: 2px; flex-shrink: 0; }
.checkbox-item span { font-size: 13px; color: var(--gray); line-height: 1.5; }
.checkbox-item span strong { color: var(--black); }

.btn-submit { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 16px; font-size: 15px; font-weight: 700; border-radius: 10px; border: none; background: var(--maroon); color: var(--white); cursor: pointer; transition: 0.2s; font-family: inherit; }
.btn-submit:hover:not(:disabled) { background: var(--maroon-hover); }
.btn-submit:disabled { opacity: 0.7; cursor: wait; }

.alert { display: none; padding: 14px; border-radius: 8px; font-size: 13px; font-weight: 600; margin-top: 16px; align-items: flex-start; gap: 8px; }
.alert.error { background: #FEF2F2; color: var(--error); border: 1px solid #FECACA; }
.alert.success { background: #DCFCE7; color: var(--success); border: 1px solid #BBF7D0; }

@media (max-width: 600px) { .row { grid-template-columns: 1fr; } .form-card { padding: 24px; } }
</style>
</head>
<body>

<div class="container">
    <a href="index.html" class="nav-back"><i data-lucide="arrow-left"></i> Back to Home</a>
    
    <div class="form-card">
        <div class="header">
            <h1>2027 Application</h1>
            <p>Sign in with Google to begin your registration.</p>
        </div>

        <!-- Step 1: Google Login -->
        <button class="btn-google" id="googleBtn" onclick="googleLogin()">
            <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.2 26.7 36 24 36c-5.2 0-9.6-3.1-11.3-7.6l-6.5 5C9.6 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.1 5.6l6.2 5.2C41 35.2 44 30 44 24c0-1.3-.1-2.3-.4-3.5z"/></svg>
            Continue with Google
        </button>

        <div class="alert error" id="loginError"><i data-lucide="alert-circle" style="width:16px;height:16px;flex-shrink:0;"></i><span id="loginErrorText"></span></div>

        <!-- Step 2: Application Form -->
        <div class="form-fields" id="formFields">
            <form id="admissionForm" onsubmit="submitForm(event)">
                
                <div class="row">
                    <div class="form-group">
                        <label class="field-label"><i data-lucide="user"></i> First Name</label>
                        <div class="input-wrap"><input type="text" id="firstName" placeholder="Nathaniel" required></div>
                    </div>
                    <div class="form-group">
                        <label class="field-label"><i data-lucide="user"></i> Surname</label>
                        <div class="input-wrap"><input type="text" id="surname" placeholder="Nyl" required></div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="field-label"><i data-lucide="mail"></i> Email Address (Google)</label>
                    <div class="input-wrap"><input type="email" id="emailAddress" disabled></div>
                </div>

                <div class="form-group">
                    <label class="field-label"><i data-lucide="calendar"></i> Date of Birth</label>
                    <div class="input-wrap"><input type="date" id="dob" required onchange="checkAge()"></div>
                </div>

                <!-- Guardian Consent (Shows only if age is 17) -->
                <div class="guardian-box" id="guardianBox">
                    <h4><i data-lucide="shield-alert" style="width:16px;height:16px;"></i> Parent/Guardian Consent Required</h4>
                    <p>Because you are 17 years old, POPIA law requires us to collect your parent or guardian's details for consent.</p>
                    <div class="form-group" style="margin-bottom:10px;">
                        <input type="text" id="guardianName" placeholder="Guardian Full Name" style="width:100%; padding:12px; border:1px solid #FECACA; border-radius:8px; font-family:inherit;">
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <input type="tel" id="guardianPhone" placeholder="Guardian Phone Number" style="width:100%; padding:12px; border:1px solid #FECACA; border-radius:8px; font-family:inherit;">
                    </div>
                </div>

                <div class="form-group">
                    <label class="field-label"><i data-lucide="graduation-cap"></i> Select Programme</label>
                    <div class="input-wrap">
                        <select id="courseSelect" required>
                            <option value="">-- Choose a course --</option>
                            <option value="Mathematics">IFB-S Mathematics</option>
                            <option value="Web Development">IFB AQ-B Web Development</option>
                        </select>
                    </div>
                </div>

                <div class="checkbox-group">
                    <label class="checkbox-item">
                        <input type="checkbox" id="termsCheck" required>
                        <span>I agree to the <a href="#" onclick="alert('Terms link goes to resources.html')" style="color:var(--maroon);font-weight:700;">Terms, Privacy Policy, and POPIA consent</a>.</span>
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" id="accreditCheck" required>
                        <span>I understand the Institute of Board is an <strong>independent, non-accredited</strong> academic institution.</span>
                    </label>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <i data-lucide="arrow-right"></i> Complete Application
                </button>

                <div class="alert error" id="errorBox"><span id="errorText"></span></div>
                <div class="alert success" id="successBox"><span id="successText"></span></div>
            </form>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyA6HO7n6wCZEeCgKxJLjB-MjL0ZFGR7svU", authDomain: "nyldevcourses.firebaseapp.com", projectId: "nyldevcourses", storageBucket: "nyldevcourses.firebasestorage.app", messagingSenderId: "16687006873", appId: "1:16687006873:web:b7d66ad1024ccd92722408" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;

// Init Icons
if (window.lucide) lucide.createIcons();

// Helper: Show Error
function showError(msg) {
    const box = document.getElementById('errorBox');
    document.getElementById('errorText').textContent = msg;
    box.style.display = 'flex';
}

// Check Age logic
window.checkAge = function() {
    const dobInput = document.getElementById('dob').value;
    if (!dobInput) return;
    
    const birthDate = new Date(dobInput);
    const today = new Date();
    let age = today.getFullYear() - birthDate.getFullYear();
    const m = today.getMonth() - birthDate.getMonth();
    if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
        age--;
    }

    const guardianBox = document.getElementById('guardianBox');
    const guardianName = document.getElementById('guardianName');
    const guardianPhone = document.getElementById('guardianPhone');

    if (age === 17) {
        guardianBox.style.display = 'block';
        guardianName.required = true;
        guardianPhone.required = true;
    } else {
        guardianBox.style.display = 'none';
        guardianName.required = false;
        guardianPhone.required = false;
    }
}

// Generate 6-digit ID
function generateStudentId() {
    return String(Math.floor(Math.random() * 900000) + 100000);
}

// Handle Auth state
async function handleUser(user) {
    currentUser = user;
    try {
        const snap = await getDoc(doc(db, "users", user.uid));
        if (snap.exists()) {
            // Already applied -> go to dashboard
            window.location.href = "dashboard.html";
            return;
        }
        
        // Show form
        document.getElementById('googleBtn').style.display = 'none';
        document.getElementById('formFields').style.display = 'block';
        document.getElementById('emailAddress').value = user.email;
        
        // Pre-fill name if available
        if (user.displayName) {
            const parts = user.displayName.split(' ');
            document.getElementById('firstName').value = parts[0] || '';
            document.getElementById('surname').value = parts.slice(1).join(' ') || '';
        }

    } catch (e) {
        document.getElementById('loginErrorText').textContent = "Could not check your account: " + e.message;
        document.getElementById('loginError').style.display = 'flex';
    }
}

onAuthStateChanged(auth, (user) => { if (user) handleUser(user); });

window.googleLogin = async function() {
    document.getElementById('loginError').style.display = 'none';
    try {
        const provider = new GoogleAuthProvider();
        const result = await signInWithPopup(auth, provider);
        await handleUser(result.user);
    } catch (e) {
        document.getElementById('loginErrorText').textContent = e.message || "Sign-in failed.";
        document.getElementById('loginError').style.display = 'flex';
    }
};

window.submitForm = async function(e) {
    e.preventDefault();
    document.getElementById('errorBox').style.display = 'none';
    if (!currentUser) return;

    const fName = document.getElementById('firstName').value.trim();
    const sName = document.getElementById('surname').value.trim();
    const dob = document.getElementById('dob').value;
    const course = document.getElementById('courseSelect').value;
    const btn = document.getElementById('submitBtn');

    if (!fName || !sName || !dob || !course) {
        showError("Please fill in all required fields.");
        return;
    }

    // Check if guardian box is visible and filled
    const guardianBox = document.getElementById('guardianBox');
    let guardianData = null;
    if (guardianBox.style.display === 'block') {
        const gName = document.getElementById('guardianName').value.trim();
        const gPhone = document.getElementById('guardianPhone').value.trim();
        if (!gName || !gPhone) {
            showError("Parent/Guardian details are required for minors.");
            return;
        }
        guardianData = { name: gName, phone: gPhone };
    }

    btn.disabled = true;
    btn.innerHTML = '<i data-lucide="loader" style="animation:spin 1s linear infinite;"></i> Processing...';
    if (window.lucide) lucide.createIcons();

    try {
        const studentId = generateStudentId();
        const appId = "APP-2027-" + Math.floor(1000 + Math.random() * 9000);
        
        // Save to Firestore
        await setDoc(doc(db, "users", currentUser.uid), {
            firstName: fName,
            surname: sName,
            name: `${fName} ${sName}`,
            email: currentUser.email,
            dob: dob,
            course: course,
            status: "Applicant", // They become "Student" after passing AE
            studentId: studentId,
            applicationId: appId,
            examinationNumber: null, 
            aeResult: null,
            guardian: guardianData,
            popiaConsent: true,
            termsAcceptedAt: new Date().toISOString(),
            createdAt: new Date()
        });

        // Show success and redirect
        document.getElementById('admissionForm').style.display = 'none';
        document.getElementById('successBox').style.display = 'flex';
        document.getElementById('successText').innerHTML = `<strong>Application Complete!</strong><br>Your Application ID is: ${appId}<br>Redirecting to your dashboard...`;
        
        setTimeout(() => {
            window.location.href = "dashboard.html";
        }, 2500);

    } catch(err) {
        showError(err.message || "Submission failed. Please try again.");
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="arrow-right"></i> Complete Application';
        if (window.lucide) lucide.createIcons();
    }
};
</script>
<style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>
</body>
</html>
