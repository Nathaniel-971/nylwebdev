<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0e1a" />
<meta name="robots" content="noindex" />
<title>Page Not Found | Nyl Web Dev</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none' stroke='%2300d9ff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='22 16 8 32 22 48'/%3E%3Cline x1='32' y1='14' x2='32' y2='50'/%3E%3Cpolyline points='42 16 56 32 42 48'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<header class="navbar">
  <div class="container navbar__inner">
    <a href="/" class="brand">
      <span class="brand__mark"><span>&lt;</span><span>/</span><span>&gt;</span></span>
      <span class="brand__name">Nyl Web Dev</span>
    </a>
    <nav class="nav" id="mainNav">
      <a href="/">Home</a>
      <a href="/services">Services</a>
      <a href="/pricing">Pricing</a>
      <a href="/work">Work</a>
      <a href="/about">About</a>
      <a href="/contact">Contact</a>
    </nav>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
      <i data-lucide="menu"></i>
    </button>
  </div>
</header>

<main>
  <section class="page">
    <div class="container" style="text-align:center;padding-top:4rem;padding-bottom:4rem;max-width:640px;margin:0 auto">
      <div style="font-family:var(--mono);font-size:clamp(4rem,12vw,8rem);font-weight:700;line-height:1;background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;background-clip:text;color:transparent">
        404
      </div>
      <h1 style="font-size:clamp(1.5rem,3vw,2rem);margin-top:1rem;font-weight:700">
        Page not found
      </h1>
      <p style="color:var(--muted);margin-top:.75rem;font-size:1.05rem">
        The page you're looking for doesn't exist or has been moved.
      </p>

      <div style="display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;margin-top:2rem">
        <a href="/" class="btn btn--primary">
          <i data-lucide="home"></i> Back home
        </a>
        <a href="/contact" class="btn btn--ghost">
          <i data-lucide="mail"></i> Contact us
        </a>
      </div>

      <div style="margin-top:3rem;color:var(--muted);font-size:.9rem">
        Looking for one of these?
      </div>
      <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin-top:1rem">
        <a href="/services" style="color:var(--primary);font-size:.9rem">Services</a>
        <a href="/pricing" style="color:var(--primary);font-size:.9rem">Pricing</a>
        <a href="/work" style="color:var(--primary);font-size:.9rem">Work</a>
        <a href="/about" style="color:var(--primary);font-size:.9rem">About</a>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="container">
    <div class="footer__inner">
      <p class="footer__copy">
        <i data-lucide="copyright"></i>
        <span id="year">2026</span> Nyl Web Dev. All rights reserved.
      </p>
      <div class="footer__social">
        <a href="https://github.com/Nathaniel-971" aria-label="GitHub" target="_blank" rel="noopener">
          <i data-lucide="github"></i>
        </a>
      </div>
    </div>
  </div>
</footer>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
