<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply | Institute of Board</title>
    
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 10 L92 85 H8 L50 10 Z' fill='%237A1F2B'/%3E%3Cpath d='M50 32 L77 78 H23 L50 32 Z' fill='%23FFFFFF'/%3E%3C/svg%3E">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
    /* ================= VARIABLES ================= */
    :root {
        --white: #FFF; --black: #111; --gray: #A1A1AA; --silver: #333;
        --maroon: #7A1F2B; --maroon-hover: #5A1620; 
        --dark-bg: #111111; --dark-card: #1F1F1F;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; overflow-x: hidden; width: 100%; }
    body { font-family: 'Inter', sans-serif; background: var(--dark-bg); color: var(--white); line-height: 1.6; overflow-x: hidden; position: relative; width: 100%; max-width: 100vw; display: flex; flex-direction: column; min-height: 100vh; }
    a { text-decoration: none; color: inherit; }

    /* ================= HEADER ================= */
    .header { padding: 20px 48px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--silver); width: 100%; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-logo { width: 40px; height: 40px; background: var(--white); color: var(--maroon); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 900; }
    .brand-text { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
    .btn-back { background: transparent; color: var(--gray); border: none; cursor: pointer; font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 8px; transition: 0.2s; font-family: 'Inter', sans-serif;}
    .btn-back:hover { color: var(--white); }

    /* ================= FORM CONTAINER ================= */
    .apply-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 24px; width: 100%; }
    .apply-box { background: var(--dark-card); border: 1px solid var(--silver); padding: 48px; width: 100%; max-width: 600px; border-top: 6px solid var(--maroon); }
    
    .apply-box h1 { font-size: 32px; font-weight: 900; text-transform: uppercase; margin-bottom: 8px; text-align: center; }
    .apply-box p.subtitle { color: var(--gray); font-size: 14px; text-align: center; margin-bottom: 32px; }

    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 8px; text-transform: uppercase; color: var(--white); letter-spacing: 0.5px; }
    .form-group input, .form-group select { width: 100%; padding: 16px; background: var(--dark-bg); border: 1px solid var(--silver); color: var(--white); font-family: 'Inter', sans-serif; font-size: 15px; transition: 0.2s; }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--maroon); background: #000; }
    .form-group input::placeholder { color: #555; }

    /* Checkboxes */
    .checkbox-group { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 16px; }
    .checkbox-group input[type="checkbox"] { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--maroon); flex-shrink: 0; cursor: pointer; }
    .checkbox-group label { font-size: 12px; color: var(--gray); line-height: 1.5; cursor: pointer; }
    .checkbox-group a { color: var(--maroon); text-decoration: underline; }

    /* Parental Box */
    #parentalConsentBox { display: none; background: rgba(122, 31, 43, 0.1); border: 1px solid var(--maroon); padding: 16px; margin-bottom: 20px; }
    #parentalConsentBox label { color: var(--white); font-weight: 600; font-size: 13px; }

    /* Submit Button */
    .btn-submit { width: 100%; padding: 20px; background: var(--maroon); color: var(--white); font-size: 16px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; border: none; cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 10px; }
    .btn-submit:hover { background: var(--maroon-hover); }
    .btn-submit:disabled { background: #333; color: #666; cursor: not-allowed; }

    /* Auth State */
    #authGate { text-align: center; }
    .btn-google { width: 100%; padding: 18px; background: var(--white); color: var(--black); font-size: 16px; font-weight: 800; border: none; cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 12px; margin-bottom: 20px; }
    .btn-google:hover { background: #E2E8F0; }
    .user-profile { display: flex; align-items: center; gap: 16px; background: var(--dark-bg); padding: 16px; border: 1px solid var(--silver); margin-bottom: 24px; }
    .user-profile img { width: 40px; height: 40px; border-radius: 50%; }

    /* Error/Success Messages */
    .alert { padding: 16px; margin-bottom: 20px; font-size: 14px; font-weight: 600; display: none; }
    .alert-error { background: rgba(220, 38, 38, 0.1); border-left: 4px solid #DC2626; color: #FCA5A5; }
    .alert-success { background: rgba(21, 128, 61, 0.1); border-left: 4px solid #15803D; color: #86EFAC; }

    /* Responsive */
    @media (max-width: 600px) {
        .header { padding: 16px 24px; }
        .brand-text { display: none; }
        .apply-box { padding: 32px 24px; }
    }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <a href="index.html" class="brand">
            <div class="brand-logo">∆</div>
            <div class="brand-text">IFB ACADEMY</div>
        </a>
        <a href="index.html" class="btn-back"><i data-lucide="arrow-left" style="width: 18px;"></i> Back to Home</a>
    </header>

    <!-- APPLICATION FORM -->
    <main class="apply-container">
        <div class="apply-box">
            <h1>Student Application</h1>
            <p class="subtitle">Complete your profile to register for the AE Paper.</p>

            <!-- Messages -->
            <div id="errorMsg" class="alert alert-error"></div>
            <div id="successMsg" class="alert alert-success"></div>

            <!-- STEP 1: GOOGLE AUTH -->
            <div id="authGate">
                <p style="color: var(--gray); margin-bottom: 30px;">You must verify your identity to apply. We use Google Auth to prevent spam and duplicate registrations.</p>
                <button class="btn-google" onclick="googleLogin()">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="24" alt="Google">
                    Sign in with Google
                </button>
            </div>

            <!-- STEP 2: THE FORM (Hidden until logged in) -->
            <form id="applicationForm" style="display: none;" onsubmit="submitApplication(event)">
                
                <div class="user-profile">
                    <img id="userAvatar" src="" alt="User">
                    <div>
                        <div style="font-weight: 700; font-size: 14px;" id="userName">Loading...</div>
                        <div style="font-size: 12px; color: var(--gray);" id="userEmail">...</div>
                    </div>
                </div>

                <div class="form-group">
                    <label>First Legal Name (as on ID)</label>
                    <input type="text" id="legalFirstName" required placeholder="e.g. Nathaniel">
                </div>
                <div class="form-group">
                    <label>Last Legal Name</label>
                    <input type="text" id="legalLastName" required placeholder="e.g. Smith">
                </div>
                <div class="form-group">
                    <label>Date of Birth</label>
                    <input type="date" id="dob" required onchange="checkAge()">
                </div>

                <!-- Parental Consent for 16-17 year olds -->
                <div id="parentalConsentBox">
                    <div class="checkbox-group" style="margin-bottom: 0;">
                        <input type="checkbox" id="parentalConsent">
                        <label>I am under 18. I confirm I have my parent/guardian's consent to share my data and participate in the IFB.</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Primary Programme</label>
                    <select id="courseSelect1" required>
                        <option value="">-- Choose Programme --</option>
                        <option value="MAT">IFB—Mathematics</option>
                        <option value="WEB">IFB—Web Development</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Second Programme (Optional)</label>
                    <select id="courseSelect2">
                        <option value="">-- Choose Second Programme --</option>
                        <option value="MAT">IFB—Mathematics</option>
                        <option value="WEB">IFB—Web Development</option>
                    </select>
                </div>

                <!-- Legal Consents -->
                <div class="checkbox-group">
                    <input type="checkbox" id="popiaConsent" required>
                    <label>I consent to the processing of my personal data in accordance with POPIA and GDPR. I understand I can request deletion of my data at any time.</label>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="commitmentConsent" required>
                    <label>I commit to completing my selected programme(s). I understand that any malpractice, plagiarism, or impersonation will result in immediate disqualification and potential legal action.</label>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    Submit Application <i data-lucide="arrow-right" style="width: 20px;"></i>
                </button>
            </form>
        </div>
    </main>

    <!-- JAVASCRIPT & FIREBASE -->
    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyA6HO7n6wCZEeCgKxJLjB-MjL0ZFGR7svU", authDomain: "nyldevcourses.firebaseapp.com", projectId: "nyldevcourses", storageBucket: "nyldevcourses.firebasestorage.app", messagingSenderId: "16687006873", appId: "1:16687006873:web:b7d66ad1024ccd92722408" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    if (window.lucide) lucide.createIcons();

    let currentUser = null;

    // 1. Check if the user clicked a specific course on index.html (?course=MAT)
    const urlParams = new URLSearchParams(window.location.search);
    const preSelectedCourse = urlParams.get('course');
    if (preSelectedCourse === 'MAT' || preSelectedCourse === 'WEB') {
        document.getElementById('courseSelect1').value = preSelectedCourse;
    }

    // 2. Google Login Logic
    window.googleLogin = async function() {
        try {
            await signInWithPopup(auth, new GoogleAuthProvider());
        } catch(e) { 
            showError("Sign-in failed: " + e.message); 
        }
    };

    // 3. Auth State Observer
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUser = user;
            
            // Check if they already have a profile in the database
            const docRef = doc(db, "users", user.uid);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                // They are already registered. Redirect to index (which loads dashboard).
                window.location.href = "index.html";
            } else {
                // Show the form
                document.getElementById('authGate').style.display = 'none';
                document.getElementById('applicationForm').style.display = 'block';
                
                // Populate their Google details (visual only)
                document.getElementById('userAvatar').src = user.photoURL || '';
                document.getElementById('userName').innerText = user.displayName || 'Student';
                document.getElementById('userEmail').innerText = user.email;
            }
        } else {
            // Logged out
            currentUser = null;
            document.getElementById('authGate').style.display = 'block';
            document.getElementById('applicationForm').style.display = 'none';
        }
    });

    // 4. Age Verification Logic
    window.checkAge = function() {
        const dobInput = document.getElementById('dob').value;
        if (!dobInput) return;
        
        const dob = new Date(dobInput);
        const today = new Date();
        let age = today.getFullYear() - dob.getFullYear();
        const m = today.getMonth() - dob.getMonth();
        if (m < 0 || (m === 0 && today.getDate() < dob.getDate())) age--;

        const parentalBox = document.getElementById('parentalConsentBox');
        const parentalCheck = document.getElementById('parentalConsent');

        if (age < 16) {
            showError("You must be at least 16 years old to register.");
            document.getElementById('dob').value = '';
            parentalBox.style.display = 'none';
            parentalCheck.required = false;
        } else if (age >= 16 && age < 18) {
            parentalBox.style.display = 'block';
            parentalCheck.required = true;
        } else {
            parentalBox.style.display = 'none';
            parentalCheck.required = false;
        }
    };

    // 5. Submit Application
    window.submitApplication = async function(e) {
        e.preventDefault();
        if (!currentUser) return;

        const c1 = document.getElementById('courseSelect1').value;
        const c2 = document.getElementById('courseSelect2').value;

        if (c1 === c2 && c2 !== "") { 
            showError("Please select two different programmes."); 
            return; 
        }

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerHTML = "Saving...";

        // Generate Mock IDs (Replace with your Firebase query for pre-generated IDs)
        const mockStudentId = Math.floor(100000 + Math.random() * 900000).toString();
        const mockExamNo = "IFB" + Math.floor(10000000 + Math.random() * 90000000).toString();

        const newData = {
            uid: currentUser.uid,
            email: currentUser.email,
            firstName: document.getElementById('legalFirstName').value.trim(),
            lastName: document.getElementById('legalLastName').value.trim(),
            dob: document.getElementById('dob').value,
            courses: c2 ? [c1, c2] : [c1],
            studentId: mockStudentId,
            examNumber: mockExamNo,
            createdAt: new Date().toISOString()
        };

        try {
            await setDoc(doc(db, "users", currentUser.uid), newData);
            showSuccess("Application successful! Redirecting to your dashboard...");
            setTimeout(() => {
                window.location.href = "index.html";
            }, 2000);
        } catch (error) {
            showError("Error saving application: " + error.message);
            btn.disabled = false;
            btn.innerHTML = "Submit Application";
        }
    };

    // Helper: Show Errors
    function showError(msg) {
        const err = document.getElementById('errorMsg');
        err.innerText = msg;
        err.style.display = 'block';
        setTimeout(() => { err.style.display = 'none'; }, 5000);
    }

    // Helper: Show Success
    function showSuccess(msg) {
        const succ = document.getElementById('successMsg');
        succ.innerText = msg;
        succ.style.display = 'block';
    }
    </script>
</body>
</html>
