<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Application — IFB</title>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
    :root { --white: #FFFFFF; --black: #111111; --gray: #666666; --silver: #E2E8F0; --maroon: #7A1F2B; }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Inter', sans-serif; background: #FAFAFA; color: var(--black); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 24px; }
    .container { width: 100%; max-width: 500px; }
    .nav-back { display: inline-flex; align-items: center; gap: 8px; color: var(--gray); text-decoration: none; font-weight: 600; margin-bottom: 24px; }
    .form-card { background: var(--white); border-radius: 24px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid var(--silver); }
    .header { text-align: center; margin-bottom: 32px; }
    .header .logo { font-size: 48px; font-weight: 900; color: var(--maroon); margin-bottom: 16px; }
    .header h1 { font-size: 24px; font-weight: 900; margin-bottom: 8px; }
    .header p { font-size: 14px; color: var(--gray); }
    .warning { background: #FFF5F6; border: 1px solid var(--maroon); color: var(--maroon); padding: 12px; border-radius: 8px; font-size: 13px; font-weight: 600; text-align: center; margin-bottom: 24px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px; }
    input { width: 100%; padding: 14px; font-size: 15px; border: 1.5px solid var(--silver); border-radius: 10px; outline: none; }
    input:focus { border-color: var(--maroon); }
    .btn { width: 100%; padding: 16px; font-size: 15px; font-weight: 700; border-radius: 10px; border: none; background: var(--maroon); color: var(--white); cursor: pointer; }
    .btn:hover { background: var(--maroon-hover); }
    #successState { display: none; text-align: center; }
    .id-box { background: var(--white); border: 2px dashed var(--maroon); border-radius: 12px; padding: 20px; margin: 20px 0; }
    .id-box .label { font-size: 11px; text-transform: uppercase; color: var(--gray); font-weight: 700; }
    .id-box .value { font-family: monospace; font-size: 22px; font-weight: 800; color: var(--black); }
</style>
</head>
<body>
<div class="container">
    <a href="index.html" class="nav-back"><i data-lucide="arrow-left"></i> Back to Home</a>
    
    <div class="form-card" id="formCard">
        <div class="header">
            <div class="logo">∆</div>
            <h1>2027 Application</h1>
            <p>Register to receive your unique 13-digit Student ID.</p>
        </div>
        <div class="warning">Applications Close: 13 January 2027</div>
        
        <form id="admissionForm">
            <div class="form-group"><label>Full Legal Name</label><input type="text" id="fullName" required placeholder="e.g. Nathaniel Nyl"></div>
            <div class="form-group"><label>Email Address</label><input type="email" id="email" required placeholder="you@example.com"></div>
            <div class="form-group"><label>Phone Number</label><input type="tel" id="phone" required placeholder="+27 XX XXX XXXX"></div>
            <div class="form-group"><label>Date of Birth</label><input type="date" id="dob" required></div>
            <button type="submit" class="btn" id="submitBtn">Submit Application</button>
        </form>
    </div>

    <div class="form-card" id="successState">
        <div style="font-size: 48px; font-weight: 900; color: var(--maroon);">∆</div>
        <h2>Application Successful</h2>
        <p style="font-size: 14px; color: var(--gray); margin-top: 8px;">Save your Student ID.</p>
        
        <div class="id-box">
            <div class="label">13-Digit Student ID</div>
            <div class="value" id="displayId">2027010000000</div>
        </div>

        <a href="index.html" class="btn" style="display: block; text-decoration: none;">Go to Login</a>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyA6HO7n6wCZEeCgKxJLjB-MjL0ZFGR7svU", authDomain: "nyldevcourses.firebaseapp.com", projectId: "nyldevcourses", storageBucket: "nyldevcourses.firebasestorage.app", messagingSenderId: "16687006873", appId: "1:16687006873:web:b7d66ad1024ccd92722408" };
    const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);

    document.getElementById('admissionForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('submitBtn');
        btn.innerText = "Processing...";
        btn.disabled = true;

        const name = document.getElementById('fullName').value;
        const email = document.getElementById('email').value;
        const phone = document.getElementById('phone').value;
        const dob = document.getElementById('dob').value;
        
        const tempPassword = "IFB2027!" + Math.floor(Math.random() * 10000);

        try {
            // 1. Attempt to Create Auth User
            const userCredential = await createUserWithEmailAndPassword(auth, email, tempPassword);
            const user = userCredential.user;

            // 2. Generate 13-digit ID
            const timestampStr = Date.now().toString().slice(-6);
            const randomDigit = Math.floor(Math.random() * 900) + 100;
            const studentId = `202701${timestampStr}${randomDigit}`;

            // 3. Save to Firestore
            await setDoc(doc(db, "users", user.uid), {
                name: name, email: email, phone: phone, dob: dob, studentId: studentId, curriculum: "Not Selected", status: "Applicant", createdAt: new Date()
            });

            // 4. Show Success
            document.getElementById('formCard').style.display = 'none';
            document.getElementById('displayId').innerText = studentId;
            document.getElementById('successState').style.display = 'block';

        } catch (error) {
            // If account already exists, sign them in and redirect
            if (error.code === 'auth/email-already-in-use') {
                try {
                    // We can't know their real password, so we attempt to sign in with a generic one if they used this flow previously.
                    // If this fails, we redirect them to the login page with a message.
                    // In a real app with a dedicated backend, you would use an API to check if they are an applicant.
                    
                    alert("An account with this email already exists. Redirecting you to the login page.");
                    window.location.href = "index.html";
                } catch (signInError) {
                    alert("Error: " + signInError.message);
                    btn.innerText = "Submit Application";
                    btn.disabled = false;
                }
            } else {
                alert("Registration Error: " + error.message);
                btn.innerText = "Submit Application";
                btn.disabled = false;
            }
        }
    });
    lucide.createIcons();
</script>
</body>
</html>
