<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Gateway — IFB</title>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root { --maroon:#7A1F2B; --silver:#E2E8F0; --black:#111; --gray:#666; --white:#fff; --bg:#F8FAFC; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',sans-serif; background:var(--bg); display:flex; justify-content:center; align-items:center; min-height:100dvh; padding:20px; overflow-x: clip; }
.card { background:var(--white); border:1px solid var(--silver); border-radius:16px; padding:40px; max-width:480px; width:100%; box-shadow:0 10px 30px rgba(0,0,0,.05); text-align:center; }
.logo { font-size:48px; font-weight:900; color:var(--maroon); margin-bottom:12px; }
h1 { font-size:24px; font-weight:900; margin-bottom:6px; }
p.sub { font-size:14px; color:var(--gray); margin-bottom:28px; }
.input-group { text-align:left; margin-bottom:16px; }
label { display:block; font-size:13px; font-weight:700; margin-bottom:8px; }
input { width:100%; padding:14px; font-size:16px; border:1.5px solid var(--silver); border-radius:8px; outline:none; font-family:monospace; text-align:center; }
input:focus { border-color:var(--maroon); }
.btn { width:100%; padding:16px; background:var(--maroon); color:var(--white); border:none; border-radius:8px; font-size:16px; font-weight:700; cursor:pointer; margin-top:8px; }
.error { color:#B91C1C; font-size:14px; margin-top:15px; display:none; background:#FEF2F2; padding:12px; border-radius:8px; }
</style>
</head>
<body>

<div class="card">
    <div class="logo">∆</div>
    <h1>Examination Gateway</h1>
    <p class="sub">Verify your identity to access the live exam session.</p>
    
    <div class="input-group">
        <label>13-Digit Student ID</label>
        <input type="text" id="studentId" placeholder="2701051026001" maxlength="13">
    </div>
    <div class="input-group">
        <label>6-Char Security Code</label>
        <input type="password" id="securityCode" placeholder="A7X2B9" maxlength="6">
    </div>
    <button class="btn" id="enterBtn" onclick="verifyAndEnter()">Enter Examination Session</button>
    <div class="error" id="errorBox"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyA6HO7n6wCZEeCgKxJLjB-MjL0ZFGR7svU", authDomain: "nyldevcourses.firebaseapp.com", projectId: "nyldevcourses", storageBucket: "nyldevcourses.firebasestorage.app", messagingSenderId: "16687006873", appId: "1:16687006873:web:b7d66ad1024ccd92722408" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = "admission.html"; return; }
    const snap = await getDoc(doc(db, "users", user.uid));
    if (!snap.exists() || snap.data().status === "Incomplete") {
        window.location.href = "student-dashboard.html";
    }
});

window.verifyAndEnter = async function() {
    const id = document.getElementById('studentId').value.trim();
    const code = document.getElementById('securityCode').value.trim().toUpperCase();
    const errorBox = document.getElementById('errorBox');
    
    errorBox.style.display = 'none';
    if (id.length !== 13 || !code) { errorBox.innerText = "Invalid format."; errorBox.style.display = 'block'; return; }

    const btn = document.getElementById('enterBtn');
    btn.innerText = "Verifying..."; btn.disabled = true;

    try {
        const q = query(collection(db, "users"), where("studentId", "==", id), where("securityCode", "==", code));
        const snap = await getDocs(q);

        if (!snap.empty) {
            const data = snap.docs[0].data();
            sessionStorage.setItem("examStudentId", id);
            sessionStorage.setItem("examStudentCourses", JSON.stringify(data.courses || []));
            window.location.href = "exam-session.html";
        } else {
            errorBox.innerText = "Invalid ID or Code.";
            errorBox.style.display = 'block';
            btn.innerText = "Enter Examination Session"; btn.disabled = false;
        }
    } catch (error) {
        errorBox.innerText = "Database error.";
        errorBox.style.display = 'block';
        btn.innerText = "Enter Examination Session"; btn.disabled = false;
    }
};
</script>
</body>
</html>
