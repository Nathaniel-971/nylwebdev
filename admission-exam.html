<style>
/* =================== THEME =================== */
:root{
  --ink:#0b0b0b;--ink-2:#1c1c1c;--ink-3:#2b2b2b;
  --paper:#ffffff;--paper-2:#fafafa;--paper-3:#f4f4f4;--paper-4:#ebebeb;
  --line:#e7e7e7;--line-2:#d6d6d6;
  --muted:#6f6f6f;--muted-2:#909090;--muted-3:#b4b4b4;
  --gold:#b58a2b;--gold-soft:#fbf4e0;
  --blue:#2f4ba8;--blue-soft:#eef2ff;
  --green:#0a7d4f;--green-soft:#e8f5ec;
  --red:#b3261e;--red-soft:#fdefec;
  --orange:#b46300;--orange-soft:#fdf1e0;
  --purple:#6b21a8;--purple-soft:#f5e8ff;
  --radius:10px;--radius-lg:16px;--radius-xl:22px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 10px 28px rgba(0,0,0,.06);
  --shadow-lg:0 26px 70px rgba(0,0,0,.10);
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper-2);color:var(--ink);
  font-family:var(--font);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
::selection{background:var(--ink);color:var(--paper)}
button{font-family:inherit;cursor:pointer}
a{color:inherit}

/* =================== LOADER =================== */
.loader{position:fixed;inset:0;z-index:9999;background:var(--ink);color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transition:opacity .6s ease,visibility .6s ease;padding:24px}
.loader.gone{opacity:0;visibility:hidden;pointer-events:none}
.loader-mark{font-size:88px;font-weight:600;line-height:1;letter-spacing:-3px;animation:breathe 1.7s ease-in-out infinite}
.loader-label{font-size:10.5px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.5);font-weight:600;text-align:center}
.loader-bar{width:180px;height:2px;background:rgba(255,255,255,.14);border-radius:2px;overflow:hidden;margin-top:4px}
.loader-bar span{display:block;height:100%;width:36%;background:var(--paper);border-radius:2px;animation:loaderSlide 1.35s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.7;transform:scale(.94)}50%{opacity:1;transform:scale(1)}}
@keyframes loaderSlide{0%{transform:translateX(-130%)}100%{transform:translateX(380%)}}

/* =================== NAV =================== */
nav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.97);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.nav-inner{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.brand-mark{font-size:32px;font-weight:600;line-height:.9;letter-spacing:-2px;flex-shrink:0}
.brand-text{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.brand-name{font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;white-space:nowrap}
.brand-sub{font-size:9.5px;color:var(--muted);letter-spacing:1.4px;text-transform:uppercase;margin-top:2px;white-space:nowrap}
@media(max-width:400px){.brand-text{display:none}}
.nav-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.nav-btn{font-size:12.5px;font-weight:600;color:var(--ink);background:var(--paper);text-decoration:none;padding:8px 12px;border-radius:8px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);transition:all .18s ease;white-space:nowrap}
.nav-btn:hover{border-color:var(--ink);background:var(--paper-3)}
.nav-btn svg{width:13px;height:13px}
.nav-btn.icon-only{padding:8px 9px}
.nav-btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* =================== SHELL =================== */
.shell{padding:0 16px;max-width:100%}

/* =================== HEAD =================== */
.head{padding:24px 0 18px}
.head .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:10px}
.head .eyebrow svg{width:11px;height:11px}
.head .eyebrow::before{content:"";width:16px;height:1px;background:var(--muted);opacity:.5}
.head h1{font-size:26px;letter-spacing:-1.1px;line-height:1.12;font-weight:700;margin-bottom:8px}
.head p{font-size:13.5px;color:var(--muted);line-height:1.55}

/* =================== CARD =================== */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px 18px;margin-bottom:14px}
.card-title{font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-title svg{width:12px;height:12px}

/* =================== PRELUDE STATUS =================== */
.status-hero{
  background:var(--paper);border:1px solid var(--line);
  border-radius:var(--radius-xl);padding:24px 20px;
  margin-bottom:14px;text-align:center;position:relative;overflow:hidden;
}
.status-hero::before{
  content:"";position:absolute;top:-40%;right:-20%;width:260px;height:260px;
  background:radial-gradient(circle,rgba(181,138,43,.14) 0%,rgba(181,138,43,0) 70%);
  pointer-events:none;
}
.status-hero .icon-wrap{
  width:64px;height:64px;border-radius:50%;
  background:var(--purple-soft);border:1px solid rgba(107,33,168,.2);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 16px;position:relative;z-index:1;
}
.status-hero .icon-wrap svg{width:28px;height:28px;color:var(--purple)}
.status-hero h2{font-size:20px;font-weight:700;letter-spacing:-.5px;margin-bottom:6px;position:relative;z-index:1}
.status-hero p{font-size:13.5px;color:var(--muted);line-height:1.55;max-width:340px;margin:0 auto 18px;position:relative;z-index:1}
.status-hero .actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;position:relative;z-index:1}
.status-hero .btn{
  padding:12px 20px;border-radius:10px;font-size:13.5px;font-weight:600;
  border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);
  display:inline-flex;align-items:center;gap:7px;transition:all .18s ease;
}
.status-hero .btn:hover{background:var(--ink-2)}
.status-hero .btn svg{width:14px;height:14px}
.status-hero .btn.ghost{background:var(--paper);color:var(--ink)}

/* verified variant */
.status-hero.verified .icon-wrap{background:var(--green-soft);border-color:rgba(10,125,79,.2)}
.status-hero.verified .icon-wrap svg{color:var(--green)}
.status-hero.pending .icon-wrap{background:var(--orange-soft);border-color:rgba(180,99,0,.2)}
.status-hero.pending .icon-wrap svg{color:var(--orange)}
.status-hero.revoked .icon-wrap{background:var(--red-soft);border-color:rgba(179,38,30,.2)}
.status-hero.revoked .icon-wrap svg{color:var(--red)}

/* =================== CARD: WHAT TO EXPECT =================== */
.expect-grid{display:grid;grid-template-columns:1fr;gap:8px}
.expect-item{
  display:flex;gap:11px;align-items:flex-start;
  padding:11px 12px;background:var(--paper-2);
  border-radius:10px;border:1px solid var(--line);
}
.expect-item .num{
  font-family:var(--mono);font-size:11px;font-weight:700;
  color:var(--muted);letter-spacing:.5px;flex-shrink:0;
  width:24px;padding-top:2px;
}
.expect-item .body{flex:1;min-width:0}
.expect-item .body h4{font-size:13px;font-weight:700;line-height:1.25;margin-bottom:2px}
.expect-item .body p{font-size:11.5px;color:var(--muted);line-height:1.5}

/* =================== PAPER INFO =================== */
.paper-info{
  background:var(--paper-2);border:1px dashed var(--line-2);
  border-radius:12px;padding:14px;margin-bottom:14px;
}
.paper-info .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:5px 0;font-size:12.5px}
.paper-info .row .k{color:var(--muted);display:flex;align-items:center;gap:6px}
.paper-info .row .k svg{width:12px;height:12px}
.paper-info .row .v{font-weight:600;text-align:right;font-family:var(--mono);font-size:12px}

/* =================== DOC LIST =================== */
.doc-list{list-style:none}
.doc-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;background:var(--paper);
  border:1px solid var(--line);border-radius:11px;margin-bottom:8px;
  text-decoration:none;color:var(--ink);
  transition:all .18s ease;
}
.doc-item:last-child{margin-bottom:0}
.doc-item:hover{border-color:var(--ink);background:var(--paper-3)}
.doc-item .ic{
  width:34px;height:34px;border-radius:9px;
  background:var(--paper-3);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.doc-item .ic svg{width:15px;height:15px}
.doc-item .meta{flex:1;min-width:0}
.doc-item .meta h4{font-size:13px;font-weight:600;letter-spacing:-.1px;line-height:1.25;margin-bottom:2px}
.doc-item .meta p{font-size:11px;color:var(--muted);line-height:1.3}
.doc-item .arrow{color:var(--muted);flex-shrink:0}
.doc-item .arrow svg{width:14px;height:14px}

/* =================== HOW IT WORKS =================== */
.steps{list-style:none;counter-reset:s;margin-top:6px}
.steps li{
  counter-increment:s;
  display:flex;gap:14px;align-items:flex-start;
  padding:14px 0;border-bottom:1px solid var(--line);
}
.steps li:last-child{border-bottom:none;padding-bottom:0}
.steps li::before{
  content:counter(s,decimal-leading-zero);
  font-family:var(--mono);font-size:11px;font-weight:700;
  color:var(--muted);letter-spacing:1px;width:28px;flex-shrink:0;padding-top:3px;
}
.steps .body h4{font-size:13.5px;font-weight:700;margin-bottom:3px;letter-spacing:-.1px}
.steps .body p{font-size:12.5px;color:var(--muted);line-height:1.55}

/* =================== AI NOTICE =================== */
.ai-notice{
  background:var(--purple-soft);border:1px solid rgba(107,33,168,.18);
  border-radius:12px;padding:13px 14px;display:flex;gap:10px;
  align-items:flex-start;font-size:12px;color:var(--purple);line-height:1.55;
}
.ai-notice svg{width:16px;height:16px;flex-shrink:0;margin-top:2px}
.ai-notice strong{display:block;font-weight:700;margin-bottom:3px;font-size:12.5px;color:#4c1580}

/* =================== WARNING NOTICE =================== */
.warning-notice{
  background:var(--orange-soft);border:1px solid rgba(180,99,0,.2);
  border-radius:12px;padding:13px 14px;display:flex;gap:10px;
  align-items:flex-start;font-size:12px;color:var(--orange);line-height:1.55;
}
.warning-notice svg{width:16px;height:16px;flex-shrink:0;margin-top:2px}
.warning-notice strong{display:block;font-weight:700;margin-bottom:3px;font-size:12.5px;color:#7d4300}

/* =================== BADGES =================== */
.badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:10px;font-weight:700;letter-spacing:.5px;
  text-transform:uppercase;padding:4px 10px;border-radius:100px;
  white-space:nowrap;
}
.badge svg{width:11px;height:11px}
.badge.pending{background:var(--orange-soft);color:var(--orange)}
.badge.verified{background:var(--green-soft);color:var(--green)}
.badge.ai{background:var(--purple-soft);color:var(--purple)}
.badge.revoked{background:var(--red-soft);color:var(--red)}

/* =================== FOOT =================== */
.foot{padding:32px 4px 40px;text-align:center;color:var(--muted);font-size:11px;line-height:1.6}
.foot .mark{font-size:26px;font-weight:600;letter-spacing:-2px;color:var(--ink);display:block;margin-bottom:8px}
.foot .nonacc{font-size:10.5px;color:var(--muted-2);margin-top:6px}

/* =================== DENIED =================== */
.denied{text-align:center;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-xl);padding:40px 24px;box-shadow:var(--shadow-sm);margin:64px 0}
.denied .icon{width:64px;height:64px;border-radius:50%;background:var(--red-soft);border:1px solid rgba(179,38,30,.2);display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.denied .icon svg{width:26px;height:26px;color:var(--red)}
.denied h1{font-size:20px;letter-spacing:-.6px;margin-bottom:8px;font-weight:700}
.denied p{font-size:13.5px;color:var(--muted);line-height:1.55;margin-bottom:22px}
.denied .actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* =================== TOAST =================== */
.toasts{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:12px;right:12px;z-index:500;display:flex;flex-direction:column;gap:8px;pointer-events:none;align-items:center}
.toast{background:var(--ink);color:var(--paper);padding:12px 16px;border-radius:11px;font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:9px;box-shadow:var(--shadow-lg);width:100%;max-width:420px;animation:toastIn .3s cubic-bezier(.16,1,.3,1) both;pointer-events:auto;line-height:1.4}
.toast svg{width:15px;height:15px;flex-shrink:0}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* skeleton */
.sk{border-radius:10px;background:linear-gradient(90deg,var(--paper-3) 25%,var(--paper-4) 50%,var(--paper-3) 75%);background-size:200% 100%;animation:sk 1.4s ease-in-out infinite}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>

<script>
/* ---------- LOADER ---------- */
(function(){
  const loader = document.getElementById('loader');
  const start = Date.now();
  const minShow = 600;
  function hide(){
    const elapsed = Date.now() - start;
    const wait = Math.max(0, minShow - elapsed);
    setTimeout(() => {
      loader.classList.add('gone');
      setTimeout(() => loader.remove(), 700);
    }, wait);
  }
  if (document.readyState === 'complete') hide();
  else window.addEventListener('load', hide);
  setTimeout(() => { if (document.body.contains(loader)) loader.classList.add('gone'); }, 3000);
})();

/* ---------- TOAST ---------- */
window.toast = function(msg, type){
  type = type || 'info';
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const icon = type === 'success' ? 'check-circle' : type === 'error' ? 'alert-triangle' : 'info';
  el.innerHTML = '<i data-lucide="' + icon + '"></i><span>' + String(msg) + '</span>';
  document.getElementById('toasts').appendChild(el);
  if (window.lucide) lucide.createIcons();
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 320); }, 3400);
};
</script>

          <div class="body"><h4>Numerical reasoning</h4><p>Arithmetic, ratios, and basic algebra.</p></div>
        </div>
        <div class="expect-item">
          <div class="num">02</div>
          <div class="body"><h4>Language comprehension</h4><p>Reading and inference from short passages.</p></div>
        </div>
        <div class="expect-item">
          <div class="num">03</div>
          <div class="body"><h4>Logical reasoning</h4><p>Patterns, sequences, and deduction.</p></div>
        </div>
        <div class="expect-item">
          <div class="num">04</div>
          <div class="body"><h4>Computational thinking</h4><p>Sequencing, conditionals, and decomposition.</p></div>
        </div>
        <div class="expect-item">
          <div class="num">05</div>
          <div class="body"><h4>Digital literacy</h4><p>Files, browsers, and common tools.</p></div>
        </div>
        <div class="expect-item">
          <div class="num">06</div>
          <div class="body"><h4>Spatial reasoning</h4><p>Layout and structure.</p></div>
        </div>
        <div class="expect-item">
          <div class="num">07</div>
          <div class="body"><h4>Written communication</h4><p>Clarity in short form.</p></div>
        </div>
        <div class="expect-item">
          <div class="num">08</div>
          <div class="body"><h4>Problem framing</h4><p>Recognising the real question.</p></div>
        </div>
      </div>
    </div>

    <!-- ========== HOW IT WORKS ========== -->
    <div class="card">
      <div class="card-title"><i data-lucide="route"></i> How sitting the Prelude works</div>
      <ol class="steps">
        <li>
          <div class="body">
            <h4>Get ready</h4>
            <p>You'll need your Reference ID (on your profile) and a quiet place for 90 minutes.</p>
          </div>
        </li>
        <li>
          <div class="body">
            <h4>Enter the exam session</h4>
            <p>Click <strong>Enter Prelude session</strong>. A monitored exam window opens. You'll be asked to attach your barcode to the answer sheet.</p>
          </div>
        </li>
        <li>
          <div class="body">
            <h4>Answer 40 questions</h4>
            <p>Each section tests one of the eight skill areas. No external tools, no AI, no second screens.</p>
          </div>
        </li>
        <li>
          <div class="body">
            <h4>DeepSeek AI marks the paper</h4>
            <p>Your submission is reviewed by DeepSeek AI within minutes. The result is written to your profile automatically.</p>
          </div>
        </li>
        <li>
          <div class="body">
            <h4>Receive your Student Number</h4>
            <p>On a pass, the institute assigns your permanent Student Number, Examination Number, and PIN.</p>
          </div>
        </li>
      </ol>
    </div>

    <!-- ========== RULES ========== -->
    <div class="card">
      <div class="card-title"><i data-lucide="shield-alert"></i> Rules of the sitting</div>
      <div class="warning-notice" style="margin-bottom:10px">
        <i data-lucide="alert-triangle"></i>
        <div>
          <strong>One sitting only.</strong>
          The Prelude is a single opportunity. If you fail, you cannot retake it in the 2027 intake. Prepare first.
        </div>
      </div>
      <div class="warning-notice" style="margin-bottom:10px">
        <i data-lucide="monitor-off"></i>
        <div>
          <strong>Anti-cheat is enforced.</strong>
          Leaving the exam window, copy-paste, right-click, or using external AI will flag your session. DeepSeek AI reviews flagged papers and may fail them.
        </div>
      </div>
      <div class="ai-notice">
        <i data-lucide="brain-circuit"></i>
        <div>
          <strong>Results are final.</strong>
          DeepSeek AI's verdict is final. The institute cannot overturn, edit, or override a Prelude result. Appeals go through DeepSeek AI, not administration.
        </div>
      </div>
    </div>

    <!-- ========== ACTIONS ========== -->
    <div class="card">
      <div class="card-title"><i data-lucide="zap"></i> Actions</div>
      ${canSit
        ? `<a href="exams.html" class="doc-item" style="border-color:var(--ink);background:var(--ink);color:var(--paper)">
            <div class="ic" style="background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2)"><i data-lucide="lock" style="color:var(--paper)"></i></div>
            <div class="meta">
              <h4 style="color:var(--paper)">Enter Prelude session</h4>
              <p style="color:rgba(255,255,255,.55)">Begin the monitored 90-minute sitting</p>
            </div>
            <span class="arrow" style="color:rgba(255,255,255,.5)"><i data-lucide="arrow-right"></i></span>
          </a>`
        : ''}
      <a href="prelude-qp-2027.html" class="doc-item">
        <div class="ic"><i data-lucide="file-text"></i></div>
        <div class="meta">
          <h4>View the sample paper</h4>
          <p>What the paper looks like · for information only</p>
        </div>
        <span class="arrow"><i data-lucide="external-link"></i></span>
      </a>
      <a href="messages.html" class="doc-item">
        <div class="ic"><i data-lucide="message-square"></i></div>
        <div class="meta">
          <h4>Message the institute</h4>
          <p>Questions about the Prelude</p>
        </div>
        <span class="arrow"><i data-lucide="arrow-right"></i></span>
      </a>
      <a href="profile.html" class="doc-item">
        <div class="ic"><i data-lucide="user"></i></div>
        <div class="meta">
          <h4>My profile</h4>
          <p>Reference ID, status, results</p>
        </div>
        <span class="arrow"><i data-lucide="arrow-right"></i></span>
      </a>
    </div>

    <div class="foot">
      <span class="mark">∆</span>
      <p>IFB · Online Institute · 2027 Intake</p>
      <p class="nonacc">The Prelude is not an accredited examination. It is an internal admission test.</p>
    </div>
  `;
  if (window.lucide) lucide.createIcons();
}

/* =================== DENIED =================== */
function renderDenied(reason, showSignIn){
  main.innerHTML = `
    <div class="denied">
      <div class="icon"><i data-lucide="lock"></i></div>
      <h1>${showSignIn ? 'Sign in required' : 'Unavailable'}</h1>
      <p>${esc(reason)}</p>
      <div class="actions">
        ${showSignIn ? `<a href="auth.html" class="btn" style="padding:11px 16px;font-size:13px;background:var(--ink);color:var(--paper);border-radius:9px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;border:none;"><i data-lucide="log-in"></i> Sign in</a>` : ''}
        <a href="index.html" class="btn ghost" style="padding:11px 16px;font-size:13px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:9px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;"><i data-lucide="arrow-left"></i> Home</a>
      </div>
    </div>`;
  if (window.lucide) lucide.createIcons();
}

/* =================== AUTH =================== */
onAuthStateChanged(auth, async (user) => {
  if (!user) { renderDenied('Sign in to see your Prelude status.', true); return; }
  if (user.email === ADMIN_EMAIL) { window.location.href = 'admin.html'; return; }

  try {
    const snap = await getDoc(doc(db, 'users', user.uid));
    if (!snap.exists()) {
      renderDenied('No profile record found. Complete your application first.', false);
      return;
    }
    render({ id: user.uid, ...snap.data() });
  } catch (err) {
    renderDenied('Could not load your record: ' + err.message, false);
  }
});
</script>
