<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Institute of Board</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 10 L92 85 H8 L50 10 Z' fill='%237A1F2B'/%3E%3Cpath d='M50 32 L77 78 H23 L50 32 Z' fill='%23FFFFFF'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  /* ALL CSS IS IN HERE - NO EXTERNAL FILES */
  :root {
    --maroon: #7A1F2B;
    --maroon-hover: #5A1620;
    --black: #111;
    --gray: #666;
    --silver: #E2E8F0;
    --bg: #F8FAFC;
    --white: #FFF;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--black);
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  a { text-decoration: none; color: inherit; }

  /* Top Bar */
  .top-bar {
    background: var(--silver);
    text-align: center;
    padding: 10px;
    font-size: 13px;
    font-weight: 600;
    border-bottom: 1px solid #cbd5e1;
  }

  /* Header */
  .header {
    background: var(--white);
    border-bottom: 1px solid var(--silver);
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 20px;
    font-weight: 900;
  }
  .brand svg { width: 30px; height: 30px; }
  .btn-home {
    font-size: 14px;
    font-weight: 700;
    padding: 10px 20px;
    border: 2px solid var(--silver);
    border-radius: 8px;
    transition: 0.2s;
  }
  .btn-home:hover { border-color: var(--maroon); color: var(--maroon); }

  /* Main Content */
  .main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .card {
    background: var(--white);
    border: 1px solid var(--silver);
    border-radius: 20px;
    padding: 50px 30px;
    max-width: 500px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.05);
  }
  .error-code {
    font-family: 'Courier New', monospace;
    font-size: 90px;
    font-weight: 900;
    color: var(--maroon);
    line-height: 1;
    margin-bottom: 10px;
  }
  .error-title {
    font-size: 24px;
    font-weight: 900;
    margin-bottom: 15px;
  }
  .error-desc {
    font-size: 15px;
    color: var(--gray);
    margin-bottom: 30px;
  }
  .btn-primary {
    display: inline-block;
    background: var(--maroon);
    color: var(--white);
    padding: 14px 28px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 15px;
    width: 100%;
    transition: 0.2s;
  }
  .btn-primary:hover { background: var(--maroon-hover); }

  /* Footer */
  .footer {
    text-align: center;
    padding: 20px;
    font-size: 12px;
    color: var(--gray);
    border-top: 1px solid var(--silver);
  }
</style>
</head>
<body>

  <div class="top-bar">
    <strong>Institute of Board</strong> · Non-accredited academic institution
  </div>

  <header class="header">
    <a href="/" class="brand">
      <svg viewBox="0 0 100 100">
        <path d="M50 10 L92 85 H8 L50 10 Z" fill="#7A1F2B"/>
        <path d="M50 32 L77 78 H23 L50 32 Z" fill="#FFFFFF"/>
      </svg>
      IFB Portal
    </a>
    <a href="/" class="btn-home">← Home</a>
  </header>

  <main class="main">
    <div class="card">
      <div class="error-code">404</div>
      <h1 class="error-title">Page Not Found</h1>
      <p class="error-desc" id="errorMsg">
        This page has been moved or deleted during our 2027 portal upgrade.
      </p>
      <a href="/" class="btn-primary">Return to Homepage</a>
    </div>
  </main>

  <footer class="footer">
    &copy; 2026—2028 Institute of Board. Independent, non-accredited institution.
  </footer>

  <script>
    // ALL JS IS IN HERE
    // This script automatically shows the user what missing URL they tried to visit.
    var path = window.location.pathname;
    if (path && path !== '/' && path !== '/404.html') {
      var msg = document.getElementById('errorMsg');
      msg.innerHTML = "The page <code>" + path + "</code> does not exist or has been moved.";
    }
  </script>
</body>
</html>
