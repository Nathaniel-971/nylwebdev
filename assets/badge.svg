<svg viewBox="0 0 240 300" xmlns="http://www.w3.org/2000/svg" aria-label="Institution Emblem">
  <defs>
    <!-- Gold Gradient for the main elements -->
    <linearGradient id="emblemGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5d76e"/>
      <stop offset="0.5" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#8f6b1a"/>
    </linearGradient>
    <!-- Lighter Gold for the banner and highlights -->
    <linearGradient id="emblemGoldLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff5cc"/>
      <stop offset="1" stop-color="#d4af37"/>
    </linearGradient>

    <!-- Left Radiating Wing -->
    <g id="wing">
      <path d="M 60 100 L 20 80 L 25 92 L 60 110 Z" fill="url(#emblemGold)"/>
      <path d="M 60 125 L 15 115 L 20 127 L 60 135 Z" fill="url(#emblemGold)"/>
      <path d="M 62 150 L 18 148 L 22 160 L 62 160 Z" fill="url(#emblemGold)"/>
      <path d="M 65 175 L 25 180 L 30 192 L 68 183 Z" fill="url(#emblemGold)"/>
      <path d="M 70 200 L 35 210 L 42 220 L 74 208 Z" fill="url(#emblemGold)"/>
    </g>
  </defs>

  <!-- Left Wing -->
  <use href="#wing" x="0" y="0"/>
  <!-- Right Wing (Mirrored) -->
  <use href="#wing" transform="translate(240, 0) scale(-1, 1)"/>

  <!-- Outer Shield -->
  <path d="M 120 30 L 190 50 L 190 150 C 190 215 120 260 120 260 C 120 260 50 215 50 150 L 50 50 Z" 
        fill="none" stroke="url(#emblemGold)" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- Inner Shield Border -->
  <path d="M 120 45 L 178 62 L 178 148 C 178 203 120 243 120 243 C 120 243 62 203 62 148 L 62 62 Z" 
        fill="none" stroke="url(#emblemGold)" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Inner Shield Background (Subtle) -->
  <path d="M 120 45 L 178 62 L 178 148 C 178 203 120 243 120 243 C 120 243 62 203 62 148 L 62 62 Z" 
        fill="#fff" opacity="0.05"/>

  <!-- Star at the top of the shield -->
  <path d="M 120 60 L 123 68 L 132 68 L 125 74 L 128 82 L 120 77 L 112 82 L 115 74 L 108 68 L 117 68 Z" 
        fill="url(#emblemGold)"/>

  <!-- The Ball / Planet (Replacing the hat) -->
  <g transform="translate(120, 145)">
    <!-- Orbit Ring -->
    <ellipse cx="0" cy="0" rx="38" ry="12" fill="none" stroke="url(#emblemGold)" stroke-width="3" transform="rotate(-20)"/>
    <!-- Ball/Sphere -->
    <circle cx="0" cy="0" r="24" fill="url(#emblemGold)"/>
    <!-- Highlight on the ball -->
    <circle cx="-8" cy="-8" r="8" fill="#fff" opacity="0.4"/>
    <!-- Small orbiting moon/dot -->
    <circle cx="30" cy="-12" r="4" fill="url(#emblemGoldLight)"/>
  </g>

  <!-- Curved Banner -->
  <!-- Banner Back (Shadows/Folds) -->
  <path d="M 30 230 L 50 245 L 50 265 L 20 250 Z" fill="url(#emblemGold)" opacity="0.8"/>
  <path d="M 210 230 L 190 245 L 190 265 L 220 250 Z" fill="url(#emblemGold)" opacity="0.8"/>
  
  <!-- Banner Main Body -->
  <path d="M 40 235 Q 120 270 200 235 L 200 260 Q 120 295 40 260 Z" fill="url(#emblemGoldLight)"/>
  
  <!-- Banner Left Fold -->
  <path d="M 30 230 L 40 235 L 40 260 L 25 255 Z" fill="url(#emblemGold)"/>
  <!-- Banner Right Fold -->
  <path d="M 210 230 L 200 235 L 200 260 L 215 255 Z" fill="url(#emblemGold)"/>

  <!-- Stars on Banner -->
  <path d="M 50 248 L 53 253 L 58 253 L 54 256 L 55 261 L 50 258 L 45 261 L 46 256 L 42 253 L 47 253 Z" fill="url(#emblemGold)"/>
  <path d="M 190 248 L 193 253 L 198 253 L 194 256 L 195 261 L 190 258 L 185 261 L 186 256 L 182 253 L 187 253 Z" fill="url(#emblemGold)"/>

  <!-- Motto Text on Banner -->
  <text x="120" y="253" text-anchor="middle" font-family="'Times New Roman', serif" font-size="9" font-weight="700" fill="#0d0d0d" letter-spacing="2">SCIENCE · MATHEMATICS · CRAFT</text>
</svg>