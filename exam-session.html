<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IFB Live Examination</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<meta name="theme-color" content="#7A1F2B">

<!-- Libraries -->
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
  window.MathJax = { tex: { inlineMath: [['$','$'], ['\\(','\\)']], displayMath: [['$$','$$']] }, svg: { fontCache: 'global' } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  /* ========== BASE ========== */
  :root { 
    --maroon: #7A1F2B; --bg: #F8FAFC; --panel: #FFFFFF; --text: #111111; 
    --gray: #64748B; --silver: #E2E8F0; --success: #15803D; --error: #B91C1C; 
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* ========== HEADER ========== */
  .header { background: var(--panel); border-bottom: 1px solid var(--silver); padding: 0 16px; height: 64px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; z-index: 100; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 18px; }
  .brand span { color: var(--maroon); font-size: 24px; }
  .clock-container { background: var(--bg); padding: 6px 14px; border-radius: 8px; border: 1px solid var(--silver); display: flex; align-items: center; gap: 8px; }
  .clock { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700; color: var(--success); }
  .clock.danger { color: var(--error); animation: pulse 1s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  .btn { background: transparent; border: 1px solid var(--silver); color: var(--text); padding: 8px 12px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: 0.2s; font-family: inherit; }
  .btn:hover { background: var(--bg); }
  .btn-primary { background: var(--maroon); color: var(--white); border: none; }
  .btn-danger { border-color: var(--error); color: var(--error); }

  /* ========== MAIN LAYOUT ========== */
  .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .tabs { display: flex; background: var(--panel); border-bottom: 1px solid var(--silver); overflow-x: auto; flex-shrink: 0; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab-btn { flex: 1; padding: 12px 16px; border: none; background: transparent; font-weight: 700; font-size: 13px; color: var(--gray); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; border-bottom: 2px solid transparent; white-space: nowrap; transition: 0.2s; font-family: inherit; }
  .tab-btn.active { color: var(--maroon); border-bottom-color: var(--maroon); background: var(--bg); }

  /* IFRAME WRAPPER */
  .content-area { flex: 1; position: relative; display: flex; }
  .tab-content { display: none; width: 100%; height: 100%; }
  .tab-content.active { display: block; }
  
  /* The iframe takes up 100% of the space */
  .doc-frame { width: 100%; height: 100%; border: none; background: #E2E8F0; }

  /* ========== ADMIN UI ========== */
  .admin-container { padding: 16px; overflow-y: auto; height: 100%; width: 100%; }
  .admin-grid { display: grid; grid-template-columns: 1fr; gap: 16px; max-width: 800px; margin: 0 auto; }
  @media (min-width: 768px) { .admin-grid { grid-template-columns: 350px 1fr; } }
  .card { background: var(--white); border: 1px solid var(--silver); border-radius: 12px; padding: 20px; }
  .card h2 { font-size: 16px; font-weight: 900; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--silver); padding-bottom: 12px; }
  .file-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .file-group label { font-size: 12px; font-weight: 700; }
  .file-input { width: 100%; font-size: 12px; padding: 8px; border: 1px solid var(--silver); border-radius: 6px; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--silver); border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; min-width: 400px; }
  th, td { padding: 10px 12px; border-bottom: 1px solid var(--silver); }
  th { background: var(--bg); font-weight: 800; color: var(--gray); text-transform: uppercase; font-size: 10px; }
  .status-badge { padding: 3px 8px; border-radius: 4px; font-weight: 700; font-size: 11px; }

  /* ========== OVERLAYS ========== */
  .overlay { position: fixed; inset: 0; background: rgba(248, 250, 252, 0.95); backdrop-filter: blur(10px); z-index: 1000; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 24px; }
  .overlay.active { display: flex; }
  .overlay h2 { font-size: 28px; font-weight: 900; margin-bottom: 16px; }
  .overlay p { font-size: 15px; color: var(--gray); max-width: 400px; margin-bottom: 24px; }
  .pin-input { background: var(--white); border: 2px solid var(--silver); font-size: 32px; font-family: monospace; text-align: center; letter-spacing: 8px; padding: 16px; border-radius: 12px; outline: none; width: 100%; max-width: 300px; margin-bottom: 24px; }
</style>
</head>
<body oncontextmenu="return false;">

<!-- HEADER -->
<header class="header">
  <div class="brand"><span>∆</span> IFB Exam</div>
  <div class="clock-container" id="clockContainer" style="display:none;">
    <i data-lucide="timer" style="width: 16px; height: 16px; color: var(--gray);"></i>
    <div class="clock" id="clockDisplay">--:--:--</div>
  </div>
  <div class="header-actions">
    <button class="btn btn-danger" onclick="exitExam()"><i data-lucide="log-out" style="width: 16px; height: 16px;"></i> Exit</button>
  </div>
</header>

<!-- MAIN -->
<main class="main-content">
  <div class="tabs" id="mainTabs">
    <button class="tab-btn active" onclick="switchTab('paper')" id="tabPaper"><i data-lucide="file-text"></i> Paper</button>
    <button class="tab-btn" onclick="switchTab('answerbook')" id="tabAnswerBook"><i data-lucide="book-open"></i> Answer Book</button>
    <button class="tab-btn" onclick="switchTab('guidelines')" id="tabGuidelines"><i data-lucide="shield-check"></i> Guidelines</button>
    <button class="tab-btn" onclick="switchTab('admin')" id="tabAdmin" style="display:none;"><i data-lucide="settings"></i> Admin</button>
  </div>

  <div class="content-area">
    <!-- The iframes will render the EXACT uploaded HTML -->
    <div class="tab-content active" id="viewPaper">
      <iframe class="doc-frame" id="paperFrame" src="about:blank"></iframe>
    </div>

    <div class="tab-content" id="viewAnswerBook">
      <iframe class="doc-frame" id="answerBookFrame" src="about:blank"></iframe>
    </div>

    <div class="tab-content" id="viewGuidelines">
      <iframe class="doc-frame" id="guidelinesFrame" src="about:blank"></iframe>
    </div>

    <!-- ADMIN TAB (No iframe, just UI) -->
    <div class="tab-content" id="viewAdmin">
      <div class="admin-container">
        <div class="admin-grid">
          <div class="card">
            <h2><i data-lucide="settings"></i> Create Session</h2>
            <div class="file-group"><label>Question Paper (.html)</label><input type="file" id="qFile" class="file-input" accept=".html"></div>
            <div class="file-group"><label>Answer Book (.html)</label><input type="file" id="aFile" class="file-input" accept=".html"></div>
            <div class="file-group"><label>Guidelines (.html)</label><input type="file" id="gFile" class="file-input" accept=".html"></div>
            <div class="file-group"><label>Exam Title</label><input type="text" id="examTitle" class="file-input" placeholder="e.g. AE Mathematics 2027"></div>
            <div class="file-group"><label>Exam PIN (6 digits)</label><input type="text" id="examPin" class="file-input" maxlength="6" placeholder="123456" style="font-family:monospace; font-size:16px; text-align:center;"></div>
            <div class="file-group"><label>Duration (minutes)</label><input type="number" id="examDuration" class="file-input" value="120"></div>
            <button class="btn btn-primary" style="width:100%; justify-content:center;" id="startBtn" onclick="createSession()"><i data-lucide="play-circle"></i> Create & Publish</button>
            <div id="setupStatus" style="margin-top: 8px; font-size: 12px; font-weight: 700; text-align: center; color: var(--gray);"></div>
          </div>
          <div class="card">
            <h2><i data-lucide="activity"></i> Live Monitor</h2>
            <div class="table-wrap">
              <table><thead><tr><th>Exam No</th><th>Status</th><th>Tabs</th><th>Action</th></tr></thead>
              <tbody id="monitorTable"><tr><td colspan="4" style="text-align:center;padding:20px;">Waiting...</td></tr></tbody></table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- PIN OVERLAY -->
<div class="overlay" id="pinOverlay">
  <div style="background: var(--panel); padding: 32px; border-radius: 24px; border: 1px solid var(--silver);">
    <i data-lucide="shield-lock" style="width: 48px; height: 48px; color: var(--maroon); margin-bottom: 16px;"></i>
    <h2>Session Locked</h2>
    <p style="margin-bottom: 20px;">Enter the 6-digit PIN sent to your email to begin.</p>
    <input type="text" class="pin-input" id="pinInput" maxlength="6" placeholder="••••••">
    <button class="btn btn-primary" style="padding: 14px 24px; font-size: 15px; width: 100%; justify-content: center; font-weight: 700;" onclick="verifyPin()">Unlock Exam</button>
    <p id="pinError" style="color: var(--error); font-size: 13px; margin-top: 12px; display: none; font-weight: 700;">Incorrect PIN.</p>
  </div>
</div>

<!-- TAB WARNING -->
<div class="overlay" id="tabWarning">
  <i data-lucide="alert-triangle" style="width: 64px; height: 64px; color: var(--error); margin-bottom: 16px;"></i>
  <h2 style="color: var(--error);">Tab Switch Detected</h2>
  <p>You have left the examination window. This has been logged.</p>
  <button class="btn btn-primary" style="padding: 14px 24px; font-size: 15px;" onclick="document.getElementById('tabWarning').classList.remove('active')">I Understand</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, query, orderBy, serverTimestamp, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = { apiKey: "AIzaSyA6HO7n6wCZEeCgKxJLjB-MjL0ZFGR7svU", authDomain: "nyldevcourses.firebaseapp.com", projectId: "nyldevcourses", storageBucket: "nyldevcourses.firebasestorage.app", messagingSenderId: "16687006873", appId: "1:16687006873:web:b7d66ad1024ccd92722408" };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const ADMIN_EMAIL = "n1nathaniel971@gmail.com";

  let currentUser = null, studentId = null, examNumber = null;
  let currentSessionId = null, examPin = null, examDurationMins = 120;
  let examStartTime = null, timerInterval = null, unsubMonitor = null;

  function refreshIcons() { if (window.lucide) { try { lucide.createIcons(); } catch(e) {} } }

  // Get Session ID from URL
  const urlParams = new URLSearchParams(window.location.search);
  currentSessionId = urlParams.get('session');

  // Auth Check
  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = "index.html"; return; }
    currentUser = user;

    if (user.email === ADMIN_EMAIL) {
      document.getElementById('tabAdmin').style.display = 'flex';
      initMonitor();
      if (currentSessionId) await loadSessionData(currentSessionId, true);
    } else {
      await initStudentSession(user);
    }
    refreshIcons();
  });

  // ============================================================
  // ADMIN FUNCTIONS
  // ============================================================
  window.createSession = async function() {
    const qFile = document.getElementById('qFile').files[0];
    const aFile = document.getElementById('aFile').files[0];
    const gFile = document.getElementById('gFile').files[0];
    const title = document.getElementById('examTitle').value.trim();
    const pin = document.getElementById('examPin').value.trim();
    const duration = parseInt(document.getElementById('examDuration').value);
    const statusEl = document.getElementById('setupStatus');
    const btn = document.getElementById('startBtn');

    if (!qFile || !aFile || !gFile || !title || pin.length !== 6) { alert("Please fill all fields."); return; }

    try {
      btn.disabled = true;
      statusEl.innerText = "Reading files...";

      const readText = (f) => new Promise(r => { const rd = new FileReader(); rd.onload = e => r(e.target.result); rd.readAsText(f); });
      
      const qHtml = await readText(qFile);
      const aHtml = await readText(aFile);
      const gHtml = await readText(gFile);

      statusEl.innerText = "Saving to Database...";
      const sessionId = 'SESSION_' + Date.now();

      await setDoc(doc(db, "examSessions", sessionId), {
        sessionId, title, examCode: pin, 
        questionPaperHtml: qHtml, answerBookHtml: aHtml, guidelinesHtml: gHtml,
        durationMinutes: duration, active: true, createdAt: serverTimestamp()
      });

      await setDoc(doc(db, "config", "examSettings"), { activeSessionId: sessionId }, { merge: true });
      
      statusEl.innerText = "Session Published!";
      statusEl.style.color = "var(--success)";
      btn.innerHTML = '<i data-lucide="check-circle"></i> Published';
      
      window.location.href = `exam-session.html?session=${sessionId}`;

    } catch (error) {
      statusEl.innerText = "Error: " + error.message;
      statusEl.style.color = "var(--error)";
      btn.disabled = false;
    }
  };

  function initMonitor() {
    if (unsubMonitor) unsubMonitor();
    const q = query(collection(db, "examLogs"), orderBy("lastActive", "desc"));
    unsubMonitor = onSnapshot(q, (snapshot) => {
      const tbody = document.getElementById('monitorTable');
      tbody.innerHTML = '';
      if (snapshot.empty) { tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:20px;">Waiting...</td></tr>'; return; }
      snapshot.forEach((doc) => {
        const data = doc.data();
        const tabCount = data.tabSwitches ? data.tabSwitches.length : 0;
        const isOnline = data.status === 'In Session' || data.status === 'Online';
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="font-family:monospace;font-weight:bold;">${data.examNumber || doc.id}</td>
          <td><span class="status-badge ${isOnline?'status-online':''}">${isOnline?'Online':'Offline'}</span></td>
          <td style="color:${tabCount>0?'var(--error)':'inherit'};font-weight:bold;">${tabCount}</td>
          <td><button class="btn" style="padding:4px 8px;font-size:11px;" onclick="alert('Viewer coming soon')">View</button></td>
        `;
        tbody.appendChild(tr);
      });
    });
  }

  // ============================================================
  // STUDENT FUNCTIONS
  // ============================================================
  async function initStudentSession(user) {
    const userDoc = await getDoc(doc(db, "users", user.uid));
    if (userDoc.exists()) {
      const data = userDoc.data();
      studentId = data.studentId;
      examNumber = data.examNumber;
    }

    if (!currentSessionId) {
      document.getElementById('paperFrame').srcdoc = `<html><body style="font-family:sans-serif;text-align:center;padding:50px;"><h1 style="color:red;">No session selected.</h1></body></html>`;
      return;
    }

    await loadSessionData(currentSessionId, false);
    document.getElementById('pinOverlay').classList.add('active');
  }

  async function loadSessionData(sessionId, isAdmin) {
    const sessionDoc = await getDoc(doc(db, "examSessions", sessionId));
    if (!sessionDoc.exists()) {
      document.getElementById('paperFrame').srcdoc = `<html><body style="font-family:sans-serif;text-align:center;padding:50px;"><h1 style="color:red;">Session not found.</h1></body></html>`;
      return;
    }
    const sd = sessionDoc.data();
    examPin = sd.examCode;
    examDurationMins = sd.durationMinutes || 120;

    if (isAdmin) {
      document.getElementById('pinOverlay').classList.remove('active');
      document.getElementById('clockContainer').style.display = 'flex';
      renderContent(sd);
      startTimer();
    } else {
      // Store the HTML in window variables so we can render it after PIN verification
      window._pendingHtml = sd;
    }
  }

  window.verifyPin = function() {
    const entered = document.getElementById('pinInput').value;
    if (entered === examPin) {
      document.getElementById('pinOverlay').classList.remove('active');
      document.getElementById('clockContainer').style.display = 'flex';
      renderContent(window._pendingHtml);
      startTimer();
      logEvent('login', {});
    } else {
      document.getElementById('pinError').style.display = 'block';
      document.getElementById('pinInput').value = '';
    }
  };

  // ============================================================
  // THE CRITICAL FIX: Render HTML via iframe.srcdoc
  // ============================================================
  function renderContent(sd) {
    if (sd.questionPaperHtml) {
      document.getElementById('paperFrame').srcdoc = sd.questionPaperHtml;
    }
    if (sd.answerBookHtml) {
      document.getElementById('answerBookFrame').srcdoc = sd.answerBookHtml;
    }
    if (sd.guidelinesHtml) {
      document.getElementById('guidelinesFrame').srcdoc = sd.guidelinesHtml;
    }
  }

  function startTimer() {
    examStartTime = Date.now();
    timerInterval = setInterval(() => {
      const remaining = (examDurationMins * 60 * 1000) - (Date.now() - examStartTime);
      if (remaining <= 0) {
        clearInterval(timerInterval);
        document.getElementById('clockDisplay').innerText = "00:00:00";
        document.getElementById('clockDisplay').className = "clock danger";
        alert("Time is up! The portal is now locked.");
        return;
      }
      const h = Math.floor(remaining / 3600000).toString().padStart(2, '0');
      const m = Math.floor((remaining % 3600000) / 60000).toString().padStart(2, '0');
      const s = Math.floor((remaining % 60000) / 1000).toString().padStart(2, '0');
      const clockEl = document.getElementById('clockDisplay');
      clockEl.innerText = `${h}:${m}:${s}`;
      if (remaining < 5 * 60 * 1000) clockEl.className = "clock danger";
    }, 1000);
  }

  window.switchTab = function(tab) {
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    if (tab === 'paper') { document.getElementById('viewPaper').classList.add('active'); document.getElementById('tabPaper').classList.add('active'); }
    else if (tab === 'answerbook') { document.getElementById('viewAnswerBook').classList.add('active'); document.getElementById('tabAnswerBook').classList.add('active'); }
    else if (tab === 'guidelines') { document.getElementById('viewGuidelines').classList.add('active'); document.getElementById('tabGuidelines').classList.add('active'); }
    else if (tab === 'admin') { document.getElementById('viewAdmin').classList.add('active'); document.getElementById('tabAdmin').classList.add('active'); }
  };

  document.addEventListener("visibilitychange", async () => {
    if (document.hidden && !document.getElementById('pinOverlay').classList.contains('active')) {
      document.getElementById('tabWarning').classList.add('active');
      await logEvent('tab_switch', {});
    }
  });

  async function logEvent(type, payload) {
    if (!studentId) return;
    try {
      const logRef = doc(db, "examLogs", studentId);
      if (type === 'tab_switch') {
        await setDoc(logRef, { examNumber, status: 'In Session', lastActive: serverTimestamp(), tabSwitches: arrayUnion(new Date().toISOString()) }, { merge: true });
      } else {
        await setDoc(logRef, { examNumber, status: 'In Session', lastActive: serverTimestamp() }, { merge: true });
      }
    } catch (e) {}
  }

  window.exitExam = async function() {
    if (confirm("Are you sure? You will not be able to re-enter.")) {
      await signOut(auth);
      window.location.href = "student-dashboard.html";
    }
  };

  refreshIcons();
</script>
</body>
</html>
