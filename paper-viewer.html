<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paper Viewer</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#2a2a2a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#0d0d0d;overflow:hidden}
.topbar{position:fixed;top:0;left:0;right:0;height:56px;background:#0d0d0d;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;z-index:100;border-bottom:1px solid #333}
.topbar .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
.topbar .mark{font-family:'Courier New',monospace;font-size:20px;font-weight:700;letter-spacing:-1px}
.topbar .label{font-size:13px;font-weight:600}
.topbar .actions{display:flex;gap:8px;align-items:center}
.topbar button,.topbar a{padding:9px 14px;font-size:12.5px;font-weight:600;border-radius:8px;border:1px solid #333;background:transparent;color:#fff;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:7px;text-decoration:none}
.topbar button:hover,.topbar a:hover{background:#222;border-color:#555}
.topbar button svg,.topbar a svg{width:14px;height:14px}
.scroll{position:absolute;top:56px;bottom:0;left:0;right:0;overflow-y:auto;overflow-x:hidden;padding:40px 20px 80px;perspective:2400px}
.scroll::-webkit-scrollbar{width:10px}
.scroll::-webkit-scrollbar-track{background:#1a1a1a}
.scroll::-webkit-scrollbar-thumb{background:#444;border-radius:5px}
.wrap{max-width:220mm;margin:0 auto 32px;position:relative;transform-style:preserve-3d}
.wrap iframe{width:100%;min-height:297mm;border:none;background:#fff;display:block;box-shadow:0 20px 60px rgba(0,0,0,.5);border-radius:2px}
@keyframes flipIn{0%{opacity:0;transform:rotateY(-30deg) translateZ(-100px)}100%{opacity:1;transform:rotateY(0) translateZ(0)}}
.flip-in{animation:flipIn 1s cubic-bezier(.22,.9,.3,1) both;transform-origin:left center}
.controls{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:8px;background:#0d0d0d;padding:8px;border-radius:100px;z-index:100;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.controls button{width:40px;height:40px;border-radius:50%;border:none;background:transparent;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.controls button:hover{background:#333}
.controls button svg{width:16px;height:16px}
.loading{text-align:center;color:#aaa;padding:80px 20px;font-size:14px}
.error{text-align:center;color:#ff6b6b;padding:80px 20px;font-size:14px}
@media print{.topbar,.controls{display:none!important}.scroll{position:static;padding:0;overflow:visible}.wrap{max-width:100%;margin:0;box-shadow:none}.wrap iframe{min-height:0;box-shadow:none}body{background:#fff}}
</style>
</head>
<body>

<div class="topbar">
  <a href="past-papers.html" class="brand">
    <span class="mark">∆</span>
    <span class="label">Paper Viewer</span>
  </a>
  <div class="actions">
    <button id="printBtn"><i data-lucide="printer"></i> Print</button>
    <a href="past-papers.html"><i data-lucide="arrow-left"></i> Back</a>
  </div>
</div>

<div class="scroll" id="scroll"><div class="loading">Loading document…</div></div>

<div class="controls">
  <button id="flipLeft" title="Flip left"><i data-lucide="chevron-left"></i></button>
  <button id="flipRight" title="Flip right"><i data-lucide="chevron-right"></i></button>
</div>

<script>
(function(){
  const params = new URLSearchParams(location.search);
  const src = params.get('src');
  const scroll = document.getElementById('scroll');
  if (!src) { scroll.innerHTML = '<div class="error">No document specified.</div>'; return; }
  fetch(src)
    .then(res => { if (!res.ok) throw new Error('Could not load document'); return res.text(); })
    .then(html => {
      scroll.innerHTML = '';
      const wrap = document.createElement('div');
      wrap.className = 'wrap flip-in';
      const iframe = document.createElement('iframe');
      iframe.setAttribute('sandbox', 'allow-same-origin allow-scripts');
      wrap.appendChild(iframe);
      scroll.appendChild(wrap);
      const doc = iframe.contentDocument || iframe.contentWindow.document;
      doc.open(); doc.write(html); doc.close();
      setTimeout(() => { try { iframe.contentWindow.dispatchEvent(new Event('load')); } catch(e){} }, 300);
    })
    .catch(err => { scroll.innerHTML = '<div class="error">' + err.message + '</div>'; });
  document.getElementById('printBtn').addEventListener('click', () => {
    const iframe = document.querySelector('iframe');
    if (iframe && iframe.contentWindow) iframe.contentWindow.print();
  });
  document.getElementById('flipLeft').addEventListener('click', () => {
    const w = document.querySelector('.wrap'); if (!w) return;
    w.classList.remove('flip-in'); void w.offsetWidth;
    w.style.animation = 'flipIn .8s cubic-bezier(.22,.9,.3,1) reverse both';
    setTimeout(() => { w.style.animation = ''; }, 800);
  });
  document.getElementById('flipRight').addEventListener('click', () => {
    const w = document.querySelector('.wrap'); if (!w) return;
    w.classList.remove('flip-in'); void w.offsetWidth;
    w.classList.add('flip-in');
  });
  if (window.lucide) lucide.createIcons();
})();
</script>
</body>
</html>
