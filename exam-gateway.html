<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Gateway — IFB</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 10 L92 85 H8 L50 10 Z' fill='%237A1F2B'/%3E%3Cpath d='M50 32 L77 78 H23 L50 32 Z' fill='%23FFFFFF'/%3E%3C/svg%3E">
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root { --maroon: #7A1F2B; --silver: #E2E8F0; --black: #111; --gray: #666; --white: #FFF; --bg: #F8FAFC; --success: #15803D; }
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
body { background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; color: var(--black); }
.card { background: var(--white); border: 1px solid var(--silver); border-radius: 16px; padding: 40px; max-width: 480px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; }
.logo { font-size: 48px; font-weight: 900; color: var(--maroon); margin-bottom: 12px; }
h1 { font-size: 24px; font-weight: 900; margin-bottom: 8px; }
p.sub { font-size: 14px; color: var(--gray); margin-bottom: 28px; }
.input-group { text-align: left; margin-bottom: 16px; }
label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px; }
input { width: 100%; padding: 14px; font-size: 16px; border: 1.5px solid var(--silver); border-radius: 8px; outline: none; font-family: monospace; text-align: center; letter-spacing: 2px; }
input:focus { border-color: var(--maroon); }
.btn { width: 100%; padding: 16px; background: var(--maroon); color: var(--white); border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px; transition: 0.2s; }
.btn:hover { background: #5A1620; }
.btn:disabled { opacity: 0.7; cursor: wait; }
.error { color: #B91C1C; font-size: 14px; margin-top: 15px; display: none; background: #FEF2F2; padding: 12px; border-radius: 8px; border: 1px solid #FECACA; }
.hint { font-size: 11px; color: var(--gray); margin-top: 6px; }
.back-link { display: block; margin-top: 24px; font-size: 14px; color: var(--gray); text-decoration: none; font-weight: 600; }
.back-link:hover { color: var(--maroon); }
</style>
</head>
<body>

<div class="card">
    <div class="logo">∆</div>
    <h1>Examination Gateway</h1>
    <p class="sub">Verify your credentials to enter the live exam session.</p>

    <div class="input-group">
        <label>Student ID or Examination Number</label>
        <input type="text" id="studentId" placeholder="270100 or 2701000000001" maxlength="13" autocomplete="off">
        <div class="hint">6-digit Student ID (2701XX) or 13-digit Examination Number (2701XXXXXXXXX).</div>
    </div>
    <div class="input-group">
        <label>6-Character Security Code</label>
        <input type="password" id="securityCode" placeholder="A7X2B9" maxlength="6" autocomplete="off">
    </div>
    <div class="input-group" id="examCodeGroup">
        <label>Examination Access Code</label>
        <input type="text" id="examCode" placeholder="Provided by Invigilator" maxlength="10" autocomplete="off" style="text-transform: uppercase;">
    </div>

    <button class="btn" id="enterBtn" onclick="verifyAndEnter()">Verify &amp; Enter Session</button>
    <div class="error" id="errorBox"></div>

    <a href="student-dashboard.html" class="back-link"><i data-lucide="arrow-left" style="width:14px; height:14px; vertical-align:middle;"></i> Back to Dashboard</a>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyA6HO7n6wCZEeCgKxJLjB-MjL0ZFGR7svU", authDomain: "nyldevcourses.firebaseapp.com", projectId: "nyldevcourses", storageBucket: "nyldevcourses.firebasestorage.app", messagingSenderId: "16687006873", appId: "1:16687006873:web:b7d66ad1024ccd92722408" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const ADMIN = "n1nathaniel971@gmail.com";

// 2027 Intake 01 format
const SID_REGEX         = /^2701\d{2}$/;       // 270100–270199
const SID_LEGACY_REGEX  = /^2701\d{4}$/;       // 27010001–27019999
const EXAM_REGEX        = /^2701\d{9}$/;       // 2701000000001–2701999999999
const EXAM_LEGACY_REGEX = /^26012027\d{5}$/;   // 2601202700001–2601202799999

let isCurrentUserAdmin = false;
let currentUserDoc = null;

onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = "index.html"; return; }

    if (user.email === ADMIN) {
        isCurrentUserAdmin = true;
        document.getElementById('examCodeGroup').style.display = 'none';
    }

    const docSnap = await getDoc(doc(db, "users", user.uid));
    if (docSnap.exists()) currentUserDoc = docSnap.data();
});

window.verifyAndEnter = async function() {
    const id = document.getElementById('studentId').value.trim();
    const code = document.getElementById('securityCode').value.trim().toUpperCase();
    const examCodeInput = document.getElementById('examCode').value.trim().toUpperCase();

    const errorBox = document.getElementById('errorBox');
    const btn = document.getElementById('enterBtn');
    errorBox.style.display = 'none';

    if (isCurrentUserAdmin) {
        sessionStorage.setItem("examStudentId", "ADMIN");
        sessionStorage.setItem("examSecurityCode", "ADMIN");
        sessionStorage.setItem("examStudentName", "Administrator");
        sessionStorage.setItem("isAdmin", "true");
        sessionStorage.setItem("examCode", "ADMIN");
        window.location.href = "exam-session.html";
        return;
    }

    const validSid       = SID_REGEX.test(id);
    const validLegacySid = SID_LEGACY_REGEX.test(id);
    const validExam      = EXAM_REGEX.test(id);
    const validLegacyEx  = EXAM_LEGACY_REGEX.test(id);

    if (!validSid && !validLegacySid && !validExam && !validLegacyEx) {
        errorBox.innerText = "Invalid format. Enter your 6-digit Student ID (2701XX) or 13-digit Examination Number (2701XXXXXXXXX).";
        errorBox.style.display = 'block';
        return;
    }
    if (code.length !== 6) {
        errorBox.innerText = "Security code must be exactly 6 characters.";
        errorBox.style.display = 'block';
        return;
    }

    btn.innerText = "Verifying..."; btn.disabled = true;

    try {
        if (!currentUserDoc) {
            errorBox.innerText = "Student record not found. Please complete your application.";
            errorBox.style.display = 'block';
            btn.innerText = "Verify & Enter Session"; btn.disabled = false;
            return;
        }

        const configSnap = await getDoc(doc(db, "config", "examSettings"));
        let correctCode = "IFB2027";
        if (configSnap.exists()) correctCode = configSnap.data().examCode || "IFB2027";

        if (examCodeInput !== correctCode) {
            errorBox.innerText = "Invalid Examination Access Code. Please ask the invigilator.";
            errorBox.style.display = 'block';
            btn.innerText = "Verify & Enter Session"; btn.disabled = false;
            return;
        }

        const idMatches =
            currentUserDoc.studentId === id ||
            currentUserDoc.legacyStudentId === id ||
            currentUserDoc.examinationNumber === id ||
            currentUserDoc.legacyExaminationNumber === id;

        if (idMatches && currentUserDoc.securityCode === code) {
            sessionStorage.setItem("examStudentId", currentUserDoc.studentId || id);
            sessionStorage.setItem("examSecurityCode", code);
            sessionStorage.setItem("examStudentName", currentUserDoc.name || 'Student');
            sessionStorage.setItem("examExaminationNumber", currentUserDoc.examinationNumber || '');
            sessionStorage.setItem("isAdmin", "false");

            const courses = currentUserDoc.courses || [];
            let examCodeVal = "AE-W-AEW";
            if (courses.includes("Mathematics")) examCodeVal = "AE-S-MATH";
            else if (courses.includes("Physics")) examCodeVal = "AE-S-PHYS";
            sessionStorage.setItem("examCode", examCodeVal);

            window.location.href = "exam-session.html";
        } else {
            errorBox.innerText = "Invalid Student ID or Security Code. Please check your Student Card.";
            errorBox.style.display = 'block';
            btn.innerText = "Verify & Enter Session"; btn.disabled = false;
        }
    } catch (error) {
        console.error(error);
        errorBox.innerText = "Database error. Contact the invigilator.";
        errorBox.style.display = 'block';
        btn.innerText = "Verify & Enter Session"; btn.disabled = false;
    }
};

document.getElementById('studentId').addEventListener('input', (e) => e.target.value = e.target.value.replace(/\D/g, ''));
document.getElementById('securityCode').addEventListener('input', (e) => e.target.value = e.target.value.toUpperCase());

if (window.lucide) lucide.createIcons();
</script>
</body>
</html>
