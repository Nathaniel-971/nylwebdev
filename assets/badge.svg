    <ellipse cx="0" cy="0" rx="28" ry="9" fill="none" stroke="url(#bdGold)" stroke-width="2" transform="rotate(-20)"/>
    <circle cx="-6" cy="-4" r="2.5" fill="#0f1f5c"/>
    <circle cx="7" cy="5" r="3" fill="#0f1f5c"/>
