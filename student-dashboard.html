<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Student Dashboard · IFB Institute</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ffffff">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
:root{--ink:#0b0b0b;--paper:#fff;--bg:#f7f7f7;--line:#e5e5e5;--muted:#6b6b6b;--red:#b3261e;--radius:12px;--font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;--mono:ui-monospace,monospace;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;user-select:none;}
header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top);}
.header-inner{padding:14px 20px;display:flex;justify-content:space-between;align-items:center;max-width:680px;margin:0 auto;}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none;}
.brand-mark{font-size:44px;font-weight:700;line-height:.85;letter-spacing:-3px;}
.brand-text{display:flex;flex-direction:column;line-height:1.05;}
.brand-name{font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;}
.brand-sub{font-size:9.5px;color:var(--muted);letter-spacing:1.6px;text-transform:uppercase;margin-top:3px;}
.header-right{display:flex;align-items:center;gap:10px;}
.nav-avatar{width:40px;height:40px;border-radius:12px;overflow:hidden;border:1.5px solid var(--line);display:none;align-items:center;justify-content:center;background:var(--bg);}
.nav-avatar svg{display:block;border-radius:11px;}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;transition:all .2s;}
.icon-btn:hover{background:var(--bg);border-color:var(--ink);}
.icon-btn svg{width:18px;height:18px;}
.shell{max-width:680px;margin:0 auto;padding:24px 20px 60px;}
.hero-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:20px;}
.hero-top{display:flex;gap:16px;align-items:flex-start;margin-bottom:18px;}
.hero-avatar{width:64px;height:64px;border-radius:16px;overflow:hidden;border:1.5px solid var(--line);flex-shrink:0;background:var(--bg);}
.hero-avatar svg{display:block;border-radius:15px;}
.hero-id h1{font-size:20px;font-weight:700;margin-bottom:4px;}
.hero-id .email{font-size:12px;font-family:var(--mono);color:var(--muted);}
.status-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;padding:5px 10px;border-radius:100px;text-transform:uppercase;}
.badge.pending{background:#fcf8eb;color:#9e7820;}
.badge.duration{background:var(--bg);color:var(--muted);border:1px solid var(--line);}
.badge.stream{background:var(--ink);color:var(--paper);}
.section{margin-bottom:24px;}
.section-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:0 4px;}
.section-head h2{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:700;}
.section-head .line{flex:1;height:1px;background:var(--line);}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:12px;}
.id-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.id-cell{background:var(--bg);padding:14px;border-radius:10px;border:1px solid var(--line);}
.id-cell .k{font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px;}
.id-cell .v{font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:.5px;word-break:break-all;}
.id-cell .v.null{font-family:var(--font);font-size:12px;color:var(--muted);font-style:italic;font-weight:500;}
.barcode-box{background:var(--paper);border:1.5px dashed var(--line);border-radius:12px;padding:20px;text-align:center;}
.barcode-box .lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:12px;}
.barcode-box svg{width:100%;max-width:300px;height:50px;display:block;margin:0 auto;}
.barcode-box .num{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:2px;margin-top:10px;}
.action-item{display:flex;align-items:center;gap:14px;padding:16px;background:var(--paper);border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);margin-bottom:8px;transition:all .2s;}
.action-item:hover{border-color:var(--ink);}
.action-item .ic{width:36px;height:36px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;}
.action-item .txt h4{font-size:13.5px;font-weight:600;}
.action-item .txt p{font-size:11px;color:var(--muted);}
.btn{width:100%;padding:14px;border-radius:12px;background:var(--ink);color:var(--paper);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;}
.btn.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line);}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);}
.modal-overlay.open{display:flex;}
.modal{background:var(--paper);width:100%;max-width:480px;border-radius:20px;padding:24px;}
.modal h3{font-size:18px;font-weight:700;margin-bottom:8px;}
.modal p{font-size:13px;color:var(--muted);margin-bottom:20px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:600;margin-bottom:6px;}
.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:var(--bg);}
</style>
</head>
<body oncontextmenu="return false;">

<header>
  <div class="header-inner">
    <a href="index.html" class="brand">
      <span class="brand-mark">∆</span>
      <span class="brand-text">
        <span class="brand-name">Student Dashboard</span>
        <span class="brand-sub">IFB Institute</span>
      </span>
    </a>
    <div class="header-right">
      <div class="nav-avatar" id="navAvatar"></div>
      <button class="icon-btn" id="logoutBtn"><i data-lucide="log-out"></i></button>
    </div>
  </div>
</header>

<main class="shell" id="app">
  <div style="text-align:center;padding:40px;color:var(--muted);">Loading official records…</div>
</main>

<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h3>Edit Curriculum</h3>
    <p>You may change your stream until 21 March 2027.</p>
    <div class="field">
      <label>Stream</label>
      <select id="editStream">
        <option value="fullstack">Full Stack Engineering</option>
        <option value="frontend">Frontend Development</option>
        <option value="backend">Backend Engineering</option>
        <option value="mobile">Mobile Development</option>
        <option value="webdesign">Web Design</option>
        <option value="uiux">UI/UX Design</option>
        <option value="data">Data & Analytics</option>
        <option value="stem">STEM & Physics</option>
      </select>
    </div>
    <div style="display:flex;gap:10px;margin-top:20px;">
      <button class="btn ghost" onclick="document.getElementById('editModal').classList.remove('open')">Cancel</button>
      <button class="btn" id="saveEditBtn">Save Changes</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyA6HO7n6wCZEeCgKxJLjB-MjL0ZFGR7svU", authDomain: "nyldevcourses.firebaseapp.com", projectId: "nyldevcourses", storageBucket: "nyldevcourses.firebasestorage.app", messagingSenderId: "16687006873", appId: "1:16687006873:web:b7d66ad1024ccd92722408" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const appEl = document.getElementById('app');

function hash32(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function gridy(seed,px){px=px||40;const h=hash32(String(seed||'anon'));const rnd=mulberry32(h);const hue=h%360;const fg='hsl('+hue+',48%,32%)';const bg='hsl('+hue+',20%,90%)';const N=5,cell=100/N;const half=[];for(let r=0;r<N;r++){const row=[];for(let c=0;c<3;c++)row.push(rnd()>0.46?1:0);half.push(row);}if(!half.some(r=>r.some(v=>v)))half[2][1]=1;let rects='';for(let r=0;r<N;r++)for(let c=0;c<N;c++){const cc=c<3?c:4-c;if(half[r][cc])rects+='<rect x="'+(c*cell).toFixed(2)+'" y="'+(r*cell).toFixed(2)+'" width="'+cell.toFixed(2)+'" height="'+cell.toFixed(2)+'"/>';}return '<svg viewBox="0 0 100 100" width="'+px+'" height="'+px+'" xmlns="http://www.w3.org/2000/svg" style="display:block"><rect width="100" height="100" fill="'+bg+'"/><g fill="'+fg+'">'+rects+'</g></svg>';}

let currentUid = null;
let currentUserData = null;

function render(data) {
  currentUserData = data;
  const isAdmissionPeriod = new Date() < new Date('2027-03-21T23:59:59+02:00');
  const hasStudentNo = !!data.studentNumber;
  const barcodeValue = data.studentNumber || data.referenceId;
  
  appEl.innerHTML = `
    <div class="hero-card">
      <div class="hero-top">
        <div class="hero-avatar" id="heroAvatar"></div>
        <div class="hero-id">
          <h1>${data.name || 'Candidate'}</h1>
          <div class="email">${data.email}</div>
        </div>
      </div>
      
      <div class="status-row">
        <span class="badge pending"><i data-lucide="clock"></i> ${hasStudentNo ? 'Enrolled' : 'Awaiting IFB/AE'}</span>
        <span class="badge duration"><i data-lucide="calendar"></i> ${data.duration || '—'} Months</span>
        <span class="badge stream"><i data-lucide="layout-grid"></i> ${data.course || '—'}</span>
      </div>

      ${isAdmissionPeriod ? `
      <div style="border-top:1px solid var(--line);padding-top:16px;display:flex;justify-content:space-between;align-items:center;">
        <div style="font-size:12px;color:var(--muted);">Need to adjust your stream?</div>
        <button class="btn ghost" style="width:auto;padding:8px 14px;font-size:12px;" onclick="document.getElementById('editModal').classList.add('open')">
          <i data-lucide="edit-3"></i> Edit Curriculum
        </button>
      </div>
      ` : ''}
    </div>

    <div class="section">
      <div class="section-head"><h2>Examination Records</h2><div class="line"></div></div>
      <div class="card">
        <div class="id-grid">
          <div class="id-cell">
            <div class="k">Reference ID</div>
            <div class="v">${data.referenceId}</div>
          </div>
          <div class="id-cell">
            <div class="k">Student Number</div>
            <div class="v ${data.studentNumber ? '' : 'null'}">${data.studentNumber || 'Pending'}</div>
          </div>
          <div class="id-cell">
            <div class="k">Examination Number</div>
            <div class="v ${data.examinationNumber ? '' : 'null'}">${data.examinationNumber || 'Pending'}</div>
          </div>
          <div class="id-cell">
            <div class="k">Examination PIN</div>
            <div class="v ${data.examPin ? '' : 'null'}">${data.examPin || 'Pending'}</div>
          </div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-head"><h2>Official Barcode</h2><div class="line"></div></div>
      <div class="barcode-box">
        <div class="lbl">Candidate Identification</div>
        ${barcodeValue ? `<svg id="barcode"></svg>` : '<div style="padding:10px;font-size:12px;color:var(--muted);">Will generate upon Student Number assignment.</div>'}
        <div class="num">${barcodeValue || '—'}</div>
      </div>
    </div>

    <div class="section">
      <div class="section-head"><h2>Quick Actions</h2><div class="line"></div></div>
      <a href="admission-slip.html" class="action-item">
        <div class="ic"><i data-lucide="file-text"></i></div>
        <div class="txt"><h4>Download Admission Slip</h4><p>A4 PDF format</p></div>
        <i data-lucide="chevron-right" style="margin-left:auto;color:var(--muted);"></i>
      </a>
      <a href="exam-room.html" class="action-item" style="border-color:var(--ink);">
        <div class="ic" style="background:var(--ink);color:var(--paper);"><i data-lucide="monitor-play"></i></div>
        <div class="txt"><h4>Enter Examination Room</h4><p>Practice environment & live exams</p></div>
        <i data-lucide="chevron-right" style="margin-left:auto;color:var(--muted);"></i>
      </a>
    </div>
  `;

  document.getElementById('heroAvatar').innerHTML = gridy(data.referenceId, 64);
  document.getElementById('navAvatar').innerHTML = gridy(data.referenceId, 40);
  document.getElementById('navAvatar').style.display = 'flex';

  if (barcodeValue && typeof JsBarcode === 'function') {
    try { JsBarcode('#barcode', barcodeValue, { format: 'CODE128', width: 2, height: 50, displayValue: false, margin: 0 }); } catch(e) {}
  }

  document.getElementById('editStream').value = data.course || 'fullstack';
  if (window.lucide) lucide.createIcons();
}

document.getElementById('saveEditBtn').addEventListener('click', async () => {
  const newStream = document.getElementById('editStream').value;
  try {
    await updateDoc(doc(db, 'users', currentUid), { course: newStream, updatedAt: serverTimestamp() });
    document.getElementById('editModal').classList.remove('open');
    currentUserData.course = newStream;
    render(currentUserData);
  } catch (e) {
    alert('Failed to update: ' + e.message);
  }
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await signOut(auth);
  localStorage.removeItem('ifb_user');
  window.location.href = 'index.html';
});

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = 'admissions.html'; return; }
  if (user.email === "n1nathaniel971@gmail.com") { window.location.href = 'administration.html'; return; }
  
  currentUid = user.uid;
  const snap = await getDoc(doc(db, 'users', user.uid));
  if (!snap.exists()) { appEl.innerHTML = 'Profile not found.'; return; }
  render(snap.data());
});
</script>
</body>
</html>
