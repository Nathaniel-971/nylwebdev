<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IFB Mobile Scanner</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<meta name="theme-color" content="#7A1F2B">
<script src="https://unpkg.com/lucide@latest"></script>
<script async src="https://docs.opencv.org/4.9.0/opencv.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --maroon: #7A1F2B; --bg: #F8FAFC; --white: #FFF; --text: #111; --gray: #64748B; --silver: #E2E8F0; --success: #15803D; --error: #B91C1C; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 16px; min-height: 100vh; }
  .container { max-width: 500px; margin: 0 auto; }
  .card { background: var(--white); border: 1px solid var(--silver); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
  h1 { font-size: 22px; font-weight: 900; color: var(--maroon); margin-bottom: 8px; text-align: center; }
  p.sub { font-size: 13px; color: var(--gray); text-align: center; margin-bottom: 20px; }
  .stage { position: relative; width: 100%; aspect-ratio: 3/4; background: #f3f4f6; border: 1px solid var(--silver); border-radius: 12px; overflow: hidden; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; }
  video, canvas, img.preview { width:100%; height:100%; object-fit:contain; display:none; }
  video.active, canvas.active, img.preview.active { display:block; }
  .framing-guide { position:absolute; inset:6%; pointer-events:none; display:none; z-index:4; }
  .framing-guide.visible { display:block; }
  .framing-guide .corner { position:absolute; width:30px; height:30px; border:3px solid var(--maroon); }
  .framing-guide .tl { top:0; left:0; border-right:none; border-bottom:none; border-radius:8px 0 0 0; }
  .framing-guide .tr { top:0; right:0; border-left:none; border-bottom:none; border-radius:0 8px 0 0; }
  .framing-guide .bl { bottom:0; left:0; border-right:none; border-top:none; border-radius:0 0 0 8px; }
  .framing-guide .br { bottom:0; right:0; border-left:none; border-top:none; border-radius:0 0 8px 0; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; }
  .action { padding: 12px 16px; font-size: 14px; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; flex: 1; min-width: 120px; }
  .btn-primary { background: var(--maroon); color: #fff; }
  .btn-secondary { background: #fff; color: var(--maroon); border: 2px solid var(--maroon); }
  .action:disabled { opacity: .4; cursor: not-allowed; }
  .status { margin-top: 12px; font-size: 13px; text-align: center; color: var(--gray); font-weight: 600; min-height: 1.2em; }
  .pages-list { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .page-thumb { position: relative; width: 60px; background: #fafafa; border: 1px solid var(--silver); border-radius: 6px; padding: 4px; }
  .page-thumb img { width: 100%; border-radius: 3px; display: block; }
  .page-thumb .num { position: absolute; bottom: 2px; right: 2px; background: var(--maroon); color: #fff; font-size: 10px; font-weight: 700; padding: 1px 4px; border-radius: 4px; }
  .blocked { display: none; text-align: center; padding: 40px 20px; }
  .blocked h2 { color: var(--error); margin-bottom: 12px; }
</style>
</head>
<body>

<div class="container">
  <!-- BLOCKED VIEW FOR DESKTOP -->
  <div class="blocked" id="desktopBlock">
    <i data-lucide="monitor-x" style="width: 64px; height: 64px; color: var(--error); margin-bottom: 16px;"></i>
    <h2>Mobile Device Required</h2>
    <p style="color: var(--gray); margin-bottom: 20px;">This scanner can only be accessed from a mobile phone or tablet. Please scan the QR code on your computer using your phone's camera.</p>
  </div>

  <!-- SCANNER VIEW -->
  <div id="scannerView">
    <h1>Upload Answer Page</h1>
    <p class="sub">Scan each page after you finish writing. Your exam number must be signed in.</p>

    <div class="card">
      <div class="stage">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
        <img id="preview" class="preview" alt="Scanned page">
        <div class="framing-guide" id="framingGuide"><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div></div>
      </div>
      <div class="controls">
        <button class="action btn-primary" id="btnOpen">Open Camera</button>
        <button class="action btn-secondary" id="btnCapture" disabled>Capture</button>
        <button class="action btn-secondary" id="btnRetake" disabled>Retake</button>
        <button class="action btn-secondary" id="btnUpload" disabled>Upload to IFB</button>
      </div>
      <div class="status" id="status">Ready to scan.</div>
      <div class="pages-list" id="pagesList"></div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, arrayUnion, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = { apiKey: "AIzaSyA6HO7n6wCZEeCgKxJLjB-MjL0ZFGR7svU", authDomain: "nyldevcourses.firebaseapp.com", projectId: "nyldevcourses", storageBucket: "nyldevcourses.firebasestorage.app", messagingSenderId: "16687006873", appId: "1:16687006873:web:b7d66ad1024ccd92722408" };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const CLOUDINARY_CLOUD_NAME = "s6otjgim";
  const CLOUDINARY_UPLOAD_PRESET = "students_ifb_2027";

  // ================= DEVICE CHECK =================
  const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
  if (!isMobile) {
    document.getElementById('desktopBlock').style.display = 'block';
    document.getElementById('scannerView').style.display = 'none';
  }

  const urlParams = new URLSearchParams(window.location.search);
  const sessionId = urlParams.get('session');
  let studentId = null, examNumber = null;

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      document.getElementById('status').innerText = "Please log in on your computer first.";
      document.getElementById('status').style.color = "var(--error)";
      return;
    }
    const userDoc = await getDoc(doc(db, "users", user.uid));
    if (userDoc.exists()) {
      studentId = userDoc.data().studentId;
      examNumber = userDoc.data().examNumber;
    }
  });

  // ================= CV SCANNER =================
  const A4_W = 1240, A4_H = 1754;
  let stream = null, pendingBlob = null, cvReady = false;
  const video = document.getElementById('video'), canvas = document.getElementById('canvas'), preview = document.getElementById('preview');
  const framingGuide = document.getElementById('framingGuide');
  const statusEl = document.getElementById('status');
  const pagesList = document.getElementById('pagesList');

  function waitCv() {
    const started = Date.now(); let attached = false;
    const t = setInterval(() => {
      if (typeof cv !== 'undefined') {
        if (cv.Mat) { cvReady = true; clearInterval(t); return; }
        if (!attached && typeof cv.onRuntimeInitialized !== 'undefined') { attached = true; cv.onRuntimeInitialized = () => { cvReady = true; }; }
      }
      if (Date.now() - started > 20000) clearInterval(t);
    }, 150);
  }
  waitCv();

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  function setStatus(msg, type = '') { statusEl.textContent = msg; statusEl.style.color = type === 'error' ? 'var(--error)' : (type === 'success' ? 'var(--success)' : 'var(--gray)'); }

  window.openCamera = async function() {
    setStatus('Opening camera...');
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 } }, audio: false });
      video.srcObject = stream; await video.play();
      video.classList.add('active'); framingGuide.classList.add('visible');
      document.getElementById('btnOpen').disabled = true;
      document.getElementById('btnCapture').disabled = false;
      setStatus('Position the page inside the frame.');
    } catch (err) { setStatus('Camera error: ' + err.message, 'error'); }
  };

  window.capture = async function() {
    if (!stream) return;
    const w = video.videoWidth, h = video.videoHeight;
    document.getElementById('btnCapture').disabled = true;
    setStatus('Capturing...');
    await sleep(100);
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(video, 0, 0, w, h);
    stopCamera();
    
    let a4 = null;
    try { if (cvReady) a4 = detectAndWarpToA4(canvas); } catch(e) {}
    if (!a4) a4 = fallbackA4(canvas);
    enhanceText(a4);
    
    a4.toBlob(blob => {
      pendingBlob = blob;
      preview.src = URL.createObjectURL(blob); preview.classList.add('active');
      video.classList.remove('active'); framingGuide.classList.remove('visible');
      document.getElementById('btnRetake').disabled = false;
      document.getElementById('btnUpload').disabled = false;
      setStatus('Page captured. Click Upload.', 'success');
    }, 'image/jpeg', 0.9);
  };

  window.retake = function() {
    if (preview.src) { URL.revokeObjectURL(preview.src); preview.removeAttribute('src'); }
    pendingBlob = null; preview.classList.remove('active');
    document.getElementById('btnRetake').disabled = true;
    document.getElementById('btnUpload').disabled = true;
    document.getElementById('btnOpen').disabled = false;
    setStatus('Retake ready.');
  };

  window.uploadToIFB = async function() {
    if (!pendingBlob || !studentId) { setStatus('Please log in first.', 'error'); return; }
    const btn = document.getElementById('btnUpload');
    btn.innerHTML = 'Uploading...'; btn.disabled = true;
    setStatus('Uploading to Cloudinary...');

    try {
      const formData = new FormData();
      formData.append('file', pendingBlob);
      formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
      formData.append('public_id', `${studentId}_${sessionId}_${Date.now()}`);

      const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, { method: 'POST', body: formData });
      if (!response.ok) throw new Error('Cloudinary upload failed');
      const data = await response.json();

      // Save to Firestore
      await setDoc(doc(db, "examLogs", studentId), {
        examNumber: examNumber,
        scripts: arrayUnion({ url: data.secure_url, uploadedAt: new Date().toISOString() }),
        lastActive: serverTimestamp()
      }, { merge: true });

      // Add to local gallery
      if (!window.localCaptures) window.localCaptures = [];
      window.localCaptures.push(data.secure_url);
      renderPages();

      // Reset
      if (preview.src) { URL.revokeObjectURL(preview.src); preview.removeAttribute('src'); }
      pendingBlob = null; preview.classList.remove('active');
      btn.innerHTML = 'Upload to IFB'; btn.disabled = true;
      document.getElementById('btnRetake').disabled = true;
      document.getElementById('btnOpen').disabled = false;
      setStatus('Upload approved! Page saved.', 'success');

    } catch (err) {
      setStatus('Upload failed: ' + err.message, 'error');
      btn.innerHTML = 'Upload to IFB'; btn.disabled = false;
    }
  };

  function stopCamera() {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    video.srcObject = null; video.classList.remove('active'); framingGuide.classList.remove('visible');
  }

  function detectAndWarpToA4(srcCanvas) {
    const src = cv.imread(srcCanvas);
    const scale = Math.min(1, 600 / Math.max(src.cols, src.rows));
    const small = new cv.Mat(); cv.resize(src, small, new cv.Size(Math.round(src.cols * scale), Math.round(src.rows * scale)), 0, 0, cv.INTER_AREA);
    const gray = new cv.Mat(); cv.cvtColor(small, gray, cv.COLOR_RGBA2GRAY); cv.GaussianBlur(gray, gray, new cv.Size(5, 5), 0);
    const edges = new cv.Mat(); cv.Canny(gray, edges, 50, 150);
    const kernel = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(3, 3)); cv.dilate(edges, edges, kernel);
    const contours = new cv.MatVector(); const hierarchy = new cv.Mat();
    cv.findContours(edges, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
    let best = null, bestArea = 0;
    for (let i = 0; i < contours.size(); i++) {
      const cnt = contours.get(i); const peri = cv.arcLength(cnt, true);
      const approx = new cv.Mat(); cv.approxPolyDP(cnt, approx, 0.02 * peri, true);
      const area = cv.contourArea(approx);
      if (approx.rows === 4 && area > bestArea && area > small.rows * small.cols * 0.15) { if (best) best.delete(); best = approx.clone(); bestArea = area; }
      approx.delete();
    }
    let corners = null;
    if (best) { corners = []; for (let i = 0; i < 4; i++) corners.push({ x: best.data32S[i * 2] / scale, y: best.data32S[i * 2 + 1] / scale }); best.delete(); }
    src.delete(); small.delete(); gray.delete(); edges.delete(); kernel.delete(); contours.delete(); hierarchy.delete();
    if (!corners) return null;
    const cx = corners.reduce((s, p) => s + p.x, 0) / 4, cy = corners.reduce((s, p) => s + p.y, 0) / 4;
    corners.sort((a, b) => Math.atan2(a.y - cy, a.x - cx) - Math.atan2(b.y - cy, b.x - cx));
    let minI = 0, minSum = Infinity; for (let i = 0; i < 4; i++) { const s = corners[i].x + corners[i].y; if (s < minSum) { minSum = s; minI = i; } }
    corners = [corners[minI], corners[(minI + 1) % 4], corners[(minI + 2) % 4], corners[(minI + 3) % 4]];
    const srcFull = cv.imread(srcCanvas);
    const srcQuad = cv.matFromArray(4, 1, cv.CV_32FC2, [corners[0].x, corners[0].y, corners[1].x, corners[1].y, corners[2].x, corners[2].y, corners[3].x, corners[3].y]);
    const dstQuad = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, A4_W, 0, A4_W, A4_H, 0, A4_H]);
    const M = cv.getPerspectiveTransform(srcQuad, dstQuad);
    const warped = new cv.Mat(); cv.warpPerspective(srcFull, warped, M, new cv.Size(A4_W, A4_H));
    const out = document.createElement('canvas'); out.width = A4_W; out.height = A4_H; cv.imshow(out, warped);
    srcFull.delete(); srcQuad.delete(); dstQuad.delete(); M.delete(); warped.delete();
    return out;
  }

  function fallbackA4(srcCanvas) {
    const out = document.createElement('canvas'); out.width = A4_W; out.height = A4_H;
    const ctx = out.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, A4_W, A4_H);
    const sw = srcCanvas.width, sh = srcCanvas.height; const scale = Math.min(A4_W / sw, A4_H / sh);
    ctx.drawImage(srcCanvas, (A4_W - sw * scale) / 2, (A4_H - sh * scale) / 2, sw * scale, sh * scale);
    return out;
  }

  function enhanceText(canvasEl) {
    const W = canvasEl.width, H = canvasEl.height; const ctx = canvasEl.getContext('2d');
    const imgData = ctx.getImageData(0, 0, W, H); const d = imgData.data;
    const gray = new Uint8ClampedArray(W * H);
    for (let i = 0, p = 0; i < d.length; i += 4, p++) gray[p] = (0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]) | 0;
    const IW = W + 1; const integ = new Uint32Array(IW * (H + 1));
    for (let y = 0; y < H; y++) { let rowSum = 0; for (let x = 0; x < W; x++) { rowSum += gray[y * W + x]; integ[(y + 1) * IW + (x + 1)] = integ[y * IW + (x + 1)] + rowSum; } }
    const block = 41, half = (block - 1) >> 1, C = 15; const bin = new Uint8ClampedArray(W * H);
    for (let y = 0; y < H; y++) {
      const y0 = Math.max(0, y - half), y1 = Math.min(H - 1, y + half);
      for (let x = 0; x < W; x++) {
        const x0 = Math.max(0, x - half), x1 = Math.min(W - 1, x + half);
        const area = (x1 - x0 + 1) * (y1 - y0 + 1);
        const sum = integ[(y1 + 1) * IW + (x1 + 1)] - integ[y0 * IW + (x1 + 1)] - integ[(y1 + 1) * IW + x0] + integ[y0 * IW + x0];
        bin[y * W + x] = gray[y * W + x] < (sum / area - C) ? 0 : 255;
      }
    }
    for (let i = 0, p = 0; p < bin.length; i += 4, p++) { d[i] = d[i + 1] = d[i + 2] = bin[p]; d[i + 3] = 255; }
    ctx.putImageData(imgData, 0, 0);
  }

  function renderPages() {
    pagesList.innerHTML = '';
    const captures = window.localCaptures || [];
    captures.forEach((url, i) => {
      const wrap = document.createElement('div'); wrap.className = 'page-thumb';
      const img = document.createElement('img'); img.src = url; wrap.appendChild(img);
      const num = document.createElement('span'); num.className = 'num'; num.textContent = i + 1; wrap.appendChild(num);
      pagesList.appendChild(wrap);
    });
  }

  document.getElementById('btnOpen').addEventListener('click', openCamera);
  document.getElementById('btnCapture').addEventListener('click', capture);
  document.getElementById('btnRetake').addEventListener('click', retake);
  document.getElementById('btnUpload').addEventListener('click', uploadToIFB);
  window.addEventListener('beforeunload', stopCamera);
  if (window.lucide) lucide.createIcons();
</script>
</body>
</html>
