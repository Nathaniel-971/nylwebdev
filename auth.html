<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Become a Student — Nyl Dev</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --black:#0d0d0d; --white:#fff; --grey:#6b6b6b; --light:#f5f5f5; --line:#e5e5e5; --mid:#333; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--black); color: var(--white); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; line-height:1.6; -webkit-font-smoothing:antialiased; }
  @keyframes blink { 0%,50%{opacity:1} 51%,100%{opacity:0} }
  @keyframes fadeUp { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform: translateY(0); } }
  .card { width:100%; max-width:440px; background: var(--white); color: var(--black); border-radius:16px; padding:40px 36px; animation: fadeUp .5s ease both; }
  .logo { font-family:'Courier New',monospace; font-size:28px; font-weight:700; letter-spacing:-2px; display:flex; align-items:center; margin-bottom:24px; text-decoration:none; color: var(--black); }
  .logo .cursor { width:13px; height:26px; background: var(--black); margin-left:2px; animation: blink 1.1s step-end infinite; }
  .tabs { display:flex; border-bottom:1px solid var(--line); margin-bottom:22px; }
  .tab { flex:1; padding:14px 0; text-align:center; font-size:14.5px; font-weight:600; color: var(--grey); background:none; border:none; border-bottom:2px solid transparent; cursor:pointer; font-family:inherit; margin-bottom:-1px; transition: all .2s; display:inline-flex; align-items:center; justify-content:center; gap:7px; }
  .tab svg { width:15px; height:15px; }
  .tab.active { color: var(--black); border-bottom-color: var(--black); }
  .panel { display:none; } .panel.active { display:block; }
  .panel h2 { font-size:22px; letter-spacing:-.5px; margin-bottom:6px; }
  .panel .sub { font-size:13.5px; color: var(--grey); margin-bottom:20px; }
  .oauth { width:100%; padding:13px; font-size:14.5px; font-weight:500; font-family:inherit; border:1.5px solid var(--line); background: var(--white); color: var(--black); border-radius:10px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:11px; transition: all .2s; margin-bottom:16px; }
  .oauth:hover { border-color: var(--black); background: var(--light); }
  .oauth svg { width:18px; height:18px; }
  .divider { display:flex; align-items:center; gap:12px; margin: 4px 0 16px; color: var(--grey); font-size:11.5px; letter-spacing:1.5px; text-transform:uppercase; }
  .divider::before, .divider::after { content:""; flex:1; height:1px; background: var(--line); }
  .form-group { margin-bottom:14px; }
  .form-group label { display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; margin-bottom:7px; }
  .form-group label svg { width:13px; height:13px; color: var(--grey); }
  .form-group input { width:100%; padding:13px 15px; font-size:14.5px; font-family:inherit; border:1.5px solid var(--line); border-radius:10px; background: var(--white); color: var(--black); transition: border-color .2s; }
  .form-group input:focus { outline:none; border-color: var(--black); }
  .form-check { display:flex; align-items:flex-start; gap:10px; margin:16px 0; font-size:12.5px; color: var(--grey); }
  .form-check input { margin-top:3px; width:15px; height:15px; flex-shrink:0; accent-color: var(--black); }
  .form-check a { color: var(--black); text-decoration:underline; }
  .btn { width:100%; padding:15px; font-size:14.5px; font-weight:600; font-family:inherit; border-radius:10px; border:1.5px solid var(--black); background: var(--black); color: var(--white); cursor:pointer; transition: all .2s; display:inline-flex; align-items:center; justify-content:center; gap:9px; }
  .btn:hover { background: var(--mid); border-color: var(--mid); }
  .btn:disabled { opacity:.6; cursor:not-allowed; }
  .btn svg { width:16px; height:16px; }
  .msg { padding:11px 13px; border-radius:8px; font-size:12.5px; margin-bottom:14px; display:none; line-height:1.5; }
  .msg.error { background:#fef2f2; color:#b91c1c; border:1px solid #fecaca; display:block; }
  .msg.success { background:#f0fdf4; color:#15803d; border:1px solid #bbf7d0; display:block; }
  .forgot { display:block; text-align:right; font-size:12.5px; color: var(--grey); text-decoration:none; margin-top:-6px; margin-bottom:16px; }
  .back { display:block; text-align:center; margin-top:18px; font-size:12.5px; color: var(--grey); text-decoration:none; }
  @media (max-width:500px) { .card { padding:28px 22px; } }
</style>
</head>
<body>
<div class="card">
  <a href="/" class="logo"><span>^</span><span class="cursor"></span></a>

  <div class="tabs">
    <button class="tab active" data-tab="signup"><i data-lucide="user-plus"></i> Become a Student</button>
    <button class="tab" data-tab="signin"><i data-lucide="log-in"></i> Sign in</button>
  </div>

  <div class="panel active" id="panel-signup">
    <h2>Create your account</h2>
    <p class="sub">Free · You'll choose your curriculum next.</p>

    <div class="msg" id="signupMsg"></div>

    <button type="button" class="oauth" id="googleSignup">
      <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.2 26.7 36 24 36c-5.2 0-9.6-3.1-11.3-7.6l-6.5 5C9.6 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.1 5.6l6.2 5.2C41 35.2 44 30 44 24c0-1.3-.1-2.3-.4-3.5z"/></svg>
      Continue with Google
    </button>

    <div class="divider">or with email</div>

    <form id="signupForm">
      <div class="form-group">
        <label><i data-lucide="user"></i> Full name</label>
        <input type="text" id="signupName" placeholder="Your name" required>
      </div>
      <div class="form-group">
        <label><i data-lucide="mail"></i> Email</label>
        <input type="email" id="signupEmail" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label><i data-lucide="lock"></i> Password</label>
        <input type="password" id="signupPassword" placeholder="At least 8 characters" minlength="8" required>
      </div>
      <div class="form-check">
        <input type="checkbox" id="signupTerms" required>
        <label for="signupTerms">I agree to the <a href="terms.html">Terms of Service</a> and <a href="privacy.html">Privacy Policy</a>. I understand this is a <strong>non-accredited, skills-based</strong> course.</label>
      </div>
      <button type="submit" class="btn" id="signupBtn"><i data-lucide="user-plus"></i> Become a Student</button>
    </form>

    <a href="/" class="back">← Back to home</a>
  </div>

  <div class="panel" id="panel-signin">
    <h2>Welcome back</h2>
    <p class="sub">Sign in to view your course.</p>

    <div class="msg" id="signinMsg"></div>

    <button type="button" class="oauth" id="googleSignin">
      <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.2 26.7 36 24 36c-5.2 0-9.6-3.1-11.3-7.6l-6.5 5C9.6 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.1 5.6l6.2 5.2C41 35.2 44 30 44 24c0-1.3-.1-2.3-.4-3.5z"/></svg>
      Continue with Google
    </button>

    <div class="divider">or with email</div>

    <form id="signinForm">
      <div class="form-group">
        <label><i data-lucide="mail"></i> Email</label>
        <input type="email" id="signinEmail" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label><i data-lucide="lock"></i> Password</label>
        <input type="password" id="signinPassword" placeholder="Your password" required>
      </div>
      <a href="#" class="forgot" id="forgotLink">Forgot password?</a>
      <button type="submit" class="btn" id="signinBtn"><i data-lucide="log-in"></i> Sign in</button>
    </form>

    <a href="/" class="back">← Back to home</a>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  GoogleAuthProvider, signInWithPopup, sendPasswordResetEmail, updateProfile
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA6HO7n6wCZEeCgKxJLjB-MjL0ZFGR7svU",
  authDomain: "nyldevcourses.firebaseapp.com",
  projectId: "nyldevcourses",
  storageBucket: "nyldevcourses.firebasestorage.app",
  messagingSenderId: "16687006873",
  appId: "1:16687006873:web:b7d66ad1024ccd92722408"
};
const ADMIN_EMAIL = "n1nathaniel971@gmail.com";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const googleProvider = new GoogleAuthProvider();

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
    if (window.lucide) lucide.createIcons();
  });
});

function showMsg(id, text, type) { const el = document.getElementById(id); el.textContent = text; el.className = 'msg ' + type; }
function clearMsg(id) { document.getElementById(id).className = 'msg'; }

function friendlyError(code) {
  const map = {
    'auth/email-already-in-use': 'That email is already registered. Try signing in.',
    'auth/invalid-email': 'Please enter a valid email.',
    'auth/weak-password': 'Password must be at least 8 characters.',
    'auth/user-not-found': 'No account found with that email.',
    'auth/wrong-password': 'Incorrect password.',
    'auth/invalid-credential': 'Incorrect email or password.',
    'auth/popup-closed-by-user': 'Sign-in cancelled.',
    'auth/account-exists-with-different-credential': 'That email is registered with a different sign-in method.',
    'auth/too-many-requests': 'Too many attempts. Try later.'
  };
  return map[code] || 'Something went wrong. Please try again.';
}

// Redirect: admin → admin · student without curriculum → curriculum · student with → portal
async function redirect(user) {
  if (user.email === ADMIN_EMAIL) { window.location.href = 'admin.html'; return; }
  const snap = await getDoc(doc(db, 'users', user.uid));
  const data = snap.exists() ? snap.data() : {};
  window.location.href = data.course ? 'student-portal.html' : 'curriculum.html';
}

async function ensureStudentDoc(user, name) {
  if (user.email === ADMIN_EMAIL) return;
  const ref = doc(db, 'users', user.uid);
  const snap = await getDoc(ref);
  if (snap.exists()) return;
  await setDoc(ref, {
    name: name || user.displayName || '',
    email: user.email,
    duration: null,
    curriculum: null,
    course: null,
    electives: [],
    studentNumber: null,
    examinationNumber: null,
    status: 'pending',
    role: 'student',
    createdAt: serverTimestamp()
  });
}

document.getElementById('googleSignup').addEventListener('click', async () => {
  clearMsg('signupMsg');
  try {
    const result = await signInWithPopup(auth, googleProvider);
    await ensureStudentDoc(result.user);
    showMsg('signupMsg', 'Signed in. Redirecting…', 'success');
    setTimeout(() => redirect(result.user), 600);
  } catch (err) { showMsg('signupMsg', friendlyError(err.code), 'error'); }
});

document.getElementById('googleSignin').addEventListener('click', async () => {
  clearMsg('signinMsg');
  try {
    const result = await signInWithPopup(auth, googleProvider);
    redirect(result.user);
  } catch (err) { showMsg('signinMsg', friendlyError(err.code), 'error'); }
});

document.getElementById('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  clearMsg('signupMsg');
  const name = document.getElementById('signupName').value.trim();
  const email = document.getElementById('signupEmail').value.trim();
  const password = document.getElementById('signupPassword').value;
  const btn = document.getElementById('signupBtn');
  btn.disabled = true;
  btn.innerHTML = '<i data-lucide="loader"></i> Creating account…';
  if (window.lucide) lucide.createIcons();
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, password);
    await updateProfile(cred.user, { displayName: name });
    await ensureStudentDoc(cred.user, name);
    showMsg('signupMsg', 'Account created. Redirecting…', 'success');
    setTimeout(() => redirect(cred.user), 600);
  } catch (err) {
    showMsg('signupMsg', friendlyError(err.code), 'error');
    btn.disabled = false;
    btn.innerHTML = '<i data-lucide="user-plus"></i> Become a Student';
    if (window.lucide) lucide.createIcons();
  }
});

document.getElementById('signinForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  clearMsg('signinMsg');
  const email = document.getElementById('signinEmail').value.trim();
  const password = document.getElementById('signinPassword').value;
  const btn = document.getElementById('signinBtn');
  btn.disabled = true;
  btn.innerHTML = '<i data-lucide="loader"></i> Signing in…';
  if (window.lucide) lucide.createIcons();
  try {
    const cred = await signInWithEmailAndPassword(auth, email, password);
    redirect(cred.user);
  } catch (err) {
    showMsg('signinMsg', friendlyError(err.code), 'error');
    btn.disabled = false;
    btn.innerHTML = '<i data-lucide="log-in"></i> Sign in';
    if (window.lucide) lucide.createIcons();
  }
});

document.getElementById('forgotLink').addEventListener('click', async (e) => {
  e.preventDefault();
  clearMsg('signinMsg');
  const email = document.getElementById('signinEmail').value.trim();
  if (!email) { showMsg('signinMsg', 'Enter your email first.', 'error'); return; }
  try {
    await sendPasswordResetEmail(auth, email);
    showMsg('signinMsg', 'Reset email sent. Check your inbox.', 'success');
  } catch (err) { showMsg('signinMsg', friendlyError(err.code), 'error'); }
});

if (window.lucide) lucide.createIcons();
</script>
</body>
</html>
