<!DOCTYPE html>

<header class="navbar">

    <a href="/" class="brand">

      <span class="brand__name">Nyl Web Dev</span>

    <nav class="nav" id="mainNav">
      <a href="/">Home</a>
      <a href="/services">Services</a>
      <a href="/pricing">Pricing</a>
      <a href="/work">Work</a>
      <a href="/about">About</a>
      <a href="/contact">Contact</a>

      <i data-lucide="menu"></i>
    </button>
  </div>
</header>

<main>
  <section class="page">
    <div class="container" style="text-align:center;padding-top:4rem;padding-bottom:4rem;max-width:640px;margin:0 auto">
      <div style="font-family:var(--mono);font-size:clamp(4rem,12vw,8rem);font-weight:700;line-height:1;background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;background-clip:text;color:transparent">
        404
      </div>
      <h1 style="font-size:clamp(1.5rem,3vw,2rem);margin-top:1rem;font-weight:700">
        Page not found
      </h1>
      <p style="color:var(--muted);margin-top:.75rem;font-size:1.05rem">
        The page you're looking for doesn't exist or has been moved.
      </p>

      <div style="display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;margin-top:2rem">
        <a href="/" class="btn btn--primary">
          <i data-lucide="home"></i> Back home
        </a>
        <a href="/contact" class="btn btn--ghost">
          <i data-lucide="mail"></i> Contact us
        </a>
      </div>

      <div style="margin-top:3rem;color:var(--muted);font-size:.9rem">
        Looking for one of these?
      </div>
      <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin-top:1rem">
        <a href="/services" style="color:var(--primary);font-size:.9rem">Services</a>
        <a href="/pricing" style="color:var(--primary);font-size:.9rem">Pricing</a>
        <a href="/work" style="color:var(--primary);font-size:.9rem">Work</a>
        <a href="/about" style="color:var(--primary);font-size:.9rem">About</a>
      </div>
    </div>
  </section>
</main>

    <div class="footer__inner">
      <p class="footer__copy">
        <i data-lucide="copyright"></i>
        <span id="year">2026</span> Nyl Web Dev. All rights reserved.
      </p>

        <a href="https://github.com/Nathaniel-971" aria-label="GitHub" target="_blank" rel="noopener">
