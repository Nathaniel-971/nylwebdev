<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Manage Resources</title>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
    --white: #FFF; --black: #111; --gray: #64748B; --silver: #E2E8F0;
    --maroon: #7A1F2B; --maroon-hover: #5A1620;
    --bg: #F8FAFC;
    --success: #15803D;
    --error: #B91C1C;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--black); min-height: 100dvh; display: flex; flex-direction: column; }

/* HEADER */
.header { background: var(--white); height: 68px; border-bottom: 1px solid var(--silver); display: flex; justify-content: space-between; align-items: center; padding: 0 24px; position: sticky; top: 0; z-index: 100; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--black); }
.brand-logo { font-size: 28px; font-weight: 900; color: var(--maroon); }
.brand-text { font-weight: 800; font-size: 16px; }
.nav-actions { display: flex; gap: 12px; }
.btn-nav { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 700; text-decoration: none; transition: 0.2s; border: 1.5px solid var(--silver); background: var(--white); color: var(--black); cursor: pointer; font-family: inherit; }
.btn-nav:hover { border-color: var(--black); }
.btn-nav.primary { background: var(--maroon); color: var(--white); border-color: var(--maroon); }
.btn-nav.primary:hover { background: var(--maroon-hover); }
.btn-nav i { width: 16px; height: 16px; }

/* MAIN LAYOUT */
.container { max-width: 1000px; margin: 40px auto; padding: 0 24px; width: 100%; flex: 1; }
.page-title { font-size: 28px; font-weight: 900; margin-bottom: 8px; letter-spacing: -0.5px; }
.page-sub { font-size: 15px; color: var(--gray); margin-bottom: 32px; }

/* GRID */
.dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; align-items: start; }

/* CARDS */
.card { background: var(--white); border-radius: 16px; border: 1px solid var(--silver); box-shadow: 0 4px 20px rgba(0,0,0,0.03); overflow: hidden; }
.card-header { padding: 20px 24px; border-bottom: 1px solid var(--silver); background: #FAFAFA; display: flex; justify-content: space-between; align-items: center; }
.card-header h2 { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.card-header h2 i { width: 20px; height: 20px; color: var(--maroon); }
.card-body { padding: 24px; }

/* FORM */
.form-group { margin-bottom: 20px; }
.form-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px; color: #333; }
.form-control { width: 100%; padding: 12px 14px; font-size: 14px; border: 1.5px solid var(--silver); border-radius: 8px; outline: none; font-family: inherit; transition: 0.2s; background: var(--white); color: var(--black); }
.form-control:focus { border-color: var(--maroon); box-shadow: 0 0 0 3px rgba(122,31,43,0.1); }
select.form-control { appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748B' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 14px center; background-size: 16px; padding-right: 40px; }

.btn-submit { width: 100%; padding: 14px; background: var(--maroon); color: var(--white); border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; transition: 0.2s; font-family: inherit; }
.btn-submit:hover { background: var(--maroon-hover); }
.btn-submit:disabled { opacity: 0.7; cursor: not-allowed; }
.btn-submit i { width: 18px; height: 18px; }

.alert { display: none; padding: 12px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; margin-bottom: 20px; align-items: flex-start; gap: 8px; line-height: 1.5; }
.alert.success { background: #DCFCE7; color: #15803D; border: 1px solid #86EFAC; display: flex; }
.alert.error { background: #FEE2E2; color: #B91C1C; border: 1px solid #FECACA; display: flex; }
.alert i { width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; }

/* LIST */
.list-group { display: flex; flex-direction: column; gap: 12px; max-height: 600px; overflow-y: auto; padding-right: 4px; }
.list-item { display: flex; justify-content: space-between; align-items: center; padding: 16px; border: 1px solid var(--silver); border-radius: 10px; background: var(--white); transition: 0.2s; }
.list-item:hover { border-color: var(--maroon); }
.list-info h4 { font-size: 14px; font-weight: 800; margin-bottom: 4px; }
.list-meta { display: flex; gap: 8px; align-items: center; }
.badge { font-size: 10px; font-weight: 800; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; background: var(--bg); color: var(--gray); border: 1px solid var(--silver); }
.badge.subject { background: #FFF5F6; color: var(--maroon); border-color: #FCA5A5; }
.badge.video { background: #FEE2E2; color: #B91C1C; border-color: #FECACA; }
.list-desc { font-size: 12px; color: var(--gray); margin-top: 6px; }
.btn-delete { background: #FEF2F2; color: var(--error); border: 1px solid #FECACA; padding: 8px; border-radius: 6px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
.btn-delete:hover { background: #FEE2E2; }
.btn-delete i { width: 16px; height: 16px; }

/* LOADER */
.spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: var(--white); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 900px) {
    .dashboard-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
    <a href="index.html" class="brand">
        <div class="brand-logo">∆</div>
        <div class="brand-text">IFB Admin</div>
    </a>
    <div class="nav-actions">
        <a href="resources.html" class="btn-nav"><i data-lucide="eye"></i> View Public Page</a>
        <button class="btn-nav" onclick="logout()"><i data-lucide="log-out"></i> Log Out</button>
    </div>
</header>

<!-- MAIN -->
<main class="container">
    <h1 class="page-title">Manage Resources</h1>
    <p class="page-sub">Upload weekly modules, daily docs, and YouTube videos for Mathematics and Web Development.</p>

    <div class="dashboard-grid">
        
        <!-- UPLOAD FORM -->
        <div class="card">
            <div class="card-header">
                <h2><i data-lucide="upload-cloud"></i> Upload New Resource</h2>
            </div>
            <div class="card-body">
                <div class="alert error" id="errorBox"><i data-lucide="alert-circle"></i><span id="errorText"></span></div>
                <div class="alert success" id="successBox"><i data-lucide="check-circle"></i><span id="successText"></span></div>

                <form id="uploadForm" onsubmit="uploadResource(event)">
                    
                    <div class="form-group">
                        <label>Resource Title</label>
                        <input type="text" id="resTitle" class="form-control" placeholder="e.g. Week 1: Advanced Algebra" required>
                    </div>

                    <div class="form-group">
                        <label>Subject</label>
                        <select id="resSubject" class="form-control" required>
                            <option value="" disabled selected>Select a subject...</option>
                            <option value="Mathematics">Mathematics</option>
                            <option value="Web Development">Web Development</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Resource Type</label>
                        <select id="resType" class="form-control" required onchange="updateUrlPlaceholder()">
                            <option value="" disabled selected>Select type...</option>
                            <option value="module">Weekly Module</option>
                            <option value="daily">Daily Document</option>
                            <option value="video">YouTube Video</option>
                            <option value="exam">Past Exam Paper</option>
                            <option value="memo">Memorandum</option>
                            <option value="mock">Mock Paper</option>
                            <option value="guidelines">Subject Guidelines</option>
                            <option value="answerbook">Answer Book Template</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>File / YouTube URL</label>
                        <input type="url" id="resUrl" class="form-control" placeholder="https://..." required>
                        <p style="font-size: 11px; color: var(--gray); margin-top: 6px;">For videos, paste the full YouTube link. For documents, paste the link to the HTML/PDF.</p>
                    </div>

                    <div class="form-group">
                        <label>Description (Optional)</label>
                        <input type="text" id="resDesc" class="form-control" placeholder="Short description...">
                    </div>

                    <div class="form-group">
                        <label>Filename / Reference</label>
                        <input type="text" id="resFilename" class="form-control" placeholder="ifb-2027-math-w01-module.html" required>
                    </div>

                    <button type="submit" class="btn-submit" id="submitBtn">
                        <i data-lucide="plus-circle"></i> Publish Resource
                    </button>
                </form>
            </div>
        </div>

        <!-- CURRENT RESOURCES LIST -->
        <div class="card">
            <div class="card-header">
                <h2><i data-lucide="database"></i> Published Resources</h2>
                <span id="resourceCount" class="badge">0 Items</span>
            </div>
            <div class="card-body">
                <div id="loadingList" style="text-align:center; padding: 20px; color: var(--gray);">Loading resources...</div>
                <div class="list-group" id="resourceList" style="display:none;">
                    <!-- Items injected here -->
                </div>
            </div>
        </div>

    </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyA6HO7n6wCZEeCgKxJLjB-MjL0ZFGR7svU", authDomain: "nyldevcourses.firebaseapp.com", projectId: "nyldevcourses", storageBucket: "nyldevcourses.firebasestorage.app", messagingSenderId: "16687006873", appId: "1:16687006873:web:b7d66ad1024ccd92722408" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const ADMIN_EMAIL = "n1nathaniel971@gmail.com";

function refreshIcons() { if (window.lucide) { try { lucide.createIcons(); } catch(e) {} } }

window.logout = async function() {
    await signOut(auth);
    window.location.href = "index.html";
}

window.updateUrlPlaceholder = function() {
    const type = document.getElementById('resType').value;
    const urlInput = document.getElementById('resUrl');
    if (type === 'video') {
        urlInput.placeholder = "https://www.youtube.com/watch?v=...";
    } else {
        urlInput.placeholder = "https://ifb-nmaz.onrender.com/path-to-file.html";
    }
}

// Show alerts
function showAlert(type, msg) {
    const box = document.getElementById(type + 'Box');
    const text = document.getElementById(type + 'Text');
    text.textContent = msg;
    box.style.display = 'flex';
    setTimeout(() => { box.style.display = 'none'; }, 5000);
}

// Load Resources
async function loadResourceList() {
    const list = document.getElementById('resourceList');
    const loader = document.getElementById('loadingList');
    const countBadge = document.getElementById('resourceCount');
    
    try {
        const q = query(collection(db, 'resources'), orderBy('createdAt', 'desc'));
        const snap = await getDocs(q);
        
        loader.style.display = 'none';
        list.style.display = 'flex';
        list.innerHTML = '';
        
        countBadge.textContent = `${snap.size} Items`;

        if (snap.empty) {
            list.innerHTML = '<div style="text-align:center; color:var(--gray); font-size:13px;">No resources uploaded yet.</div>';
            return;
        }

        snap.forEach(d => {
            const data = d.data();
            const item = document.createElement('div');
            item.className = 'list-item';
            
            item.innerHTML = `
                <div class="list-info">
                    <h4>${data.title || 'Untitled'}</h4>
                    <div class="list-meta">
                        <span class="badge subject">${data.subject || 'General'}</span>
                        <span class="badge ${data.type === 'video' ? 'video' : ''}">${data.type || 'doc'}</span>
                        <span style="font-size:11px; color:var(--gray);">${data.filename || ''}</span>
                    </div>
                    ${data.description ? `<div class="list-desc">${data.description}</div>` : ''}
                </div>
                <button class="btn-delete" onclick="deleteResource('${d.id}')">
                    <i data-lucide="trash-2"></i>
                </button>
            `;
            list.appendChild(item);
        });
        refreshIcons();
    } catch(e) {
        loader.textContent = "Failed to load resources.";
        console.error(e);
    }
}

window.uploadResource = async function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner"></div> Publishing...';

    const title = document.getElementById('resTitle').value.trim();
    const subject = document.getElementById('resSubject').value;
    const type = document.getElementById('resType').value;
    const fileUrl = document.getElementById('resUrl').value.trim();
    const description = document.getElementById('resDesc').value.trim();
    const filename = document.getElementById('resFilename').value.trim();

    try {
        await addDoc(collection(db, 'resources'), {
            title,
            subject,
            type,
            fileUrl,
            description,
            filename,
            visible: true, // required by the public page
            createdAt: new Date()
        });

        showAlert('success', 'Resource published successfully!');
        document.getElementById('uploadForm').reset();
        await loadResourceList();
    } catch(err) {
        showAlert('error', 'Error: ' + err.message);
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="plus-circle"></i> Publish Resource';
        refreshIcons();
    }
}

window.deleteResource = async function(id) {
    if (!confirm("Are you sure you want to delete this resource?")) return;
    try {
        await deleteDoc(doc(db, 'resources', id));
        await loadResourceList();
    } catch(e) {
        alert("Failed to delete: " + e.message);
    }
}

// Auth Guard
onAuthStateChanged(auth, (user) => {
    if (!user || user.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
        window.location.href = "index.html";
        return;
    }
    loadResourceList();
    refreshIcons();
});

document.addEventListener('DOMContentLoaded', refreshIcons);
</script>
</body>
</html>
