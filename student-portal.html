<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Portal</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0d0d0d">
<script src="https://unpkg.com/lucide@latest"></script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/service-worker.js').catch(()=>{});}</script>
<style>
:root{--black:#0d0d0d;--white:#fff;--grey:#6b6b6b;--light:#f5f5f5;--line:#e5e5e5;--mid:#333;--green:#059669;--green-soft:#ecfdf5;--green-line:#a7f3d0;--red:#dc2626;--red-soft:#fef2f2;--red-line:#fecaca}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--light);color:var(--black);line-height:1.6;padding-bottom:60px}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
nav{background:var(--white);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.nav-left{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--black)}
.mark{font-family:'Courier New',monospace;font-size:28px;font-weight:700;letter-spacing:-2px}
.nav-right{display:flex;align-items:center;gap:8px}
.nav-icon{width:38px;height:38px;border-radius:10px;background:var(--white);border:1px solid var(--line);cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--black)}
.nav-icon:hover{border-color:var(--black);background:var(--light)}
.nav-icon svg{width:16px;height:16px}
.container{max-width:960px;margin:0 auto;padding:32px 20px}
h1{font-size:clamp(24px,5vw,34px);letter-spacing:-1px;margin-bottom:6px}
.sub{color:var(--grey);font-size:14.5px;margin-bottom:24px}
.tabs{display:flex;gap:6px;margin-bottom:20px;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:5px}
.tab{flex:1;padding:10px 12px;font-size:13.5px;font-weight:600;font-family:inherit;border:none;background:transparent;color:var(--grey);cursor:pointer;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.tab svg{width:15px;height:15px}
.tab.active{background:var(--black);color:var(--white)}
.tab:hover:not(.active){background:var(--light);color:var(--black)}
.panel{display:none;animation:fadeUp .35s ease both}
.panel.active{display:block}
.card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:16px;animation:fadeUp .4s ease both}
.card .label{font-size:11.5px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--grey);margin-bottom:14px;display:flex;align-items:center;gap:7px}
.card .label svg{width:14px;height:14px}
.hero-card{background:var(--black);color:var(--white);border:none}
.hero-card .label{color:rgba(255,255,255,.55)}
.hero-card .c-name{font-size:26px;font-weight:700;margin-bottom:6px}
.hero-card .c-desc{font-size:13.5px;color:rgba(255,255,255,.7)}
.subject-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tile{background:var(--white);border:1.5px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;animation:popIn .4s ease both;transition:all .25s;position:relative}
.tile:hover{border-color:var(--black);transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.07)}
.tile .t-icon{width:40px;height:40px;border-radius:10px;background:var(--light);display:flex;align-items:center;justify-content:center}
.tile .t-icon svg{width:20px;height:20px}
.tile h4{font-size:15px;font-weight:700;line-height:1.25}
.tile .mods{font-size:12px;color:var(--grey);line-height:1.5}
.tile .tag{position:absolute;top:12px;right:12px;font-size:9.5px;font-weight:700;padding:3px 8px;border-radius:100px;background:var(--black);color:var(--white);text-transform:uppercase}
.tile .tag.stream{background:#eef2ff;color:#3730a3}
.tile .tag.elective{background:var(--green-soft);color:var(--green)}
.tile .tag.math{background:var(--red-soft);color:var(--red)}
.tile.stream-tile{border-width:2px;border-color:var(--black);background:linear-gradient(180deg,#fff 0%,var(--light) 100%)}
.tile.stream-tile .t-icon{background:var(--black)}
.tile.stream-tile .t-icon svg{color:var(--white)}
.tile.math-tile{border-width:2px;border-color:var(--black)}
.id-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.id-cell{padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--light)}
.id-cell .k{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--grey);font-weight:600;margin-bottom:6px}
.id-cell .v{font-family:'Courier New',monospace;font-size:18px;font-weight:700;letter-spacing:1px}
.id-cell .v.pending{font-family:inherit;font-size:13.5px;letter-spacing:0;color:#b86e00;font-weight:600}
.info-row{display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px;gap:14px}
.info-row:last-child{border-bottom:none}
.info-row .k{color:var(--grey);display:flex;align-items:center;gap:7px}
.info-row .k svg{width:14px;height:14px}
.info-row .v{font-weight:600;text-align:right}
.status-badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:100px}
.status-badge svg{width:12px;height:12px}
.status-badge.pending{background:#fff4e5;color:#b86e00}
.status-badge.approved{background:var(--green-soft);color:var(--green)}
.status-badge.revoked{background:var(--red-soft);color:var(--red)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;font-size:13.5px;font-weight:600;border-radius:9px;border:1.5px solid var(--black);background:var(--black);color:var(--white);cursor:pointer;font-family:inherit;text-decoration:none}
.btn:hover{background:var(--mid)}
.btn-ghost{background:var(--white);color:var(--black);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--black);background:var(--light)}
.edit-banner{background:var(--green-soft);border:1px solid var(--green-line);color:#065f46;padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.edit-banner svg{width:16px;height:16px;flex-shrink:0}
.empty{text-align:center;padding:40px 20px;color:var(--grey);font-size:14px}
@media(max-width:500px){nav{padding:12px 16px}.container{padding:24px 16px}.card{padding:20px 16px}.id-grid,.subject-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav>
  <a href="/" class="nav-left"><span class="mark">∆</span></a>
  <div class="nav-right">
    <a href="past-papers.html" class="nav-icon" title="Resources"><i data-lucide="file-text"></i></a>
    <a href="messages.html" class="nav-icon" title="Messages"><i data-lucide="message-square"></i></a>
    <a href="settings.html" class="nav-icon" title="Settings"><i data-lucide="settings"></i></a>
  </div>
</nav>
<div class="container" id="app"><div class="empty">Loading…</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyA6HO7n6wCZEeCgKxJLjB-MjL0ZFGR7svU", authDomain: "nyldevcourses.firebaseapp.com", projectId: "nyldevcourses", storageBucket: "nyldevcourses.firebasestorage.app", messagingSenderId: "16687006873", appId: "1:16687006873:web:b7d66ad1024ccd92722408" };
const ADMIN_EMAIL = "n1nathaniel971@gmail.com";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const META = { '6':{name:'IPI',full:'IPI — Intensive Programme of Instruction',desc:'6-month programme · 2 exam periods'}, '12':{name:'ACC',full:'ACC — Applied Competence Certificate',desc:'12-month programme · 3 exam periods'} };
const CORE = {
  math: { name:'Mathematics', modules:'Algebra · Functions · Sequences · Statistics · Logic', icon:'sigma', required:true, tag:'Required' },
  webFoundations: { name:'Web Foundations', modules:'Git · HTML5 · CSS3 · Responsive Design', icon:'layout-template', tag:'Core' },
  progFundamentals: { name:'Programming Fundamentals', modules:'JavaScript · Advanced JavaScript', icon:'code-2', tag:'Core' }
};
const STREAM_SUBJECTS = {
  fullstack: { name:'Full Stack Systems', modules:'Node · Express · Databases · React', icon:'boxes' },
  frontend:  { name:'Frontend Systems',   modules:'React · Vue · TypeScript · Figma', icon:'monitor-smartphone' },
  backend:   { name:'Backend Systems',    modules:'Node · Express · SQL · NoSQL · REST', icon:'server' },
  webdesign: { name:'Visual Systems',     modules:'Figma · Typography · Colour · UI/UX', icon:'palette' },
  uiux:      { name:'Experience Design',  modules:'Research · Prototyping · Accessibility', icon:'users' },
  stem:      { name:'Physical Sciences',  modules:'Mechanics · Thermo · Waves · Electromagnetism', icon:'atom' }
};
const STREAM_NAMES = { fullstack:'Full Stack Engineering', frontend:'Frontend Craft', backend:'Backend Engineering', webdesign:'Web Design', uiux:'UI/UX Design', stem:'STEM & Physics' };
const CURRICULUM = {
  fullstack: { electives:['React','Vue','Next.js','TypeScript','Cloud & DevOps','Physics'] },
  frontend:  { electives:['React','Vue','Next.js','TypeScript','Figma','Physics'] },
  backend:   { electives:['Databases (NoSQL)','REST APIs','Authentication','TypeScript','Cloudinary','Physics'] },
  webdesign: { electives:['CSS Animation','Accessibility','Design Systems','Portfolio','Git & GitHub','Physics'] },
  uiux:      { electives:['Design Systems','Accessibility','Prototyping','Figma Advanced','Portfolio','Physics'] },
  stem:      { electives:['Core 50 Equations','Nuclear Physics','Relativity','Astrophysics','JavaScript Fundamentals','Physics Lab'] }
};
const APPLICATION_CLOSE = new Date('2027-02-14T23:59:59+02:00').getTime();

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href='auth.html'; return; }
  if (user.email === ADMIN_EMAIL) { window.location.href='admin.html'; return; }
  const snap = await getDoc(doc(db,'users',user.uid));
  const data = snap.exists()?snap.data():{};
  if (!data.course) { window.location.href='curriculum.html'; return; }
  render(user, data);
});

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function tile(subj, kind) {
  const cls = kind==='stream'?'stream-tile':(subj.required?'math-tile':'');
  const tagCls = kind==='stream'?'stream':kind==='elective'?'elective':(subj.required?'math':'');
  const tagText = kind==='stream'?'Stream':kind==='elective'?'Elective':(subj.tag||'Core');
  return `<div class="tile ${cls}"><span class="tag ${tagCls}">${tagText}</span><div class="t-icon"><i data-lucide="${subj.icon}"></i></div><h4>${esc(subj.name)}</h4><div class="mods">${esc(subj.modules||'')}</div></div>`;
}

function render(user, data) {
  const status = data.status||'pending';
  const meta = META[data.duration]||{full:'—',desc:'—'};
  const streamKey = data.course;
  const streamSubj = STREAM_SUBJECTS[streamKey]||{name:'—',modules:'',icon:'layout-grid'};
  const electives = data.electives||[];
  const editable = Date.now() < APPLICATION_CLOSE;
  const periods = data.duration==='12'
    ? [{n:'First Certification Period',w:'May / June 2027'},{n:'Targeted Revision Period',w:'September 2027'},{n:'Final Certification Period',w:'Oct / Nov 2027'}]
    : [{n:'First Certification Period',w:'May / June 2027'},{n:'Final Certification Period',w:'June / July 2027'}];
  const allSubjects = [
    {name:'Mathematics'},{name:'Web Foundations'},{name:'Programming Fundamentals'},{name:streamSubj.name},...electives.map(e=>({name:e}))
  ];

  document.getElementById('app').innerHTML = `
    <h1>Hello, ${esc((data.name||user.email).split(' ')[0])}</h1>
    <p class="sub">Your course at a glance — 2027 intake</p>

    <div class="tabs">
      <button class="tab active" data-tab="subjects"><i data-lucide="layout-grid"></i> Subjects</button>
      <button class="tab" data-tab="profile"><i data-lucide="user"></i> Profile</button>
      <button class="tab" data-tab="exams"><i data-lucide="calendar"></i> Exams</button>
    </div>

    <div class="panel active" id="panel-subjects">
      <div class="card hero-card">
        <div class="label"><i data-lucide="award"></i> Your Curriculum</div>
        <div class="c-name">${esc(meta.full)}</div>
        <div class="c-desc">${esc(meta.desc)}</div>
      </div>
      <div class="card">
        <div class="label"><i data-lucide="layout-grid"></i> Your 6 Subjects</div>
        <div class="subject-grid">
          ${tile(CORE.math,'core')}
          ${tile(CORE.webFoundations,'core')}
          ${tile(CORE.progFundamentals,'core')}
          ${tile(streamSubj,'stream')}
          ${electives.map(e=>tile({name:e,modules:'Elective subject',icon:'star'},'elective')).join('')}
        </div>
        <p style="font-size:12.5px;color:var(--grey);margin-top:16px">3 core · 1 stream · 2 electives. Mathematics required.</p>
      </div>
    </div>

    <div class="panel" id="panel-profile">
      ${editable ? `<div class="edit-banner"><i data-lucide="info"></i><span>You can edit stream &amp; electives until 14 February 2027.</span></div>` : ''}
      <div class="card">
        <div class="label"><i data-lucide="fingerprint"></i> Identifiers</div>
        <div class="id-grid">
          <div class="id-cell"><div class="k">Student №</div><div class="v ${data.studentNumber?'':'pending'}">${data.studentNumber?esc(data.studentNumber):'Pending'}</div></div>
          <div class="id-cell"><div class="k">Examination №</div><div class="v ${data.examinationNumber?'':'pending'}">${data.examinationNumber?esc(data.examinationNumber):'Issued at exams'}</div></div>
        </div>
      </div>
      <div class="card">
        <div class="label"><i data-lucide="activity"></i> State</div>
        <div class="info-row"><span class="k">Status</span><span class="v"><span class="status-badge ${status}"><i data-lucide="${status==='approved'?'circle-check':'clock'}"></i> ${status}</span></span></div>
        <div class="info-row"><span class="k">Stream</span><span class="v">${editable?`<select id="editStream" style="padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-family:inherit">${Object.entries(STREAM_NAMES).map(([k,v])=>`<option value="${k}" ${k===streamKey?'selected':''}>${v}</option>`).join('')}</select>`:esc(STREAM_NAMES[streamKey]||'—')}</span></div>
        <div class="info-row"><span class="k">Duration</span><span class="v">${data.duration?data.duration+' months':'—'}</span></div>
        <div class="info-row"><span class="k">Application closes</span><span class="v">14 February 2027</span></div>
      </div>
      ${editable ? `
      <div class="card">
        <div class="label"><i data-lucide="edit-3"></i> Electives</div>
        <div id="editElectives" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px">
          ${(CURRICULUM[streamKey]?.electives||[]).map(e=>`<label style="display:flex;align-items:center;gap:6px;padding:7px 12px;border:1.5px solid var(--line);border-radius:8px;font-size:13px;cursor:pointer"><input type="checkbox" value="${e}" ${electives.includes(e)?'checked':''} class="editEl" style="accent-color:var(--black)"> ${e}</label>`).join('')}
        </div>
        <button class="btn" id="saveEdit"><i data-lucide="save"></i> Save Changes</button>
      </div>
      ` : ''}
      <div class="card">
        <div class="label"><i data-lucide="user"></i> Personal</div>
        <div class="info-row"><span class="k">Name</span><span class="v">${esc(data.name||'—')}</span></div>
        <div class="info-row"><span class="k">Email</span><span class="v">${esc(data.email||user.email)}</span></div>
        <p style="font-size:12px;color:var(--grey);margin-top:12px">Read-only. Email the studio for changes.</p>
      </div>
      <div class="card">
        <div class="label"><i data-lucide="file-text"></i> Admission Slip</div>
        <p style="font-size:13.5px;color:var(--grey);margin-bottom:14px">Your slip contains your exam number, papers, barcode, badge watermark.</p>
        <a href="admission-slip.html" class="btn"><i data-lucide="download"></i> Open Admission Slip</a>
      </div>
    </div>

    <div class="panel" id="panel-exams">
      <div class="card">
        <div class="label"><i data-lucide="calendar"></i> Exam Periods</div>
        <ul style="list-style:none">
          ${periods.map(p=>`<li style="padding:14px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px"><div><div style="font-weight:700;font-size:14.5px">${p.n}</div><div style="font-size:12.5px;color:var(--grey);margin-top:3px">One paper per subject</div></div><span style="font-size:12.5px;color:var(--grey);white-space:nowrap">${p.w}</span></li>`).join('')}
        </ul>
      </div>
      <div class="card">
        <div class="label"><i data-lucide="file-text"></i> Papers by Subject</div>
        <ul style="list-style:none">
          ${allSubjects.map(s=>`<li style="padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px;display:flex;justify-content:space-between;gap:12px"><span>${esc(s.name)}</span><span style="font-size:12px;color:var(--grey)">1 paper</span></li>`).join('')}
        </ul>
      </div>
      <div class="card">
        <div class="label"><i data-lucide="shield"></i> Exam Access</div>
        <p style="font-size:13.5px;color:var(--grey);margin-bottom:14px">On exam day, sign in with your Examination Number and PIN.</p>
        <a href="exam-gateway.html" class="btn"><i data-lucide="log-in"></i> Exam Gateway</a>
      </div>
    </div>
  `;
  if (window.lucide) lucide.createIcons();

  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('panel-' + t.dataset.tab).classList.add('active');
  }));

  if (editable) {
    const saveBtn = document.getElementById('saveEdit');
    if (saveBtn) {
      saveBtn.addEventListener('click', async () => {
        const newStream = document.getElementById('editStream')?.value || streamKey;
        const newEls = Array.from(document.querySelectorAll('.editEl:checked')).map(c => c.value);
        if (newEls.length !== 2) { alert('Choose exactly 2 electives.'); return; }
        try {
          await updateDoc(doc(db,'users',user.uid), { course: newStream, electives: newEls, updatedAt: serverTimestamp() });
          alert('Saved.'); location.reload();
        } catch (e) { alert('Error: ' + e.message); }
      });
    }
  }
}
if (window.lucide) lucide.createIcons();
</script>
</body>
</html>
