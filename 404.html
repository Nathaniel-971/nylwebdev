<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Lost in the Syllabus | Institute of Board</title>
<meta name="description" content="The page you requested has moved or no longer exists.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 10 L92 85 H8 L50 10 Z' fill='%237A1F2B'/%3E%3Cpath d='M50 32 L77 78 H23 L50 32 Z' fill='%23FFFFFF'/%3E%3C/svg%3E">

<!-- Catchy Serif Font for the 404 + Inter for body -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<style>
  :root {
    --maroon: #7A1F2B;
    --maroon-dark: #4A1219;
    --white: #FFF;
    --silver: #E2E8F0;
    --gray: #666;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--maroon);
    color: var(--white);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Background Pattern (Subtle Grid) */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: 0;
    pointer-events: none;
  }

  /* Background Ambient Glow */
  .glow {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 60vw; height: 60vw;
    background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 60%);
    border-radius: 50%;
    z-index: 0;
    pointer-events: none;
    animation: pulseGlow 6s ease-in-out infinite;
  }

  @keyframes pulseGlow {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
    50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
  }

  .content-wrapper {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 24px;
    max-width: 600px;
    animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    opacity: 0;
    transform: translateY(30px);
  }

  @keyframes slideUp {
    to { opacity: 1; transform: translateY(0); }
  }

  /* The Catchy Font for 404 */
  .error-code {
    font-family: 'Fraunces', serif;
    font-size: clamp(100px, 20vw, 180px);
    font-weight: 900;
    line-height: 0.9;
    letter-spacing: -4px;
    margin-bottom: 10px;
    background: linear-gradient(to bottom, #FFF 0%, #E2E8F0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }

  .error-title {
    font-size: 24px;
    font-weight: 800;
    margin-bottom: 12px;
    letter-spacing: -0.5px;
  }

  .error-desc {
    font-size: 16px;
    color: rgba(255,255,255,0.7);
    line-height: 1.6;
    margin-bottom: 40px;
  }

  .error-desc code {
    background: rgba(0,0,0,0.3);
    padding: 2px 8px;
    border-radius: 4px;
    font-family: monospace;
    color: #FFF;
    font-size: 14px;
  }

  .actions {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 28px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    transition: all 0.2s ease;
    border: 2px solid transparent;
  }

  .btn-primary {
    background: var(--white);
    color: var(--maroon);
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  }
  
  .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 25px rgba(0,0,0,0.3);
  }

  .btn-secondary {
    background: transparent;
    color: var(--white);
    border-color: rgba(255,255,255,0.3);
  }

  .btn-secondary:hover {
    border-color: var(--white);
    background: rgba(255,255,255,0.1);
  }

  /* Footer */
  .footer-bottom {
    position: absolute;
    bottom: 24px;
    font-size: 12px;
    color: rgba(255,255,255,0.5);
    z-index: 10;
    text-align: center;
    width: 100%;
  }

  .footer-bottom strong {
    color: var(--white);
  }

  @media (max-width: 600px) {
    .error-title { font-size: 20px; }
    .error-desc { font-size: 14px; }
    .btn { width: 100%; }
  }
</style>
</head>
<body>

  <div class="glow"></div>

  <div class="content-wrapper">
    <div class="error-code">404</div>
    
    <h1 class="error-title">Oops! You're lost in the syllabus.</h1>
    
    <p class="error-desc" id="errorMsg">
      The page you are looking for has been moved, deleted, or perhaps never existed in this curriculum. 
    </p>

    <div class="actions">
      <a href="/" class="btn btn-primary">
        <i data-lucide="home" style="width:18px;height:18px;"></i> Return Home
      </a>
      <a href="/resources.html" class="btn btn-secondary">
        <i data-lucide="folder-open" style="width:18px;height:18px;"></i> Browse Resources
      </a>
    </div>
  </div>

  <div class="footer-bottom">
    &copy; 2026—2028 <strong>Institute of Board</strong>. Independent, non-accredited institution.
  </div>

  <script>
    // Init Lucide Icons
    if (window.lucide) lucide.createIcons();

    // Show the missing path dynamically
    var path = window.location.pathname;
    if (path && path !== '/' && path !== '/404.html') {
      var msg = document.getElementById('errorMsg');
      msg.innerHTML = "We couldn't find the page <code>" + path + "</code> in our records. It may have been moved or deleted during our portal upgrade.";
    }
  </script>
</body>
</html>
