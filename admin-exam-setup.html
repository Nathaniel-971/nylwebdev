<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Setup — IFB</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root { --maroon: #7A1F2B; --bg: #F8FAFC; --white: #FFF; --text: #111; --gray: #64748B; --silver: #E2E8F0; --success: #15803D; --error: #B91C1C; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 24px; }
  .container { max-width: 1200px; margin: 0 auto; }
  .nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 18px; }
  .brand span { color: var(--maroon); font-size: 26px; }
  .btn { background: transparent; border: 1.5px solid var(--silver); padding: 8px 16px; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; color: var(--text); font-family: inherit; }
  .btn-danger { background: #FEF2F2; color: var(--error); border-color: #FECACA; }
  .grid { display: grid; grid-template-columns: 380px 1fr; gap: 24px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--white); border: 1px solid var(--silver); border-radius: 12px; padding: 20px; }
  .card h2 { font-size: 16px; font-weight: 900; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--silver); padding-bottom: 12px; }
  .card h2 i { color: var(--maroon); width: 18px; height: 18px; }
  .file-group { margin-bottom: 12px; }
  .file-group label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 4px; }
  .file-input { width: 100%; font-size: 12px; padding: 8px; border: 1px solid var(--silver); border-radius: 6px; }
  .btn-primary { background: var(--maroon); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
  .btn-primary:disabled { opacity: 0.6; }
  .pin-display { text-align: center; margin-top: 20px; display: none; background: var(--bg); padding: 16px; border-radius: 8px; border: 1px dashed var(--maroon); }
  .pin-text { font-family: monospace; font-size: 32px; font-weight: 900; color: var(--maroon); letter-spacing: 6px; margin: 8px 0; }
  .qr-box { margin-top: 16px; text-align: center; }
  .qr-box svg { max-width: 180px; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--silver); border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; min-width: 500px; }
  th, td { padding: 10px 12px; border-bottom: 1px solid var(--silver); }
  th { background: var(--bg); font-weight: 800; color: var(--gray); text-transform: uppercase; font-size: 10px; }
  .status-badge { padding: 3px 8px; border-radius: 4px; font-weight: 700; font-size: 11px; }
  .status-online { background: #DCFCE7; color: var(--success); }
  .status-offline { background: #FEE2E2; color: var(--error); }
  #viewer { position: fixed; inset: 0; background: rgba(15,23,42,0.95); z-index: 1000; display: none; flex-direction: column; padding: 20px; }
  #viewer.active { display: flex; }
  .viewer-header { display: flex; justify-content: space-between; align-items: center; color: white; margin-bottom: 16px; }
  .viewer-content { flex: 1; background: white; border-radius: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .viewer-content img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .viewer-nav { display: flex; justify-content: center; gap: 16px; margin-top: 16px; }
  .viewer-nav button { background: var(--maroon); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<div class="container">
  <div class="nav">
    <div class="brand"><span>∆</span> IFB Admin</div>
    <button class="btn btn-danger" onclick="logout()"><i data-lucide="log-out"></i> Logout</button>
  </div>
  <div class="grid">
    <div class="card">
      <h2><i data-lucide="settings"></i> Create Session</h2>
      <div class="file-group"><label>Question Paper (.html)</label><input type="file" id="qFile" class="file-input" accept=".html"></div>
      <div class="file-group"><label>Answer Book (.html)</label><input type="file" id="aFile" class="file-input" accept=".html"></div>
      <div class="file-group"><label>PIN (6 digits)</label><input type="text" id="pin" class="file-input" maxlength="6" placeholder="e.g. 847291" style="font-family: monospace; font-size: 16px; text-align: center;"></div>
      <div class="file-group"><label>Duration (minutes)</label><input type="number" id="duration" class="file-input" value="120"></div>
      <button class="btn-primary" id="startBtn" onclick="createSession()"><i data-lucide="play-circle"></i> Create & Unlock</button>
      <div id="status" style="margin-top: 8px; font-size: 12px; font-weight: 700; text-align: center; color: var(--gray);"></div>
      <div class="pin-display" id="pinDisplay">
        <div style="font-size: 11px; font-weight: 800; color: var(--gray); text-transform: uppercase;">Session PIN</div>
        <div class="pin-text" id="pinText">------</div>
        <div class="qr-box"><div style="font-size: 11px; color: var(--gray); margin-bottom: 8px;">Scan for Mobile Scanner</div><div id="qrCode"></div></div>
      </div>
    </div>
    <div class="card">
      <h2><i data-lucide="activity"></i> Live Monitor</h2>
      <div class="table-wrap">
        <table><thead><tr><th>Exam Number</th><th>Status</th><th>Tab Switches</th><th>Last Active</th><th>Action</th></tr></thead>
        <tbody id="monitorTable"><tr><td colspan="5" style="text-align: center; padding: 20px;">Waiting...</td></tr></tbody></table>
      </div>
    </div>
  </div>
</div>
<div id="viewer">
  <div class="viewer-header"><h2 id="viewerTitle">Script</h2><button class="btn" style="background:white;color:var(--maroon);" onclick="closeViewer()"><i data-lucide="x"></i> Close</button></div>
  <div class="viewer-content" id="viewerContent"></div>
  <div class="viewer-nav" id="viewerNav" style="display:none;"><button onclick="prevPage()">◀ Prev</button><span id="pageIndicator" style="color:white;font-weight:800;"></span><button onclick="nextPage()">Next ▶</button></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyA6HO7n6wCZEeCgKxJLjB-MjL0ZFGR7svU", authDomain: "nyldevcourses.firebaseapp.com", projectId: "nyldevcourses", storageBucket: "nyldevcourses.firebasestorage.app", messagingSenderId: "16687006873", appId: "1:16687006873:web:b7d66ad1024ccd92722408" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const ADMIN = "n1nathaniel971@gmail.com";

let unsub = null, pages = [], idx = 0;
function ri(){ if(window.lucide) try{lucide.createIcons()}catch(e){} }

onAuthStateChanged(auth, (u) => {
  if (!u || u.email !== ADMIN) { document.body.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:100vh;"><h1>Access Denied</h1></div>'; return; }
  initMonitor();
});
window.logout = async () => { await signOut(auth); window.location.href = "index.html"; };

function readFile(f){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=e=>res(e.target.result); r.onerror=rej; r.readAsText(f); }); }

window.createSession = async () => {
  const q = document.getElementById('qFile').files[0];
  const a = document.getElementById('aFile').files[0];
  const pin = document.getElementById('pin').value.trim();
  const dur = parseInt(document.getElementById('duration').value);
  const st = document.getElementById('status');
  if (!q || !a || pin.length !== 6) { alert("Upload both files and enter 6-digit PIN."); return; }
  try {
    document.getElementById('startBtn').disabled = true;
    st.innerText = "Reading files...";
    const qHtml = await readFile(q);
    const aHtml = await readFile(a);
    st.innerText = "Saving...";
    const sid = 'S_' + Date.now();
    await setDoc(doc(db, "examSessions", sid), { sessionId: sid, examCode: pin, questionPaperHtml: qHtml, answerBookHtml: aHtml, durationMinutes: dur, active: true, createdAt: serverTimestamp() });
    await setDoc(doc(db, "config", "examSettings"), { activeSessionId: sid }, { merge: true });
    document.getElementById('pinDisplay').style.display = 'block';
    document.getElementById('pinText').innerText = pin;
    const qr = qrcode(0, "M"); qr.addData(`${window.location.origin}/mobile-scanner.html?session=${sid}&pin=${pin}`); qr.make();
    document.getElementById('qrCode').innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0 });
    st.innerText = "Session Live!"; st.style.color = "var(--success)";
    document.getElementById('startBtn').innerHTML = '<i data-lucide="check-circle"></i> Active';
    ri();
  } catch(e) { st.innerText = "Error: " + e.message; st.style.color = "var(--error)"; document.getElementById('startBtn').disabled = false; }
};

function initMonitor() {
  if (unsub) unsub();
  const q = query(collection(db, "examLogs"), orderBy("lastActive", "desc"));
  unsub = onSnapshot(q, (snap) => {
    const tb = document.getElementById('monitorTable'); tb.innerHTML = '';
    if (snap.empty) { tb.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:20px;">Waiting...</td></tr>'; return; }
    snap.forEach(d => {
      const x = d.data();
      const tabs = x.tabSwitches ? x.tabSwitches.length : 0;
      const online = x.status === 'In Session' || x.status === 'Online';
      const la = x.lastActive ? new Date(x.lastActive.toDate()).toLocaleTimeString() : 'N/A';
      const tr = document.createElement('tr');
      tr.innerHTML = `<td style="font-family:monospace;font-weight:bold;">${x.examNumber || d.id}</td><td><span class="status-badge ${online?'status-online':'status-offline'}">${online?'Online':'Offline'}</span></td><td style="color:${tabs>0?'var(--error)':'inherit'};font-weight:bold;">${tabs}</td><td>${la}</td><td><button class="btn" style="padding:4px 8px;font-size:11px;" onclick="viewScript('${d.id}')">View</button></td>`;
      tb.appendChild(tr);
    });
  });
}

window.viewScript = async (sid) => {
  const s = await getDoc(doc(db, "examLogs", sid));
  if (!s.exists()) { alert("No script."); return; }
  pages = s.data().scripts || []; idx = 0;
  document.getElementById('viewerTitle').innerText = `Script: ${s.data().examNumber || sid}`;
  document.getElementById('viewer').classList.add('active');
  document.getElementById('viewerNav').style.display = pages.length > 1 ? 'flex' : 'none';
  renderPage(); ri();
};
function renderPage() {
  const c = document.getElementById('viewerContent');
  if (!pages.length) { c.innerHTML = '<div style="padding:40px;color:var(--gray);">No pages uploaded.</div>'; return; }
  c.innerHTML = `<img src="${pages[idx].url}">`;
  document.getElementById('pageIndicator').innerText = `${idx+1} / ${pages.length}`;
}
window.prevPage = () => { if(idx>0){idx--;renderPage();} };
window.nextPage = () => { if(idx<pages.length-1){idx++;renderPage();} };
window.closeViewer = () => document.getElementById('viewer').classList.remove('active');
ri();
</script>
</body>
</html>
