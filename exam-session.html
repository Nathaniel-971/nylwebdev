<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IFB Exam Session</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>window.MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']],displayMath:[['$$','$$']]},svg:{fontCache:'global'}};</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --maroon:#7A1F2B; --bg:#F8FAFC; --white:#FFF; --text:#111; --gray:#64748B; --silver:#E2E8F0; --success:#15803D; --error:#B91C1C; }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
  .header{background:white;border-bottom:1px solid var(--silver);padding:0 24px;height:72px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
  .brand{display:flex;align-items:center;gap:12px;font-weight:900;font-size:20px;}
  .brand span{color:var(--maroon);font-size:28px;}
  .clock{background:var(--bg);padding:8px 20px;border-radius:8px;border:1px solid var(--silver);font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700;color:var(--success);}
  .clock.danger{color:var(--error);animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
  .btn{background:transparent;border:1px solid var(--silver);color:var(--text);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px;font-family:inherit;}
  .btn-primary{background:var(--maroon);color:white;border:none;}
  .btn-danger{border-color:var(--error);color:var(--error);}
  .main{flex:1;display:flex;overflow:hidden;}
  .left{flex:1;display:flex;flex-direction:column;background:#E2E8F0;overflow:hidden;}
  .tabs{display:flex;background:white;border-bottom:1px solid var(--silver);}
  .tab{flex:1;padding:12px;border:none;background:transparent;font-weight:700;font-size:14px;color:var(--gray);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;border-bottom:2px solid transparent;}
  .tab.active{color:var(--maroon);border-bottom-color:var(--maroon);background:var(--bg);}
  .tc{flex:1;overflow-y:auto;padding:24px;display:none;}
  .tc.active{display:block;}
  .paper{background:white;max-width:900px;margin:0 auto;padding:40px;box-shadow:0 4px 15px rgba(0,0,0,0.1);border-radius:8px;}
  .sidebar{width:320px;background:white;border-left:1px solid var(--silver);padding:24px;flex-shrink:0;overflow-y:auto;}
  @media(max-width:900px){.main{flex-direction:column;}.left{height:60vh;flex:none;}.sidebar{width:100%;border-left:none;border-top:1px solid var(--silver);}}
  .scard{background:var(--bg);padding:16px;border-radius:12px;border:1px solid var(--silver);text-align:center;margin-bottom:16px;}
  .scard .num{font-family:monospace;font-size:18px;font-weight:900;color:var(--maroon);margin:8px 0;}
  .scard svg{max-width:100%;height:40px;}
  .overlay{position:fixed;inset:0;background:rgba(248,250,252,0.95);backdrop-filter:blur(10px);z-index:1000;display:none;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;}
  .overlay.active{display:flex;}
  .overlay h2{font-size:32px;font-weight:900;margin-bottom:16px;}
  .overlay p{font-size:16px;color:var(--gray);max-width:500px;margin-bottom:32px;}
  .pin-input{background:white;border:2px solid var(--silver);font-size:42px;font-family:monospace;text-align:center;letter-spacing:12px;padding:16px 24px;border-radius:12px;outline:none;width:100%;max-width:300px;margin-bottom:24px;}
</style>
</head>
<body>
<header class="header">
  <div class="brand"><span>∆</span> IFB Exam</div>
  <div class="clock" id="clock">--:--:--</div>
  <button class="btn btn-danger" onclick="exitExam()"><i data-lucide="log-out"></i> Exit</button>
</header>
<main class="main">
  <div class="left">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('paper')" id="tPaper"><i data-lucide="file-text"></i> Question Paper</button>
      <button class="tab" onclick="switchTab('ab')" id="tAB"><i data-lucide="book-open"></i> Answer Book</button>
    </div>
    <div class="tc active" id="vPaper"><div class="paper" id="paperC">Loading...</div></div>
    <div class="tc" id="vAB"><div class="paper" id="abC">Loading...</div></div>
  </div>
  <aside class="sidebar">
    <h3 style="font-size:12px;text-transform:uppercase;color:var(--gray);margin-bottom:12px;font-weight:800;">Student Info</h3>
    <div class="scard">
      <div style="font-size:11px;color:var(--gray);text-transform:uppercase;font-weight:800;">Exam Number</div>
      <div class="num" id="examNum">Loading...</div>
      <svg id="barcode"></svg>
    </div>
    <div id="dlBox" style="display:none;margin-top:16px;">
      <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="downloadPaper()"><i data-lucide="download"></i> Download Paper</button>
    </div>
  </aside>
</main>

<div class="overlay active" id="pinOverlay">
  <div style="background:white;padding:40px;border-radius:24px;border:1px solid var(--silver);">
    <i data-lucide="shield-lock" style="width:64px;height:64px;color:var(--maroon);margin-bottom:24px;"></i>
    <h2>Session Locked</h2>
    <p style="margin-bottom:24px;font-size:15px;">Enter the 6-digit PIN from your Invigilator.</p>
    <input type="text" class="pin-input" id="pinInput" maxlength="6" placeholder="••••••" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
    <button class="btn btn-primary" style="padding:16px 32px;font-size:16px;width:100%;justify-content:center;font-weight:700;" onclick="verifyPin()">Unlock</button>
    <p id="pinErr" style="color:var(--error);font-size:14px;margin-top:12px;display:none;font-weight:700;">Incorrect PIN.</p>
  </div>
</div>

<div class="overlay" id="tabWarn">
  <i data-lucide="alert-triangle" style="width:80px;height:80px;color:var(--error);margin-bottom:24px;"></i>
  <h2 style="color:var(--error);">Tab Switch Detected</h2>
  <p>You left the exam window. This has been logged.</p>
  <button class="btn btn-primary" style="padding:16px 32px;font-size:16px;font-weight:700;" onclick="document.getElementById('tabWarn').classList.remove('active')">I Understand</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, arrayUnion, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyA6HO7n6wCZEeCgKxJLjB-MjL0ZFGR7svU", authDomain: "nyldevcourses.firebaseapp.com", projectId: "nyldevcourses", storageBucket: "nyldevcourses.firebasestorage.app", messagingSenderId: "16687006873", appId: "1:16687006873:web:b7d66ad1024ccd92722408" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const ADMIN = "n1nathaniel971@gmail.com";

let sid=null, examNum=null, pin=null, pHtml=null, aHtml=null, dur=120, start=null, timer=null;
function ri(){if(window.lucide)try{lucide.createIcons()}catch(e){}}

onAuthStateChanged(auth, async (u) => {
  if(!u){window.location.href="index.html";return;}
  try{
    const ud=await getDoc(doc(db,"users",u.uid));
    if(ud.exists()){sid=ud.data().studentId;examNum=ud.data().examNumber;
      document.getElementById('examNum').innerText=examNum||'Pending';
      try{JsBarcode("#barcode",examNum,{format:"CODE128",width:1.5,height:40,displayValue:false})}catch(e){}
    }
    const cfg=await getDoc(doc(db,"config","examSettings"));
    if(!cfg.exists()||!cfg.data().activeSessionId){document.getElementById('paperC').innerHTML='<div style="color:var(--error);">No active session.</div>';return;}
    const sess=await getDoc(doc(db,"examSessions",cfg.data().activeSessionId));
    if(sess.exists()){const s=sess.data();pin=s.examCode;pHtml=s.questionPaperHtml;aHtml=s.answerBookHtml;dur=s.durationMinutes||120;
      document.getElementById('pinOverlay').classList.add('active');}
  }catch(e){console.error(e)}
  ri();
});

window.verifyPin = () => {
  const e=document.getElementById('pinInput').value;
  if(e.length!==6)return;
  if(e===pin){document.getElementById('pinOverlay').classList.remove('active');loadP();loadAB();startT();}
  else{document.getElementById('pinErr').style.display='block';document.getElementById('pinInput').value='';}
};

function loadP(){const c=document.getElementById('paperC');c.innerHTML=DOMPurify.sanitize(pHtml);if(window.MathJax)MathJax.typesetPromise([c]).catch(()=>{});}
function loadAB(){const c=document.getElementById('abC');c.innerHTML=DOMPurify.sanitize(aHtml);if(window.MathJax)MathJax.typesetPromise([c]).catch(()=>{});}

function startT(){start=Date.now();timer=setInterval(()=>{
  const r=(dur*60*1000)-(Date.now()-start);
  if(r<=0){clearInterval(timer);document.getElementById('clock').innerText="00:00:00";document.getElementById('clock').className="clock danger";alert("Time up! You may now download the paper.");document.getElementById('dlBox').style.display='block';ri();return;}
  const h=Math.floor(r/3600000).toString().padStart(2,'0');
  const m=Math.floor((r%3600000)/60000).toString().padStart(2,'0');
  const s=Math.floor((r%60000)/1000).toString().padStart(2,'0');
  const el=document.getElementById('clock');el.innerText=`${h}:${m}:${s}`;
  if(r<300000)el.className="clock danger";
},1000);
log('login',{});}

async function log(t,p){if(!sid)return;try{const r=doc(db,"examLogs",sid);
if(t==='tab'){await setDoc(r,{examNumber:examNum,status:'In Session',lastActive:serverTimestamp(),tabSwitches:arrayUnion(new Date().toISOString())},{merge:true});}
else{await setDoc(r,{examNumber:examNum,status:'In Session',lastActive:serverTimestamp()},{merge:true});}}catch(e){}}

document.addEventListener("visibilitychange",async()=>{
if(document.hidden&&!document.getElementById('pinOverlay').classList.contains('active')){
document.getElementById('tabWarn').classList.add('active');await log('tab',{});}});

window.exitExam=async()=>{if(confirm("Exit exam?")){await log('logout',{});await signOut(auth);window.location.href="index.html";}};
window.switchTab=(t)=>{document.querySelectorAll('.tc').forEach(c=>c.classList.remove('active'));document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
if(t==='paper'){document.getElementById('vPaper').classList.add('active');document.getElementById('tPaper').classList.add('active');}
else{document.getElementById('vAB').classList.add('active');document.getElementById('tAB').classList.add('active');}};
window.downloadPaper=async()=>{const el=document.getElementById('paperC');await html2pdf().set({margin:10,filename:`IFB-Paper-${examNum}.pdf`,image:{type:'jpeg',quality:0.95},html2canvas:{scale:2,useCORS:true,backgroundColor:'#fff'},jsPDF:{unit:'mm',format:'a4'}}).from(el).save();};
ri();
</script>
</body>
</html>
