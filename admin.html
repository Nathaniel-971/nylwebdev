<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Administration · ∆ IFB Institute</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b0b0b">
<meta name="robots" content="noindex, nofollow">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
/* =================== THEME =================== */
:root{
  --ink:#0b0b0b;--ink-2:#1c1c1c;--ink-3:#2b2b2b;
  --paper:#ffffff;--paper-2:#fafafa;--paper-3:#f4f4f4;--paper-4:#ebebeb;
  --line:#e7e7e7;--line-2:#d6d6d6;
  --muted:#6f6f6f;--muted-2:#909090;--muted-3:#b4b4b4;
  --gold:#b58a2b;--gold-soft:#fbf4e0;
  --blue:#2f4ba8;--blue-soft:#eef2ff;
  --green:#0a7d4f;--green-soft:#e8f5ec;
  --red:#b3261e;--red-soft:#fdefec;
  --orange:#b46300;--orange-soft:#fdf1e0;
  --purple:#6b21a8;--purple-soft:#f5e8ff;
  --radius:10px;--radius-lg:16px;--radius-xl:22px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 10px 28px rgba(0,0,0,.06);
  --shadow-lg:0 26px 70px rgba(0,0,0,.10);
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper-2);color:var(--ink);
  font-family:var(--font);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
::selection{background:var(--ink);color:var(--paper)}
button{font-family:inherit;cursor:pointer}
a{color:inherit}
table{border-collapse:collapse}

/* =================== LOADER =================== */
.loader{position:fixed;inset:0;z-index:9999;background:var(--ink);color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transition:opacity .6s ease,visibility .6s ease;padding:24px}
.loader.gone{opacity:0;visibility:hidden;pointer-events:none}
.loader-mark{font-size:88px;font-weight:600;line-height:1;letter-spacing:-3px;animation:breathe 1.7s ease-in-out infinite}
.loader-label{font-size:10.5px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.5);font-weight:600;text-align:center}
.loader-bar{width:180px;height:2px;background:rgba(255,255,255,.14);border-radius:2px;overflow:hidden;margin-top:4px}
.loader-bar span{display:block;height:100%;width:36%;background:var(--paper);border-radius:2px;animation:loaderSlide 1.35s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.7;transform:scale(.94)}50%{opacity:1;transform:scale(1)}}
@keyframes loaderSlide{0%{transform:translateX(-130%)}100%{transform:translateX(380%)}}

/* =================== NAV =================== */
nav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.97);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.nav-inner{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.brand-mark{font-size:32px;font-weight:600;line-height:.9;letter-spacing:-2px;flex-shrink:0}
.brand-text{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.brand-name{font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;white-space:nowrap}
.brand-sub{font-size:9.5px;color:var(--muted);letter-spacing:1.4px;text-transform:uppercase;margin-top:2px;white-space:nowrap}
@media(max-width:400px){.brand-text{display:none}}
.nav-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.nav-btn{font-size:12.5px;font-weight:600;color:var(--ink);background:var(--paper);text-decoration:none;padding:8px 12px;border-radius:8px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);transition:all .18s ease;white-space:nowrap}
.nav-btn:hover{border-color:var(--ink);background:var(--paper-3)}
.nav-btn svg{width:13px;height:13px}
.nav-btn.icon-only{padding:8px 9px}
@media(max-width:400px){.nav-btn .lbl{display:none}}

/* =================== LAYOUT =================== */
.shell{padding:0 16px;max-width:100%}
.admin-head{padding:32px 0 22px}
.admin-head .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:10px}
.admin-head .eyebrow svg{width:11px;height:11px}
.admin-head .eyebrow::before{content:"";width:16px;height:1px;background:var(--muted);opacity:.5}
.admin-head h1{font-size:24px;letter-spacing:-1px;line-height:1.15;font-weight:700;margin-bottom:6px}
.admin-head p{font-size:13.5px;color:var(--muted);line-height:1.55}

/* =================== DENIED =================== */
.denied{text-align:center;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-xl);padding:40px 24px;box-shadow:var(--shadow-sm);margin:64px 0}
.denied .icon{width:64px;height:64px;border-radius:50%;background:var(--red-soft);border:1px solid rgba(179,38,30,.2);display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.denied .icon svg{width:26px;height:26px;color:var(--red)}
.denied h1{font-size:20px;letter-spacing:-.6px;margin-bottom:8px;font-weight:700}
.denied p{font-size:13.5px;color:var(--muted);line-height:1.55;margin-bottom:22px}
.denied .actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* =================== STATS =================== */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
.stat{border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:14px;position:relative;overflow:hidden}
.stat .label{display:flex;align-items:center;gap:6px;font-size:9px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px}
.stat .label svg{width:10px;height:10px}
.stat .value{font-size:24px;font-weight:700;letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums}
.stat .sub{font-size:10.5px;color:var(--muted-2);margin-top:4px}
.stat.accent{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.stat.accent .label{color:rgba(255,255,255,.6)}
.stat.accent .sub{color:rgba(255,255,255,.5)}

/* =================== TABS =================== */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:11px 14px;font-size:12.5px;font-weight:600;background:transparent;border:none;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:all .18s ease}
.tab svg{width:13px;height:13px}
.tab.active{color:var(--ink);border-bottom-color:var(--ink)}

/* =================== TOOLBAR =================== */
.toolbar{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;margin-bottom:12px}
.search{flex:1 1 100%;position:relative;min-width:0}
.search input{width:100%;padding:12px 14px 12px 38px;font-size:14px;font-family:inherit;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);transition:border-color .18s ease,box-shadow .18s ease}
.search input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 4px rgba(11,11,11,.05)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted);pointer-events:none}
.tool-btn{flex:1 1 0;font-size:12.5px;font-weight:600;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all .18s ease;white-space:nowrap}
.tool-btn:hover{border-color:var(--ink);background:var(--paper-3)}
.tool-btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tool-btn svg{width:13px;height:13px}
.tool-btn:disabled{opacity:.55;cursor:not-allowed}

/* =================== CHIPS =================== */
.chips{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;font-size:12px;font-weight:600;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--muted);display:inline-flex;align-items:center;gap:6px;transition:all .18s ease}
.chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip svg{width:12px;height:12px}
.chip .count{font-family:var(--mono);font-size:9.5px;font-weight:700;background:var(--paper-3);color:var(--muted);padding:1px 5px;border-radius:100px;margin-left:2px}
.chip.active .count{background:rgba(255,255,255,.2);color:var(--paper)}

/* =================== MOBILE CARD LIST =================== */
.card-list{display:flex;flex-direction:column;gap:10px}
.cand-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;transition:border-color .18s ease,box-shadow .18s ease;position:relative}
.cand-card:active{border-color:var(--ink)}
.cand-card .top{display:flex;gap:11px;align-items:flex-start}
.cand-card .avatar{width:42px;height:42px;border-radius:11px;overflow:hidden;border:1px solid var(--line);flex-shrink:0;background:var(--paper-3);display:flex;align-items:center;justify-content:center}
.cand-card .avatar svg{display:block}
.cand-card .id{flex:1;min-width:0}
.cand-card .name{font-size:14.5px;font-weight:700;line-height:1.25;margin-bottom:2px;letter-spacing:-.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cand-card .email{font-size:11.5px;color:var(--muted);font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3}
.cand-card .badge-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.cand-card .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;padding-top:10px;border-top:1px dashed var(--line)}
.cand-card .grid .kv{display:flex;flex-direction:column;gap:2px;min-width:0}
.cand-card .grid .kv .k{font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:700}
.cand-card .grid .kv .v{font-size:12px;font-weight:600;font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.3px}
.cand-card .grid .kv .v.null{color:var(--muted-3);font-style:italic;font-weight:400;font-family:var(--font);font-size:11.5px}
.cand-card .footer{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.cand-card .cb{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);font-weight:600}
.cand-card .cb input{width:16px;height:16px;accent-color:var(--ink)}
.cand-card .open{font-size:12px;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:5px}
.cand-card .open svg{width:12px;height:12px}
.cand-card.selected{border-color:var(--ink);background:linear-gradient(180deg,var(--paper) 0%,var(--gold-soft) 100%)}

.status{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:3px 8px;border-radius:100px;white-space:nowrap}
.status svg{width:10px;height:10px}
.status.pending{background:var(--orange-soft);color:var(--orange)}
.status.prelude{background:var(--blue-soft);color:var(--blue)}
.status.curriculum{background:var(--gold-soft);color:var(--gold)}
.status.approved{background:var(--green-soft);color:var(--green)}
.status.revoked{background:var(--red-soft);color:var(--red)}
.status.none{background:var(--paper-3);color:var(--muted)}
.status.ai{background:var(--purple-soft);color:var(--purple)}
.tag{display:inline-flex;font-size:10px;font-weight:700;letter-spacing:.4px;padding:3px 7px;border-radius:5px;background:var(--paper-3);color:var(--muted);text-transform:uppercase;white-space:nowrap}
.tag.duration{background:var(--blue-soft);color:var(--blue)}
.tag.stream{background:var(--ink);color:var(--paper)}

/* =================== EMPTY =================== */
.empty{text-align:center;padding:56px 20px;background:var(--paper);border:1px solid var(--line);border-radius:14px}
.empty .icon{width:48px;height:48px;border-radius:12px;background:var(--paper-3);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.empty .icon svg{width:20px;height:20px;color:var(--muted)}
.empty h3{font-size:15px;font-weight:700;margin-bottom:5px}
.empty p{font-size:12.5px;color:var(--muted);max-width:320px;margin:0 auto;line-height:1.5}

/* =================== ACCESS MATRIX (mobile: card per candidate) =================== */
.access-list{display:flex;flex-direction:column;gap:12px}
.access-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px}
.access-card .head{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:10px}
.access-card .head .avatar{width:36px;height:36px;border-radius:10px;overflow:hidden;border:1px solid var(--line);flex-shrink:0;background:var(--paper-3);display:flex;align-items:center;justify-content:center}
.access-card .head .id{flex:1;min-width:0}
.access-card .head .name{font-size:13.5px;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.access-card .head .sub{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.access-card .papers{display:flex;flex-direction:column;gap:6px}
.paper-row{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--paper-2);transition:all .15s ease}
.paper-row .pname{flex:1;font-size:12.5px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.paper-row .ptag{font-size:9px;font-weight:700;letter-spacing:.5px;padding:2px 6px;border-radius:4px;text-transform:uppercase}
.paper-row .ptag.core{background:var(--ink);color:var(--paper)}
.paper-row .ptag.stream{background:var(--blue-soft);color:var(--blue)}
.paper-row .ptag.elective{background:var(--green-soft);color:var(--green)}
.toggle{width:52px;height:30px;border-radius:100px;border:none;background:var(--paper-4);position:relative;flex-shrink:0;transition:background .2s ease;padding:0}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.15);transition:transform .2s ease}
.toggle.on{background:var(--green)}
.toggle.on::after{transform:translateX(22px)}
.toggle.off{background:var(--red-soft)}
.toggle.off::after{transform:translateX(0);background:var(--red)}
.toggle:active{transform:scale(.96)}

/* =================== BULK BAR =================== */
.bulk-bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:none;align-items:center;gap:10px;padding:12px 14px;background:var(--ink);color:var(--paper);border-radius:14px;font-size:13px;flex-wrap:wrap;z-index:150;box-shadow:var(--shadow-lg)}
.bulk-bar.show{display:flex}
.bulk-bar strong{font-weight:700}
.bulk-bar .actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.bulk-bar button{font-size:11.5px;font-weight:600;padding:7px 11px;border-radius:7px;background:rgba(255,255,255,.12);color:var(--paper);border:1px solid rgba(255,255,255,.18);display:inline-flex;align-items:center;gap:5px;transition:background .18s ease;white-space:nowrap}
.bulk-bar button:hover{background:rgba(255,255,255,.22)}
.bulk-bar button svg{width:11px;height:11px}
.bulk-bar button:disabled{opacity:.5;cursor:not-allowed}

/* =================== DRAWER =================== */
.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:400;opacity:0;visibility:hidden;transition:opacity .3s ease,visibility .3s ease;backdrop-filter:blur(2px)}
.drawer-backdrop.open{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;right:0;bottom:0;width:100%;max-width:520px;background:var(--paper);z-index:401;border-left:1px solid var(--line);transform:translateX(102%);transition:transform .45s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.drawer.open{transform:translateX(0)}
.drawer-head{padding:16px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px;flex-shrink:0;padding-top:calc(16px + env(safe-area-inset-top))}
.drawer-head .avatar-lg{width:48px;height:48px;border-radius:12px;overflow:hidden;border:1px solid var(--line);flex-shrink:0;background:var(--paper-3);display:flex;align-items:center;justify-content:center}
.drawer-head .meta{flex:1;min-width:0}
.drawer-head .meta h3{font-size:15px;font-weight:700;letter-spacing:-.2px;margin-bottom:2px;line-height:1.25;overflow:hidden;text-overflow:ellipsis}
.drawer-head .meta .email{font-size:11px;color:var(--muted);font-family:var(--mono);word-break:break-all;line-height:1.35}
.drawer-head .meta .badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.drawer-close{width:34px;height:34px;border-radius:9px;background:var(--paper-3);border:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .18s ease}
.drawer-close svg{width:15px;height:15px}
.drawer-body{flex:1;overflow-y:auto;padding:16px 16px 40px;-webkit-overflow-scrolling:touch}
.section{margin-bottom:22px}
.section-title{font-size:9.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.section-title svg{width:11px;height:11px}
.section-title::after{content:"";flex:1;height:1px;background:var(--line)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.row:last-child{border-bottom:none}
.row .k{color:var(--muted);display:flex;align-items:center;gap:6px;flex-shrink:0;font-size:11.5px}
.row .k svg{width:11px;height:11px}
.row .v{font-weight:600;text-align:right;word-break:break-word;font-variant-numeric:tabular-nums;font-size:12.5px;min-width:0}
.row .v.mono{font-family:var(--mono);letter-spacing:.3px;font-size:11.5px}
.row .v.null{color:var(--muted-3);font-style:italic;font-weight:400}
.barcode-card{border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);padding:14px;text-align:center}
.barcode-card .label{font-size:9.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:10px}
.barcode-card svg{width:100%;height:52px;display:block;margin:0 auto}
.barcode-card .code{font-family:var(--mono);font-size:11px;letter-spacing:1.5px;color:var(--ink);font-weight:700;margin-top:8px;word-break:break-all}
.barcode-card .hint{font-size:10.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.barcode-empty{padding:20px 14px;color:var(--muted);font-size:11.5px;text-align:center;border:1.5px dashed var(--line-2);border-radius:var(--radius)}

.results-table{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.results-table table{width:100%;border-collapse:collapse;font-size:11.5px}
.results-table th,.results-table td{padding:8px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:left}
.results-table th:last-child,.results-table td:last-child{border-right:none}
.results-table th{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--paper-3)}
.results-table td.mono{font-family:var(--mono);font-size:11px}
.results-table td.num{text-align:right;font-variant-numeric:tabular-nums}
.results-table td.score{font-weight:700}
.results-table tr:last-child td{border-bottom:none}
.results-empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:12px;border:1.5px dashed var(--line-2);border-radius:var(--radius);line-height:1.5}
.results-empty strong{color:var(--ink);display:block;margin-bottom:4px;font-size:12.5px}

.actions-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.action-btn{font-size:12px;font-weight:600;padding:11px 11px;border-radius:9px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);display:flex;align-items:center;gap:7px;transition:all .18s ease;text-align:left;text-decoration:none;min-width:0}
.action-btn:hover{border-color:var(--ink);background:var(--paper-3)}
.action-btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.action-btn.danger{color:var(--red);border-color:rgba(179,38,30,.3)}
.action-btn.full{grid-column:1/-1}
.action-btn svg{width:13px;height:13px;flex-shrink:0}
.action-btn:disabled{opacity:.5;cursor:not-allowed}
.action-btn .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.restricted{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:3px 7px;border-radius:100px;background:var(--paper-3);color:var(--muted-2);border:1px solid var(--line)}

.ai-notice svg{width:16px;height:16px;flex-shrink:0;margin-top:2px}
.ai-notice strong{display:block;font-weight:700;margin-bottom:3px;font-size:12.5px;color:#4c1580}

/* =================== TOAST =================== */
.toasts{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:12px;right:12px;z-index:500;display:flex;flex-direction:column;gap:8px;pointer-events:none;align-items:center}
.toast{background:var(--ink);color:var(--paper);padding:12px 16px;border-radius:11px;font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:9px;box-shadow:var(--shadow-lg);width:100%;max-width:420px;animation:toastIn .3s cubic-bezier(.16,1,.3,1) both;pointer-events:auto;line-height:1.4}
.toast svg{width:15px;height:15px;flex-shrink:0}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* =================== MODAL =================== */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:600;display:none;align-items:flex-end;justify-content:center;padding:0;backdrop-filter:blur(3px)}
@media(min-width:520px){.modal-backdrop{align-items:center;padding:20px}}
.modal-backdrop.open{display:flex}
.modal{background:var(--paper);border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:26px 22px calc(22px + env(safe-area-inset-bottom));box-shadow:var(--shadow-lg);animation:modalIn .35s cubic-bezier(.16,1,.3,1) both}

.modal h2{font-size:17px;letter-spacing:-.4px;margin-bottom:8px;font-weight:700;line-height:1.3}
.modal p{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:20px}
.modal .modal-actions{display:flex;gap:8px}
.modal .modal-actions button{flex:1;padding:13px 14px;font-size:13px;font-weight:600;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);transition:all .18s ease}
.modal .modal-actions button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.modal .modal-actions button.danger{background:var(--red);color:var(--paper);border-color:var(--red)}

/* restricted panel */

<script>
/* ---------- LOADER ---------- */
(function(){
  const loader = document.getElementById('loader');
  const start = Date.now();
  const minShow = 650;
  function hide(){
    const elapsed = Date.now() - start;
    const wait = Math.max(0, minShow - elapsed);
    setTimeout(() => {
      loader.classList.add('gone');
      setTimeout(() => loader.remove(), 700);
    }, wait);
  }
  if (document.readyState === 'complete') hide();
  else window.addEventListener('load', hide);
  setTimeout(() => { if (document.body.contains(loader)) loader.classList.add('gone'); }, 3200);
})();

/* ---------- GRIDY ---------- */
function hash32(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function gridy(seed,px){
  px = px || 40;
  const h = hash32(String(seed || 'anon'));
  const rnd = mulberry32(h);
  const hue = h % 360;
  const fg = 'hsl(' + hue + ',58%,38%)';
  const bg = 'hsl(' + hue + ',28%,95%)';
  const N = 5, cell = 100 / N;
  const half = [];
  for (let r = 0; r < N; r++) {
    const row = [];
    for (let c = 0; c < 3; c++) row.push(rnd() > 0.46 ? 1 : 0);
    half.push(row);
  }
  if (!half.some(r => r.some(v => v))) half[2][1] = 1;
  let rects = '';
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const cc = c < 3 ? c : 4 - c;
    if (half[r][cc]) rects += '<rect x="' + (c*cell).toFixed(2) + '" y="' + (r*cell).toFixed(2) + '" width="' + cell.toFixed(2) + '" height="' + cell.toFixed(2) + '"/>';
  }
  return '<svg viewBox="0 0 100 100" width="' + px + '" height="' + px + '" xmlns="http://www.w3.org/2000/svg" style="display:block"><rect width="100" height="100" fill="' + bg + '"/><g fill="' + fg + '">' + rects + '</g></svg>';
}
window.gridy = gridy;

/* ---------- TOASTS ---------- */
window.toast = function(msg, type){
  type = type || 'info';
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const icon = type === 'success' ? 'check-circle' : type === 'error' ? 'alert-triangle' : 'info';
  el.innerHTML = '<i data-lucide="' + icon + '"></i><span>' + String(msg) + '</span>';
  document.getElementById('toasts').appendChild(el);
  if (window.lucide) lucide.createIcons();
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateY(12px)'; el.style.transition = 'all .3s'; setTimeout(() => el.remove(), 320); }, 3200);
};

/* ---------- MODAL ---------- */
window.confirmModal = function(opts){
  return new Promise(resolve => {
    const backdrop = document.getElementById('modalBackdrop');
    const title = document.getElementById('modalTitle');
    const msg = document.getElementById('modalMsg');
    const cancel = document.getElementById('modalCancel');
    const confirm = document.getElementById('modalConfirm');
    title.textContent = opts.title || 'Confirm';
    msg.textContent = opts.message || 'Are you sure?';
    confirm.textContent = opts.confirmText || 'Confirm';
    confirm.className = opts.danger ? 'danger' : 'primary';
    function cleanup(){ backdrop.classList.remove('open'); cancel.removeEventListener('click', onCancel); confirm.removeEventListener('click', onConfirm); }
    function onCancel(){ cleanup(); resolve(false); }
    function onConfirm(){ cleanup(); resolve(true); }
    cancel.addEventListener('click', onCancel);
    confirm.addEventListener('click', onConfirm);
    backdrop.classList.add('open');
  });
};
</script>

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDateTime(ts){
  if (!ts) return '—';
  try {
    const d = ts.toDate ? ts.toDate() : (ts.seconds ? new Date(ts.seconds * 1000) : new Date(ts));
    return d.toLocaleString('en-ZA', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  } catch { return '—'; }
}
function fmtDate(ts){
  if (!ts) return '—';
  try {
    const d = ts.toDate ? ts.toDate() : (ts.seconds ? new Date(ts.seconds * 1000) : new Date(ts));
    return d.toLocaleDateString('en-ZA', { day: '2-digit', month: 'short', year: 'numeric' });
  } catch { return '—'; }
}
function makeReferenceId(uid){
  const CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const h = hash32(String(uid));
  let n = h, code = '';
  for (let i = 0; i < 6; i++) { code += CHARS[n % CHARS.length]; n = Math.floor(n / CHARS.length) || (n ^ (i * 2654435761)); }
  return 'IFB-2027-' + code;
}
function statusOf(u){
  if (u.status === 'revoked') return { key: 'revoked', label: 'Revoked', icon: 'circle-x' };
  if (u.status === 'approved' && u.studentNumber) return { key: 'approved', label: 'Approved', icon: 'circle-check' };
  if (u.course) return { key: 'curriculum', label: 'Curriculum', icon: 'layout-grid' };
  if (u.preludePassed) return { key: 'prelude', label: 'Prelude verified', icon: 'shield-check' };
  return { key: 'pending', label: 'Pending', icon: 'clock' };
}
function durationLabel(d){ return d ? d + ' mo' : null; }
function streamLabel(c){
  const map = { fullstack:'Full Stack', frontend:'Frontend', backend:'Backend', mobile:'Mobile', webdesign:'Web Design', uiux:'UI/UX', data:'Data', stem:'STEM' };
  return map[c] || c;
}

async function loadUsers(){
  const snap = await getDocs(query(collection(db, 'users'), orderBy('createdAt', 'desc')));
  const list = [];
  const fixes = [];
  snap.forEach(d => {
    const data = d.data();
    if (data.email === ADMIN_EMAIL) return;
    const u = { id: d.id, ...data };
    list.push(u);
    if (!u.referenceId) {
      const referenceId = makeReferenceId(u.id);
      u.referenceId = referenceId;
      fixes.push({ id: u.id, referenceId });
    }
  });
  state.users = list;
  fixes.forEach(f => updateDoc(doc(db, 'users', f.id), { referenceId: f.referenceId, updatedAt: serverTimestamp() }).catch(() => {}));
  if (fixes.length) window.toast(fixes.length + ' Reference ID(s) issued.', 'success');
  applyFilter();
}

function matchesFilter(u, f){
  if (f === 'all') return true;
  const s = statusOf(u).key;
  if (f === 'pending') return s === 'pending';
  if (f === 'prelude') return s === 'prelude';
  if (f === 'curriculum') return s === 'curriculum';
  if (f === 'approved') return s === 'approved';
  if (f === 'revoked') return s === 'revoked';
  if (f === 'noNumber') return u.preludePassed && !u.studentNumber;
  if (f === 'noStream') return u.preludePassed && !u.course;
  return true;
}
function matchesSearch(u, q){
  if (!q) return true;
  const hay = [u.name, u.email, u.referenceId, u.studentNumber, u.examinationNumber, u.course, u.curriculum].filter(Boolean).join(' ').toLowerCase();
  return hay.includes(q.toLowerCase());
}
function applyFilter(){
  state.filtered = state.users.filter(u => matchesFilter(u, state.filter) && matchesSearch(u, state.search));
  renderBody();
}

          <div class="kv"><div class="k">Student №</div><div class="v">${u.studentNumber ? esc(u.studentNumber) : '<span class="null">Not assigned</span>'}</div></div>
          <div class="kv"><div class="k">Prelude</div><div class="v">${u.preludePassed ? (u.preludeScore != null ? 'Verified · ' + u.preludeScore + '%' : 'Verified') : '<span class="null">Pending</span>'}</div></div>
          <div class="kv"><div class="k">Registered</div><div class="v">${u.createdAt ? fmtDate(u.createdAt) : '—'}</div></div>
        </div>
        <div class="footer">
          <label class="cb" onclick="event.stopPropagation()">
            <input type="checkbox" class="row-cb" data-id="${esc(u.id)}" ${sel ? 'checked' : ''}>
            <span>Select</span>
          </label>
          <span class="open">Open <i data-lucide="chevron-right"></i></span>
        </div>
      </article>`;
  }).join('');

  if (window.lucide) lucide.createIcons();

  wrap.querySelectorAll('.cand-card').forEach(card => {
    card.addEventListener('click', e => {
      if (e.target.closest('input[type="checkbox"]') || e.target.closest('label.cb')) return;
      openDrawer(card.dataset.id);
    });
  });
  wrap.querySelectorAll('.row-cb').forEach(cb => {
    cb.addEventListener('change', e => {
      e.stopPropagation();
      const id = cb.dataset.id;
      if (cb.checked) state.selected.add(id); else state.selected.delete(id);
      const card = cb.closest('.cand-card');
      if (card) card.classList.toggle('selected', cb.checked);
      renderBulkBar();
    });
  });
}

function renderBulkBar(){
  let bar = document.getElementById('bulkBar');
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'bulkBar'; bar.className = 'bulk-bar';
    document.body.appendChild(bar);
  }
  const n = state.selected.size;
  bar.classList.toggle('show', n > 0);
  if (n > 0) {
    bar.innerHTML = `
      <span><strong>${n}</strong> selected</span>
      <div class="actions">
        <button id="bulkAssignBtn"><i data-lucide="hash"></i> №</button>
        <button id="bulkApproveBtn"><i data-lucide="circle-check"></i> Approve</button>
        <button id="bulkClearBtn"><i data-lucide="x"></i> Clear</button>
      </div>`;
    if (window.lucide) lucide.createIcons();
    document.getElementById('bulkAssignBtn').addEventListener('click', bulkAssignNumbers);
    document.getElementById('bulkApproveBtn').addEventListener('click', bulkApprove);
    document.getElementById('bulkClearBtn').addEventListener('click', () => { state.selected.clear(); renderCardList(); renderBulkBar(); });
  }
}

function renderAccess(){
  const eligible = state.filtered.filter(u => u.preludePassed && u.course);

  main.innerHTML = `
    <div class="admin-head">
      <div class="eyebrow"><i data-lucide="key-round"></i> Paper access</div>
      <h1>Access</h1>
      <p>Grant or revoke access to each paper. DeepSeek AI regulates and quality-assures all IFB examinations — access here only controls who can sit what.</p>
    </div>

    <div class="tabs">
      <button class="tab" data-tab="candidates"><i data-lucide="users"></i> Candidates</button>
      <button class="tab active" data-tab="access"><i data-lucide="key-round"></i> Paper access</button>
    </div>

    <div class="toolbar">
      <div class="search">
        <i data-lucide="search"></i>
        <input type="text" id="searchInput" placeholder="Search candidate…" value="${esc(state.search)}" autocomplete="off">
      </div>
    </div>

    <div class="access-list" id="accessList"></div>
  `;
  if (window.lucide) lucide.createIcons();

  document.getElementById('searchInput').addEventListener('input', e => {
    state.search = e.target.value;
    state.filtered = state.users.filter(u => matchesFilter(u, state.filter) && matchesSearch(u, state.search));
    renderAccess();
  });
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    state.tab = t.dataset.tab; state.selected.clear(); renderBody();
  }));

  const wrap = document.getElementById('accessList');
  if (!eligible.length) {
    wrap.innerHTML = `
      <div class="empty">
        <div class="icon"><i data-lucide="key-round"></i></div>
        <h3>No eligible candidates</h3>
        <p>Candidates appear once DeepSeek AI has verified their Prelude and they have set a curriculum.</p>
      </div>`;
    if (window.lucide) lucide.createIcons();
    return;
  }

  wrap.innerHTML = eligible.map(u => {
    const access = (u.paperAccess && typeof u.paperAccess === 'object') ? u.paperAccess : {};
    const core = SUBJECTS_BY_STREAM[u.course] || [];
    const electives = Array.isArray(u.electives) ? u.electives : [];
    const papers = [
      ...core.map((n, i) => ({ name: n, kind: i === 3 ? 'stream' : 'core' })),
      ...electives.map(n => ({ name: n, kind: 'elective' })),
    ];
    return `
      <article class="access-card" data-uid="${esc(u.id)}">
        <div class="head">
          <div class="avatar">${gridy(u.id, 36)}</div>
          <div class="id">
            <div class="name">${esc(u.name || u.email)}</div>
            <div class="sub">${esc(u.studentNumber || u.referenceId || u.email)}</div>
          </div>
        </div>
        <div class="papers">
          ${papers.map(p => {
            const v = access[p.name];
            const on = v === true;
            const off = v === false;
            const cls = on ? 'on' : off ? 'off' : '';
            return `
              <div class="paper-row">
                <span class="pname">${esc(p.name)}</span>
                <span class="ptag ${p.kind}">${p.kind}</span>
                <button class="toggle ${cls}" data-uid="${esc(u.id)}" data-subject="${esc(p.name)}" aria-label="Toggle access"></button>
              </div>`;
          }).join('')}
        </div>
      </article>`;
  }).join('');

  if (window.lucide) lucide.createIcons();

  wrap.querySelectorAll('.toggle').forEach(btn => {
    btn.addEventListener('click', async () => {
      const uid = btn.dataset.uid;
      const subject = btn.dataset.subject;
      const user = state.users.find(x => x.id === uid);
      if (!user) return;
      const access = { ...(user.paperAccess || {}) };
      const now = access[subject];
      if (now === undefined) access[subject] = true;
      else if (now === true) access[subject] = false;
      else delete access[subject];
      user.paperAccess = access;
      try {
        await updateDoc(doc(db, 'users', uid), { paperAccess: access, updatedAt: serverTimestamp() });
        const label = access[subject] === true ? 'granted' : access[subject] === false ? 'revoked' : 'cleared';
        window.toast(subject + ': ' + label, 'success');
      } catch (e) {
        window.toast('Error saving.', 'error');
      }
      renderAccess();
    });
  });
}

/* =================== DRAWER =================== */
function openDrawer(id){
  const user = state.users.find(u => u.id === id);
  if (!user) return;
  state.current = user;
  renderDrawer(user);
  document.getElementById('drawerBackdrop').classList.add('open');
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawer').setAttribute('aria-hidden', 'false');
}
function closeDrawer(){
  document.getElementById('drawerBackdrop').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawer').setAttribute('aria-hidden', 'true');
  state.current = null;
}
document.getElementById('drawerClose').addEventListener('click', closeDrawer);
document.getElementById('drawerBackdrop').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

async function handleAction(action, u){
  try {
    if (action === 'assignNumber') {
      const ok = await window.confirmModal({
        title: 'Assign Student Number?',
        message: 'A permanent Student Number, Examination Number and PIN will be generated for ' + (u.name || u.email) + '.',
        confirmText: 'Assign'
      });
      if (!ok) return;
      await assignNumbersTo([u]);
      window.toast('Student Number assigned.', 'success');
      await refreshAndReopen(u.id);
      return;
    }
    if (action === 'approve') {
      await updateDoc(doc(db, 'users', u.id), { status: 'approved', approvedAt: serverTimestamp(), updatedAt: serverTimestamp() });
      window.toast('Candidate approved.', 'success');
      await refreshAndReopen(u.id);
      return;
    }
    if (action === 'revoke') {
      const ok = await window.confirmModal({
        title: 'Revoke candidate?',
        message: 'Mark ' + (u.name || u.email) + ' as revoked. They will not be able to sit exams.',
        confirmText: 'Revoke', danger: true
      });
      if (!ok) return;
      await updateDoc(doc(db, 'users', u.id), { status: 'revoked', revokedAt: serverTimestamp(), updatedAt: serverTimestamp() });
      window.toast('Candidate revoked.', 'success');
      await refreshAndReopen(u.id);
      return;
    }
    if (action === 'shareResults') {
      const results = Array.isArray(u.results) ? u.results : [];
      if (!results.length) { window.toast('No results to share.', 'error'); return; }
      const ok = await window.confirmModal({
        title: 'Share all results?',
        message: 'All ' + results.length + ' result(s) will be marked as shared with ' + (u.name || u.email) + '.',
        confirmText: 'Share'
      });
      if (!ok) return;
      const updated = results.map(r => ({ ...r, shared: true, sharedAt: new Date().toISOString() }));
      await updateDoc(doc(db, 'users', u.id), { results: updated, resultsSharedAt: serverTimestamp(), updatedAt: serverTimestamp() });
      window.toast('Results shared.', 'success');
      await refreshAndReopen(u.id);
      return;
    }
    if (action === 'viewPublic') {
      window.open('profile.html?uid=' + u.id, '_blank');
      return;
    }
  } catch (err) {
    window.toast('Error: ' + err.message, 'error');
  }
}

async function assignNumbersTo(users){
  const counterRef = doc(db, 'counters', 'students');
  await runTransaction(db, async tx => {
    const snap = await tx.get(counterRef);
    let next = (snap.exists() && snap.data().lastNumber) ? snap.data().lastNumber : 0;
    for (const u of users) {
      next++;
      const studentNum = 'IFB-2027-' + String(next).padStart(5, '0');
      const examNum = '27' + String(next).padStart(5, '0') + '01';
      const pin = String(Math.floor(1000 + Math.random() * 9000));
      tx.update(doc(db, 'users', u.id), {
        studentNumber: studentNum,
        examinationNumber: examNum,
        examPin: pin,
        status: 'approved',
        approvedAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      });
    }
    tx.set(counterRef, { lastNumber: next }, { merge: true });
  });
}

async function bulkAssignNumbers(){
  const users = state.users.filter(u => state.selected.has(u.id) && u.preludePassed && !u.studentNumber);
  if (!users.length) { window.toast('No eligible selected (must be Prelude-verified and lack a Student №).', 'error'); return; }
  const ok = await window.confirmModal({
    title: 'Assign Student Numbers?',
    message: users.length + ' candidate(s) will receive Student Numbers, Examination Numbers and PINs.',
    confirmText: 'Assign ' + users.length
  });
  if (!ok) return;
  try {
    await assignNumbersTo(users);
    state.selected.clear();
    window.toast(users.length + ' assigned.', 'success');
    await loadUsers();
  } catch (e) { window.toast('Error: ' + e.message, 'error'); }
}

async function bulkApprove(){
  const users = state.users.filter(u => state.selected.has(u.id) && u.status !== 'approved' && u.studentNumber);
  if (!users.length) { window.toast('No candidates to approve.', 'error'); return; }
  const ok = await window.confirmModal({ title: 'Approve ' + users.length + ' candidate(s)?', confirmText: 'Approve' });
  if (!ok) return;
  try {
    for (const u of users) {
      await updateDoc(doc(db, 'users', u.id), { status: 'approved', approvedAt: serverTimestamp(), updatedAt: serverTimestamp() });
    }
    state.selected.clear();
    window.toast(users.length + ' approved.', 'success');
    await loadUsers();
  } catch (e) { window.toast('Error: ' + e.message, 'error'); }
}

function exportCSV(){
  const rows = state.filtered;
  if (!rows.length) { window.toast('Nothing to export.', 'error'); return; }
  const headers = ['Name','Email','Reference ID','Student Number','Exam Number','PIN','Prelude Passed','Prelude Score','Duration','Stream','Electives','Status','Registered'];
  const csv = [headers.join(',')].concat(rows.map(u => [
    u.name || '', u.email || '', u.referenceId || '', u.studentNumber || '', u.examinationNumber || '', u.examPin || '',
    u.preludePassed ? 'Yes' : 'No', u.preludeScore != null ? u.preludeScore : '',
    u.duration || '', u.course || '', (u.electives || []).join(' | '), u.status || 'pending',
    u.createdAt ? fmtDate(u.createdAt) : ''
  ].map(v => '"' + String(v).replace(/"/g, '""') + '"').join(','))).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'ifb-candidates-' + new Date().toISOString().slice(0, 10) + '.csv'; a.click();
  URL.revokeObjectURL(url);
  window.toast('Exported ' + rows.length + '.', 'success');
}

async function refreshAndReopen(id){
  await loadUsers();
  if (state.users.find(u => u.id === id)) openDrawer(id);
  else closeDrawer();
}

document.getElementById('signOutBtn').addEventListener('click', async () => {
  const ok = await window.confirmModal({ title: 'Sign out?', message: 'You will be returned to the site.', confirmText: 'Sign out' });
  if (!ok) return;
  await signOut(auth);
  window.location.href = 'index.html';
});

function renderDenied(reason){
  main.innerHTML = `
    <div class="denied">
      <div class="icon"><i data-lucide="lock"></i></div>
      <h1>Access denied</h1>
      <p>${esc(reason || 'You are not signed in as an administrator.')}</p>
      <div class="actions">
        <a href="auth.html" class="nav-btn" style="padding:11px 16px;font-size:13px;"><i data-lucide="log-in"></i> Sign in</a>
        <a href="index.html" class="nav-btn" style="padding:11px 16px;font-size:13px;"><i data-lucide="arrow-left"></i> Home</a>
      </div>
    </div>`;
  if (window.lucide) lucide.createIcons();
}

onAuthStateChanged(auth, async (user) => {
  if (!user) { renderDenied('You are not signed in.'); return; }
  if (user.email !== ADMIN_EMAIL) {
    renderDenied('Signed in as ' + user.email + ', but this account does not have administrator access.');
    return;
  }
  try { await loadUsers(); }
  catch (err) {
    main.innerHTML = `
      <div class="denied">
        <div class="icon"><i data-lucide="alert-triangle"></i></div>
        <h1>Could not load candidates</h1>
        <p>${esc(err.message || 'Unknown error')}</p>
        <div class="actions">
          <button class="nav-btn" onclick="location.reload()" style="padding:11px 16px;font-size:13px;"><i data-lucide="refresh-cw"></i> Retry</button>
        </div>
      </div>`;
    if (window.lucide) lucide.createIcons();
  }
});
