<!DOCTYPE html>
<html lang="en">
<head>

<title>Privacy Policy</title>
<link rel="manifest" href="/manifest.json">

<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/service-worker.js').catch(()=>{});}</script>
<style>
:root{--black:#0d0d0d;--white:#fff;--grey:#6b6b6b;--light:#f5f5f5;--line:#e5e5e5}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--light);color:var(--black);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;line-height:1.6}
.card{max-width:520px;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:48px 36px;text-align:center}
.badge{width:110px;height:165px;margin:0 auto 20px;display:block}
h1{font-size:26px;letter-spacing:-1px;margin-bottom:12px}
p{font-size:14.5px;color:var(--grey);margin-bottom:8px}
.note{font-size:12px;color:var(--grey);margin-top:16px;line-height:1.6}
a{display:inline-flex;align-items:center;gap:8px;margin-top:20px;padding:12px 22px;border-radius:10px;border:1.5px solid var(--black);background:var(--black);color:var(--white);text-decoration:none;font-weight:600;font-size:14px}
a:hover{background:#333}
</style>
</head>
<body>
<div class="card">
  <svg class="badge" viewBox="0 0 240 360" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="pg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5d76e"/><stop offset="0.5" stop-color="#d4af37"/><stop offset="1" stop-color="#8f6b1a"/></linearGradient>

      <linearGradient id="ps1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f6f9"/><stop offset="1" stop-color="#a8b0bd"/></linearGradient>
    </defs>
    <path d="M 120 8 L 228 48 L 228 200 Q 228 310 120 348 Q 12 310 12 200 L 12 48 Z" fill="url(#pg1)"/>
    <path d="M 120 22 L 214 58 L 214 198 Q 214 300 120 334 Q 26 300 26 198 L 26 58 Z" fill="url(#pr1)"/>
    <path d="M 120 36 L 200 68 L 200 196 Q 200 290 120 320 Q 40 290 40 196 L 40 68 Z" fill="none" stroke="url(#ps1)" stroke-width="2.5"/>
    <path d="M 100 108 L 120 138 L 140 108" fill="none" stroke="url(#pg1)" stroke-width="4.5" stroke-linecap="square"/>
    <path d="M 66 190 Q 93 179 120 187 L 120 218 Q 93 210 66 221 Z" fill="url(#ps1)" stroke="#0f1f5c" stroke-width="1"/>
    <path d="M 174 190 Q 147 179 120 187 L 120 218 Q 147 210 174 221 Z" fill="url(#ps1)" stroke="#0f1f5c" stroke-width="1"/>
    <g transform="translate(120,262)">
      <circle cx="0" cy="0" r="16" fill="url(#ps1)" stroke="#0f1f5c" stroke-width="1"/>
      <ellipse cx="0" cy="0" rx="28" ry="9" fill="none" stroke="url(#pg1)" stroke-width="2" transform="rotate(-20)"/>
    </g>
    <path d="M 28 308 L 212 308 L 212 334 Q 120 350 28 334 Z" fill="url(#pg1)" stroke="#0f1f5c" stroke-width="1.5"/>
  </svg>
  <h1>Privacy Policy</h1>
  <p>Coming soon.</p>

</div>
