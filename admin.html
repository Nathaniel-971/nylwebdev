<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Applications</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --black:#0d0d0d; --white:#fff; --grey:#6b6b6b; --light:#f5f5f5; --line:#e5e5e5; --mid:#333; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--light); color: var(--black); line-height:1.5; padding:28px 18px; }
  .container { max-width:1400px; margin:0 auto; }
  .emblem { width:44px; height:44px; }
  .header-row { display:flex; align-items:center; gap:16px; margin-bottom:22px; }
  .header-row .brand-name { font-family:'Courier New',monospace; font-size:22px; font-weight:700; letter-spacing:-1px; line-height:1; }
  .header-row .brand-sub { font-size:9.5px; letter-spacing:2px; color:var(--grey); text-transform:uppercase; margin-top:3px; }
  h1 { font-size:24px; letter-spacing:-1px; margin-bottom:4px; }
  .sub { color: var(--grey); font-size:13.5px; margin-bottom:22px; }
  .logout { float:right; font-size:13.5px; color: var(--grey); text-decoration:none; padding:8px 12px; border-radius:8px; display:inline-flex; align-items:center; gap:6px; font-weight:500; }
  .logout svg { width:15px; height:15px; }
  .logout:hover { color: var(--black); background: var(--line); }
  .stats { display:grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap:12px; margin-bottom:20px; }
  .stat { background: var(--white); border:1px solid var(--line); border-radius:12px; padding:18px; }
  .stat .label { font-size:10.5px; letter-spacing:1.5px; text-transform:uppercase; color: var(--grey); margin-bottom:6px; font-weight:600; display:flex; align-items:center; gap:6px; }
  .stat .value { font-size:26px; font-weight:700; letter-spacing:-1px; }
  .toolbar { display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
  .toolbar input { flex:1; min-width:200px; padding:11px 14px; font-size:13.5px; border:1.5px solid var(--line); border-radius:10px; background: var(--white); font-family:inherit; color: var(--black); }
  .toolbar input:focus { outline:none; border-color: var(--black); }
  .toolbar button { padding:11px 16px; font-size:13px; font-weight:600; border-radius:10px; border:1.5px solid var(--line); background: var(--white); color: var(--black); cursor:pointer; font-family:inherit; display:inline-flex; align-items:center; gap:7px; transition: all .2s; }
  .toolbar button.primary { background: var(--black); color: var(--white); border-color: var(--black); }
  .toolbar button.primary:hover { background: var(--mid); }
  .table-wrap { background: var(--white); border:1px solid var(--line); border-radius:12px; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; min-width:1100px; }
  th, td { text-align:left; padding:12px 14px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { font-size:10.5px; letter-spacing:1.5px; text-transform:uppercase; color: var(--grey); font-weight:600; background: var(--light); position:sticky; top:0; }
  tr:last-child td { border-bottom:none; }
  tr:hover td { background: var(--light); }
  .badge { display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:600; padding:3px 9px; border-radius:100px; }
  .badge.pending { background:#fff4e5; color:#b86e00; }
  .badge.approved { background:#e6f5ec; color:#16794a; }
  .badge.revoked { background:#fef2f2; color:#b91c1c; }
  .badge.deregistered { background: var(--line); color: var(--grey); }
  .chip { display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:1px; padding:3px 8px; border-radius:6px; background: var(--black); color: var(--white); }
  .chip.none { background: var(--line); color: var(--grey); }
  .loading, .access-denied { padding:60px 20px; text-align:center; color: var(--grey); }
  .access-denied h2 { color: var(--black); margin-bottom:10px; }
  @media print { body { padding:0; background: var(--white); } .toolbar, .logout, .no-print { display:none !important; } .table-wrap { border:none; } table { min-width:0; font-size:10pt; } th, td { padding:6px 8px; } @page { size: A4 landscape; margin: 12mm; } }
</style>
</head>
<body>
<div class="container" id="app"><div class="loading">Checking access…</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, query, orderBy, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyA6HO7n6wCZEeCgKxJLjB-MjL0ZFGR7svU", authDomain: "nyldevcourses.firebaseapp.com", projectId: "nyldevcourses", storageBucket: "nyldevcourses.firebasestorage.app", messagingSenderId: "16687006873", appId: "1:16687006873:web:b7d66ad1024ccd92722408" };
const ADMIN_EMAIL = "n1nathaniel971@gmail.com";
const INTAKE = "2601";
const COUNTER = "intake_" + INTAKE;

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const appEl = document.getElementById('app');

onAuthStateChanged(auth, (user) => {
  if (!user) { appEl.innerHTML = `<div class="access-denied"><h2>Not signed in</h2><p style="margin-top:18px;"><a href="auth.html">Sign in →</a></p></div>`; return; }
  if (user.email !== ADMIN_EMAIL) { appEl.innerHTML = `<div class="access-denied"><h2>Access denied</h2><p style="margin-top:18px;"><a href="/">← Back to site</a></p></div>`; return; }
  render(user);
});

let rows = [];

function render(user) {
  appEl.innerHTML = `
    <a href="#" class="logout" id="logout"><i data-lucide="log-out"></i> Sign out</a>
    <div class="header-row">
      <svg class="emblem" viewBox="0 0 120 120"><circle cx="60" cy="60" r="58" fill="none" stroke="#0d0d0d" stroke-width="2.5"/><circle cx="60" cy="60" r="52" fill="none" stroke="#0d0d0d" stroke-width="1"/><circle cx="60" cy="60" r="48" fill="#0d0d0d"/><path d="M40 44 L60 78 L80 44" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="square"/><rect x="66" y="44" width="8" height="6" fill="#fff"/></svg>
      <div>
        <div class="brand-name">Nyl Dev</div>
        <div class="brand-sub">Admin Panel</div>
      </div>
    </div>
    <h1>Applications</h1>
    <p class="sub">Intake ${INTAKE} · 2027 · Signed in as ${user.email}</p>

    <div class="stats">
      <div class="stat"><div class="label"><i data-lucide="users"></i> Total</div><div class="value" id="cTotal">—</div></div>
      <div class="stat"><div class="label"><i data-lucide="clock"></i> Pending</div><div class="value" id="cPending">—</div></div>
      <div class="stat"><div class="label"><i data-lucide="circle-check"></i> Approved</div><div class="value" id="cApproved">—</div></div>
      <div class="stat"><div class="label"><i data-lucide="ban"></i> Revoked</div><div class="value" id="cRevoked">—</div></div>
    </div>

    <div class="toolbar no-print">
      <input type="text" id="search" placeholder="Search by email, student number, stream, or curriculum…">
      <button class="primary" id="refresh"><i data-lucide="refresh-cw"></i> Refresh</button>
      <button class="primary" id="assignNumbersBtn"><i data-lucide="hash"></i> Assign Sequential Numbers</button>
      <button onclick="window.print()"><i data-lucide="download"></i> Download A4 PDF</button>
    </div>

    <div class="table-wrap" id="tableWrap"><div class="loading">Loading applications…</div></div>
  `;
  if (window.lucide) lucide.createIcons();
  document.getElementById('logout').addEventListener('click', async (e) => { e.preventDefault(); await signOut(auth); window.location.href = '/'; });
  document.getElementById('refresh').addEventListener('click', load);
  document.getElementById('assignNumbersBtn').addEventListener('click', assignNumbers);
  document.getElementById('search').addEventListener('input', (e) => filterTable(e.target.value));
  load();
}

async function load() {
  const wrap = document.getElementById('tableWrap');
  wrap.innerHTML = `<div class="loading">Loading applications…</div>`;
  try {
    const q = query(collection(db, 'users'), orderBy('createdAt', 'desc'));
    const snap = await getDocs(q);
    rows = [];
    snap.forEach(d => {
      const data = d.data();
      if (data.email === ADMIN_EMAIL) return;
      rows.push({ id: d.id, ...data });
    });
    updateStats();
    renderTable(rows);
  } catch (err) { wrap.innerHTML = `<div class="loading">Error: ${err.message}</div>`; }
}

function updateStats() {
  document.getElementById('cTotal').textContent = rows.length;
  document.getElementById('cPending').textContent = rows.filter(r => (r.status || 'pending') === 'pending').length;
  document.getElementById('cApproved').textContent = rows.filter(r => r.status === 'approved').length;
  document.getElementById('cRevoked').textContent = rows.filter(r => r.status === 'revoked' || r.status === 'deregistered').length;
}

function renderTable(list) {
  const wrap = document.getElementById('tableWrap');
  if (!list.length) { wrap.innerHTML = `<div class="loading">No applications yet.</div>`; return; }
  wrap.innerHTML = `
    <table>
      <thead><tr>
        <th>#</th><th>Email</th><th>Programme</th><th>Stream</th><th>Electives</th><th>Student №</th><th>Exam №</th><th>Status</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  `;
  const tbody = document.getElementById('tbody');
  list.forEach((r, i) => {
    const status = r.status || 'pending';
    const hasCourse = !!r.course;
    const curriculumLabel = r.curriculum || (r.duration === '6' ? 'IPI' : r.duration === '12' ? 'ACC' : null);
    const electives = (r.electives || []).join(', ') || '—';
    const statusIcon = status === 'approved' ? 'circle-check' : status === 'revoked' ? 'circle-x' : status === 'deregistered' ? 'trash-2' : 'clock';
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${i + 1}</td>
      <td>${esc(r.email || '—')}</td>
      <td>${curriculumLabel ? `<span class="chip">${esc(curriculumLabel)}</span>` : `<span class="chip none">—</span>`}</td>
      <td>${esc(r.course || '—')}</td>
      <td>${esc(electives)}</td>
      <td>${esc(r.studentNumber || '—')}</td>
      <td>${esc(r.examinationNumber || '—')}</td>
      <td><span class="badge ${hasCourse ? status : 'pending'}"><i data-lucide="${hasCourse ? statusIcon : 'circle-dashed'}"></i> ${hasCourse ? status : 'no course'}</span></td>
    `;
    tbody.appendChild(tr);
  });
  if (window.lucide) lucide.createIcons();
}

function filterTable(term) {
  const q = term.toLowerCase().trim();
  if (!q) { renderTable(rows); return; }
  renderTable(rows.filter(r =>
    (r.email || '').toLowerCase().includes(q) ||
    (r.studentNumber || '').includes(q) ||
    (r.course || '').toLowerCase().includes(q) ||
    (r.curriculum || '').toLowerCase().includes(q)
  ));
}

async function assignNumbers() {
  if (!confirm('Assign sequential student numbers for all pending applications?')) return;
  const pendingRows = rows.filter(r => !r.studentNumber && r.status === 'pending' && r.course);
  if (!pendingRows.length) { alert('No pending applications with a course selected.'); return; }

  try {
    const counterRef = doc(db, 'counters', COUNTER);
    let nextNumber = 0;
    await runTransaction(db, async (tx) => {
      const s = await tx.get(counterRef);
      let last = s.exists() ? (s.data().lastNumber || 0) : 0;
      nextNumber = last + 1;
      for (const row of pendingRows) {
        const studentNum = INTAKE + String(nextNumber).padStart(4, '0');
        const examNum = "27" + INTAKE + String(nextNumber).padStart(4, '0') + "01";
        const userRef = doc(db, 'users', row.id);
        tx.update(userRef, { studentNumber: studentNum, examinationNumber: examNum, status: 'approved', approvedAt: serverTimestamp() });
        nextNumber++;
      }
      tx.set(counterRef, { lastNumber: nextNumber - 1 }, { merge: true });
    });
    alert(`Assigned ${pendingRows.length} student numbers.`);
    load();
  } catch (err) { alert('Error: ' + err.message); }
}
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
if (window.lucide) lucide.createIcons();
</script>
</body>
</html>
