<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administration · ∆ IFB Institute</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b0b0b">
<meta name="robots" content="noindex, nofollow">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
/* =================== THEME =================== */
:root{
  --ink:#0b0b0b;--ink-2:#1c1c1c;--ink-3:#2b2b2b;
  --paper:#ffffff;--paper-2:#fafafa;--paper-3:#f4f4f4;--paper-4:#ebebeb;
  --line:#e7e7e7;--line-2:#d6d6d6;
  --muted:#6f6f6f;--muted-2:#909090;--muted-3:#b4b4b4;
  --gold:#b58a2b;--gold-soft:#fbf4e0;
  --blue:#2f4ba8;--blue-soft:#eef2ff;
  --green:#0a7d4f;--green-soft:#e8f5ec;
  --red:#b3261e;--red-soft:#fdefec;
  --orange:#b46300;--orange-soft:#fdf1e0;
  --radius:14px;--radius-lg:20px;--radius-xl:26px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 10px 28px rgba(0,0,0,.06);
  --shadow-lg:0 26px 70px rgba(0,0,0,.10);
  --shadow-xl:0 40px 90px rgba(0,0,0,.18);
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper-2);color:var(--ink);
  font-family:var(--font);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
::selection{background:var(--ink);color:var(--paper)}
button{font-family:inherit;cursor:pointer}
a{color:inherit}

/* =================== LOADER =================== */
.loader{position:fixed;inset:0;z-index:9999;background:var(--ink);color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;transition:opacity .6s ease,visibility .6s ease}
.loader.gone{opacity:0;visibility:hidden;pointer-events:none}
.loader-mark{font-size:100px;font-weight:600;line-height:1;letter-spacing:-3px;animation:breathe 1.7s ease-in-out infinite}
.loader-label{font-size:11.5px;letter-spacing:4px;text-transform:uppercase;color:rgba(255,255,255,.5);font-weight:600}
.loader-bar{width:220px;height:2px;background:rgba(255,255,255,.14);border-radius:2px;overflow:hidden;margin-top:4px}
.loader-bar span{display:block;height:100%;width:36%;background:var(--paper);border-radius:2px;animation:loaderSlide 1.35s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.7;transform:scale(.94)}50%{opacity:1;transform:scale(1)}}
@keyframes loaderSlide{0%{transform:translateX(-130%)}100%{transform:translateX(380%)}}

/* =================== NAV =================== */
nav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.96);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid var(--line)}
.nav-inner{max-width:1500px;margin:0 auto;padding:14px 32px;display:flex;justify-content:space-between;align-items:center;gap:14px}
@media(max-width:760px){.nav-inner{padding:12px 20px}}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink)}
.brand-mark{font-size:40px;font-weight:600;line-height:.9;letter-spacing:-2.5px}
.brand-text{display:flex;flex-direction:column;line-height:1.05}
.brand-name{font-size:13.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase}
.brand-sub{font-size:10.5px;color:var(--muted);letter-spacing:1.6px;text-transform:uppercase;margin-top:3px}
@media(max-width:620px){.brand-text{display:none}}
.nav-right{display:flex;align-items:center;gap:8px}
.nav-chip{
  display:inline-flex;align-items:center;gap:7px;
  font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;
  padding:7px 12px;border-radius:100px;background:var(--ink);color:var(--paper);
}
.nav-chip svg{width:12px;height:12px}
.nav-btn{
  font-size:13.5px;font-weight:600;color:var(--ink);background:var(--paper);
  text-decoration:none;padding:9px 15px;border-radius:9px;
  display:inline-flex;align-items:center;gap:7px;
  border:1px solid var(--line);transition:all .18s ease;
}
.nav-btn:hover{border-color:var(--ink);background:var(--paper-3)}
.nav-btn svg{width:14px;height:14px}

/* =================== LAYOUT =================== */
.shell{max-width:1500px;margin:0 auto;padding:0 32px}
@media(max-width:760px){.shell{padding:0 20px}}

/* =================== ACCESS DENIED =================== */
.denied{
  max-width:520px;margin:96px auto;text-align:center;
  background:var(--paper);border:1px solid var(--line);
  border-radius:var(--radius-xl);padding:48px 40px;box-shadow:var(--shadow-sm);
}
.denied .icon{
  width:72px;height:72px;border-radius:50%;background:var(--red-soft);
  border:1px solid rgba(179,38,30,.2);display:flex;align-items:center;justify-content:center;
  margin:0 auto 22px;
}
.denied .icon svg{width:30px;height:30px;color:var(--red)}
.denied h1{font-size:24px;letter-spacing:-.8px;margin-bottom:10px;font-weight:700}
.denied p{font-size:14.5px;color:var(--muted);line-height:1.6;margin-bottom:26px}
.denied .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* =================== HEADER =================== */
.admin-head{padding:56px 0 32px}
.admin-head .eyebrow{
  display:inline-flex;align-items:center;gap:9px;
  font-size:11px;letter-spacing:2.2px;text-transform:uppercase;
  color:var(--muted);font-weight:700;margin-bottom:14px;
}
.admin-head .eyebrow svg{width:12px;height:12px}
.admin-head .eyebrow::before{content:"";width:20px;height:1px;background:var(--muted);opacity:.5}
.admin-head h1{
  font-size:clamp(28px,3.8vw,42px);letter-spacing:-1.6px;
  line-height:1.1;font-weight:700;margin-bottom:10px;
}
.admin-head p{font-size:15px;color:var(--muted);max-width:680px}

/* =================== STATS =================== */
.stats{
  display:grid;grid-template-columns:repeat(6,1fr);gap:14px;
  margin-bottom:28px;
}
@media(max-width:1100px){.stats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{
  border:1px solid var(--line);border-radius:var(--radius);
  background:var(--paper);padding:20px 20px 18px;
  transition:all .22s ease;position:relative;overflow:hidden;
}
.stat:hover{border-color:var(--ink);transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.stat .label{
  display:flex;align-items:center;gap:7px;
  font-size:10px;letter-spacing:1.8px;text-transform:uppercase;
  color:var(--muted);font-weight:700;margin-bottom:12px;
}
.stat .label svg{width:12px;height:12px}
.stat .value{
  font-size:30px;font-weight:700;letter-spacing:-1.2px;line-height:1;
  font-variant-numeric:tabular-nums;
}
.stat .sub{font-size:11.5px;color:var(--muted-2);margin-top:6px}
.stat.accent{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.stat.accent .label{color:rgba(255,255,255,.6)}
.stat.accent .sub{color:rgba(255,255,255,.5)}
.stat.gold::after{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--gold);
}
.stat.green::after{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--green);
}

/* =================== TOOLBAR =================== */
.toolbar{
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  margin-bottom:18px;
}
.search{
  flex:1;min-width:240px;position:relative;
}
.search input{
  width:100%;padding:12px 16px 12px 42px;
  font-size:14px;font-family:inherit;
  border:1.5px solid var(--line);border-radius:11px;
  background:var(--paper);color:var(--ink);
  transition:border-color .18s ease,box-shadow .18s ease;
}
.search input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 4px rgba(11,11,11,.05)}
.search svg{
  position:absolute;left:15px;top:50%;transform:translateY(-50%);
  width:15px;height:15px;color:var(--muted);pointer-events:none;
}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  font-size:12.5px;font-weight:600;padding:9px 14px;border-radius:9px;
  border:1px solid var(--line);background:var(--paper);color:var(--muted);
  display:inline-flex;align-items:center;gap:6px;
  transition:all .18s ease;
}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip svg{width:13px;height:13px}
.chip .count{
  font-family:var(--mono);font-size:10.5px;font-weight:700;
  background:var(--paper-3);color:var(--muted);
  padding:1px 6px;border-radius:100px;margin-left:2px;
}
.chip.active .count{background:rgba(255,255,255,.18);color:var(--paper)}
.tool-btn{
  font-size:13px;font-weight:600;padding:11px 16px;border-radius:10px;
  border:1.5px solid var(--line);background:var(--paper);color:var(--ink);
  display:inline-flex;align-items:center;gap:7px;transition:all .18s ease;
}
.tool-btn:hover{border-color:var(--ink);background:var(--paper-3)}
.tool-btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tool-btn.primary:hover{background:var(--ink-2);transform:translateY(-1px)}
.tool-btn svg{width:14px;height:14px}
.tool-btn:disabled{opacity:.55;cursor:not-allowed;transform:none}

/* =================== TABLE =================== */
.table-card{
  border:1px solid var(--line);border-radius:var(--radius-lg);
  background:var(--paper);overflow:hidden;
  box-shadow:var(--shadow-sm);
}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:1050px}
th,td{
  text-align:left;padding:14px 18px;
  border-bottom:1px solid var(--line);vertical-align:middle;
}
th{
  font-size:10px;letter-spacing:1.6px;text-transform:uppercase;
  color:var(--muted);font-weight:700;background:var(--paper-3);
  position:sticky;top:0;z-index:2;
}
tbody tr{transition:background .15s ease;cursor:pointer}
tbody tr:hover{background:var(--paper-2)}
tbody tr.selected{background:var(--paper-3)}
tbody tr:last-child td{border-bottom:none}
td.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:.3px}
.cell-user{display:flex;align-items:center;gap:12px;min-width:220px}
.cell-user .avatar{
  width:36px;height:36px;border-radius:10px;overflow:hidden;
  border:1px solid var(--line);flex-shrink:0;
  background:var(--paper-3);display:flex;align-items:center;justify-content:center;
}
.cell-user .avatar svg{display:block}
.cell-user .info{display:flex;flex-direction:column;min-width:0;flex:1}
.cell-user .name{font-size:13.5px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell-user .email{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono)}
.status{
  display:inline-flex;align-items:center;gap:6px;
  font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  padding:4px 9px;border-radius:100px;
}
.status svg{width:11px;height:11px}
.status.pending{background:var(--orange-soft);color:var(--orange)}
.status.prelude{background:var(--blue-soft);color:var(--blue)}
.status.curriculum{background:var(--gold-soft);color:var(--gold)}
.status.approved{background:var(--green-soft);color:var(--green)}
.status.revoked{background:var(--red-soft);color:var(--red)}
.status.none{background:var(--paper-3);color:var(--muted)}
.tag{
  display:inline-flex;font-size:10.5px;font-weight:700;letter-spacing:.6px;
  padding:3px 8px;border-radius:6px;background:var(--paper-3);color:var(--muted);
  text-transform:uppercase;
}
.tag.duration{background:var(--blue-soft);color:var(--blue)}
.tag.stream{background:var(--ink);color:var(--paper)}
td .null{color:var(--muted-3);font-style:italic;font-size:12.5px}

/* empty state */
.empty{
  text-align:center;padding:80px 24px;
}
.empty .icon{
  width:56px;height:56px;border-radius:14px;background:var(--paper-3);
  display:flex;align-items:center;justify-content:center;margin:0 auto 18px;
}
.empty .icon svg{width:24px;height:24px;color:var(--muted)}
.empty h3{font-size:17px;font-weight:700;margin-bottom:6px}
.empty p{font-size:13.5px;color:var(--muted);max-width:400px;margin:0 auto}

/* =================== DRAWER =================== */
.drawer-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.42);
  z-index:400;opacity:0;visibility:hidden;
  transition:opacity .3s ease,visibility .3s ease;
  backdrop-filter:blur(2px);
}
.drawer-backdrop.open{opacity:1;visibility:visible}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:560px;max-width:100vw;
  background:var(--paper);z-index:401;
  border-left:1px solid var(--line);
  transform:translateX(102%);
  transition:transform .45s cubic-bezier(.16,1,.3,1);
  display:flex;flex-direction:column;
  box-shadow:var(--shadow-xl);
}
@media(max-width:620px){.drawer{width:100%}}
.drawer.open{transform:translateX(0)}
.drawer-head{
  padding:24px 26px;border-bottom:1px solid var(--line);
  display:flex;align-items:flex-start;gap:16px;
  position:relative;flex-shrink:0;
}
.drawer-head .avatar-lg{
  width:56px;height:56px;border-radius:14px;overflow:hidden;
  border:1px solid var(--line);flex-shrink:0;
  background:var(--paper-3);display:flex;align-items:center;justify-content:center;
}
.drawer-head .meta{flex:1;min-width:0}
.drawer-head .meta h3{font-size:17px;font-weight:700;letter-spacing:-.3px;margin-bottom:3px;line-height:1.25}
.drawer-head .meta .email{
  font-size:12.5px;color:var(--muted);font-family:var(--mono);
  word-break:break-all;line-height:1.4;
}
.drawer-head .meta .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.drawer-close{
  width:34px;height:34px;border-radius:10px;
  background:var(--paper-3);border:none;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:background .18s ease;
}
.drawer-close:hover{background:var(--line)}
.drawer-close svg{width:16px;height:16px}

.drawer-body{flex:1;overflow-y:auto;padding:22px 26px 32px}
.drawer-body::-webkit-scrollbar{width:8px}
.drawer-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}

.section{margin-bottom:26px}
.section-title{
  font-size:10.5px;letter-spacing:2px;text-transform:uppercase;
  color:var(--muted);font-weight:700;margin-bottom:14px;
  display:flex;align-items:center;gap:8px;
}
.section-title svg{width:12px;height:12px}
.section-title::after{content:"";flex:1;height:1px;background:var(--line)}

.row{
  display:flex;justify-content:space-between;align-items:baseline;
  gap:14px;padding:9px 0;border-bottom:1px dashed var(--line);
  font-size:13.5px;
}
.row:last-child{border-bottom:none}
.row .k{color:var(--muted);display:flex;align-items:center;gap:7px;flex-shrink:0}
.row .k svg{width:13px;height:13px}
.row .v{font-weight:600;text-align:right;word-break:break-word;font-variant-numeric:tabular-nums}
.row .v.mono{font-family:var(--mono);letter-spacing:.4px;font-size:13px}
.row .v.null{color:var(--muted-3);font-style:italic;font-weight:400}

/* barcode card */
.barcode-card{
  border:1px solid var(--line);border-radius:var(--radius);
  background:var(--paper);padding:20px 20px 16px;text-align:center;
}
.barcode-card .label{
  font-size:10.5px;letter-spacing:2px;text-transform:uppercase;
  color:var(--muted);font-weight:700;margin-bottom:14px;
}
.barcode-card svg{width:100%;height:60px;display:block;margin:0 auto}
.barcode-card .code{
  font-family:var(--mono);font-size:12px;letter-spacing:2px;
  color:var(--ink);font-weight:700;margin-top:10px;
}
.barcode-card .hint{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5}
.barcode-empty{
  padding:24px 16px;color:var(--muted);font-size:12.5px;
  text-align:center;border:1.5px dashed var(--line-2);border-radius:var(--radius);
}

/* subject list */
.subjects{list-style:none;display:flex;flex-direction:column;gap:6px}
.subjects li{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;background:var(--paper-2);
  border-radius:9px;font-size:13px;
  border:1px solid var(--line);
}
.subjects li svg{width:13px;height:13px;color:var(--muted)}
.subjects li .tag{
  margin-left:auto;font-size:9.5px;padding:3px 8px;
}
.subjects li .tag.core{background:var(--ink);color:var(--paper)}
.subjects li .tag.stream{background:var(--blue-soft);color:var(--blue)}
.subjects li .tag.elective{background:var(--green-soft);color:var(--green)}

/* result rows */
.result-row{
  display:grid;grid-template-columns:1fr auto auto;gap:12px;
  align-items:center;padding:11px 12px;
  border:1px solid var(--line);border-radius:9px;
  background:var(--paper);margin-bottom:7px;font-size:13px;
}
.result-row .name{font-weight:600}
.result-row .score{
  font-family:var(--mono);font-size:12.5px;font-weight:700;
  background:var(--paper-3);padding:3px 9px;border-radius:6px;
}
.result-row .shared{
  font-size:10.5px;font-weight:700;letter-spacing:.6px;
  text-transform:uppercase;padding:3px 8px;border-radius:100px;
}
.result-row .shared.yes{background:var(--green-soft);color:var(--green)}
.result-row .shared.no{background:var(--orange-soft);color:var(--orange)}

/* actions grid */
.actions-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:480px){.actions-grid{grid-template-columns:1fr}}
.action-btn{
  font-size:13px;font-weight:600;padding:11px 14px;border-radius:10px;
  border:1.5px solid var(--line);background:var(--paper);color:var(--ink);
  display:flex;align-items:center;gap:8px;transition:all .18s ease;
  text-align:left;
}
.action-btn:hover{border-color:var(--ink);background:var(--paper-3)}
.action-btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.action-btn.primary:hover{background:var(--ink-2)}
.action-btn.danger{color:var(--red);border-color:rgba(179,38,30,.3)}
.action-btn.danger:hover{background:var(--red-soft);border-color:var(--red)}
.action-btn.full{grid-column:1/-1}
.action-btn svg{width:15px;height:15px;flex-shrink:0}
.action-btn:disabled{opacity:.55;cursor:not-allowed;transform:none}

/* =================== TOAST =================== */
.toasts{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  z-index:500;display:flex;flex-direction:column;gap:10px;
  pointer-events:none;
}
.toast{
  background:var(--ink);color:var(--paper);
  padding:13px 20px;border-radius:12px;font-size:13.5px;font-weight:500;
  display:flex;align-items:center;gap:10px;
  box-shadow:var(--shadow-lg);min-width:260px;max-width:520px;
  animation:toastIn .3s cubic-bezier(.16,1,.3,1) both;
  pointer-events:auto;
}
.toast svg{width:16px;height:16px;flex-shrink:0}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}
.toast.info{background:var(--ink)}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastOut{to{opacity:0;transform:translateY(12px)}}

/* =================== MODAL =================== */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.5);
  z-index:600;display:none;align-items:center;justify-content:center;
  padding:20px;backdrop-filter:blur(3px);
}
.modal-backdrop.open{display:flex}
.modal{
  background:var(--paper);border-radius:var(--radius-xl);
  max-width:480px;width:100%;padding:32px 30px;
  box-shadow:var(--shadow-xl);animation:modalIn .35s cubic-bezier(.16,1,.3,1) both;
}
@keyframes modalIn{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal h2{font-size:20px;letter-spacing:-.5px;margin-bottom:10px;font-weight:700}
.modal p{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:24px}
.modal .modal-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.modal .modal-actions button{
  padding:11px 18px;font-size:13.5px;font-weight:600;
  border-radius:10px;border:1.5px solid var(--line);
  background:var(--paper);color:var(--ink);
  transition:all .18s ease;

<script>
/* ---------- LOADER ---------- */
(function(){
  const loader = document.getElementById('loader');
  const start = Date.now();
  const minShow = 700;
  function hide(){
    const elapsed = Date.now() - start;
    const wait = Math.max(0, minShow - elapsed);
    setTimeout(() => {
      loader.classList.add('gone');
      setTimeout(() => loader.remove(), 700);
    }, wait);
  }
  if (document.readyState === 'complete') hide();
  else window.addEventListener('load', hide);
  setTimeout(() => { if (document.body.contains(loader)) loader.classList.add('gone'); }, 3400);
})();

/* ---------- GRIDY AVATAR ---------- */
function hash32(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function gridy(seed,px){
  px = px || 40;
  const h = hash32(String(seed || 'anon'));
  const rnd = mulberry32(h);
  const hue = h % 360;
  const fg = 'hsl(' + hue + ',58%,38%)';
  const bg = 'hsl(' + hue + ',28%,95%)';
  const N = 5, cell = 100 / N;
  const half = [];
  for (let r = 0; r < N; r++) {
    const row = [];
    for (let c = 0; c < 3; c++) row.push(rnd() > 0.46 ? 1 : 0);
    half.push(row);
  }
  if (!half.some(r => r.some(v => v))) half[2][1] = 1;
  let rects = '';
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const cc = c < 3 ? c : 4 - c;
    if (half[r][cc]) {
      rects += '<rect x="' + (c*cell).toFixed(2) + '" y="' + (r*cell).toFixed(2) +
               '" width="' + cell.toFixed(2) + '" height="' + cell.toFixed(2) + '"/>';
    }
  }
  return '<svg viewBox="0 0 100 100" width="' + px + '" height="' + px +
         '" xmlns="http://www.w3.org/2000/svg" style="display:block">' +
         '<rect width="100" height="100" fill="' + bg + '"/>' +
         '<g fill="' + fg + '">' + rects + '</g></svg>';
}
window.gridy = gridy;

/* ---------- TOASTS ---------- */
window.toast = function(msg, type){
  type = type || 'info';
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const icon = type === 'success' ? 'check-circle' : type === 'error' ? 'alert-triangle' : 'info';
  el.innerHTML = '<i data-lucide="' + icon + '"></i><span>' + String(msg) + '</span>';
  document.getElementById('toasts').appendChild(el);
  if (window.lucide) lucide.createIcons();
  setTimeout(() => {
    el.style.animation = 'toastOut .3s ease both';
    setTimeout(() => el.remove(), 320);
  }, 3400);
};

/* ---------- MODAL ---------- */
window.confirmModal = function(opts){
  return new Promise(resolve => {
    const backdrop = document.getElementById('modalBackdrop');
    const title = document.getElementById('modalTitle');
    const msg = document.getElementById('modalMsg');
    const cancel = document.getElementById('modalCancel');
    const confirm = document.getElementById('modalConfirm');

    title.textContent = opts.title || 'Confirm';
    msg.textContent = opts.message || 'Are you sure?';
    confirm.textContent = opts.confirmText || 'Confirm';
    confirm.className = (opts.danger ? 'danger' : 'primary');

    function cleanup(){ backdrop.classList.remove('open'); cancel.removeEventListener('click', onCancel); confirm.removeEventListener('click', onConfirm); }
    function onCancel(){ cleanup(); resolve(false); }
    function onConfirm(){ cleanup(); resolve(true); }
    cancel.addEventListener('click', onCancel);
    confirm.addEventListener('click', onConfirm);
    backdrop.classList.add('open');
  });
};
</script>

  document.getElementById('drawerBadges').innerHTML = `
    <span class="status ${s.key}"><i data-lucide="${s.icon}"></i> ${s.label}</span>
    ${u.preludePassed ? '<span class="status approved"><i data-lucide="shield-check"></i> Prelude passed</span>' : '<span class="status pending"><i data-lucide="clock"></i> Awaiting Prelude</span>'}
    ${u.duration ? `<span class="tag duration">${esc(durationLabel(u.duration))}</span>` : ''}
    ${u.course ? `<span class="tag stream">${esc(streamLabel(u.course))}</span>` : ''}

  const SUBJECTS_BY_STREAM = {
    fullstack: ['Mathematics','Web Foundations','Programming Fundamentals','Full Stack Systems'],
    frontend:  ['Mathematics','Web Foundations','Programming Fundamentals','Frontend Systems'],
    backend:   ['Mathematics','Web Foundations','Programming Fundamentals','Backend Systems'],
    mobile:    ['Mathematics','Web Foundations','Programming Fundamentals','Mobile Systems'],
    webdesign: ['Mathematics','Web Foundations','Programming Fundamentals','Visual Systems'],
    uiux:      ['Mathematics','Web Foundations','Programming Fundamentals','Experience Design'],
    data:      ['Mathematics','Web Foundations','Programming Fundamentals','Data Systems'],
    stem:      ['Mathematics','Web Foundations','Programming Fundamentals','Physical Sciences'],

  const core = SUBJECTS_BY_STREAM[u.course] || [];
  const electives = Array.isArray(u.electives) ? u.electives : [];
  const allSubjects = [
    ...core.map((n, i) => ({ name: n, kind: i === 3 ? 'stream' : 'core' })),
    ...electives.map(n => ({ name: n, kind: 'elective' })),

  const results = Array.isArray(u.results) ? u.results : [];

  document.getElementById('drawerBody').innerHTML = `
    <!-- Barcode -->
    <div class="section">
      <div class="section-title"><i data-lucide="barcode"></i> Unique barcode</div>
      ${barcodeValue
        ? `<div class="barcode-card">
            <div class="label">IFB candidate identifier</div>
            <svg id="drawerBarcode"></svg>
            <div class="code">${esc(barcodeValue)}</div>
            <div class="hint">Unique to this candidate. Used on the admission slip and any examination document.</div>
          </div>`
        : `<div class="barcode-empty">No identifier yet. Assign a Student Number to generate a barcode.</div>`}
    </div>

    <!-- Identity -->
    <div class="section">
      <div class="section-title"><i data-lucide="fingerprint"></i> Identity</div>
      <div class="row"><span class="k"><i data-lucide="user"></i> Name</span><span class="v">${esc(u.name || '') || '<span class="null">—</span>'}</span></div>
      <div class="row"><span class="k"><i data-lucide="mail"></i> Email</span><span class="v mono">${esc(u.email || '')}</span></div>
      <div class="row"><span class="k"><i data-lucide="hash"></i> Reference ID</span><span class="v mono">${u.referenceId ? esc(u.referenceId) : '<span class="null">—</span>'}</span></div>
      <div class="row"><span class="k"><i data-lucide="badge"></i> Student №</span><span class="v mono">${u.studentNumber ? esc(u.studentNumber) : '<span class="null">Not assigned</span>'}</span></div>
      <div class="row"><span class="k"><i data-lucide="ticket"></i> Exam №</span><span class="v mono">${u.examinationNumber ? esc(u.examinationNumber) : '<span class="null">Not assigned</span>'}</span></div>
      <div class="row"><span class="k"><i data-lucide="key"></i> PIN</span><span class="v mono">${u.examPin ? esc(u.examPin) : '<span class="null">Not assigned</span>'}</span></div>
      <div class="row"><span class="k"><i data-lucide="calendar"></i> Registered</span><span class="v">${fmtDateTime(u.createdAt)}</span></div>
    </div>

    <!-- Prelude -->
    <div class="section">
      <div class="section-title"><i data-lucide="shield-check"></i> Prelude</div>
      <div class="row"><span class="k"><i data-lucide="circle-check"></i> Passed</span><span class="v">${u.preludePassed ? 'Yes' : 'No'}</span></div>
      <div class="row"><span class="k"><i data-lucide="percent"></i> Score</span><span class="v">${u.preludeScore != null ? u.preludeScore + '%' : '<span class="null">—</span>'}</span></div>
      <div class="row"><span class="k"><i data-lucide="clock"></i> Taken</span><span class="v">${u.preludeTakenAt ? fmtDateTime(u.preludeTakenAt) : '<span class="null">—</span>'}</span></div>
    </div>

    <!-- Curriculum -->
    <div class="section">
      <div class="section-title"><i data-lucide="layout-grid"></i> Curriculum</div>
      <div class="row"><span class="k"><i data-lucide="clock"></i> Duration</span><span class="v">${u.duration ? esc(durationLabel(u.duration)) : '<span class="null">—</span>'}</span></div>
      <div class="row"><span class="k"><i data-lucide="boxes"></i> Stream</span><span class="v">${u.course ? esc(streamLabel(u.course)) : '<span class="null">—</span>'}</span></div>
      <div class="row"><span class="k"><i data-lucide="star"></i> Electives</span><span class="v">${electives.length ? esc(electives.join(', ')) : '<span class="null">—</span>'}</span></div>
      ${allSubjects.length
        ? `<ul class="subjects" style="margin-top:12px">
            ${allSubjects.map(s => `
              <li>
                <i data-lucide="${s.kind === 'stream' ? 'boxes' : s.kind === 'elective' ? 'star' : 'circle-dot'}"></i>
                ${esc(s.name)}
                <span class="tag ${s.kind}">${s.kind}</span>
              </li>`).join('')}
          </ul>`
        : ''}
    </div>

    <!-- Results -->
    <div class="section">
      <div class="section-title"><i data-lucide="bar-chart-3"></i> Results</div>
      ${results.length
        ? results.map((r, i) => `
            <div class="result-row">
              <span class="name">${esc(r.subject || 'Subject')}</span>
              <span class="score">${r.score != null ? r.score + '%' : '—'}</span>
              <span class="shared ${r.shared ? 'yes' : 'no'}">${r.shared ? 'Shared' : 'Not shared'}</span>

      <div class="actions-grid">

          : ''}
        ${u.preludePassed && !u.studentNumber
          ? `<button class="action-btn primary full" data-action="assignNumber"><i data-lucide="hash"></i> Assign Student Number</button>`
          : ''}

          ? `<button class="action-btn" data-action="approve"><i data-lucide="circle-check"></i> Approve</button>`
          : `<button class="action-btn" data-action="revoke"><i data-lucide="ban"></i> Revoke</button>`}

        <button class="action-btn full" data-action="editCurriculum"><i data-lucide="edit-3"></i> Edit curriculum</button>

          ? `<a class="action-btn full" href="admission-slip.html?uid=${esc(u.id)}" target="_blank"><i data-lucide="ticket"></i> Open admission slip</a>`
          : ''}
        <a class="action-btn full" href="mailto:${esc(u.email || '')}"><i data-lucide="mail"></i> Email candidate</a>
      </div>
    </div>

  if (window.lucide) lucide.createIcons();

  /* Barcode */
  if (barcodeValue && typeof JsBarcode === 'function') {
    try {
      JsBarcode('#drawerBarcode', barcodeValue, {
        format: 'CODE128',
        width: 2,
        height: 60,
        displayValue: false,
        margin: 0,
        background: '#ffffff',
        lineColor: '#0b0b0b'
      });
    } catch (e) {}

  /* Action handlers */
  document.getElementById('drawerBody').querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', () => handleAction(btn.dataset.action, u));
  });
}

/* =================== ACTIONS =================== */
async function handleAction(action, u){
  try {
    if (action === 'markPrelude') {
      const ok = await window.confirmModal({
        title: 'Mark Prelude as passed?',
        message: 'This will flag ' + (u.name || u.email) + ' as having passed the Prelude and unlock Student Number assignment.',
        confirmText: 'Mark passed'
      });
      if (!ok) return;
      await updateDoc(doc(db, 'users', u.id), {
        preludePassed: true,
        preludeTakenAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      });
      window.toast('Prelude marked passed.', 'success');
      await refreshAndReopen(u.id);
      return;
    }

    if (action === 'assignNumber') {
      const ok = await window.confirmModal({
        title: 'Assign Student Number?',
        message: 'A permanent Student Number, Examination Number and PIN will be generated for ' + (u.name || u.email) + '.',
        confirmText: 'Assign'
      });
      if (!ok) return;
      await assignNumbersTo([u]);
      window.toast('Student Number assigned.', 'success');
      await refreshAndReopen(u.id);
      return;
    }

    if (action === 'approve') {
      await updateDoc(doc(db, 'users', u.id), {
        status: 'approved',
        approvedAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      });
      window.toast('Candidate approved.', 'success');
      await refreshAndReopen(u.id);
      return;
    }

    if (action === 'revoke') {
      const ok = await window.confirmModal({
        title: 'Revoke candidate?',
        message: 'This will mark ' + (u.name || u.email) + ' as revoked. They will not be able to sit exams.',
        confirmText: 'Revoke',
        danger: true
      });
      if (!ok) return;
      await updateDoc(doc(db, 'users', u.id), {
        status: 'revoked',
        revokedAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      });
      window.toast('Candidate revoked.', 'success');
      await refreshAndReopen(u.id);
      return;
    }

    if (action === 'shareResults') {
      const results = Array.isArray(u.results) ? u.results : [];
      if (!results.length) { window.toast('No results to share.', 'error'); return; }
      const ok = await window.confirmModal({
        title: 'Share all results?',
        message: 'All ' + results.length + ' result(s) will be marked as shared with ' + (u.name || u.email) + '.',
        confirmText: 'Share'
      });
      if (!ok) return;
      const updated = results.map(r => ({ ...r, shared: true, sharedAt: new Date().toISOString() }));
      await updateDoc(doc(db, 'users', u.id), {
        results: updated,
        resultsSharedAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      });
      window.toast('Results shared.', 'success');
      await refreshAndReopen(u.id);
      return;
    }

    if (action === 'addResult') {
      const subject = prompt('Subject name (e.g. Mathematics):');
      if (!subject) return;
      const scoreStr = prompt('Score % (0–100):', '0');
      if (scoreStr === null) return;
      const score = Math.max(0, Math.min(100, parseInt(scoreStr, 10) || 0));
      const results = Array.isArray(u.results) ? u.results.slice() : [];
      results.push({
        subject: subject.trim(),
        score,
        period: u.duration === '12' ? 'QIF' : u.duration === '9' ? 'Interm' : 'Foundation',
        shared: false,
        addedAt: new Date().toISOString()
      });
      await updateDoc(doc(db, 'users', u.id), {
        results,
        updatedAt: serverTimestamp()
      });
      window.toast('Result added.', 'success');
      await refreshAndReopen(u.id);
      return;
    }

    if (action === 'editCurriculum') {
      const streams = ['fullstack','frontend','backend','mobile','webdesign','uiux','data','stem'];
      const durations = ['3','9','12'];
      const duration = prompt('Duration (3, 9, or 12 months):', u.duration || '9');
      if (!durations.includes(String(duration))) { window.toast('Invalid duration.', 'error'); return; }
      const course = prompt('Stream key (' + streams.join(', ') + '):', u.course || 'fullstack');
      if (!streams.includes(String(course))) { window.toast('Invalid stream.', 'error'); return; }
      await updateDoc(doc(db, 'users', u.id), {
        duration: String(duration),
        course: String(course),
        updatedAt: serverTimestamp()
      });
      window.toast('Curriculum updated.', 'success');
      await refreshAndReopen(u.id);
      return;
    }
  } catch (err) {
    window.toast('Error: ' + err.message, 'error');
  }
}

/* =================== ASSIGN NUMBERS (transactional) =================== */
async function assignNumbersTo(users){
  const counterRef = doc(db, 'counters', 'students');
  await runTransaction(db, async tx => {
    const snap = await tx.get(counterRef);
    let next = (snap.exists() && snap.data().lastNumber) ? snap.data().lastNumber : 0;
    for (const u of users) {
      next++;
      const studentNum = 'IFB-2027-' + String(next).padStart(5, '0');
      const examNum = '27' + String(next).padStart(5, '0') + '01';
      const pin = String(Math.floor(1000 + Math.random() * 9000));
      tx.update(doc(db, 'users', u.id), {
        studentNumber: studentNum,
        examinationNumber: examNum,
        examPin: pin,
        status: 'approved',
        approvedAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      });
    }
    tx.set(counterRef, { lastNumber: next }, { merge: true });
  });
}

/* =================== BULK ACTIONS =================== */
async function bulkAssignNumbers(){
  const users = state.users.filter(u => state.selected.has(u.id) && u.preludePassed && !u.studentNumber);
  if (!users.length) {
    window.toast('No selected candidates are eligible (must have passed Prelude and lack a Student №).', 'error');
    return;
  }
  const ok = await window.confirmModal({
    title: 'Assign Student Numbers?',
    message: users.length + ' candidate(s) will receive permanent Student Numbers, Examination Numbers and PINs.',
    confirmText: 'Assign ' + users.length
  });
  if (!ok) return;
  try {
    await assignNumbersTo(users);
    state.selected.clear();
    window.toast(users.length + ' Student Number(s) assigned.', 'success');
    await loadUsers();
  } catch (e) {
    window.toast('Error: ' + e.message, 'error');
  }
}

async function bulkApprove(){
  const users = state.users.filter(u => state.selected.has(u.id) && u.status !== 'approved');
  if (!users.length) { window.toast('No candidates to approve.', 'error'); return; }
  const ok = await window.confirmModal({
    title: 'Approve ' + users.length + ' candidate(s)?',
    confirmText: 'Approve'
  });
  if (!ok) return;
  try {
    for (const u of users) {
      await updateDoc(doc(db, 'users', u.id), {
        status: 'approved',
        approvedAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      });
    }
    state.selected.clear();
    window.toast(users.length + ' approved.', 'success');
    await loadUsers();
  } catch (e) {
    window.toast('Error: ' + e.message, 'error');
  }
}

async function bulkMarkPrelude(){
  const users = state.users.filter(u => state.selected.has(u.id) && !u.preludePassed);
  if (!users.length) { window.toast('No candidates need Prelude marked.', 'error'); return; }
  const ok = await window.confirmModal({
    title: 'Mark Prelude passed for ' + users.length + ' candidate(s)?',
    confirmText: 'Mark passed'
  });
  if (!ok) return;
  try {
    for (const u of users) {
      await updateDoc(doc(db, 'users', u.id), {
        preludePassed: true,
        preludeTakenAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      });
    }
    state.selected.clear();
    window.toast(users.length + ' marked.', 'success');
    await loadUsers();
  } catch (e) {
    window.toast('Error: ' + e.message, 'error');
  }
}

/* =================== EXPORT CSV =================== */
function exportCSV(){
  const rows = state.filtered;
  if (!rows.length) { window.toast('Nothing to export.', 'error'); return; }
  const headers = [
    'Name','Email','Reference ID','Student Number','Exam Number','PIN',
    'Prelude Passed','Prelude Score','Duration','Stream','Electives','Status','Registered'
  ];
  const csv = [headers.join(',')].concat(
    rows.map(u => [
      u.name || '',
      u.email || '',
      u.referenceId || '',
      u.studentNumber || '',
      u.examinationNumber || '',
      u.examPin || '',
      u.preludePassed ? 'Yes' : 'No',
      u.preludeScore != null ? u.preludeScore : '',
      u.duration || '',
      u.course || '',
      (u.electives || []).join(' | '),
      u.status || 'pending',
      u.createdAt ? fmtDate(u.createdAt) : ''
    ].map(v => '"' + String(v).replace(/"/g, '""') + '"').join(','))
  ).join('\n');

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'ifb-candidates-' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
  window.toast('Exported ' + rows.length + ' candidates.', 'success');
}

/* =================== REFRESH + REOPEN DRAWER =================== */
async function refreshAndReopen(id){
  await loadUsers();
  if (state.users.find(u => u.id === id)) {
    openDrawer(id);
  } else {
    closeDrawer();
  }
}

/* =================== SIGN OUT =================== */
document.getElementById('signOutBtn').addEventListener('click', async () => {
  const ok = await window.confirmModal({
    title: 'Sign out?',
    message: 'You will be returned to the site.',
    confirmText: 'Sign out'
  });
  if (!ok) return;
  await signOut(auth);
  window.location.href = 'index.html';
});

/* =================== AUTH GATE =================== */
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    renderDenied('You are not signed in.');
    return;
  }
  if (user.email !== ADMIN_EMAIL) {
    renderDenied('Signed in as ' + user.email + ', but this account does not have administrator access.');
    return;
  }
  document.getElementById('adminChip').innerHTML =
    '<i data-lucide="shield-check"></i> ' + (user.email || '');
  if (window.lucide) lucide.createIcons();

  try {
    await loadUsers();
  } catch (err) {
    main.innerHTML = `
      <div class="denied">
        <div class="icon"><i data-lucide="alert-triangle"></i></div>
        <h1>Could not load candidates</h1>
        <p>${esc(err.message || 'Unknown error')}</p>
        <div class="actions">
          <button class="nav-btn" onclick="location.reload()" style="padding:11px 18px;font-size:13.5px;">
            <i data-lucide="refresh-cw"></i> Try again
          </button>
        </div>
      </div>
    `;
    if (window.lucide) lucide.createIcons();
  }
});
