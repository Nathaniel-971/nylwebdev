<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Admin Exam Setup — IFB</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<meta name="theme-color" content="#7A1F2B">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --maroon: #7A1F2B; --maroon-hover: #5A1620; --bg: #F8FAFC; --white: #FFF; --text: #111; --gray: #64748B; --silver: #E2E8F0; --success: #15803D; --error: #B91C1C; --warning: #B45309; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; display: flex; flex-direction: column; min-height: 100vh; }
  .nav { background: var(--white); border-bottom: 1px solid var(--silver); padding: 0 24px; height: 64px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); font-weight: 900; font-size: 16px; }
  .brand span { font-size: 24px; color: var(--maroon); }
  .btn-nav { background: transparent; border: 1.5px solid var(--silver); padding: 8px 14px; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; color: var(--text); font-family: inherit; }
  .btn-logout { background: #FEF2F2; color: var(--error); border-color: #FECACA; }
  .container { max-width: 1300px; margin: 24px auto; padding: 0 20px; width: 100%; }
  .grid { display: grid; grid-template-columns: 380px 1fr; gap: 24px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--white); border: 1px solid var(--silver); border-radius: 12px; padding: 20px; }
  .card h2 { font-size: 16px; font-weight: 900; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--silver); padding-bottom: 12px; }
  .card h2 i { color: var(--maroon); width: 18px; height: 18px; }
  .file-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .file-group label { font-size: 12px; font-weight: 700; }
  .file-input { width: 100%; font-size: 12px; padding: 8px; border: 1px solid var(--silver); border-radius: 6px; }
  .btn-primary { background: var(--maroon); color: var(--white); border: none; padding: 12px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
  .btn-primary:disabled { opacity: 0.6; }
  .progress-bar { width: 100%; height: 6px; background: var(--silver); border-radius: 4px; overflow: hidden; margin-top: 12px; display: none; }
  .progress-fill { height: 100%; background: var(--maroon); width: 0%; transition: width 0.3s; }
  .pin-display { text-align: center; margin-top: 20px; display: none; background: var(--bg); padding: 16px; border-radius: 8px; border: 1px dashed var(--maroon); }
  .pin-text { font-family: monospace; font-size: 32px; font-weight: 900; color: var(--maroon); letter-spacing: 6px; margin: 8px 0; }
  .qr-box { margin-top: 16px; text-align: center; }
  .qr-box svg { max-width: 180px; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--silver); border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; min-width: 500px; }
  th, td { padding: 10px 12px; border-bottom: 1px solid var(--silver); }
  th { background: var(--bg); font-weight: 800; color: var(--gray); text-transform: uppercase; font-size: 10px; }
  .status-badge { padding: 3px 8px; border-radius: 4px; font-weight: 700; font-size: 11px; }
  .status-online { background: #DCFCE7; color: var(--success); }
  .status-offline { background: #FEE2E2; color: var(--error); }
  /* Viewer */
  #viewerOverlay { position: fixed; inset: 0; background: rgba(15,23,42,0.95); backdrop-filter: blur(8px); z-index: 1000; display: none; flex-direction: column; padding: 20px; }
  #viewerOverlay.active { display: flex; }
  .viewer-header { display: flex; justify-content: space-between; align-items: center; color: white; margin-bottom: 16px; }
  .viewer-header h2 { font-size: 18px; font-weight: 900; }
  .viewer-content { flex: 1; background: white; border-radius: 12px; overflow-y: auto; padding: 40px; position: relative; }
  .viewer-nav { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: white; padding: 10px 20px; border-radius: 100px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); display: flex; gap: 16px; align-items: center; z-index: 1001; }
  .viewer-nav button { background: var(--maroon); color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; }
  .viewer-nav button:disabled { opacity: 0.4; }
  .viewer-nav span { font-weight: 800; font-size: 14px; color: var(--maroon); }
</style>
</head>
<body>
<nav class="nav">
  <a href="index.html" class="brand"><span>∆</span> IFB Admin</a>
  <div class="nav-links">
    <button class="btn-nav" onclick="window.location.href='student-dashboard.html'"><i data-lucide="layout-dashboard"></i> Dashboard</button>
    <button class="btn-nav btn-logout" onclick="logout()"><i data-lucide="log-out"></i> Logout</button>
  </div>
</nav>
<div class="container">
  <div class="grid">
    <div class="card">
      <h2><i data-lucide="settings"></i> Session Setup</h2>
      <div class="file-group"><label>Question Paper (.html)</label><input type="file" id="questionFile" class="file-input" accept=".html"></div>
      <div class="file-group"><label>Answer Book (.html)</label><input type="file" id="answerBookFile" class="file-input" accept=".html"></div>
      <div class="file-group"><label>Exam PIN (6 digits)</label><input type="text" id="examPin" class="file-input" maxlength="6" placeholder="e.g. 847291" style="font-family: monospace; font-size: 16px; text-align: center;"></div>
      <div class="file-group"><label>Duration (minutes)</label><input type="number" id="examDuration" class="file-input" value="120" min="1" max="300"></div>
      <button class="btn-primary" id="startSessionBtn" onclick="startSession()"><i data-lucide="play-circle"></i> Create & Unlock Session</button>
      <div class="progress-bar" id="uploadProgress"><div class="progress-fill" id="progressFill"></div></div>
      <div id="setupStatus" style="margin-top: 8px; font-size: 12px; font-weight: 700; text-align: center; color: var(--gray);"></div>
      <div class="pin-display" id="sessionCodeContainer">
        <div style="font-size: 11px; font-weight: 800; color: var(--gray); text-transform: uppercase;">Live Session PIN</div>
        <div class="pin-text" id="displayPin">------</div>
        <div class="qr-box" id="qrBox">
          <div style="font-size: 11px; color: var(--gray); margin-bottom: 8px;">Scan with phone for mobile scanner</div>
          <div id="qrCode"></div>
        </div>
      </div>
    </div>
    <div class="card">
      <h2><i data-lucide="activity"></i> Live Monitor</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Exam Number</th><th>Status</th><th>Tab Switches</th><th>Last Active</th><th>Action</th></tr></thead>
          <tbody id="monitorTable"><tr><td colspan="5" style="text-align: center; padding: 20px;">Waiting for students...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Student Script Viewer -->
<div id="viewerOverlay">
  <div class="viewer-header">
    <h2 id="viewerTitle">Student Script</h2>
    <button class="btn-nav" style="background:white;color:var(--maroon);" onclick="closeViewer()"><i data-lucide="x"></i> Close</button>
  </div>
  <div class="viewer-content" id="viewerContent"></div>
  <div class="viewer-nav" id="viewerNav" style="display:none;">
    <button onclick="prevPage()" id="btnPrevPage">◀ Previous</button>
    <span id="pageIndicator">1 / 1</span>
    <button onclick="nextPage()" id="btnNextPage">Next ▶</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = { apiKey: "AIzaSyA6HO7n6wCZEeCgKxJLjB-MjL0ZFGR7svU", authDomain: "nyldevcourses.firebaseapp.com", projectId: "nyldevcourses", storageBucket: "nyldevcourses.firebasestorage.app", messagingSenderId: "16687006873", appId: "1:16687006873:web:b7d66ad1024ccd92722408" };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let unsubscribeMonitor = null;
  let currentViewerPages = [];
  let currentPageIndex = 0;

  function refreshIcons() { if (window.lucide) { try { lucide.createIcons(); } catch(e) {} } }
  window.logout = async function() { await signOut(auth); window.location.href = "index.html"; };

  onAuthStateChanged(auth, (user) => {
    if (!user || user.email !== "n1nathaniel971@gmail.com") {
      document.body.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif;"><h1>Access Denied.</h1></div>';
      return;
    } else { initMonitor(); }
  });

  function readFileAsText(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => resolve(e.target.result);
      reader.onerror = reject;
      reader.readAsText(file);
    });
  }

  window.startSession = async function() {
    const qFile = document.getElementById('questionFile').files[0];
    const aFile = document.getElementById('answerBookFile').files[0];
    const pin = document.getElementById('examPin').value.trim();
    const duration = parseInt(document.getElementById('examDuration').value);
    const statusEl = document.getElementById('setupStatus');
    const progressBar = document.getElementById('uploadProgress');
    const progressFill = document.getElementById('progressFill');
    const btn = document.getElementById('startSessionBtn');

    if (!qFile || !aFile || pin.length !== 6 || !duration) { alert("Please upload both .html files, enter a 6-digit PIN, and set duration."); return; }

    try {
      btn.disabled = true;
      progressBar.style.display = 'block';
      statusEl.innerText = "Reading files...";
      progressFill.style.width = '30%';

      const qHtml = await readFileAsText(qFile);
      progressFill.style.width = '60%';
      const aHtml = await readFileAsText(aFile);
      progressFill.style.width = '80%';

      statusEl.innerText = "Saving to Database...";
      const sessionId = 'SESSION_' + Date.now();

      await setDoc(doc(db, "examSessions", sessionId), {
        sessionId, examCode: pin, questionPaperHtml: qHtml, answerBookHtml: aHtml,
        durationMinutes: duration,
        active: true, createdAt: serverTimestamp(), createdBy: auth.currentUser.email
      });

      await setDoc(doc(db, "config", "examSettings"), { activeSessionId: sessionId }, { merge: true });
      progressFill.style.width = '100%';

      document.getElementById('sessionCodeContainer').style.display = 'block';
      document.getElementById('displayPin').innerText = pin;
      generateQR(sessionId, pin);

      statusEl.innerText = "Session is live!";
      statusEl.style.color = "var(--success)";
      btn.innerHTML = '<i data-lucide="check-circle"></i> Session Active';
      refreshIcons();
    } catch (error) {
      console.error(error);
      statusEl.innerText = "Error: " + error.message;
      statusEl.style.color = "var(--error)";
      progressBar.style.display = 'none';
      btn.disabled = false;
    }
  };

  function generateQR(sessionId, pin) {
    if (typeof qrcode !== "function") return;
    const qrContainer = document.getElementById('qrCode');
    qrContainer.innerHTML = '';
    const mobileUrl = `${window.location.origin}/mobile-scanner.html?session=${sessionId}&pin=${pin}`;
    var qr = qrcode(0, "M");
    qr.addData(mobileUrl);
    qr.make();
    qrContainer.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0 });
  }

  function initMonitor() {
    if (unsubscribeMonitor) unsubscribeMonitor();
    const q = query(collection(db, "examLogs"), orderBy("lastActive", "desc"));
    unsubscribeMonitor = onSnapshot(q, (snapshot) => {
      const tbody = document.getElementById('monitorTable');
      tbody.innerHTML = '';
      if (snapshot.empty) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 20px;">Waiting for students...</td></tr>';
        return;
      }
      snapshot.forEach((doc) => {
        const data = doc.data();
        const tabCount = data.tabSwitches ? data.tabSwitches.length : 0;
        const isOnline = data.status === 'In Session' || data.status === 'Online';
        const lastActive = data.lastActive ? new Date(data.lastActive.toDate()).toLocaleTimeString() : 'N/A';
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="font-family: monospace; font-weight: bold;">${data.examNumber || doc.id}</td>
          <td><span class="status-badge ${isOnline ? 'status-online' : 'status-offline'}">${isOnline ? 'Online' : 'Offline'}</span></td>
          <td style="color: ${tabCount > 0 ? 'var(--error)' : 'inherit'}; font-weight: bold;">${tabCount}</td>
          <td>${lastActive}</td>
          <td><button class="btn-nav" style="padding: 4px 8px; font-size: 11px;" onclick="viewScript('${doc.id}')">View</button></td>
        `;
        tbody.appendChild(tr);
      });
    });
  }

  window.viewScript = async function(studentId) {
    const docSnap = await getDoc(doc(db, "examLogs", studentId));
    if (!docSnap.exists()) { alert("No script found."); return; }
    const data = docSnap.data();
    currentViewerPages = data.scripts || [];
    currentPageIndex = 0;
    document.getElementById('viewerTitle').innerText = `Script: ${data.examNumber || studentId}`;
    document.getElementById('viewerOverlay').classList.add('active');
    document.getElementById('viewerNav').style.display = currentViewerPages.length > 1 ? 'flex' : 'none';
    renderViewerPage();
    refreshIcons();
  };

  function renderViewerPage() {
    const container = document.getElementById('viewerContent');
    if (!currentViewerPages.length) {
      container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--gray);">No pages uploaded yet.</div>';
      return;
    }
    container.innerHTML = `<img src="${currentViewerPages[currentPageIndex].url}" style="max-width:100%;display:block;margin:0 auto;">`;
    document.getElementById('pageIndicator').innerText = `${currentPageIndex + 1} / ${currentViewerPages.length}`;
    document.getElementById('btnPrevPage').disabled = currentPageIndex === 0;
    document.getElementById('btnNextPage').disabled = currentPageIndex === currentViewerPages.length - 1;
  }

  window.prevPage = function() { if (currentPageIndex > 0) { currentPageIndex--; renderViewerPage(); } };
  window.nextPage = function() { if (currentPageIndex < currentViewerPages.length - 1) { currentPageIndex++; renderViewerPage(); } };
  window.closeViewer = function() { document.getElementById('viewerOverlay').classList.remove('active'); };

  refreshIcons();
</script>
</body>
</html>
