<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Institute of Board</title>
    
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 10 L92 85 H8 L50 10 Z' fill='%237A1F2B'/%3E%3Cpath d='M50 32 L77 78 H23 L50 32 Z' fill='%23FFFFFF'/%3E%3C/svg%3E">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
    :root {
        --white: #FFF; --black: #111; --gray: #A1A1AA; --silver: #333;
        --maroon: #7A1F2B; --maroon-hover: #5A1620; 
        --dark-bg: #111111; --dark-card: #1F1F1F;
        --green: #15803D; --red: #DC2626;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; overflow-x: hidden; width: 100%; }
    body { font-family: 'Inter', sans-serif; background: var(--dark-bg); color: var(--white); line-height: 1.6; overflow-x: hidden; position: relative; width: 100%; max-width: 100vw; }
    a { text-decoration: none; color: inherit; }

    /* ================= HEADER & HAMBURGER ================= */
    .header { position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; padding: 20px 48px; display: flex; justify-content: space-between; align-items: center; background: var(--black); border-bottom: 1px solid var(--silver); }
    .brand { display: flex; align-items: center; gap: 12px; z-index: 1001; }
    .brand-logo { width: 40px; height: 40px; background: var(--white); color: var(--maroon); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 900; flex-shrink: 0; }
    .brand-text { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; white-space: nowrap; }

    .hamburger { display: flex; flex-direction: column; gap: 6px; cursor: pointer; z-index: 1002; background: transparent; padding: 5px; border: none; margin-left: auto; }
    .hamburger span { display: block; width: 35px; height: 3px; background: var(--white); transition: 0.3s; border-radius: 2px; }
    .hamburger.active span:nth-child(1) { transform: translateY(9px) rotate(45deg); }
    .hamburger.active span:nth-child(2) { opacity: 0; }
    .hamburger.active span:nth-child(3) { transform: translateY(-9px) rotate(-45deg); }

    .mobile-menu { position: fixed; inset: 0; width: 100%; height: 100vh; background: var(--dark-bg); z-index: 999; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 30px; opacity: 0; pointer-events: none; transition: 0.4s ease; }
    .mobile-menu.active { opacity: 1; pointer-events: auto; }
    .mobile-menu a { font-size: 28px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: var(--white); transition: 0.2s; text-align: center; }
    .mobile-menu a:hover { color: var(--maroon); }

    /* ================= DASHBOARD LAYOUT ================= */
    .dash-container { max-width: 1200px; margin: 0 auto; width: 100%; padding: 120px 48px 80px; }
    .dash-header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid var(--silver); padding-bottom: 30px; margin-bottom: 40px; flex-wrap: wrap; gap: 20px; }
    .profile-block { display: flex; gap: 20px; align-items: center; }
    .profile-icon { width: 80px; height: 80px; border-radius: 50%; background: var(--maroon); color: var(--white); display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 900; flex-shrink: 0; }
    .dash-name { font-size: 32px; font-weight: 900; text-transform: uppercase; line-height: 1.1; }
    .id-badges { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    .badge { background: #000; border: 1px solid var(--silver); padding: 6px 12px; font-size: 12px; font-weight: 700; color: var(--maroon); }
    
    .dash-content { display: grid; grid-template-columns: 1fr 2fr; gap: 40px; align-items: start; }
    .dash-section h3 { font-size: 20px; font-weight: 800; text-transform: uppercase; margin-bottom: 20px; color: var(--gray); letter-spacing: 1px; }
    .course-pill { display: flex; justify-content: space-between; align-items: center; padding: 20px; border: 1px solid var(--silver); border-left: 4px solid var(--maroon); margin-bottom: 15px; background: var(--dark-card); }
    .course-pill span { font-weight: 800; font-size: 18px; }

    /* RESOURCE CARDS */
    .session-card { background: var(--dark-card); border: 1px solid var(--silver); padding: 30px; margin-bottom: 20px; transition: 0.3s; }
    .session-card:hover { border-color: var(--maroon); }
    .session-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 15px; }
    .session-title { font-size: 24px; font-weight: 900; text-transform: uppercase; }
    .session-badge { background: var(--maroon); color: var(--white); padding: 4px 10px; font-size: 12px; font-weight: 700; letter-spacing: 1px; }
    .resource-item { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid #222; color: var(--white); }
    .resource-item:last-child { border-bottom: none; padding-bottom: 0; }
    .resource-name { display: flex; align-items: center; gap: 12px; font-weight: 600; }
    .resource-name i { color: var(--maroon); }
    .btn-download { background: transparent; border: 1px solid var(--gray); color: var(--gray); padding: 6px 12px; font-size: 12px; cursor: pointer; transition: 0.2s; }
    .btn-download:hover { border-color: var(--white); color: var(--white); }

    /* ADMIN PANEL */
    .admin-panel { background: rgba(122, 31, 43, 0.1); border: 2px dashed var(--maroon); padding: 20px; margin-bottom: 30px; display: none; }
    .admin-panel h4 { color: var(--maroon); font-size: 16px; font-weight: 900; text-transform: uppercase; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .admin-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-admin { background: var(--maroon); color: var(--white); padding: 10px 20px; font-size: 12px; font-weight: 700; border: none; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
    .btn-admin:hover { background: var(--maroon-hover); }

    /* WHATSAPP-STYLE EXAM LIST */
    .wa-list { background: var(--dark-card); border: 1px solid var(--silver); margin-bottom: 20px; display: none; }
    .wa-list.active { display: block; }
    .wa-header { background: #000; padding: 15px 20px; font-weight: 900; text-transform: uppercase; font-size: 14px; border-bottom: 1px solid var(--silver); display: flex; justify-content: space-between; align-items: center; }
    .wa-item { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid #222; cursor: pointer; transition: 0.2s; }
    .wa-item:hover { background: rgba(255,255,255,0.03); }
    .wa-item:last-child { border-bottom: none; }
    .wa-info h5 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .wa-info p { font-size: 12px; color: var(--gray); }
    .wa-status { padding: 4px 10px; font-size: 11px; font-weight: 800; text-transform: uppercase; border-radius: 4px; }
    .status-live { background: rgba(21, 128, 61, 0.2); color: #4ADE80; border: 1px solid #15803D; }
    .status-upcoming { background: rgba(161, 161, 170, 0.2); color: #D4D4D8; border: 1px solid #52525B; }
    .status-closed { background: rgba(220, 38, 38, 0.2); color: #F87171; border: 1px solid #DC2626; }

    /* MODALS */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 10000; display: none; justify-content: center; align-items: center; padding: 24px; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: var(--dark-card); border: 1px solid var(--silver); padding: 40px; max-width: 500px; width: 100%; border-top: 6px solid var(--maroon); position: relative; }
    .modal-content h2 { font-size: 24px; font-weight: 900; text-transform: uppercase; margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 8px; text-transform: uppercase; color: var(--gray); }
    .form-group input, .form-group select { width: 100%; padding: 14px; background: var(--dark-bg); border: 1px solid var(--silver); color: var(--white); font-family: 'Inter', sans-serif; font-size: 14px; }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--maroon); }
    .btn-submit { width: 100%; padding: 16px; background: var(--maroon); color: var(--white); font-size: 14px; font-weight: 900; text-transform: uppercase; border: none; cursor: pointer; margin-top: 10px; }
    .close-modal { position: absolute; top: 20px; right: 20px; background: none; border: none; color: var(--gray); cursor: pointer; }

    @media (max-width: 900px) {
        .header, .dash-container { padding-left: 24px; padding-right: 24px; }
        .dash-header { flex-direction: column; align-items: flex-start; }
        .dash-content { grid-template-columns: 1fr; }
    }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <a href="index.html" class="brand">
            <div class="brand-logo">∆</div>
            <div class="brand-text">IFB ACADEMY</div>
        </a>
        <!-- Three Lines Button -->
        <button class="hamburger" id="hamburgerBtn" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </button>
    </header>

    <!-- DROP DOWN MENU -->
    <div class="mobile-menu" id="mobileMenu">
        <a href="index.html" onclick="toggleMenu()">Home</a>
        <a href="dashboard.html" onclick="toggleMenu()">My Dashboard</a>
        <a href="settings.html">Settings</a>
        <a href="#" onclick="logout(); toggleMenu();">Logout</a>
    </div>

    <!-- UPLOAD RESOURCE MODAL -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal-content">
            <button class="close-modal" onclick="document.getElementById('uploadModal').classList.remove('active')"><i data-lucide="x"></i></button>
            <h2>Upload Resource</h2>
            <form id="uploadForm" onsubmit="handleUpload(event)">
                <div class="form-group">
                    <label>Document Title</label>
                    <input type="text" id="resTitle" required placeholder="e.g. AE Timetable 2027">
                </div>
                <div class="form-group">
                    <label>Exam Session</label>
                    <select id="resSession" required>
                        <option value="AE">Admissions Exam (AE)</option>
                        <option value="MayJun">May/June</option>
                        <option value="NovDec">Nov/Dec</option>
                        <option value="General">General</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Target Course</label>
                    <select id="resCourse" required>
                        <option value="ALL">All Students</option>
                        <option value="MAT">Mathematics Only</option>
                        <option value="WEB">Web Development Only</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>File URL (HTML Link)</label>
                    <input type="url" id="resUrl" required placeholder="https://ifb-nmaz.onrender.com/resources/...">
                </div>
                <button type="submit" class="btn-submit" id="uploadBtn">Publish</button>
            </form>
        </div>
    </div>

    <!-- CREATE EXAM MODAL -->
    <div class="modal-overlay" id="createExamModal">
        <div class="modal-content">
            <button class="close-modal" onclick="document.getElementById('createExamModal').classList.remove('active')"><i data-lucide="x"></i></button>
            <h2>Create Exam Session</h2>
            <form id="createExamForm" onsubmit="handleCreateExam(event)">
                <div class="form-group">
                    <label>Session Name</label>
                    <input type="text" id="examName" required placeholder="e.g. AE Paper 2027">
                </div>
                <div class="form-group">
                    <label>Target Course</label>
                    <select id="examCourse" required>
                        <option value="MAT">Mathematics</option>
                        <option value="WEB">Web Development</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="examStatus" required>
                        <option value="upcoming">Upcoming (Locked)</option>
                        <option value="live">Live (Unlocked)</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit" id="createExamBtn">Create Session</button>
            </form>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div class="dash-container">
        <div class="dash-header">
            <div class="profile-block">
                <div class="profile-icon" id="dashProfileIcon">N</div>
                <div>
                    <div class="dash-name" id="dashName">Loading...</div>
                    <div class="id-badges">
                        <span class="badge">ID: <span id="dashStudentId">...</span></span>
                        <span class="badge">Exam No: <span id="dashExamNo">...</span></span>
                        <span class="badge" id="dashStatusBadge">Applicant</span>
                    </div>
                </div>
            </div>
            <div>
                <a href="settings.html" class="btn-download" style="padding: 10px 20px; font-size: 12px; border-color: var(--silver); color: var(--white); display: flex; align-items: center; gap: 8px;"><i data-lucide="settings" style="width: 16px;"></i> Settings</a>
            </div>
        </div>

        <!-- ADMIN PANEL -->
        <div class="admin-panel" id="adminPanel">
            <h4><i data-lucide="shield-alert" style="width: 18px;"></i> Admin Controls</h4>
            <div class="admin-buttons">
                <button class="btn-admin" onclick="document.getElementById('uploadModal').classList.add('active')"><i data-lucide="upload"></i> Upload Resources</button>
                <button class="btn-admin" onclick="toggleExamList()"><i data-lucide="calendar"></i> Manage Exam Sessions</button>
                <button class="btn-admin"><i data-lucide="users"></i> Manage Students</button>
            </div>

            <!-- WHATSAPP-STYLE EXAM LIST (Admin Only) -->
            <div class="wa-list" id="waExamList">
                <div class="wa-header">
                    <span>Live Exam Sessions</span>
                    <button class="btn-admin" style="padding: 4px 10px; font-size: 10px;" onclick="document.getElementById('createExamModal').classList.add('active')">+ New Session</button>
                </div>
                <div id="waSessionItems">
                    <!-- Rendered via JS -->
                </div>
            </div>
        </div>

        <!-- STUDENT DASHBOARD CONTENT -->
        <div class="dash-content">
            <div class="dash-section">
                <h3>My Programme</h3>
                <div id="dashMyCourses"></div>
            </div>
            <div class="dash-section">
                <h3>Exams & Resources</h3>
                <div id="dashResources">
                    <p style="color: var(--gray); font-size: 14px;">Checking for available documents...</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, collection, getDocs, addDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyA6HO7n6wCZEeCgKxJLjB-MjL0ZFGR7svU", authDomain: "nyldevcourses.firebaseapp.com", projectId: "nyldevcourses", storageBucket: "nyldevcourses.firebasestorage.app", messagingSenderId: "16687006873", appId: "1:16687006873:web:b7d66ad1024ccd92722408" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    if (window.lucide) lucide.createIcons();

    let currentUser = null;
    let userData = null;
    let isAdmin = false;

    // HEADER & MENU
    window.toggleMenu = function() {
        document.getElementById('mobileMenu').classList.toggle('active');
        document.getElementById('hamburgerBtn').classList.toggle('active');
    };

    window.logout = async function() {
        await signOut(auth);
        window.location.href = "index.html";
    };

    window.toggleExamList = function() {
        document.getElementById('waExamList').classList.toggle('active');
    };

    // AUTH STATE
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUser = user;
            const docRef = doc(db, "users", user.uid);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                userData = docSnap.data();
                populateDashboard();
                fetchResources();

                if (user.email === "n1nathaniel971@gmail.com") {
                    isAdmin = true;
                    document.getElementById('adminPanel').style.display = 'block';
                    fetchAdminSessions();
                }
            } else {
                window.location.href = "apply.html";
            }
        } else {
            window.location.href = "index.html";
        }
    });

    function populateDashboard() {
        document.getElementById('dashName').innerText = `${userData.firstName} ${userData.lastName}`;
        document.getElementById('dashProfileIcon').innerText = userData.firstName.charAt(0).toUpperCase();
        document.getElementById('dashStudentId').innerText = userData.studentId || "PENDING";
        document.getElementById('dashExamNo').innerText = userData.examinationNumber || "Not Issued";
        document.getElementById('dashStatusBadge').innerText = userData.status || "Applicant";

        const courseContainer = document.getElementById('dashMyCourses');
        courseContainer.innerHTML = '';
        if (userData.courses && userData.courses.length > 0) {
            const courseCode = userData.courses[0]; 
            const courseName = courseCode === 'MAT' ? 'IFB—Mathematics' : 'IFB—Web Development';
            courseContainer.innerHTML = `
                <div class="course-pill">
                    <span>${courseName}</span> 
                    <i data-lucide="check-circle" style="color: var(--maroon);"></i>
                </div>`;
        } else {
            courseContainer.innerHTML = '<p style="color: var(--gray);">No programme selected.</p>';
        }
        if (window.lucide) lucide.createIcons();
    }

    // STUDENT RESOURCES
    async function fetchResources() {
        const resContainer = document.getElementById('dashResources');
        
        try {
            const querySnapshot = await getDocs(collection(db, "resources"));
            
            if (querySnapshot.empty) {
                resContainer.innerHTML = '<p style="color: var(--gray); font-size: 14px;">No resources uploaded yet.</p>';
                return;
            }

            const sessions = {};

            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const isForMyCourse = data.course === 'ALL' || (userData.courses && userData.courses.includes(data.course));
                const hasAccess = isForMyCourse || isAdmin;

                if (hasAccess) {
                    const session = data.session || 'General';
                    if (!sessions[session]) sessions[session] = [];
                    sessions[session].push(data);
                }
            });

            resContainer.innerHTML = '';
            let hasResources = false;

            const sessionOrder = { 'AE': 1, 'MayJun': 2, 'NovDec': 3, 'General': 4 };
            const sortedSessions = Object.keys(sessions).sort((a, b) => (sessionOrder[a] || 99) - (sessionOrder[b] || 99));

            sortedSessions.forEach(sessionName => {
                hasResources = true;
                let displayTitle = sessionName;
                if (sessionName === 'AE') displayTitle = 'Admissions Examination (AE)';
                if (sessionName === 'MayJun') displayTitle = 'May/June Examinations';
                if (sessionName === 'NovDec') displayTitle = 'Nov/Dec Examinations';
                if (sessionName === 'General') displayTitle = 'General Documents';

                let cardHtml = `
                    <div class="session-card">
                        <div class="session-header">
                            <div class="session-title">${displayTitle}</div>
                            <div class="session-badge">2027</div>
                        </div>
                        <div>
                `;

                sessions[sessionName].forEach(res => {
                    cardHtml += `
                        <div class="resource-item">
                            <div class="resource-name">
                                <i data-lucide="file-text"></i> ${res.title}
                            </div>
                            <a href="${res.fileUrl}" target="_blank" class="btn-download">Download</a>
                        </div>
                    `;
                });

                cardHtml += `</div></div>`;
                resContainer.innerHTML += cardHtml;
            });

            if (!hasResources) {
                resContainer.innerHTML = '<p style="color: var(--gray); font-size: 14px;">No resources available for your programme yet.</p>';
            }

            if (window.lucide) lucide.createIcons();

        } catch (error) {
            console.error("Error fetching resources:", error);
            resContainer.innerHTML = '<p style="color: var(--maroon);">Error loading resources.</p>';
        }
    }

    // ADMIN UPLOAD LOGIC
    window.handleUpload = async function(e) {
        e.preventDefault();
        const btn = document.getElementById('uploadBtn');
        btn.innerText = "Publishing...";
        btn.disabled = true;

        const newResource = {
            title: document.getElementById('resTitle').value,
            session: document.getElementById('resSession').value,
            course: document.getElementById('resCourse').value,
            fileUrl: document.getElementById('resUrl').value,
            uploadedAt: new Date().toISOString()
        };

        try {
            await addDoc(collection(db, "resources"), newResource);
            document.getElementById('uploadModal').classList.remove('active');
            document.getElementById('uploadForm').reset();
            fetchResources(); 
            btn.innerText = "Publish";
            btn.disabled = false;
        } catch (error) {
            alert("Error uploading resource: " + error.message);
            btn.innerText = "Publish";
            btn.disabled = false;
        }
    };

    // ADMIN EXAM SESSIONS
    async function fetchAdminSessions() {
        try {
            const querySnapshot = await getDocs(collection(db, "examSessions"));
            const container = document.getElementById('waSessionItems');
            container.innerHTML = '';

            if (querySnapshot.empty) {
                container.innerHTML = '<div style="padding: 20px; font-size: 13px; color: var(--gray);">No sessions created yet.</div>';
                return;
            }

            querySnapshot.forEach((docSnap) => {
                const data = docSnap.data();
                let statusClass = 'status-upcoming';
                let statusText = 'Upcoming';
                if (data.status === 'live') { statusClass = 'status-live'; statusText = 'Live Now'; }
                if (data.status === 'closed') { statusClass = 'status-closed'; statusText = 'Closed'; }

                container.innerHTML += `
                    <div class="wa-item">
                        <div class="wa-info">
                            <h5>${data.name} (${data.course})</h5>
                            <p>Code: <strong>${data.code}</strong></p>
                        </div>
                        <div class="${statusClass} wa-status" onclick="toggleSessionStatus('${docSnap.id}', '${data.status}')">
                            ${statusText}
                        </div>
                    </div>
                `;
            });
        } catch (e) {
            console.error(e);
        }
    }

    window.handleCreateExam = async function(e) {
        e.preventDefault();
        const btn = document.getElementById('createExamBtn');
        btn.innerText = "Creating...";
        btn.disabled = true;

        const code = Math.random().toString(36).substring(2, 8).toUpperCase();

        const newSession = {
            name: document.getElementById('examName').value,
            course: document.getElementById('examCourse').value,
            status: document.getElementById('examStatus').value,
            code: code,
            createdAt: new Date().toISOString()
        };

        try {
            await addDoc(collection(db, "examSessions"), newSession);
            document.getElementById('createExamModal').classList.remove('active');
            document.getElementById('createExamForm').reset();
            fetchAdminSessions();
            btn.innerText = "Create Session";
            btn.disabled = false;
        } catch (error) {
            alert("Error creating exam: " + error.message);
            btn.innerText = "Create Session";
            btn.disabled = false;
        }
    };

    window.toggleSessionStatus = async function(docId, currentStatus) {
        let newStatus = 'live';
        if (currentStatus === 'live') newStatus = 'closed';
        if (currentStatus === 'closed') newStatus = 'upcoming';

        try {
            const sessionRef = doc(db, "examSessions", docId);
