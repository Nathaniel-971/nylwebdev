<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Course — Nyl Dev</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --black:#0d0d0d; --white:#fff; --grey:#6b6b6b; --light:#f5f5f5; --line:#e5e5e5; --mid:#333; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--light); color: var(--black); line-height:1.6; -webkit-font-smoothing:antialiased; padding-bottom:60px; }
  @keyframes blink { 0%,50%{opacity:1} 51%,100%{opacity:0} }
  @keyframes fadeUp { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform: translateY(0); } }
  nav { background: var(--white); border-bottom:1px solid var(--line); padding:14px 24px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:100; }
  .logo { font-family:'Courier New',monospace; font-size:26px; font-weight:700; letter-spacing:-2px; text-decoration:none; color: var(--black); display:flex; align-items:center; }
  .logo .cursor { width:12px; height:24px; background: var(--black); margin-left:2px; animation: blink 1.1s step-end infinite; }
  .nav-right { display:flex; align-items:center; gap:8px; }
  .nav-icon { width:38px; height:38px; border-radius:10px; background: var(--white); border:1px solid var(--line); cursor:pointer; display:flex; align-items:center; justify-content:center; text-decoration:none; color: var(--black); transition: all .2s; }
  .nav-icon:hover { border-color: var(--black); background: var(--light); }
  .nav-icon svg { width:16px; height:16px; }
  .nav-avatar { width:38px; height:38px; border-radius:10px; overflow:hidden; border:1px solid var(--line); cursor:pointer; background: var(--white); padding:0; }
  .nav-avatar canvas { width:100%; height:100%; display:block; }
  .container { max-width:900px; margin:0 auto; padding:32px 20px; }
  h1 { font-size: clamp(24px, 5vw, 34px); letter-spacing:-1px; margin-bottom:6px; }
  .sub { color: var(--grey); font-size:14.5px; margin-bottom:28px; }
  .card { background: var(--white); border:1px solid var(--line); border-radius:14px; padding:24px; margin-bottom:16px; animation: fadeUp .4s ease both; }
  .card .label { font-size:11.5px; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; color: var(--grey); margin-bottom:14px; display:flex; align-items:center; gap:7px; }
  .card .label svg { width:14px; height:14px; }
  .curriculum-hero { background: var(--black); color: var(--white); border:none; }
  .curriculum-hero .label { color: rgba(255,255,255,.55); }
  .curriculum-hero .c-name { font-size: 28px; font-weight: 700; letter-spacing: -1px; margin-bottom:6px; }
  .curriculum-hero .c-desc { font-size: 14px; color: rgba(255,255,255,.7); }
  .id-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .id-cell { padding:16px; border:1px solid var(--line); border-radius:10px; background: var(--light); }
  .id-cell .k { font-size:10.5px; letter-spacing:1.5px; text-transform:uppercase; color: var(--grey); font-weight:600; margin-bottom:6px; }
  .id-cell .v { font-family:'Courier New',monospace; font-size:20px; font-weight:700; letter-spacing:1px; }
  .id-cell .v.pending { font-family:inherit; font-size:13.5px; letter-spacing:0; color:#b86e00; font-weight:600; }
  .info-row { display:flex; justify-content:space-between; align-items:baseline; padding:11px 0; border-bottom:1px solid var(--line); font-size:14.5px; gap:14px; }
  .info-row:last-child { border-bottom:none; }
  .info-row .k { color: var(--grey); display:flex; align-items:center; gap:7px; }
  .info-row .k svg { width:14px; height:14px; }
  .info-row .v { font-weight:600; text-align:right; }
  .status-badge { display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600; padding:4px 11px; border-radius:100px; }
  .status-badge svg { width:12px; height:12px; }
  .status-badge.pending { background:#fff4e5; color:#b86e00; }
  .status-badge.approved { background:#e6f5ec; color:#16794a; }
  .status-badge.revoked { background:#fef2f2; color:#b91c1c; }
  .subject-list { list-style:none; }
  .subject-list li { padding:10px 0; border-bottom:1px solid var(--line); font-size:13.5px; display:flex; justify-content:space-between; gap:12px; align-items:center; }
  .subject-list li:last-child { border-bottom:none; }
  .subject-list .pill { font-size:10.5px; font-weight:600; padding:3px 9px; border-radius:100px; background: var(--light); color: var(--grey); white-space:nowrap; }
  .subject-list .pill.elective { background:#eef2ff; color:#3730a3; }
  .exam-list { list-style:none; }
  .exam-list li { padding:11px 0; border-bottom:1px solid var(--line); font-size:13.5px; display:flex; justify-content:space-between; gap:12px; align-items:center; }
  .exam-list li:last-child { border-bottom:none; }
  .exam-list .exam-name { font-weight:600; }
  .exam-list .exam-meta { color: var(--grey); font-size:12px; white-space:nowrap; }
  .danger-card { border-color:#fecaca; }
  .danger-card .label { color:#b91c1c; }
  .danger-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
  .btn-danger { padding:11px 18px; font-size:13.5px; font-weight:600; border-radius:9px; border:1.5px solid #fecaca; background: var(--white); color:#b91c1c; cursor:pointer; font-family:inherit; display:inline-flex; align-items:center; gap:8px; transition: all .2s; }
  .btn-danger svg { width:15px; height:15px; }
  .btn-danger:hover { background:#fef2f2; border-color:#b91c1c; }
  .btn-danger:disabled { opacity:.45; cursor:not-allowed; }
  .loading { text-align:center; padding:80px 20px; color: var(--grey); }
  .print-btn { position:fixed; bottom:24px; right:24px; z-index:50; padding:13px 20px; background: var(--black); color: var(--white); border:none; border-radius:100px; font-size:13.5px; font-weight:600; cursor:pointer; font-family:inherit; box-shadow: 0 10px 30px rgba(0,0,0,.2); display:none; align-items:center; gap:8px; }
  .print-btn svg { width:16px; height:16px; }
  .print-btn:hover { background: var(--mid); }
  @media (max-width:500px) { nav { padding:12px 16px; } .container { padding:24px 16px; } .card { padding:20px 16px; } .id-grid { grid-template-columns:1fr; } }
  @media print { body { background: var(--white); padding:0; } nav, .print-btn, .danger-card, .no-print { display:none !important; } .container { max-width:100%; padding:0; } .card { border:1px solid #ccc; page-break-inside: avoid; } @page { size: A4; margin: 18mm; } }
</style>
</head>
<body>

<nav>
  <a href="/" class="logo"><span>^</span><span class="cursor"></span></a>
  <div class="nav-right">
    <a href="past-papers.html" class="nav-icon" title="Past Papers"><i data-lucide="file-text"></i></a>
    <a href="messages.html" class="nav-icon" title="Message us"><i data-lucide="message-square"></i></a>
    <a href="settings.html" class="nav-icon" title="Settings"><i data-lucide="settings"></i></a>
    <button class="nav-avatar" id="navAvatar" title="Profile"></button>
    <a href="#" class="nav-icon" id="signout" title="Sign out"><i data-lucide="log-out"></i></a>
  </div>
</nav>

<div class="container" id="app"><div class="loading">Loading your course…</div></div>
<button class="print-btn" id="printBtn" onclick="window.print()"><i data-lucide="download"></i> Download A4 PDF</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA6HO7n6wCZEeCgKxJLjB-MjL0ZFGR7svU",
  authDomain: "nyldevcourses.firebaseapp.com",
  projectId: "nyldevcourses",
  storageBucket: "nyldevcourses.firebasestorage.app",
  messagingSenderId: "16687006873",
  appId: "1:16687006873:web:b7d66ad1024ccd92722408"
};
const ADMIN_EMAIL = "n1nathaniel971@gmail.com";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const CURRICULUM = {
  fullstack: { name:'Full Stack Engineering', compulsory:['Mathematics','Git & GitHub','HTML5 & CSS3','JavaScript Fundamentals','Node.js Core','Databases Core'] },
  frontend:  { name:'Frontend Craft', compulsory:['Mathematics','Git & GitHub','HTML5 & CSS3','JavaScript Fundamentals','Advanced JavaScript','Responsive Design'] },
  backend:   { name:'Backend Engineering', compulsory:['Mathematics','Git & GitHub','JavaScript Fundamentals','Node.js','Express','Databases (SQL)'] },
  webdesign: { name:'Web Design', compulsory:['Mathematics','HTML5 & CSS3','Responsive Design','UI/UX Fundamentals','Typography & Colour','Figma'] },
  uiux:      { name:'UI/UX Design', compulsory:['Mathematics','UI/UX Fundamentals','Figma','Typography & Colour','User Research','Responsive Design'] },
  stem:      { name:'STEM & Physics', compulsory:['Mathematics','Mechanics','Thermodynamics','Waves & Optics','Electromagnetism','Modern Physics'] }
};

const CURRICULUM_META = {
  '6':  { name:'IPI', full:'IPI — Intensive Programme of Instruction', desc:'6-month fast track · 2 major exams · 4–8 papers per exam · Non-accredited' },
  '12': { name:'ACC', full:'ACC — Applied Competence Certificate',     desc:'12-month full programme · 3 major exams · 4–8 papers per exam · Non-accredited' }
};

function generateAvatar(uid) {
  let hash = 0;
  for (let i = 0; i < uid.length; i++) { hash = ((hash << 5) - hash) + uid.charCodeAt(i); hash |= 0; }
  const size = 5, cells = [];
  for (let i = 0; i < size * size; i++) cells.push(((hash >> (i % 28)) & 3) > 0 ? 1 : 0);
  const grid = [];
  for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) grid.push(cells[r * size + Math.min(c, size - 1 - c)]);
  return { grid, hue: Math.abs(hash) % 360, size };
}
function paintAvatar(canvas, uid) {
  const { grid, hue, size } = generateAvatar(uid);
  const ctx = canvas.getContext('2d'); const px = 40;
  canvas.width = size * px; canvas.height = size * px;
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  grid.forEach((v, i) => {
    if (v) { const shade = Math.round(60 + (i % 3) * 15); ctx.fillStyle = `hsl(${hue}, 8%, ${shade}%)`; const r = Math.floor(i / size), c = i % size; ctx.fillRect(c * px, r * px, px, px); }
  });
}
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = 'auth.html'; return; }
  if (user.email === ADMIN_EMAIL) { window.location.href = 'admin.html'; return; }

  const navAvatar = document.getElementById('navAvatar');
  const canvas = document.createElement('canvas');
  navAvatar.innerHTML = ''; navAvatar.appendChild(canvas);
  paintAvatar(canvas, user.uid);

  const ref = doc(db, 'users', user.uid);
  const snap = await getDoc(ref);
  const data = snap.exists() ? snap.data() : {};

  if (!data.course) { window.location.href = 'curriculum.html'; return; }
  renderPortal(user, data, ref);
});

function renderPortal(user, data, ref) {
  const status = data.status || 'pending';
  const stream = CURRICULUM[data.course];
  const compulsory = stream?.compulsory || [];
  const electives = data.electives || [];
  const statusIcon = status === 'approved' ? 'circle-check' : status === 'revoked' ? 'circle-x' : 'clock';
  const meta = CURRICULUM_META[data.duration] || { name:'—', full:'—', desc:'—' };
  const is12 = data.duration === '12';

  const examRows = is12
    ? `
      <li><span class="exam-name">FCC / IFB</span><span class="exam-meta">May / June 2027 · Mathematics · 150 marks</span></li>
      <li><span class="exam-name">Interim Examination</span><span class="exam-meta">September 2027 · Targeted revision · 100 marks</span></li>
      <li><span class="exam-name">ACC / IFB Final</span><span class="exam-meta">Oct / Nov 2027 · 150 marks per paper</span></li>
    `
    : `
      <li><span class="exam-name">IPI FCC</span><span class="exam-meta">May / June 2027 · Mathematics · 150 marks</span></li>
      <li><span class="exam-name">IPI Final</span><span class="exam-meta">June / July 2027 · 150 marks per paper</span></li>
    `;

  document.getElementById('app').innerHTML = `
    <h1>Hello, ${esc((data.name || user.email).split(' ')[0])}</h1>
    <p class="sub">Your course at a glance — 2027 intake</p>

    <div class="card curriculum-hero">
      <div class="label"><i data-lucide="award"></i> Your Curriculum</div>
      <div class="c-name">${esc(meta.full)}</div>
      <div class="c-desc">${esc(meta.desc)}</div>
    </div>

    <div class="card">
      <div class="label"><i data-lucide="fingerprint"></i> Student Identifiers</div>
      <div class="id-grid">
        <div class="id-cell"><div class="k">Student Number</div><div class="v ${data.studentNumber ? '' : 'pending'}">${data.studentNumber ? esc(data.studentNumber) : 'Pending'}</div></div>
        <div class="id-cell"><div class="k">Examination Number</div><div class="v ${data.examinationNumber ? '' : 'pending'}">${data.examinationNumber ? esc(data.examinationNumber) : 'Issued at exams'}</div></div>
      </div>
    </div>

    <div class="card">
      <div class="label"><i data-lucide="activity"></i> Application State</div>
      <div class="info-row"><span class="k"><i data-lucide="circle-dot"></i> Status</span><span class="v"><span class="status-badge ${status}"><i data-lucide="${statusIcon}"></i> ${status}</span></span></div>
      <div class="info-row"><span class="k"><i data-lucide="layout-grid"></i> Stream</span><span class="v">${esc(stream?.name || '—')}</span></div>
      <div class="info-row"><span class="k"><i data-lucide="clock"></i> Duration</span><span class="v">${data.duration ? data.duration + ' months' : '—'}</span></div>
      <div class="info-row"><span class="k"><i data-lucide="calendar-x"></i> Administration closes</span><span class="v">14 February 2027</span></div>
      <div class="info-row"><span class="k"><i data-lucide="calendar-check"></i> Courses begin</span><span class="v">January / February 2027</span></div>
    </div>

    <div class="card">
      <div class="label"><i data-lucide="user"></i> Personal Information</div>
      <div class="info-row"><span class="k"><i data-lucide="user"></i> Full name</span><span class="v">${esc(data.name || '—')}</span></div>
      <div class="info-row"><span class="k"><i data-lucide="mail"></i> Email</span><span class="v">${esc(data.email || user.email)}</span></div>
      <p style="font-size:12.5px; color:var(--grey); margin-top:12px;">Personal information cannot be edited.</p>
    </div>

    <div class="card">
      <div class="label"><i data-lucide="list-checks"></i> Subjects — 6 Compulsory · 2 Electives</div>
      <ul class="subject-list">
        ${compulsory.map(s => `<li>${esc(s)} <span class="pill">Compulsory</span></li>`).join('')}
        ${electives.map(e => `<li>${esc(e)} <span class="pill elective">Elective</span></li>`).join('')}
      </ul>
    </div>

    <div class="card">
      <div class="label"><i data-lucide="clipboard-list"></i> Examinations — ${is12 ? '3' : '2'} papers · Set by our department</div>
      <ul class="exam-list">${examRows}</ul>
      <p style="font-size:12.5px; color:var(--grey); margin-top:12px;">Each exam contains 4–8 papers. All papers are set by our department. Non-accredited.</p>
    </div>

    <div class="card">
      <div class="label"><i data-lucide="calendar"></i> Important Dates — 2027</div>
      <div class="info-row"><span class="k"><i data-lucide="calendar-x"></i> Administration closes</span><span class="v">14 February 2027</span></div>
      <div class="info-row"><span class="k"><i data-lucide="calendar-check"></i> Courses begin</span><span class="v">January / February 2027</span></div>
      <div class="info-row"><span class="k"><i data-lucide="wallet"></i> Cost</span><span class="v">Free</span></div>
    </div>

    <div class="card danger-card no-print">
      <div class="label"><i data-lucide="alert-triangle"></i> Application Controls</div>
      <p style="font-size:13.5px; color:var(--grey); margin-bottom:8px;">These actions are permanent.</p>
      <div class="danger-actions">
        <button class="btn-danger" id="revokeBtn"><i data-lucide="ban"></i> Revoke my application</button>
        <button class="btn-danger" id="deregisterBtn" ${status === 'approved' ? 'disabled' : ''}><i data-lucide="trash-2"></i> ${status === 'approved' ? 'Deregister (locked during courses)' : 'Deregister'}</button>
      </div>
    </div>
  `;
  if (window.lucide) lucide.createIcons();
  document.getElementById('printBtn').style.display = 'inline-flex';

  document.getElementById('revokeBtn').addEventListener('click', async () => {
    if (!confirm('Revoke your application? This cannot be undone.')) return;
    await updateDoc(ref, { status: 'revoked', revokedAt: serverTimestamp() });
    alert('Application revoked.'); location.reload();
  });

  const d = document.getElementById('deregisterBtn');
  if (d && !d.disabled) d.addEventListener('click', async () => {
    if (!confirm('Deregister? This removes your account.')) return;
    await updateDoc(ref, { status: 'deregistered', deregisteredAt: serverTimestamp() });
    await signOut(auth); window.location.href = '/';
  });
}

document.getElementById('signout').addEventListener('click', async (e) => {
  e.preventDefault(); await signOut(auth); window.location.href = '/';
});

if (window.lucide) lucide.createIcons();
</script>
</body>
</html>
