<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admission Slip</title>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
@page{size:A4;margin:0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#e0e0e0;font-family:'Times New Roman',Times,serif;color:#000}
.page{width:210mm;height:297mm;padding:15mm 18mm 20mm 18mm;margin:20px auto;position:relative;background:#fff;display:flex;flex-direction:column;border:3px solid #000;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.2)}
@media print{body{background:#fff}.page{margin:0;box-shadow:none}.no-print{display:none!important}}
.watermark-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-45deg);font-size:80pt;font-weight:900;color:rgba(0,0,0,0.04);letter-spacing:25px;pointer-events:none;z-index:0;white-space:nowrap}
.watermark-grid{position:absolute;inset:0;background-image:repeating-linear-gradient(45deg,rgba(0,0,0,0.015) 0 1px,transparent 1px 15px),repeating-linear-gradient(-45deg,rgba(0,0,0,0.015) 0 1px,transparent 1px 15px);pointer-events:none;z-index:0}
.content{position:relative;z-index:1;display:flex;flex-direction:column;flex:1}
.cover{display:flex;flex-direction:column;align-items:center;flex:1;text-align:center}
.confidential{font-size:11pt;font-style:italic;margin-bottom:20px;letter-spacing:1px}
.badge{width:130px;height:195px;flex-shrink:0;margin-bottom:12px}
.header-text{text-align:center;margin-bottom:24px}
.header-text .main{font-size:24pt;font-weight:700;letter-spacing:2px;line-height:1.1}
.header-text .sub{font-size:11pt;margin-top:4px}
.header-text .sub strong{font-weight:700;font-size:12pt}
.doc-block{background:#000;color:#fff;padding:12px 40px;border-radius:8px;font-weight:700;font-size:16pt;letter-spacing:1px;line-height:1.3;margin:20px 0;display:inline-block}
.detail-block{border:2px solid #000;padding:20px 26px;width:90%;background:#fff9c4;border-radius:10px;margin-bottom:20px;text-align:left}
.detail-block .row{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px dashed rgba(0,0,0,.15);font-size:11pt}
.detail-block .row:last-child{border-bottom:none}
.detail-block .row .k{font-size:9.5pt;letter-spacing:1.5px;text-transform:uppercase;color:#444;font-weight:700;font-family:'Courier New',monospace}
.detail-block .row .v{font-weight:700;text-align:right}
.detail-block .row .v.mono{font-family:'Courier New',monospace;letter-spacing:1px}
.papers-block{width:90%;text-align:left;margin-bottom:16px}
.papers-block h3{font-size:10pt;letter-spacing:2px;text-transform:uppercase;color:#444;font-weight:700;margin-bottom:8px;font-family:'Courier New',monospace;border-bottom:1px solid #000;padding-bottom:6px}
.papers-block ul{list-style:none}
.papers-block li{font-size:11pt;padding:6px 0;border-bottom:1px dotted rgba(0,0,0,.2);display:flex;justify-content:space-between;gap:12px}
.papers-block li:last-child{border-bottom:none}
.papers-block .note{font-style:italic;color:#444;font-size:9.5pt}
.barcode-block{width:90%;text-align:center;margin-top:auto;margin-bottom:20px}
.barcode-block svg{width:100%;height:58px;display:block}
.barcode-num{font-family:'Courier New',monospace;font-size:10pt;letter-spacing:3px;margin-top:4px}
.page-footer{position:absolute;bottom:5mm;left:18mm;right:18mm;display:flex;justify-content:space-between;align-items:flex-end;z-index:5;font-size:10pt;font-style:italic}
.page-footer .right{text-align:right}
.actions{max-width:210mm;margin:20px auto 0;padding:0 18mm;display:flex;gap:10px;flex-wrap:wrap}
.btn{padding:12px 20px;font-size:13.5px;font-weight:600;border-radius:9px;border:1.5px solid #0d0d0d;background:#0d0d0d;color:#fff;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn:hover{background:#333}
.btn-ghost{background:#fff;color:#0d0d0d;border-color:#e5e5e5}
.btn-ghost:hover{border-color:#0d0d0d;background:#f5f5f5}
.loading{text-align:center;padding:80px 20px;color:#6b6b6b;font-family:-apple-system,sans-serif}
</style>
</head>
<body>

<div id="slipRoot"><div class="loading">Loading admission slip…</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyA6HO7n6wCZEeCgKxJLjB-MjL0ZFGR7svU", authDomain: "nyldevcourses.firebaseapp.com", projectId: "nyldevcourses", storageBucket: "nyldevcourses.firebasestorage.app", messagingSenderId: "16687006873", appId: "1:16687006873:web:b7d66ad1024ccd92722408" };
const ADMIN_EMAIL = "n1nathaniel971@gmail.com";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const CORE = ['Mathematics','Web Foundations','Programming Fundamentals'];
const STREAM_SUBJECTS = { fullstack:'Full Stack Systems', frontend:'Frontend Systems', backend:'Backend Systems', webdesign:'Visual Systems', uiux:'Experience Design', stem:'Physical Sciences' };
const STREAM_NAMES = { fullstack:'Full Stack Engineering', frontend:'Frontend Craft', backend:'Backend Engineering', webdesign:'Web Design', uiux:'UI/UX Design', stem:'STEM & Physics' };
const META = { '6':{name:'IPI',full:'Intensive Programme of Instruction'}, '12':{name:'ACC',full:'Applied Competence Certificate'} };

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href='auth.html'; return; }
  if (user.email === ADMIN_EMAIL) { window.location.href='admin.html'; return; }
  const snap = await getDoc(doc(db,'users',user.uid));
  if (!snap.exists()) { document.getElementById('slipRoot').innerHTML = '<div class="loading">No student record found.</div>'; return; }
  const data = snap.data();
  if (data.status !== 'approved' || !data.studentNumber) {
    document.getElementById('slipRoot').innerHTML = '<div class="loading">Your admission slip becomes available once your application is approved.</div>';
    return;
  }
  render(user, data);
});

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function render(user, data) {
  const examNum = data.examinationNumber || '—';
  const streamName = STREAM_NAMES[data.course] || '—';
  const streamSubject = STREAM_SUBJECTS[data.course] || '—';
  const electives = data.electives || [];
  const meta = META[data.duration] || { name:'—', full:'—' };
  const papers = [...CORE, streamSubject, ...electives];

  document.getElementById('slipRoot').innerHTML = `
    <div class="actions no-print">
      <button class="btn" id="printBtn"><i data-lucide="download"></i> Save as PDF</button>
      <button class="btn btn-ghost" id="copyBtn"><i data-lucide="copy"></i> Copy Exam Number</button>
      <a href="student-portal.html" class="btn btn-ghost"><i data-lucide="arrow-left"></i> Back</a>
    </div>

    <div class="page">
      <div class="watermark-grid"></div>
      <div class="watermark-text">ADMISSION SLIP</div>
      <div class="content">
        <div class="cover">
          <div class="confidential">Confidential</div>
          <svg class="badge" viewBox="0 0 240 360" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="sg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5d76e"/><stop offset="0.5" stop-color="#d4af37"/><stop offset="1" stop-color="#8f6b1a"/></linearGradient>
              <linearGradient id="sr1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a4a9e"/><stop offset="1" stop-color="#0f1f5c"/></linearGradient>
              <linearGradient id="ss1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f6f9"/><stop offset="1" stop-color="#a8b0bd"/></linearGradient>
            </defs>
            <path d="M 120 8 L 228 48 L 228 200 Q 228 310 120 348 Q 12 310 12 200 L 12 48 Z" fill="url(#sg1)"/>
            <path d="M 120 22 L 214 58 L 214 198 Q 214 300 120 334 Q 26 300 26 198 L 26 58 Z" fill="url(#sr1)"/>
            <path d="M 120 36 L 200 68 L 200 196 Q 200 290 120 320 Q 40 290 40 196 L 40 68 Z" fill="none" stroke="url(#ss1)" stroke-width="2.5"/>
            <path d="M 120 46 L 190 76 L 190 194 Q 190 282 120 310 Q 50 282 50 194 L 50 76 Z" fill="url(#sr1)"/>
            <path d="M 120 54 L 182 82 L 182 192 Q 182 276 120 302 Q 58 276 58 192 L 58 82 Z" fill="none" stroke="url(#ss1)" stroke-width="0.8" opacity="0.55"/>
            <path d="M 120 70 L 123.5 80 L 134 80 L 125.5 86.5 L 129 96 L 120 89.5 L 111 96 L 114.5 86.5 L 106 80 L 116.5 80 Z" fill="url(#sg1)"/>
            <path d="M 100 108 L 120 138 L 140 108" fill="none" stroke="url(#sg1)" stroke-width="4.5" stroke-linecap="square"/>
            <path d="M 66 190 Q 93 179 120 187 L 120 218 Q 93 210 66 221 Z" fill="url(#ss1)" stroke="#0f1f5c" stroke-width="1"/>
            <path d="M 174 190 Q 147 179 120 187 L 120 218 Q 147 210 174 221 Z" fill="url(#ss1)" stroke="#0f1f5c" stroke-width="1"/>
            <line x1="120" y1="187" x2="120" y2="218" stroke="#0f1f5c" stroke-width="1.2"/>
            <line x1="75" y1="197" x2="112" y2="194" stroke="#8b95a4" stroke-width="0.7"/>
            <line x1="75" y1="203" x2="112" y2="200" stroke="#8b95a4" stroke-width="0.7"/>
            <line x1="75" y1="209" x2="112" y2="206" stroke="#8b95a4" stroke-width="0.7"/>
            <line x1="128" y1="194" x2="165" y2="197" stroke="#8b95a4" stroke-width="0.7"/>
            <line x1="128" y1="200" x2="165" y2="203" stroke="#8b95a4" stroke-width="0.7"/>
            <line x1="128" y1="206" x2="165" y2="209" stroke="#8b95a4" stroke-width="0.7"/>
            <g transform="translate(120,262)">
              <circle cx="0" cy="0" r="16" fill="url(#ss1)" stroke="#0f1f5c" stroke-width="1"/>
              <ellipse cx="0" cy="0" rx="28" ry="9" fill="none" stroke="url(#sg1)" stroke-width="2" transform="rotate(-20)"/>
              <circle cx="-6" cy="-4" r="2.5" fill="#0f1f5c"/>
              <circle cx="7" cy="5" r="3" fill="#0f1f5c"/>
              <circle cx="-2" cy="8" r="1.5" fill="#0f1f5c"/>
            </g>
            <path d="M 28 308 L 212 308 L 212 334 Q 120 350 28 334 Z" fill="url(#sg1)" stroke="#0f1f5c" stroke-width="1.5"/>
            <text x="120" y="326" text-anchor="middle" font-family="'Times New Roman',serif" font-size="9.5" font-weight="700" fill="#0f1f5c" letter-spacing="1.2">SCIENCE · MATHEMATICS · CRAFT</text>
          </svg>
          <div class="header-text">
            <div class="main">ADMISSION SLIP</div>
            <div class="sub">Fellowship Certificate of Competence<br><strong>Republic of South Africa</strong></div>
          </div>
          <div class="doc-block">2027 Intake · ${esc(meta.name)}</div>
          <div class="detail-block">
            <div class="row"><span class="k">Candidate</span><span class="v">${esc(data.name||user.displayName||'—')}</span></div>
            <div class="row"><span class="k">Student №</span><span class="v mono">${esc(data.studentNumber)}</span></div>
            <div class="row"><span class="k">Examination №</span><span class="v mono">${esc(examNum)}</span></div>
            <div class="row"><span class="k">Programme</span><span class="v">${esc(meta.full)}</span></div>
            <div class="row"><span class="k">Stream</span><span class="v">${esc(streamName)}</span></div>
          </div>
          <div class="papers-block">
            <h3>Subjects &amp; Papers</h3>
            <ul>${papers.map(p=>`<li><span>${esc(p)}</span><span class="note">1 paper</span></li>`).join('')}</ul>
          </div>
          <div class="barcode-block">
            <svg id="barcodeSvg"></svg>
            <div class="barcode-num">${esc(examNum.replace(/(.{4})/g,'$1 ').trim())}</div>
          </div>
        </div>
        <div class="page-footer">
          <div>Non-accredited · Not NQF-registered</div>
          <div class="right">© 2026—2027</div>
        </div>
      </div>
    </div>
  `;
  if (window.lucide) lucide.createIcons();
  setTimeout(() => {
    if (typeof JsBarcode !== 'undefined' && examNum !== '—') {
      try { JsBarcode('#barcodeSvg', examNum, { format:'CODE128', width:2, height:58, displayValue:false, margin:0, background:'#ffffff', lineColor:'#000000' }); } catch(e){}
    }
  }, 150);
  document.getElementById('printBtn').addEventListener('click', () => window.print());
  document.getElementById('copyBtn').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(examNum); alert('Examination number copied.'); } catch(e) { alert('Could not copy.'); }
  });
}
if (window.lucide) lucide.createIcons();
</script>
</body>
</html>
