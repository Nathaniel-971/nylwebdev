<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admission Slip — Nyl Dev</title>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --black:#0d0d0d; --white:#fff; --grey:#6b6b6b; --light:#f5f5f5; --line:#e5e5e5; }
  body { background: var(--light); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; color: var(--black); padding:24px 16px 60px; }
  .slip-actions { max-width: 210mm; margin: 0 auto 16px; display:flex; gap:10px; flex-wrap:wrap; }
  .btn { padding:12px 20px; font-size:13.5px; font-weight:600; border-radius:9px; border:1.5px solid var(--black); background: var(--black); color: var(--white); cursor:pointer; font-family:inherit; display:inline-flex; align-items:center; gap:8px; text-decoration:none; }
  .btn svg { width:15px; height:15px; }
  .btn:hover { background: #333; }
  .btn-ghost { background: var(--white); color: var(--black); border-color: var(--line); }
  .btn-ghost:hover { border-color: var(--black); background: var(--light); }

  .slip { max-width: 210mm; margin: 0 auto; background: var(--white); border: 2px solid var(--black); padding: 16mm 14mm; position: relative; overflow: hidden; font-family:'Times New Roman', Times, serif; }
  .slip::after { content: "NYL DEV · IFB"; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%) rotate(-28deg); font-size: 60pt; font-weight: 900; color: rgba(0,0,0,.04); letter-spacing: 20px; white-space: nowrap; pointer-events:none; }
  .slip > * { position: relative; z-index: 1; }

  .slip-header { display:flex; align-items:center; gap: 16px; border-bottom: 2px solid var(--black); padding-bottom: 14px; margin-bottom: 18px; }
  .emblem { width: 64px; height: 64px; }
  .slip-header .title-block { flex: 1; }
  .slip-header .org { font-size: 18pt; font-weight: 700; letter-spacing: 1px; line-height: 1.1; }
  .slip-header .org-sub { font-size: 9pt; letter-spacing: 2px; color: var(--grey); text-transform: uppercase; margin-top: 3px; font-family:'Courier New',monospace; }
  .slip-header .doc-type { font-size: 10pt; letter-spacing: 4px; text-transform: uppercase; color: var(--black); margin-top: 8px; font-weight: 700; }

  .slip-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; font-size: 11pt; margin-bottom: 16px; }
  .slip-grid .k { font-size: 8.5pt; letter-spacing: 1.5px; text-transform: uppercase; color: var(--grey); font-weight: 700; margin-bottom: 2px; font-family:'Courier New',monospace; }
  .slip-grid .v { font-weight: 700; font-size: 11.5pt; word-break: break-word; }
  .slip-grid .v.mono { font-family:'Courier New', monospace; font-size: 11pt; letter-spacing: 1.5px; }
  .slip-grid .full { grid-column: 1/-1; }

  .papers-section { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 16px; }
  .papers-section h3 { font-size: 10pt; letter-spacing: 2px; text-transform: uppercase; color: var(--grey); font-weight: 700; margin-bottom: 12px; font-family:'Courier New',monospace; }
  .papers-list { list-style: none; }
  .papers-list li { font-size: 11pt; padding: 7px 0; border-bottom: 1px dotted var(--line); display: flex; justify-content: space-between; gap: 12px; }
  .papers-list li:last-child { border-bottom: none; }
  .papers-list .paper-name { font-weight: 700; }
  .papers-list .paper-note { color: var(--grey); font-size: 9.5pt; font-style: italic; }

  .slip-barcode { text-align: center; margin: 18px 0 8px; }
  .slip-barcode svg { width: 100%; height: 58px; display: block; }
  .slip-barcode-num { font-family:'Courier New', monospace; font-size: 10pt; letter-spacing: 3px; margin-top: 4px; }

  .slip-foot { border-top: 1px solid var(--line); margin-top: 18px; padding-top: 12px; font-size: 8.5pt; color: var(--grey); line-height: 1.6; text-align: center; }
  .slip-foot strong { color: var(--black); }
  .loading { text-align:center; padding:80px 20px; color: var(--grey); }

  @media print {
    body { background: #fff; padding: 0; }
    .slip-actions, .no-print { display: none !important; }
    .slip { border: 1.5px solid #000; max-width: 100%; padding: 12mm; margin: 0; }
    @page { size: A4; margin: 12mm; }
  }
  @media (max-width: 600px) { .slip { padding: 24px 20px; } .slip-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div id="slipRoot"><div class="loading">Loading admission slip…</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyA6HO7n6wCZEeCgKxJLjB-MjL0ZFGR7svU", authDomain: "nyldevcourses.firebaseapp.com", projectId: "nyldevcourses", storageBucket: "nyldevcourses.firebasestorage.app", messagingSenderId: "16687006873", appId: "1:16687006873:web:b7d66ad1024ccd92722408" };
const ADMIN_EMAIL = "n1nathaniel971@gmail.com";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const CORE_SUBJECTS = ['Mathematics','Web Foundations','Programming Fundamentals'];
const STREAM_SUBJECTS = { fullstack:'Full Stack Systems', frontend:'Frontend Systems', backend:'Backend Systems', webdesign:'Visual Systems', uiux:'Experience Design', stem:'Physical Sciences' };
const STREAM_NAMES = { fullstack:'Full Stack Engineering', frontend:'Frontend Craft', backend:'Backend Engineering', webdesign:'Web Design', uiux:'UI/UX Design', stem:'STEM & Physics' };
const CURRICULUM_NAMES = { '6':'IPI', '12':'ACC' };
const PROGRAMME_NAMES = { '6':'Intensive Programme of Instruction', '12':'Applied Competence Certificate' };

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = 'auth.html'; return; }
  if (user.email === ADMIN_EMAIL) { window.location.href = 'admin.html'; return; }
  const snap = await getDoc(doc(db, 'users', user.uid));
  if (!snap.exists()) { document.getElementById('slipRoot').innerHTML = '<div class="loading">No student record found.</div>'; return; }
  const data = snap.data();
  if (data.status !== 'approved' || !data.studentNumber) {
    document.getElementById('slipRoot').innerHTML = '<div class="loading">Your admission slip becomes available once your application is approved and your student number is issued.</div>';
    return;
  }
  render(user, data);
});

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }

function render(user, data) {
  const examNum = data.examinationNumber || '—';
  const streamName = STREAM_NAMES[data.course] || '—';
  const streamSubject = STREAM_SUBJECTS[data.course] || '—';
  const electives = data.electives || [];
  const curriculum = CURRICULUM_NAMES[data.duration] || '—';
  const programme = PROGRAMME_NAMES[data.duration] || '—';
  const allPapers = [...CORE_SUBJECTS, streamSubject, ...electives];

  document.getElementById('slipRoot').innerHTML = `
    <div class="slip-actions no-print">
      <button class="btn" id="printBtn"><i data-lucide="download"></i> Save as PDF</button>
      <button class="btn btn-ghost" id="copyBtn"><i data-lucide="copy"></i> Copy Exam Number</button>
      <a href="student-portal.html" class="btn btn-ghost"><i data-lucide="arrow-left"></i> Back to Portal</a>
    </div>

    <div class="slip">
      <div class="slip-header">
        <svg class="emblem" viewBox="0 0 120 120"><circle cx="60" cy="60" r="58" fill="none" stroke="#0d0d0d" stroke-width="2.5"/><circle cx="60" cy="60" r="52" fill="none" stroke="#0d0d0d" stroke-width="1"/><circle cx="60" cy="60" r="48" fill="#0d0d0d"/><path d="M40 44 L60 78 L80 44" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="square"/><rect x="66" y="44" width="8" height="6" fill="#fff"/><g font-family="'Courier New',monospace" font-size="8.5" fill="#0d0d0d" font-weight="700" letter-spacing="2"><text x="60" y="14" text-anchor="middle">NYL DEV</text><text x="60" y="112" text-anchor="middle">· IFB · 2027 ·</text></g></svg>
        <div class="title-block">
          <div class="org">Nyl Dev · IFB</div>
          <div class="org-sub">Fellowship Certificate of Competence</div>
          <div class="doc-type">Admission Slip — 2027</div>
        </div>
      </div>

      <div class="slip-grid">
        <div class="full"><div class="k">Candidate Name</div><div class="v">${esc(data.name || user.displayName || '—')}</div></div>
        <div><div class="k">Student Number</div><div class="v mono">${esc(data.studentNumber)}</div></div>
        <div><div class="k">Examination Number</div><div class="v mono">${esc(examNum)}</div></div>
        <div><div class="k">Programme</div><div class="v">${esc(programme)} (${esc(curriculum)})</div></div>
        <div><div class="k">Stream</div><div class="v">${esc(streamName)}</div></div>
      </div>

      <div class="papers-section">
        <h3>Subjects &amp; Papers</h3>
        <ul class="papers-list">
          ${allPapers.map(p => `<li><span class="paper-name">${esc(p)}</span><span class="paper-note">1 paper</span></li>`).join('')}
        </ul>
      </div>

      <div class="slip-barcode">
        <svg id="barcodeSvg"></svg>
        <div class="slip-barcode-num" id="barcodeNum">${esc(examNum.replace(/(.{4})/g,'$1 ').trim())}</div>
      </div>

      <div class="slip-foot">
        <strong>Nyl Dev · IFB · 2027 Intake</strong><br>
        Non-accredited skills-based admission slip. Not an NQF qualification. Not equivalent to the NSC or a university degree.<br>
        Examinations are quality assured through our internal platform. © 2026—2027 Nyl Dev. All rights reserved.
      </div>
    </div>
  `;
  if (window.lucide) lucide.createIcons();

  setTimeout(() => {
    if (typeof JsBarcode !== 'undefined' && examNum !== '—') {
      try { JsBarcode('#barcodeSvg', examNum, { format: 'CODE128', width: 2, height: 58, displayValue: false, margin: 0, background: '#ffffff', lineColor: '#000000' }); } catch(e) {}
    }
  }, 150);

  document.getElementById('printBtn').addEventListener('click', () => window.print());
  document.getElementById('copyBtn').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(examNum); alert('Examination number copied.'); }
    catch(e) { alert('Could not copy.'); }
  });
}
if (window.lucide) lucide.createIcons();
</script>
</body>
</html>
