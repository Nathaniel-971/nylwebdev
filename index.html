<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut as firebaseSignOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyA6HO7n6wCZEeCgKxJLjB-MjL0ZFGR7svU", authDomain: "nyldevcourses.firebaseapp.com", projectId: "nyldevcourses", storageBucket: "nyldevcourses.firebasestorage.app", messagingSenderId: "16687006873", appId: "1:16687006873:web:b7d66ad1024ccd92722408" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.googleLogin = async function(){ 
    try { 
        await signInWithPopup(auth, new GoogleAuthProvider()); 
        document.getElementById('authModal').classList.remove('active');
        window.location.reload(); 
    } catch(e){ console.error(e.message); } 
};

window.signOut = async function() {
    await firebaseSignOut(auth);
    window.location.reload();
};

onAuthStateChanged(auth, async (user) => {
    document.getElementById('loader').style.opacity = '0';
    setTimeout(() => document.getElementById('loader').style.display = 'none', 500);

    if (!user) {
        // Not signed in — apply / prospectus
        document.getElementById('headerLoginBtn').style.display = 'inline-flex';
        document.getElementById('headerLogoutBtn').style.display = 'none';
        document.getElementById('heroLoggedOut').style.display = 'flex';
        document.getElementById('heroLoggedIn').style.display = 'none';
        if (window.lucide) lucide.createIcons();
        return;
    }

    // Signed in — check if they've completed admission
    let hasDoc = false;
    try {
        const snap = await getDoc(doc(db, "users", user.uid));
        hasDoc = snap.exists();
    } catch (e) {
        console.warn("[Index] Could not check user doc:", e);
    }

    document.getElementById('headerLoginBtn').style.display = 'none';
    document.getElementById('headerLogoutBtn').style.display = 'inline-flex';
    document.getElementById('heroLoggedOut').style.display = 'none';
    document.getElementById('heroLoggedIn').style.display = 'flex';

    const heroTitle = document.getElementById('heroTitle');
    const heroSubtitle = document.getElementById('heroSubtitle');
    const primaryBtn = document.querySelector('#heroLoggedIn .btn-hero.primary');
    const secondaryBtn = document.querySelector('#heroLoggedIn .btn-hero.outline');

    if (hasDoc) {
        // Full dashboard
        heroTitle.innerHTML = `Welcome back,<br><span style="color:#E2E8F0">${user.displayName ? user.displayName.split(' ')[0] : 'Student'}.</span>`;
        heroSubtitle.innerText = "Access your dashboard to view your Student Slip, Examination Number, and study resources.";
        primaryBtn.href = "student-dashboard.html";
        primaryBtn.innerHTML = '<i data-lucide="layout-dashboard"></i> Go to Dashboard';
        secondaryBtn.href = "resources.html";
        secondaryBtn.innerHTML = '<i data-lucide="folder-open"></i> Study Resources';
    } else {
        // Signed in but hasn't completed admission
        heroTitle.innerHTML = `Almost there,<br><span style="color:#E2E8F0">${user.displayName ? user.displayName.split(' ')[0] : 'Applicant'}.</span>`;
        heroSubtitle.innerText = "Complete your application to receive your 6-digit Student ID and sit the Admission Examination.";
        primaryBtn.href = "admission.html";
        primaryBtn.innerHTML = '<i data-lucide="arrow-right"></i> Complete Application';
        secondaryBtn.href = "courses-ifb.html";
        secondaryBtn.innerHTML = '<i data-lucide="book-open"></i> View Prospectus';
    }

    if (window.lucide) lucide.createIcons();
});

const menuBtn=document.getElementById('menuBtn'),closeMenu=document.getElementById('closeMenu'),mobileMenu=document.getElementById('mobileMenu');
menuBtn.addEventListener('click',()=>mobileMenu.classList.add('active'));
closeMenu.addEventListener('click',()=>mobileMenu.classList.remove('active'));
window.toggleSubmenu=function(el){
    const parent=el.parentElement,sub=parent.querySelector('.submenu');
    document.querySelectorAll('.menu-item').forEach(item=>{if(item!==parent){item.classList.remove('active');item.querySelector('.submenu').style.maxHeight=null;}});
    parent.classList.toggle('active');
    sub.style.maxHeight=sub.style.maxHeight?null:sub.scrollHeight+"px";
};
document.addEventListener('DOMContentLoaded', () => { if (window.lucide) lucide.createIcons(); });
</script>
