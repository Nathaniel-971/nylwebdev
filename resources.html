<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resources | Institute of Board</title>
    
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 10 L92 85 H8 L50 10 Z' fill='%237A1F2B'/%3E%3Cpath d='M50 32 L77 78 H23 L50 32 Z' fill='%23FFFFFF'/%3E%3C/svg%3E">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
    /* ================= VARIABLES ================= */
    :root {
        --white: #FFF; --black: #111; --gray: #A1A1AA; --silver: #333;
        --maroon: #7A1F2B; --maroon-hover: #5A1620; 
        --dark-bg: #111111; --dark-card: #1F1F1F;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; overflow-x: hidden; width: 100%; }
    body { font-family: 'Inter', sans-serif; background: var(--dark-bg); color: var(--white); line-height: 1.6; overflow-x: hidden; position: relative; width: 100%; max-width: 100vw; }
    a { text-decoration: none; color: inherit; }

    /* ================= HEADER & HAMBURGER ================= */
    .header { position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; padding: 20px 48px; display: flex; justify-content: space-between; align-items: center; background: var(--black); border-bottom: 1px solid var(--silver); }
    .brand { display: flex; align-items: center; gap: 12px; z-index: 1001; }
    .brand-logo { width: 40px; height: 40px; background: var(--white); color: var(--maroon); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 900; flex-shrink: 0; }
    .brand-text { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; white-space: nowrap; }

    .hamburger { display: flex; flex-direction: column; gap: 6px; cursor: pointer; z-index: 1002; background: transparent; padding: 5px; border: none; margin-left: auto; }
    .hamburger span { display: block; width: 35px; height: 3px; background: var(--white); transition: 0.3s; border-radius: 2px; }
    .hamburger.active span:nth-child(1) { transform: translateY(9px) rotate(45deg); }
    .hamburger.active span:nth-child(2) { opacity: 0; }
    .hamburger.active span:nth-child(3) { transform: translateY(-9px) rotate(-45deg); }

    .mobile-menu { position: fixed; inset: 0; width: 100%; height: 100vh; background: var(--dark-bg); z-index: 999; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 30px; opacity: 0; pointer-events: none; transition: 0.4s ease; }
    .mobile-menu.active { opacity: 1; pointer-events: auto; }
    .mobile-menu a { font-size: 28px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: var(--white); transition: 0.2s; text-align: center; }
    .mobile-menu a:hover { color: var(--maroon); }

    /* ================= RESOURCE LAYOUT ================= */
    .res-container { max-width: 1000px; margin: 0 auto; width: 100%; padding: 120px 48px 80px; }
    
    .res-header h1 { font-size: 48px; font-weight: 900; text-transform: uppercase; margin-bottom: 8px; }
    .res-header p { color: var(--gray); font-size: 16px; margin-bottom: 40px; }

    /* FILTER BUTTONS */
    .filter-bar { display: flex; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
    .btn-filter { background: transparent; border: 1px solid var(--silver); color: var(--gray); padding: 8px 16px; font-size: 12px; font-weight: 700; text-transform: uppercase; cursor: pointer; transition: 0.2s; font-family: 'Inter', sans-serif; }
    .btn-filter.active { background: var(--maroon); border-color: var(--maroon); color: var(--white); }
    .btn-filter:hover { border-color: var(--white); color: var(--white); }

    /* GLASS UI CARD (Existing variables used) */
    .res-card { 
        background: rgba(31, 31, 31, 0.6); 
        backdrop-filter: blur(12px); 
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1); 
        padding: 24px; 
        margin-bottom: 16px; 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        transition: 0.2s; 
    }
    .res-card:hover { border-color: var(--maroon); background: rgba(31, 31, 31, 0.8); }
    
    .res-info h4 { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
    .res-info p { font-size: 13px; color: var(--gray); }
    
    .res-meta { display: flex; gap: 10px; margin-top: 8px; }
    .tag { background: #000; border: 1px solid var(--silver); padding: 3px 8px; font-size: 10px; font-weight: 700; color: var(--maroon); text-transform: uppercase; }
    
    .btn-action { 
        background: var(--maroon); color: var(--white); 
        padding: 10px 20px; font-size: 13px; font-weight: 700; 
        border: none; cursor: pointer; display: flex; align-items: center; gap: 6px; 
        transition: 0.2s;
    }
    .btn-action:hover { background: var(--maroon-hover); }

    @media (max-width: 900px) {
        .header, .res-container { padding-left: 24px; padding-right: 24px; }
        .res-header h1 { font-size: 32px; }
        .res-card { flex-direction: column; align-items: flex-start; gap: 16px; }
    }
    </style>
</head>
<body>

    <!-- HEADER & 3-LINE MENU -->
    <header class="header">
        <a href="index.html" class="brand">
            <div class="brand-logo">∆</div>
            <div class="brand-text">IFB ACADEMY</div>
        </a>
        <button class="hamburger" id="hamburgerBtn" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </button>
    </header>

    <div class="mobile-menu" id="mobileMenu">
        <a href="index.html" onclick="toggleMenu()">Home</a>
        <a href="dashboard.html" onclick="toggleMenu()">My Dashboard</a>
        <a href="resources.html" onclick="toggleMenu()">Resources</a>
        <a href="settings.html">Settings</a>
        <a href="#" onclick="logout(); toggleMenu();">Logout</a>
    </div>

    <!-- MAIN RESOURCES PAGE -->
    <main class="res-container">
        <div class="res-header">
            <h1>Resource Library</h1>
            <p>All past papers, memos, and study notes uploaded by the Admin.</p>
        </div>

        <div class="filter-bar">
            <button class="btn-filter active" onclick="filterRes('ALL', this)">All Documents</button>
            <button class="btn-filter" onclick="filterRes('AE', this)">Admissions (AE)</button>
            <button class="btn-filter" onclick="filterRes('MayJun', this)">May/June</button>
            <button class="btn-filter" onclick="filterRes('NovDec', this)">Nov/Dec</button>
            <button class="btn-filter" onclick="filterRes('General', this)">General</button>
        </div>

        <div id="resourceList">
            <p style="color: var(--gray);">Loading resources...</p>
        </div>
    </main>

    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyA6HO7n6wCZEeCgKxJLjB-MjL0ZFGR7svU", authDomain: "nyldevcourses.firebaseapp.com", projectId: "nyldevcourses", storageBucket: "nyldevcourses.firebasestorage.app", messagingSenderId: "16687006873", appId: "1:16687006873:web:b7d66ad1024ccd92722408" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    if (window.lucide) lucide.createIcons();

    let currentUser = null;
    let userData = null;
    let allResources = [];

    window.toggleMenu = function() {
        document.getElementById('mobileMenu').classList.toggle('active');
        document.getElementById('hamburgerBtn').classList.toggle('active');
    };

    window.logout = async function() {
        await signOut(auth);
        window.location.href = "index.html";
    };

    // AUTH & LOAD DATA
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUser = user;
            const docSnap = await getDoc(doc(db, "users", user.uid));
            if (docSnap.exists()) {
                userData = docSnap.data();
                fetchAllResources();
            }
        } else {
            window.location.href = "index.html";
        }
    });

    // FETCH ALL RESOURCES
    async function fetchAllResources() {
        const listContainer = document.getElementById('resourceList');
        
        try {
            const querySnapshot = await getDocs(collection(db, "resources"));
            allResources = [];

            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const isAdmin = currentUser.email === "n1nathaniel971@gmail.com";
                const hasAccess = data.course === 'ALL' || (userData.courses && userData.courses.includes(data.course)) || isAdmin;

                if (hasAccess) {
                    allResources.push(data);
                }
            });

            if (allResources.length === 0) {
                listContainer.innerHTML = '<p style="color: var(--gray);">No resources uploaded yet.</p>';
                return;
            }

            // Sort by newest first
            allResources.sort((a, b) => new Date(b.uploadedAt) - new Date(a.uploadedAt));
            renderResources('ALL');

        } catch (error) {
            console.error(error);
            listContainer.innerHTML = '<p style="color: var(--maroon);">Error loading resources.</p>';
        }
    }

    // FILTER LOGIC
    window.filterRes = function(session, btn) {
        document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderResources(session);
    };

    // RENDER CARDS
    function renderResources(filterSession) {
        const listContainer = document.getElementById('resourceList');
        listContainer.innerHTML = '';

        const filtered = filterSession === 'ALL' 
            ? allResources 
            : allResources.filter(r => r.session === filterSession);

        if (filtered.length === 0) {
            listContainer.innerHTML = '<p style="color: var(--gray);">No documents found for this session.</p>';
            return;
        }

        filtered.forEach(res => {
            let sessionName = res.session;
            if (sessionName === 'AE') sessionName = 'Admissions Exam';
            if (sessionName === 'MayJun') sessionName = 'May/June';
            if (sessionName === 'NovDec') sessionName = 'Nov/Dec';

            listContainer.innerHTML += `
                <div class="res-card">
                    <div class="res-info">
                        <h4>${res.title}</h4>
                        <p>Uploaded: ${new Date(res.uploadedAt).toLocaleDateString()}</p>
                        <div class="res-meta">
                            <span class="tag">${sessionName}</span>
                            <span class="tag">${res.course === 'ALL' ? 'All Courses' : res.course}</span>
                        </div>
                    </div>
                    <a href="${res.fileUrl}" target="_blank" class="btn-action"><i data-lucide="download" style="width: 16px;"></i> Download</a>
                </div>
            `;
        });

        if (window.lucide) lucide.createIcons();
    }
    </script>
</body>
</html>
