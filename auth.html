<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apply · ∆ IFB Institute</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b0b0b">
<meta name="description" content="Apply to IFB Online Institute. Free, non-accredited, skills-based. Inaugural 2027 intake.">
<script src="https://unpkg.com/lucide@latest"></script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/service-worker.js').catch(()=>{});}</script>
<style>
/* =================== THEME =================== */
:root{
  --ink:#0b0b0b;
  --ink-2:#1c1c1c;
  --ink-3:#2b2b2b;
  --paper:#ffffff;
  --paper-2:#fafafa;
  --paper-3:#f4f4f4;
  --paper-4:#ebebeb;
  --line:#e7e7e7;
  --line-2:#d6d6d6;
  --muted:#6f6f6f;
  --muted-2:#909090;
  --muted-3:#b4b4b4;
  --gold:#b58a2b;
  --gold-soft:#fbf4e0;
  --blue:#2f4ba8;
  --blue-soft:#eef2ff;
  --green:#0a7d4f;
  --green-soft:#e8f5ec;
  --red:#b3261e;
  --red-soft:#fdefec;
  --radius:14px;
  --radius-lg:20px;
  --radius-xl:26px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 10px 28px rgba(0,0,0,.06);
  --shadow-lg:0 26px 70px rgba(0,0,0,.10);
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--font);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overflow-x:hidden;min-height:100vh;
}
::selection{background:var(--ink);color:var(--paper)}
button{font-family:inherit;cursor:pointer}
a{color:inherit}

/* =================== LOADER =================== */
.loader{
  position:fixed;inset:0;z-index:9999;
  background:var(--ink);color:var(--paper);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  transition:opacity .6s ease,visibility .6s ease;
}
.loader.gone{opacity:0;visibility:hidden;pointer-events:none}
.loader-mark{font-size:100px;font-weight:600;line-height:1;letter-spacing:-3px;animation:breathe 1.7s ease-in-out infinite}
.loader-label{font-size:11.5px;letter-spacing:4px;text-transform:uppercase;color:rgba(255,255,255,.5);font-weight:600}
.loader-bar{width:220px;height:2px;background:rgba(255,255,255,.14);border-radius:2px;overflow:hidden;margin-top:4px}
.loader-bar span{display:block;height:100%;width:36%;background:var(--paper);border-radius:2px;animation:loaderSlide 1.35s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.7;transform:scale(.94)}50%{opacity:1;transform:scale(1)}}
@keyframes loaderSlide{0%{transform:translateX(-130%)}100%{transform:translateX(380%)}}

/* =================== NAV =================== */
nav{
  position:sticky;top:0;z-index:100;
  background:rgba(255,255,255,.94);
  backdrop-filter:saturate(180%) blur(16px);
  -webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--line);
}
.nav-inner{
  max-width:1200px;margin:0 auto;padding:14px 32px;
  display:flex;justify-content:space-between;align-items:center;gap:14px;
}
@media(max-width:760px){.nav-inner{padding:12px 20px}}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink)}
.brand-mark{font-size:44px;font-weight:600;line-height:.9;letter-spacing:-2.5px}
.brand-text{display:flex;flex-direction:column;line-height:1.05}
.brand-name{font-size:14px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase}
.brand-sub{font-size:10.5px;color:var(--muted);letter-spacing:1.6px;text-transform:uppercase;margin-top:3px}
@media(max-width:620px){.brand-text{display:none}}
.nav-right{display:flex;align-items:center;gap:6px}
.nav-link{
  font-size:13.5px;font-weight:500;color:var(--ink);text-decoration:none;
  padding:9px 14px;border-radius:9px;display:inline-flex;align-items:center;gap:7px;
  transition:background .18s ease;
}
.nav-link:hover{background:var(--paper-3)}
.nav-link svg{width:15px;height:15px}

/* =================== LAYOUT =================== */
.shell{max-width:1200px;margin:0 auto;padding:0 32px}
@media(max-width:760px){.shell{padding:0 20px}}
.auth-wrap{
  display:grid;grid-template-columns:1.05fr .95fr;
  gap:64px;align-items:start;
  padding:72px 0 96px;
}
@media(max-width:960px){.auth-wrap{grid-template-columns:1fr;gap:44px;padding:52px 0 72px}}

/* =================== FORM COLUMN =================== */
.form-card{
  border:1px solid var(--line);border-radius:var(--radius-xl);
  background:var(--paper);padding:40px 38px;
  box-shadow:var(--shadow-sm);
}
@media(max-width:520px){.form-card{padding:28px 22px;border-radius:var(--radius-lg)}}
.form-eyebrow{
  display:inline-flex;align-items:center;gap:9px;
  font-size:11px;letter-spacing:2.2px;text-transform:uppercase;
  color:var(--muted);font-weight:700;margin-bottom:16px;
}
.form-eyebrow svg{width:12px;height:12px}
.form-eyebrow::before{content:"";width:20px;height:1px;background:var(--muted);opacity:.5}
.form-card h1{
  font-size:clamp(26px,3.4vw,36px);letter-spacing:-1.3px;
  line-height:1.12;font-weight:700;margin-bottom:10px;
}
.form-card .sub{font-size:14.5px;color:var(--muted);line-height:1.55;margin-bottom:28px}

/* tabs */
.tabs{
  display:flex;border:1px solid var(--line);border-radius:12px;
  padding:5px;margin-bottom:26px;background:var(--paper-2);
}
.tab{
  flex:1;padding:10px 14px;font-size:13.5px;font-weight:600;
  border:none;background:transparent;color:var(--muted);
  border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  transition:all .18s ease;
}
.tab svg{width:15px;height:15px}
.tab:hover:not(.active){background:var(--paper);color:var(--ink)}
.tab.active{background:var(--ink);color:var(--paper)}

/* google */
.oauth{
  width:100%;padding:13px 16px;font-size:14px;font-weight:500;
  border:1.5px solid var(--line);background:var(--paper);color:var(--ink);
  border-radius:11px;display:flex;align-items:center;justify-content:center;gap:11px;
  transition:all .18s ease;margin-bottom:18px;
}
.oauth:hover{border-color:var(--ink);background:var(--paper-3)}
.oauth svg{width:18px;height:18px;flex-shrink:0}
.oauth:disabled{opacity:.55;cursor:not-allowed}

.divider{
  display:flex;align-items:center;gap:14px;margin:0 0 20px;
  color:var(--muted-2);font-size:10.5px;letter-spacing:2px;text-transform:uppercase;font-weight:700;
}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

/* fields */
.field{margin-bottom:16px}
.field label{
  display:flex;align-items:center;gap:7px;
  font-size:12.5px;font-weight:600;margin-bottom:8px;color:var(--ink);
}
.field label svg{width:13px;height:13px;color:var(--muted)}
.field input{
  width:100%;padding:14px 16px;font-size:15px;
  font-family:inherit;border:1.5px solid var(--line);
  border-radius:11px;background:var(--paper);color:var(--ink);
  transition:border-color .18s ease,box-shadow .18s ease;
}
.field input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 4px rgba(11,11,11,.05)}
.field input::placeholder{color:var(--muted-3)}
.field .help{font-size:11.5px;color:var(--muted-2);margin-top:6px}
.field .pw-toggle{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  background:transparent;border:none;color:var(--muted);padding:4px;
  border-radius:6px;
}
.field .pw-toggle:hover{color:var(--ink);background:var(--paper-3)}
.field .pw-toggle svg{width:15px;height:15px}
.field.pw{position:relative}

/* password strength */
.pw-strength{
  display:flex;gap:4px;margin-top:8px;
}
.pw-strength .seg{
  flex:1;height:3px;background:var(--paper-4);border-radius:2px;
  transition:background .25s ease;
}
.pw-strength[data-level="1"] .seg:nth-child(-n+1){background:var(--red)}
.pw-strength[data-level="2"] .seg:nth-child(-n+2){background:#c47b1e}
.pw-strength[data-level="3"] .seg:nth-child(-n+3){background:var(--gold)}
.pw-strength[data-level="4"] .seg:nth-child(-n+4){background:var(--green)}
.pw-label{
  font-size:11px;color:var(--muted-2);margin-top:6px;
}

/* terms */
.terms{
  display:flex;align-items:flex-start;gap:11px;
  margin:18px 0 22px;font-size:12.5px;color:var(--muted);line-height:1.55;
}
.terms input{
  margin-top:3px;width:16px;height:16px;accent-color:var(--ink);
  flex-shrink:0;cursor:pointer;
}
.terms a{color:var(--ink);text-decoration:underline;font-weight:600}

/* buttons */
.btn{
  width:100%;padding:15px 22px;font-size:14.5px;font-weight:600;
  border-radius:11px;border:1.5px solid var(--ink);background:var(--ink);
  color:var(--paper);display:inline-flex;align-items:center;justify-content:center;
  gap:9px;transition:all .18s ease;
}
.btn:hover:not(:disabled){background:var(--ink-2);transform:translateY(-1px);box-shadow:var(--shadow-md)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn svg{width:15px;height:15px}
.btn-ghost{
  background:var(--paper);color:var(--ink);border-color:var(--line-2);
  margin-top:10px;
}
.btn-ghost:hover:not(:disabled){border-color:var(--ink);background:var(--paper-3)}

/* messages */
.msg{
  padding:12px 14px;border-radius:10px;font-size:13px;
  margin-bottom:16px;display:none;line-height:1.5;
  align-items:flex-start;gap:9px;
}
.msg svg{width:15px;height:15px;flex-shrink:0;margin-top:1px}
.msg.show{display:flex}
.msg.error{background:var(--red-soft);color:var(--red);border:1px solid rgba(179,38,30,.18)}
.msg.success{background:var(--green-soft);color:var(--green);border:1px solid rgba(10,125,79,.18)}
.msg.info{background:var(--blue-soft);color:var(--blue);border:1px solid rgba(47,75,168,.18)}

/* footer links inside form */
.form-foot{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:20px;font-size:12.5px;color:var(--muted);gap:12px;flex-wrap:wrap;
}
.form-foot a{color:var(--ink);text-decoration:none;font-weight:600}
.form-foot a:hover{text-decoration:underline}

/* =================== SIDE / INFO COLUMN =================== */
.side{position:sticky;top:100px}
@media(max-width:960px){.side{position:static}}

.step-card{
  border:1px solid var(--line);border-radius:var(--radius-lg);
  background:var(--paper-2);padding:30px 28px;margin-bottom:16px;
}
.step-card .label{
  font-size:10.5px;letter-spacing:2px;text-transform:uppercase;
  color:var(--muted);font-weight:700;margin-bottom:18px;
  display:flex;align-items:center;gap:8px;
}
.step-card .label svg{width:13px;height:13px}
.step-card h3{font-size:18px;font-weight:700;margin-bottom:16px;letter-spacing:-.3px}

.steps-list{list-style:none;counter-reset:s}
.steps-list li{
  counter-increment:s;
  display:flex;gap:16px;align-items:flex-start;
  padding:14px 0;border-bottom:1px solid var(--line);
}
.steps-list li:last-child{border-bottom:none;padding-bottom:0}
.steps-list li::before{
  content:counter(s,decimal-leading-zero);
  font-family:var(--mono);font-size:11px;font-weight:700;
  color:var(--muted);letter-spacing:1px;width:28px;flex-shrink:0;padding-top:3px;
}
.steps-list .body h4{font-size:14px;font-weight:700;margin-bottom:3px}
.steps-list .body p{font-size:12.5px;color:var(--muted);line-height:1.55}

/* id preview card */
.id-preview{
  border:1px solid var(--line);border-radius:var(--radius-lg);
  background:var(--paper);padding:26px 24px;
  display:flex;align-items:center;gap:18px;
}
.id-preview .avatar-box{
  width:64px;height:64px;border-radius:16px;overflow:hidden;
  border:1px solid var(--line);flex-shrink:0;
  background:var(--paper-3);display:flex;align-items:center;justify-content:center;
}
.id-preview .avatar-box svg{display:block}
.id-preview .meta{flex:1;min-width:0}
.id-preview .meta .k{
  font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;
  color:var(--muted);font-weight:700;margin-bottom:6px;
}
.id-preview .meta .v{
  font-family:var(--mono);font-size:16px;font-weight:700;letter-spacing:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.id-preview .meta .n{
  font-size:12.5px;color:var(--muted);margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.id-preview .meta .badge{
  display:inline-flex;align-items:center;gap:6px;
  font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
  padding:3px 8px;border-radius:100px;background:var(--gold-soft);
  color:var(--gold);border:1px solid rgba(181,138,43,.25);margin-top:8px;
}

/* notice strip */
.notice-card{
  border:1px solid var(--line);border-radius:var(--radius-lg);
  background:var(--paper);padding:22px 24px;
  display:flex;gap:14px;align-items:flex-start;
  font-size:12.5px;color:var(--muted);line-height:1.65;
}
.notice-card .icon{
  width:36px;height:36px;border-radius:10px;
  background:var(--paper-3);display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.notice-card .icon svg{width:16px;height:16px;color:var(--ink)}
.notice-card strong{color:var(--ink);font-weight:600;display:block;margin-bottom:4px;font-size:13px}

/* =================== SIGNED IN CARD =================== */
.signed-in-card{
  border:1px solid var(--line);border-radius:var(--radius-xl);
  background:var(--paper);padding:48px 40px;text-align:center;
  box-shadow:var(--shadow-sm);
  max-width:540px;margin:64px auto;
}
.signed-in-card .avatar-lg{
  width:96px;height:96px;border-radius:24px;overflow:hidden;
  border:1px solid var(--line);margin:0 auto 22px;
  background:var(--paper-3);display:flex;align-items:center;justify-content:center;
}
.signed-in-card h2{
  font-size:24px;letter-spacing:-.8px;margin-bottom:8px;font-weight:700;
}
.signed-in-card .sub{font-size:14.5px;color:var(--muted);margin-bottom:6px}
.signed-in-card .email{
  font-family:var(--mono);font-size:13px;color:var(--muted);
  background:var(--paper-3);padding:6px 12px;border-radius:100px;
  display:inline-block;margin-bottom:26px;
}
.signed-in-card .next-step{
  background:var(--paper-2);border:1px solid var(--line);
  border-radius:14px;padding:20px 22px;margin-bottom:24px;
}
.signed-in-card .next-step .k{
  font-size:10.5px;letter-spacing:2px;text-transform:uppercase;
  color:var(--muted);font-weight:700;margin-bottom:8px;
}
.signed-in-card .next-step .v{font-size:15px;font-weight:600}
.signed-in-card .actions{display:flex;flex-direction:column;gap:10px}
.signed-in-card .actions .btn{margin-top:0}
.signed-in-card .auto{
  font-size:12px;color:var(--muted-2);margin-top:16px;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.signed-in-card .auto svg{width:13px;height:13px;animation:spin 1.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* success panel (post-signup) */
.success-panel{
  border:1px solid var(--line);border-radius:var(--radius-xl);
  background:var(--paper);padding:44px 40px;
  text-align:center;box-shadow:var(--shadow-sm);
}
.success-panel .check{
  width:72px;height:72px;border-radius:50%;background:var(--green-soft);
  border:1px solid rgba(10,125,79,.2);
  display:flex;align-items:center;justify-content:center;margin:0 auto 22px;
}
.success-panel .check svg{width:32px;height:32px;color:var(--green)}
.success-panel h2{font-size:26px;letter-spacing:-1px;margin-bottom:10px;font-weight:700}
.success-panel p{font-size:14.5px;color:var(--muted);line-height:1.6;margin-bottom:24px;max-width:420px;margin-left:auto;margin-right:auto}
.ref-block{
  background:var(--paper-2);border:1.5px dashed var(--line-2);
  border-radius:14px;padding:20px;margin-bottom:24px;
}
.ref-block .k{
  font-size:10.5px;letter-spacing:2px;text-transform:uppercase;
  color:var(--muted);font-weight:700;margin-bottom:8px;
}
.ref-block .v{
  font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:2px;
  color:var(--ink);
}
.ref-block .hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.55}
.success-panel .next{
  font-size:13.5px;color:var(--muted);margin-top:22px;line-height:1.6;
}

/* =================== RESPONSIVE =================== */
@media(max-width:520px){
  .form-card{padding:28px 22px}
  .side{gap:12px}
  .step-card{padding:24px 22px}
  .id-preview{padding:20px}
  .signed-in-card{padding:36px 24px;margin:32px auto}
  .success-panel{padding:32px 24px}
}
</style>
</head>

<!-- ===================== INLINE SCRIPTS ===================== -->
<script>
/* ---------- LOADER ---------- */
(function(){
  const loader = document.getElementById('loader');
  const start = Date.now();
  const minShow = 750;
  function hide(){
    const elapsed = Date.now() - start;
    const wait = Math.max(0, minShow - elapsed);
    setTimeout(() => {
      loader.classList.add('gone');
      setTimeout(() => loader.remove(), 700);
    }, wait);
  }
  if (document.readyState === 'complete') hide();
  else window.addEventListener('load', hide);
  setTimeout(() => { if (document.body.contains(loader)) loader.classList.add('gone'); }, 3400);
})();

/* ---------- GRIDY AVATAR ---------- */
function hash32(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function gridy(seed,px){
  px = px || 40;
  const h = hash32(String(seed || 'anon'));
  const rnd = mulberry32(h);
  const hue = h % 360;
  const fg = 'hsl(' + hue + ',58%,38%)';
  const bg = 'hsl(' + hue + ',28%,95%)';
  const N = 5, cell = 100 / N;
  const half = [];
  for (let r = 0; r < N; r++) {
    const row = [];
    for (let c = 0; c < 3; c++) row.push(rnd() > 0.46 ? 1 : 0);
    half.push(row);
  }
  if (!half.some(r => r.some(v => v))) half[2][1] = 1;
  let rects = '';
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const cc = c < 3 ? c : 4 - c;
    if (half[r][cc]) {
      rects += '<rect x="' + (c*cell).toFixed(2) + '" y="' + (r*cell).toFixed(2) +
               '" width="' + cell.toFixed(2) + '" height="' + cell.toFixed(2) + '"/>';
    }
  }
  return '<svg viewBox="0 0 100 100" width="' + px + '" height="' + px +
         '" xmlns="http://www.w3.org/2000/svg" style="display:block">' +
         '<rect width="100" height="100" fill="' + bg + '"/>' +
         '<g fill="' + fg + '">' + rects + '</g></svg>';
}
window.gridy = gridy;

/* ---------- REFERENCE ID GENERATOR ---------- */
/* Deterministic from UID — stable across sessions. Avoids ambiguous chars. */
function makeReferenceId(uid){
  const CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no I, O, 0, 1
  const h = hash32(String(uid));
  let n = h;
  let code = '';
  for (let i = 0; i < 6; i++) {
    code += CHARS[n % CHARS.length];
    n = Math.floor(n / CHARS.length) || (n ^ (i * 2654435761));
  }
  return 'IFB-2027-' + code;
}
window.makeReferenceId = makeReferenceId;
</script>

/* ---------- HELPERS ---------- */
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function showMsg(id, text, type){
  const el = document.getElementById(id);

  el.innerHTML =
    '<i data-lucide="' + (type === 'error' ? 'alert-triangle' : type === 'success' ? 'check-circle' : 'info') + '"></i>' +
    '<span>' + esc(text) + '</span>';
  if (window.lucide) lucide.createIcons();
}
function clearMsg(id){

  if (el) el.className = 'msg';

function friendly(code){

    'auth/email-already-in-use': 'That email is already registered. Sign in instead.',
    'auth/invalid-email': 'That email address doesn\'t look right.',
    'auth/weak-password': 'Password must be at least 8 characters.',

  };
  return m[code] || 'Something went wrong. Please try again.';
}

/* ---------- CREATE USER DOC ---------- */
async function ensureUserDoc(user, name){
  const ref = doc(db, 'users', user.uid);
  const snap = await getDoc(ref);
  if (snap.exists()) return snap.data();
  const referenceId = makeReferenceId(user.uid);
  const payload = {
    name: name || user.displayName || '',
    email: user.email || '',
    referenceId: referenceId,
    studentNumber: null,
    examinationNumber: null,
    examPin: null,
    preludePassed: false,
    preludeScore: null,
    preludeTakenAt: null,
    duration: null,
    curriculum: null,
    course: null,
    electives: [],
    status: 'pending',
    role: 'student',
    createdAt: serverTimestamp(),
    updatedAt: serverTimestamp()
  };
  await setDoc(ref, payload);
  return payload;
}

/* ---------- ROUTE USER ---------- */
async function routeUser(user, { silent = false } = {}){
  if (!user) return { destination: 'index.html', reason: 'Not signed in.' };
  if (user.email === ADMIN_EMAIL) {
    return { destination: 'admin.html', reason: 'Administrator account.' };
  }
  const ref = doc(db, 'users', user.uid);
  const snap = await getDoc(ref);
  if (!snap.exists()) {
    return { destination: 'admission-exam.html', reason: 'Sit the Prelude to receive your Student Number.' };
  }
  const data = snap.data();
  if (!data.preludePassed) {
    return { destination: 'admission-exam.html', reason: 'Sit the Prelude to receive your Student Number.' };
  }
  if (!data.course) {
    return { destination: 'curriculum.html', reason: 'Choose your stream and two electives.' };
  }
  return { destination: 'portal.html', reason: 'Your portal is ready.' };
}

/* ---------- AUTH STATE ---------- */
let initialResolved = false;
onAuthStateChanged(auth, async (user) => {
  if (!initialResolved) {
    initialResolved = true;
    if (user) {
      try {
        const route = await routeUser(user);
        renderSignedIn(user, route);
      } catch (err) {
        renderForm();
      }
    } else {
      renderForm();
    }
  } else {
    /* Subsequent state changes — re-render */
    if (user) {
      const route = await routeUser(user);
      renderSignedIn(user, route);
    } else {
      renderForm();
    }
  }
  if (window.lucide) lucide.createIcons();
});
