<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apply — Institute of Board</title>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root { --white: #FFF; --black: #111; --gray: #666; --silver: #E2E8F0; --maroon: #7A1F2B; --maroon-hover: #5A1620; --bg: #F8FAFC; --success: #15803D; --error: #B91C1C; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--black); min-height: 100dvh; display: flex; justify-content: center; align-items: center; padding: 24px 16px; }
.container { width: 100%; max-width: 520px; }
.nav-back { display: inline-flex; align-items: center; gap: 8px; color: var(--gray); text-decoration: none; font-weight: 600; margin-bottom: 24px; font-size: 14px; }
.nav-back:hover { color: var(--maroon); }
.nav-back i { width: 16px; height: 16px; }

.form-card { background: var(--white); border-radius: 24px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid var(--silver); }
.header { text-align: center; margin-bottom: 32px; }
.header .logo { display: flex; justify-content: center; margin-bottom: 16px; }
.header .logo i { width: 48px; height: 48px; color: var(--maroon); }
.header h1 { font-size: 24px; font-weight: 900; margin-bottom: 8px; letter-spacing: -0.5px; }
.header p { font-size: 14px; color: var(--gray); }

.notice-box { background: #FFF5F6; border-left: 4px solid var(--maroon); border-radius: 6px; padding: 12px 14px; margin-bottom: 24px; font-size: 13px; color: var(--black); display: flex; gap: 10px; align-items: flex-start; line-height: 1.5; }
.notice-box i { width: 16px; height: 16px; color: var(--maroon); flex-shrink: 0; margin-top: 2px; }

.btn-google { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 16px; background: var(--white); border: 1.5px solid var(--silver); border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; transition: 0.2s; color: var(--black); }
.btn-google:hover { background: #FAFAFA; border-color: var(--black); }
.btn-google:disabled { opacity: 0.6; cursor: wait; }

.form-fields { display: none; margin-top: 24px; }
.form-group { margin-bottom: 20px; }
label.field-label { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; margin-bottom: 8px; color: var(--black); }
label.field-label i { width: 14px; height: 14px; color: var(--maroon); }
.input-wrap { position: relative; display: flex; align-items: center; }
.input-wrap input { width: 100%; padding: 14px 14px 14px 42px; font-size: 15px; border: 1.5px solid var(--silver); border-radius: 10px; outline: none; font-family: inherit; color: var(--black); background: var(--white); }
.input-wrap input:focus { border-color: var(--maroon); }
.input-wrap input:disabled { background: #F8FAFC; color: var(--gray); cursor: not-allowed; }
.input-wrap > i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--gray); pointer-events: none; }

.row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

.course-block { display: flex; align-items: center; gap: 12px; padding: 16px; background: #FFF5F6; border: 1.5px solid var(--maroon); border-radius: 10px; }
.course-block .course-icon { width: 40px; height: 40px; border-radius: 10px; background: var(--maroon); color: var(--white); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.course-block .course-icon i { width: 20px; height: 20px; }
.course-block .course-info { flex: 1; }
.course-block .course-info strong { display: block; font-size: 15px; font-weight: 900; }
.course-block .course-info span { display: block; font-size: 12px; color: var(--maroon); font-weight: 700; margin-top: 2px; letter-spacing: 0.3px; }
.course-block .course-check { color: var(--maroon); }
.course-block .course-check i { width: 20px; height: 20px; }

.checkbox-group { display: flex; flex-direction: column; gap: 12px; margin: 24px 0; padding: 16px; background: #FAFAFA; border: 1px solid var(--silver); border-radius: 10px; }
.checkbox-item { display: flex; align-items: flex-start; gap: 12px; cursor: pointer; }
.checkbox-item input { width: 20px; height: 20px; accent-color: var(--maroon); cursor: pointer; margin-top: 2px; flex-shrink: 0; }
.checkbox-item span { font-size: 13px; color: var(--gray); line-height: 1.5; }
.checkbox-item span a { color: var(--maroon); font-weight: 700; }

.btn-submit { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 16px; font-size: 15px; font-weight: 700; border-radius: 10px; border: none; background: var(--maroon); color: var(--white); cursor: pointer; transition: 0.2s; font-family: inherit; }
.btn-submit:hover:not(:disabled) { background: var(--maroon-hover); }
.btn-submit:disabled { opacity: 0.7; cursor: wait; }
.btn-submit i { width: 18px; height: 18px; }

.alert { display: none; padding: 12px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; margin-top: 16px; align-items: flex-start; gap: 8px; line-height: 1.5; }
.alert.error { background: #FEF2F2; color: var(--error); border: 1px solid #FECACA; }
.alert.success { background: #F0FDF4; color: var(--success); border: 1px solid #BBF7D0; }
.alert i { width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; }
.alert span { flex: 1; }

@media (max-width: 768px) { .row { grid-template-columns: 1fr; } .form-card { padding: 28px 20px; } }
</style>
</head>
<body>
<div class="container">
    <a href="index.html" class="nav-back"><i data-lucide="arrow-left"></i> Back to Home</a>
    <div class="form-card">
        <div class="header">
            <div class="logo"><i data-lucide="graduation-cap"></i></div>
            <h1>2027 Application</h1>
            <p>Sign in with Google to begin.</p>
        </div>

        <div class="notice-box">
            <i data-lucide="info"></i>
            <span>Applications are open. Admission is strictly conditional on passing the Admission Examination (AE).</span>
        </div>

        <button class="btn-google" id="googleBtn" onclick="googleLogin()">
            <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.2 26.7 36 24 36c-5.2 0-9.6-3.1-11.3-7.6l-6.5 5C9.6 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.1 5.6l6.2 5.2C41 35.2 44 30 44 24c0-1.3-.1-2.3-.4-3.5z"/></svg>
            Continue with Google
        </button>

        <div class="alert error" id="loginError">
            <i data-lucide="alert-circle"></i>
            <span id="loginErrorText"></span>
        </div>

        <div class="form-fields" id="formFields">
            <form id="admissionForm" onsubmit="submitForm(event)">
                <div class="row">
                    <div class="form-group">
                        <label class="field-label"><i data-lucide="user"></i> First Name</label>
                        <div class="input-wrap">
                            <i data-lucide="user"></i>
                            <input type="text" id="firstName" placeholder="Nathaniel" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="field-label"><i data-lucide="user"></i> Surname</label>
                        <div class="input-wrap">
                            <i data-lucide="user"></i>
                            <input type="text" id="surname" placeholder="Nyl" required>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="field-label"><i data-lucide="mail"></i> Email Address (Google)</label>
                    <div class="input-wrap">
                        <i data-lucide="mail"></i>
                        <input type="email" id="emailAddress" disabled>
                    </div>
                </div>

                <div class="form-group">
                    <label class="field-label"><i data-lucide="calendar"></i> Date of Birth</label>
                    <div class="input-wrap">
                        <i data-lucide="calendar"></i>
                        <input type="date" id="dob" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="field-label"><i data-lucide="graduation-cap"></i> Selected Programme</label>
                    <div class="course-block">
                        <div class="course-icon"><i data-lucide="sigma"></i></div>
                        <div class="course-info">
                            <strong>IFB-S Mathematics</strong>
                            <span>Advanced Algebra · Calculus · Geometry · Statistics</span>
                        </div>
                        <div class="course-check"><i data-lucide="check-circle-2"></i></div>
                    </div>
                </div>

                <div class="checkbox-group">
                    <label class="checkbox-item">
                        <input type="checkbox" id="termsCheck" required>
                        <span>I agree to the <a href="guidelines-general.html" target="_blank">Terms & Policies</a>.</span>
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" id="accreditCheck" required>
                        <span>I understand the Institute of Board is an independent, non-accredited academic institution.</span>
                    </label>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <i data-lucide="arrow-right"></i> Complete Application
                </button>

                <div class="alert error" id="errorBox">
                    <i data-lucide="alert-circle"></i>
                    <span id="errorText"></span>
                </div>
            </form>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyA6HO7n6wCZEeCgKxJLjB-MjL0ZFGR7svU", authDomain: "nyldevcourses.firebaseapp.com", projectId: "nyldevcourses", storageBucket: "nyldevcourses.firebasestorage.app", messagingSenderId: "16687006873", appId: "1:16687006873:web:b7d66ad1024ccd92722408" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;

function refreshIcons() {
    if (window.lucide) { try { lucide.createIcons(); } catch(e) {} }
}

function generateStudentId() {
    const base = "27" + "01" + "X" + String(Math.floor(Math.random() * 1000000)).padStart(6, '0');
    let sum = 0;
    for (let i = 0; i < base.length; i++) sum += base.charCodeAt(i);
    return base + String(sum % 100).padStart(2, '0');
}
function generateSecurityCode() {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let out = "";
    for (let i = 0; i < 6; i++) out += chars[Math.floor(Math.random() * chars.length)];
    return out;
}

function showError(id, msg) {
    const box = document.getElementById(id);
    const text = document.getElementById(id + 'Text');
    if (text) text.textContent = msg;
    if (box) box.style.display = 'flex';
}
function hideError(id) {
    const box = document.getElementById(id);
    if (box) box.style.display = 'none';
}

async function handleUser(user) {
    currentUser = user;
    console.log("[Admission] Signed in:", user.email);
    try {
        const snap = await getDoc(doc(db, "users", user.uid));
        if (snap.exists()) {
            console.log("[Admission] User doc exists — redirecting to dashboard");
            window.location.href = "student-dashboard.html";
            return;
        }
        document.getElementById('googleBtn').style.display = 'none';
        document.getElementById('formFields').style.display = 'block';
        document.getElementById('emailAddress').value = user.email;
        refreshIcons();
    } catch (e) {
        console.error("[Admission] Failed to check user:", e);
        showError('loginError', "Could not check your account: " + e.message);
    }
}

onAuthStateChanged(auth, (user) => {
    if (user) handleUser(user);
});

window.googleLogin = async function() {
    hideError('loginError');
    const btn = document.getElementById('googleBtn');
    btn.disabled = true;
    try {
        const provider = new GoogleAuthProvider();
        const result = await signInWithPopup(auth, provider);
        await handleUser(result.user);
    } catch (e) {
        console.error("[Admission] Login failed:", e);
        showError('loginError', e.message || "Sign-in failed. Please try again.");
    } finally {
        btn.disabled = false;
    }
};

window.submitForm = async function(e) {
    e.preventDefault();
    hideError('errorBox');
    if (!currentUser) { showError('errorBox', "You must sign in with Google first."); return; }

    const fName = document.getElementById('firstName').value.trim();
    const sName = document.getElementById('surname').value.trim();
    const dob = document.getElementById('dob').value;
    const btn = document.getElementById('submitBtn');

    if (!fName || !sName || !dob) {
        showError('errorBox', "Please fill in all required fields.");
        return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i data-lucide="loader"></i> Processing...';
    refreshIcons();

    try {
        const studentId = generateStudentId();
        const securityCode = generateSecurityCode();

        console.log("[Admission] Creating user doc:", { studentId });

        await setDoc(doc(db, "users", currentUser.uid), {
            firstName: fName,
            surname: sName,
            name: `${fName} ${sName}`,
            email: currentUser.email,
            dob: dob,
            courses: ["Mathematics"],
            status: "Applicant",
            studentId: studentId,
            securityCode: securityCode,
            createdAt: new Date()
        });

        console.log("[Admission] User created — redirecting to dashboard");
        window.location.href = "student-dashboard.html";
    } catch(err) {
        console.error("[Admission] Submit failed:", err);
        showError('errorBox', err.message || "Submission failed. Please try again.");
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="arrow-right"></i> Complete Application';
        refreshIcons();
    }
};

document.addEventListener('DOMContentLoaded', refreshIcons);
window.addEventListener('load', refreshIcons);
</script>
</body>
</html>
