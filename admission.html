<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Application — IFB</title>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
    :root { --white: #FFFFFF; --black: #111111; --gray: #666666; --silver: #E2E8F0; --maroon: #7A1F2B; --maroon-hover: #5A1620; }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Inter', sans-serif; background: #FAFAFA; color: var(--black); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 24px; }
    .container { width: 100%; max-width: 600px; }
    .nav-back { display: inline-flex; align-items: center; gap: 8px; color: var(--gray); text-decoration: none; font-weight: 600; margin-bottom: 24px; }
    .form-card { background: var(--white); border-radius: 24px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid var(--silver); }
    .header { text-align: center; margin-bottom: 32px; }
    .header .logo { font-size: 48px; font-weight: 900; color: var(--maroon); margin-bottom: 16px; }
    .header h1 { font-size: 24px; font-weight: 900; margin-bottom: 8px; }
    .header p { font-size: 14px; color: var(--gray); }
    .warning { background: #FFF5F6; border: 1px solid var(--maroon); color: var(--maroon); padding: 12px; border-radius: 8px; font-size: 13px; font-weight: 600; text-align: center; margin-bottom: 24px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px; }
    input, select { width: 100%; padding: 14px; font-size: 15px; border: 1.5px solid var(--silver); border-radius: 10px; outline: none; font-family: inherit; }
    input:focus, select:focus { border-color: var(--maroon); }
    
    .module-box { display: none; background: #FAFAFA; border: 1px solid var(--silver); border-radius: 10px; padding: 16px; margin-top: 12px; }
    .module-box.active { display: block; }
    .module-title { font-size: 12px; font-weight: 800; color: var(--maroon); text-transform: uppercase; margin-bottom: 12px; }
    .checkbox-label { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; margin-bottom: 12px; cursor: pointer; color: var(--black); }
    .checkbox-label input { width: 18px; height: 18px; accent-color: var(--maroon); cursor: pointer; }
    
    .btn { width: 100%; padding: 16px; font-size: 15px; font-weight: 700; border-radius: 10px; border: none; background: var(--maroon); color: var(--white); cursor: pointer; transition: 0.2s; }
    .btn:hover { background: var(--maroon-hover); }
    .btn:disabled { opacity: 0.7; cursor: not-allowed; }
    
    #successState { display: none; text-align: center; }
    .id-box { background: var(--white); border: 2px dashed var(--maroon); border-radius: 12px; padding: 20px; margin: 20px 0; }
    .id-box .label { font-size: 11px; text-transform: uppercase; color: var(--gray); font-weight: 700; }
    .id-box .value { font-family: monospace; font-size: 22px; font-weight: 800; color: var(--black); }
</style>
</head>
<body>
<div class="container">
    <a href="index.html" class="nav-back"><i data-lucide="arrow-left"></i> Back to Home</a>
    
    <div class="form-card" id="formCard">
        <div class="header">
            <div class="logo">∆</div>
            <h1>2027 Application</h1>
            <p>Register to receive your unique 13-digit Student ID.</p>
        </div>
        <div class="warning">Applications Close: 13 January 2027</div>
        
        <form id="admissionForm">
            <div class="form-group"><label>Full Legal Name</label><input type="text" id="fullName" required placeholder="e.g. Nathaniel Nyl"></div>
            <div class="form-group"><label>Email Address</label><input type="email" id="email" required placeholder="you@example.com"></div>
            <div class="form-group"><label>Phone Number</label><input type="tel" id="phone" required placeholder="+27 XX XXX XXXX"></div>
            <div class="form-group"><label>Date of Birth</label><input type="date" id="dob" required></div>
            
            <div class="form-group" style="margin-top: 32px; border-top: 1px solid var(--silver); padding-top: 24px;">
                <label>Select Your Course (1 Year)</label>
                <select id="courseSelect" required>
                    <option value="" disabled selected>Choose a course...</option>
                    <option value="IFB-S Mathematics">IFB-S: Mathematics</option>
                    <option value="IFB AQ-B Front-End">IFB AQ-B: Front-End Web Development</option>
                </select>
            </div>

            <div class="module-box" id="mathModules">
                <div class="module-title">Mathematics Core Modules</div>
                <label class="checkbox-label"><input type="checkbox" value="Algebra" class="math-mod" checked> Algebra & Equations</label>
                <label class="checkbox-label"><input type="checkbox" value="Calculus" class="math-mod" checked> Differential & Integral Calculus</label>
                <label class="checkbox-label"><input type="checkbox" value="Geometry" class="math-mod" checked> Analytical & Euclidean Geometry</label>
                <label class="checkbox-label"><input type="checkbox" value="Probability" class="math-mod" checked> Probability & Statistics</label>
            </div>

            <div class="module-box" id="webModules">
                <div class="module-title">Web Development Core Modules</div>
                <label class="checkbox-label"><input type="checkbox" value="HTML/CSS" class="web-mod" checked> HTML5 & CSS3 Foundations</label>
                <label class="checkbox-label"><input type="checkbox" value="JavaScript" class="web-mod" checked> JavaScript & DOM</label>
                <label class="checkbox-label"><input type="checkbox" value="React" class="web-mod" checked> React & State Management</label>
                <label class="checkbox-label"><input type="checkbox" value="Deployment" class="web-mod" checked> Git, GitHub & Deployment</label>
            </div>

            <button type="submit" class="btn" id="submitBtn" style="margin-top: 24px;">Submit Application</button>
        </form>
    </div>

    <div class="form-card" id="successState">
        <div style="font-size: 48px; font-weight: 900; color: var(--maroon);">∆</div>
        <h2>Application Successful</h2>
        <p style="font-size: 14px; color: var(--gray); margin-top: 8px;">Save your Student ID.</p>
        
        <div class="id-box">
            <div class="label">13-Digit Student ID</div>
            <div class="value" id="displayId">2701000000001</div>
        </div>

        <a href="index.html" class="btn" style="display: block; text-decoration: none;">Go to Login</a>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyA6HO7n6wCZEeCgKxJLjB-MjL0ZFGR7svU", authDomain: "nyldevcourses.firebaseapp.com", projectId: "nyldevcourses", storageBucket: "nyldevcourses.firebasestorage.app", messagingSenderId: "16687006873", appId: "1:16687006873:web:b7d66ad1024ccd92722408" };
    const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);

    const courseSelect = document.getElementById('courseSelect');
    const mathModules = document.getElementById('mathModules');
    const webModules = document.getElementById('webModules');

    courseSelect.addEventListener('change', (e) => {
        mathModules.classList.remove('active');
        webModules.classList.remove('active');
        if (e.target.value === 'IFB-S Mathematics') mathModules.classList.add('active');
        else if (e.target.value === 'IFB AQ-B Front-End') webModules.classList.add('active');
    });

    document.getElementById('admissionForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.innerText = "Processing...";
        btn.disabled = true;

        const name = document.getElementById('fullName').value;
        const email = document.getElementById('email').value;
        const phone = document.getElementById('phone').value;
        const dobValue = document.getElementById('dob').value; // YYYY-MM-DD
        const course = courseSelect.value;
        
        let selectedModules = [];
        if (course === 'IFB-S Mathematics') {
            document.querySelectorAll('.math-mod:checked').forEach(cb => selectedModules.push(cb.value));
        } else {
            document.querySelectorAll('.web-mod:checked').forEach(cb => selectedModules.push(cb.value));
        }
        
        // FORMAT STUDENT ID: 2701 + YYMMDD + 001 (13 digits total)
        // e.g. 2005-10-26 -> 051026 -> 2701051026001
        const dobClean = dobValue.replace(/-/g, ''); // YYYYMMDD
        const yy = dobClean.substring(2, 4); // YY
        const mmdd = dobClean.substring(4, 8); // MMDD
        const studentId = `2701${yy}${mmdd}001`; 

        const tempPassword = "IFB2027!" + Math.floor(Math.random() * 10000);

        try {
            const userCredential = await createUserWithEmailAndPassword(auth, email, tempPassword);
            const user = userCredential.user;

            await setDoc(doc(db, "users", user.uid), {
                name: name, email: email, phone: phone, dob: dobValue, studentId: studentId, course: course, modules: selectedModules, status: "Applicant", createdAt: new Date()
            });

            document.getElementById('formCard').style.display = 'none';
            document.getElementById('displayId').innerText = studentId;
            document.getElementById('successState').style.display = 'block';

        } catch (error) {
            if (error.code === 'auth/email-already-in-use') {
                alert("An account with this email already exists. Redirecting you to the login page.");
                window.location.href = "index.html";
            } else {
                alert("Registration Error: " + error.message);
                btn.innerText = "Submit Application";
                btn.disabled = false;
            }
        }
    });
    lucide.createIcons();
</script>
</body>
</html>
