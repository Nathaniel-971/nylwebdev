<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=210mm, initial-scale=1.0">
<title>IFB Digital Access Pass</title>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  @page { size: A4; margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; max-width: 100vw; overflow-x: hidden; }
  
  body { 
    font-family: 'Times New Roman', Times, serif; 
    font-size: 16pt; 
    line-height: 1.6; 
    color: #000; 
    background: #F8FAFC; 
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
  
  .page { 
    width: 210mm; height: 297mm; padding: 0; 
    margin: 0 auto; position: relative; background: white; 
    overflow: hidden; display: flex; flex-direction: column; 
    page-break-after: always; 
  }
  
  @media print { 
    body { background: white; } 
    .page { margin: 0; box-shadow: none; page-break-inside: avoid; } 
  }

  /* ========================================== */
  /* COVER PAGE DESIGN                          */
  /* ========================================== */
  .cover-page { padding: 0; }
  
  .cover-bg { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 0; overflow: hidden; }
  
  .cover-bg-maroon {
    position: absolute; top: 0; left: 0; width: 75%; height: 65%;
    background: #7A1F2B;
  }
  
  .cover-bg-grey {
    position: absolute; bottom: 0; left: 0; width: 75%; height: 35%;
    background: #F8F8F8;
  }
  
  .cover-bg-checker {
    position: absolute; bottom: 0; right: 0; width: 25%; height: 50%;
    background-color: #fff;
    background-image: 
      linear-gradient(45deg, #D1D5DB 25%, transparent 25%, transparent 75%, #D1D5DB 75%, #D1D5DB), 
      linear-gradient(45deg, #D1D5DB 25%, transparent 25%, transparent 75%, #D1D5DB 75%, #D1D5DB);
    background-size: 24px 24px;
    background-position: 0 0, 12px 12px;
    clip-path: polygon(0 100%, 100% 100%, 100% 0, 0 50%);
  }

  .cover-bg-circle {
    position: absolute; top: 8%; right: 10%;
    width: 140px; height: 140px;
    background: #FFFFFF;
    border-radius: 50%;
    z-index: 1;
    border: 4px solid #7A1F2B;
  }
  
  .cover-bg-circle::after {
    content: '';
    position: absolute; top: 50%; left: -5%;
    width: 110%; height: 25%;
    background: #7A1F2B;
    transform: translateY(-50%);
    z-index: 2;
  }

  .cover-bg-line {
    position: absolute; top: calc(8% + 140px); right: calc(10% + 68px);
    width: 2px; height: 28%;
    background: #7A1F2B;
    z-index: 1;
  }
  
  .cover-bg-line::after {
    content: '';
    position: absolute; top: 40%; left: -6px;
    width: 14px; height: 30px;
    background: #7A1F2B;
    border: 2px solid #FFF;
  }

  .cover-content {
    position: relative; z-index: 2;
    padding: 20mm 15mm;
    display: flex; flex-direction: column; height: 100%;
  }

  .cover-logo-area {
    display: flex; align-items: center; gap: 15px;
    margin-bottom: 40px;
  }
  
  .cover-logo-svg {
    width: 80px; height: 80px;
    background: #FFF;
    border-radius: 50%;
    padding: 5px;
  }

  .cover-logo-text { display: flex; flex-direction: column; justify-content: center; }

  .cover-logo-text .logo-title {
    font-family: Arial, sans-serif; font-size: 22pt; font-weight: 900; color: #FFF; line-height: 1.1;
  }
  .cover-logo-text .logo-sub {
    font-family: Arial, sans-serif; font-size: 11pt; color: #FFF; letter-spacing: 2px; font-weight: bold;
  }

  .cover-title { font-family: Arial, sans-serif; margin-bottom: 20px; margin-top: 15px; }
  .cover-title .main-white {
    font-size: 40pt; font-weight: 900; color: #FFF; display: block; line-height: 1.1;
    text-shadow: 2px 2px 0px #7A1F2B, 4px 4px 0px rgba(0,0,0,0.2); 
  }

  .cover-highlight {
    background: #FFF; color: #7A1F2B; border-left: 6px solid #7A1F2B;
    font-family: Arial, sans-serif; font-weight: 900; font-size: 16pt;
    padding: 10px 15px; width: max-content; margin-bottom: 25px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }

  .cover-text {
    color: #FFF; font-family: Arial, sans-serif; font-size: 14pt;
    max-width: 380px; line-height: 1.5; margin-bottom: 5px;
    border-left: 2px solid rgba(255,255,255,0.4); padding-left: 15px;
  }

  .cover-text-above-circle {
    position: absolute; bottom: 75mm; left: 20mm; z-index: 2;
    font-family: Arial, sans-serif; font-size: 18pt; font-weight: 900; color: #7A1F2B;
    letter-spacing: 1px;
  }

  .cover-info-circle {
    position: absolute; bottom: 30mm; left: 20mm; z-index: 2;
    width: 170px; height: 170px;
    background: #7A1F2B;
    border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #FFF; font-family: Arial, sans-serif; text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    border: 4px solid #FFF;
  }
  .cover-info-circle .details {
    font-size: 14pt; font-weight: 900; line-height: 1.4;
  }

  .cover-barcode-a10 {
    margin-left: 17px;
    margin-top: 10px;
  }

  .cover-barcode-270610a {
    position: absolute; right: 20mm; bottom: 15mm; z-index: 3;
  }

  .cover-page .footer {
    position: absolute; bottom: 10mm; left: 20mm; right: 20mm;
    display: flex; justify-content: space-between; align-items: flex-end;
    z-index: 2; font-size: 12pt; font-family: Arial, sans-serif; height: 15mm;
  }
  .footer-left { display: flex; align-items: center; gap: 10px; }
  .footer-qr { display: inline-block; width: 40px; height: 40px; }
  .footer-qr svg { display: block; width: 40px; height: 40px; filter: grayscale(100%); }
  .footer-brand { display: flex; flex-direction: column; line-height: 1.1; }
  .footer-brand .name { font-size: 11pt; font-weight: 900; letter-spacing: 1px; color: #000; }
  .footer-brand .tag { font-size: 9pt; color: #000; }
  .footer-right { color: #000; font-style: italic;}

</style>
</head>
<body>

<div class="page cover-page">
  
  <div class="cover-bg">
    <div class="cover-bg-maroon"></div>
    <div class="cover-bg-grey"></div>
    <div class="cover-bg-checker"></div>
    <div class="cover-bg-circle"></div>
    <div class="cover-bg-line"></div>
  </div>

  <div class="cover-content">
    
    <div class="cover-logo-area">
      <svg class="cover-logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M50 10 L92 85 H8 L50 10 Z" fill="#7A1F2B" />
          <path d="M50 32 L77 78 H23 L50 32 Z" fill="#FFFFFF" />
          <rect x="20" y="88" width="60" height="4" fill="#E2E8F0" rx="2" />
      </svg>
      <div class="cover-logo-text">
        <div class="logo-title">INSTITUTE OF BOARD</div>
        <div class="logo-sub">ACADEMIC ASSESSMENT</div>
      </div>
    </div>

    <div class="cover-title">
      <span class="main-white">ACCESS PASS</span>
    </div>

    <div class="cover-highlight">
      Online AE - 2027
    </div>

    <div class="cover-text" style="margin-bottom: 20px;">
      <div style="display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 5px; margin-bottom: 5px;">
        <span style="color: rgba(255,255,255,0.7);">Student:</span>
        <strong id="slipName" style="color: #FFF;">—</strong>
      </div>
      <div style="display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 5px; margin-bottom: 5px;">
        <span style="color: rgba(255,255,255,0.7);">Student ID:</span>
        <strong id="slipStudentId" style="color: #FFF;">------</strong>
      </div>
      <div style="display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 5px; margin-bottom: 5px;">
        <span style="color: rgba(255,255,255,0.7);">Exam No:</span>
        <strong id="slipExamNum" style="color: #FFF;">PENDING</strong>
      </div>
      <div style="display: flex; justify-content: space-between;">
        <span style="color: rgba(255,255,255,0.7);">Security Code:</span>
        <strong id="slipSecCode" style="color: #FFF;">------</strong>
      </div>
    </div>
    
    <div class="cover-barcode-a10">
      <svg class="barcode-cover" id="slipBarcode" data-bc-width="2.5" data-bc-height="50" data-bc-display="true" data-bc-font-size="16" data-bc-line-color="#FFFFFF"></svg>
    </div>

  </div>

  <div class="cover-text-above-circle" id="slipProgramme">
    MATHEMATICS
  </div>

  <div class="cover-info-circle">
    <div class="details">Scan to<br>Write<br>Exam</div>
  </div>

  <div class="cover-barcode-270610a">
    <svg class="barcode-cover" id="slipExamBarcode" data-bc-width="2.5" data-bc-height="50" data-bc-display="true" data-bc-font-size="16" data-bc-line-color="#111111"></svg>
  </div>

  <div class="footer">
    <div class="footer-left">
      <span class="footer-qr" data-qr="https://ifb-nmaz.onrender.com"></span>
      <div class="footer-brand"><span class="name">INSTITUTE OF BOARD</span><span class="tag">∆ 2027</span></div>
    </div>
    <div class="footer-right">Verify Identity Before Exam</div>
  </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyA6HO7n6wCZEeCgKxJLjB-MjL0ZFGR7svU", authDomain: "nyldevcourses.firebaseapp.com", projectId: "nyldevcourses", storageBucket: "nyldevcourses.firebasestorage.app", messagingSenderId: "16687006873", appId: "1:16687006873:web:b7d66ad1024ccd92722408" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            const docRef = doc(db, "users", user.uid);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                const data = docSnap.data();
                
                document.getElementById('slipName').textContent = `${data.firstName} ${data.lastName}`;
                document.getElementById('slipProgramme').textContent = data.courses[0] === 'MAT' ? 'MATHEMATICS' : 'WEB DEVELOPMENT';
                document.getElementById('slipStudentId').textContent = data.studentId || 'PENDING';
                document.getElementById('slipExamNum').textContent = data.examinationNumber || 'PENDING';
                document.getElementById('slipSecCode').textContent = data.securityCode || '------';

                if (data.studentId) {
                    JsBarcode("#slipBarcode", data.studentId, {
                        format: "CODE128", width: 2.5, height: 50, displayValue: true, fontSize: 16, margin: 0,
                        background: "transparent", lineColor: "#FFFFFF"
                    });
                }

                if (data.examinationNumber) {
                    JsBarcode("#slipExamBarcode", data.examinationNumber, {
                        format: "CODE128", width: 2.5, height: 50, displayValue: true, fontSize: 16, margin: 0,
                        background: "transparent", lineColor: "#111111"
                    });
                }

                const qr = qrcode(0, 'M');
                qr.addData(`IFB|NAME:${data.firstName} ${data.lastName}|SID:${data.studentId}|SEC:${data.securityCode}|EXAM:${data.examinationNumber || 'PENDING'}`);
                qr.make();
                document.querySelector('.footer-qr').innerHTML = qr.createSvgTag({ cellSize: 2, margin: 0, scalable: true });

                setTimeout(() => {
                    window.print();
                }, 800);
            }
        } else {
            window.location.href = "index.html";
        }
    });
</script>
</body>
</html>
